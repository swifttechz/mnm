      - name: "[3/5] Runner info"
        run: |
          echo "Runner: $RUNNER_OS $RUNNER_ARCH"
          echo "Public IP: $(curl -fsS --max-time 10 https://api.ipify.org || echo unknown)"
          python --version

      - name: "[4/5] Run GoLogin Cloud Browser signup"
        id: automation
        working-directory: automation
        timeout-minutes: 30
        env:
          OUT_DIR: out
          GL_API_KEYS: ${{ env.GL_API_KEYS }}
          ACC_EMAIL: ${{ env.ACC_EMAIL }}
          ACC_PASSWORD: ${{ env.ACC_PASSWORD }}
          ACC_INDEX: ${{ env.ACC_INDEX }}
          PROFILE_OS: ${{ env.PROFILE_OS }}
          PROXY_TYPE: ${{ env.PROXY_TYPE }}
          PROXY_COUNTRY: ${{ env.PROXY_COUNTRY }}
        run: python signup.py

      - name: "[5/5] Upload screenshots and result"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.index }}
          path: automation/out
          if-no-files-found: warn
          retention-days: 7

      - name: "Keep alive for inspection"
        if: ${{ always() && env.KEEP_MIN != '0' }}
        run: |
          total=$KEEP_MIN
          echo "Keeping device alive ${total}min"
          for ((m=total; m>0; m--)); do echo "  ...${m}min left"; sleep 60; done

  report:
    name: "Combined API key report"
    needs: [prepare, signup]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: all
        continue-on-error: true
      - name: Print and summarise all accounts
        run: |
          shopt -s nullglob
          files=(all/*/result.json)
          if (( ${#files[@]} == 0 )); then
            echo "::warning::No result files found"; exit 0
          fi
          jq -s 'sort_by(.index)' "${files[@]}" > all-results.json
          total=$(jq 'length' all-results.json)
          ok=$(jq '[.[] | select(.token != null)] | length' all-results.json)
          echo "========= ALL GOLOGIN ACCOUNTS ($ok/$total with API key) ========="
          jq -r '.[] | "#\(.index)  \(.email)\n  os      : \(.profileOS//\"?\")\n  proxy   : \(.proxyType//\"?\") / \(.proxyCountry//\"?\")\n  signup  : \(.signup)\n  API KEY : \(.token//\"NOT CAPTURED\")\n  error   : \(.error//\"-\")\n"' all-results.json
          echo "=================================================================="
          echo ""
          echo "--- API keys only (email  token) ---"
          jq -r '.[] | select(.token != null) | "\(.email)  \(.token)"' all-results.json
          {
            echo "## GoLogin Cloud Browser — results ($ok of $total with API key)"
            echo "| # | Email | OS | Proxy | Signup | API key |"
            echo "|---|-------|-----|-------|--------|---------|"
            jq -r '.[] | "| \(.index) | \(.email) | \(.profileOS//\"?\") | \(.proxyType//\"?\") / \(.proxyCountry//\"?\") | \(if .signup then "OK ✓" else "FAILED ✗" end) | `\(.token//\"not captured\")` |"' all-results.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload combined results
        uses: actions/upload-artifact@v4
        with:
          name: gologin-all-results
          path: all-results.json
          if-no-files-found: ignore
          retention-days: 7
