          def launch_edge_guaranteed(target_url, edge_exe, proxy_server, use_proxy, lang_code, accept_lang, apply_masking=True, tz_iana="UTC", attempt_num=1):
              if not target_url or target_url.strip() == "":
                  log_msg("EdgeLaunch", f"CRITICAL: target_url is empty! Cannot launch Edge without URL.")
                  return False

              edge_candidates = [
                  edge_exe,
                  r"C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe",
                  r"C:\Program Files\Microsoft\Edge\Application\msedge.exe",
              ]
              resolved_exe = None
              for candidate in edge_candidates:
                  if candidate and os.path.exists(candidate):
                      resolved_exe = candidate
                      break

              if not resolved_exe:
                  log_msg("EdgeLaunch", "CRITICAL: Microsoft Edge executable not found in any known path!")
                  return False

              try:
                  os.system("taskkill /F /IM msedge.exe >nul 2>&1")
                  time.sleep(2)
              except Exception:
                  pass

              user_dir = os.path.join(tempfile.gettempdir(), f"EdgeProfile_{random.randint(100000, 999999)}")

              cmd_parts = [
                  f'"{resolved_exe}"',
                  f'--user-data-dir="{user_dir}"',
                  '--no-first-run',
                  '--no-default-browser-check',
                  '--disable-sync',
                  '--safebrowsing-disable-download-protection',
                  '--disable-features=msSmartScreenProtection,SmartScreenPuaEnabled,CalculateNativeWinOcclusion',
                  '--restore-last-session=false',
                  '--hide-crash-restore-window',
                  '--disable-blink-features=AutomationControlled',
                  '--force-webrtc-ip-handling-policy=disable_non_proxied_udp',
              ]

              if apply_masking:
                  resolved_lang = lang_code or "en-US"
                  primary = resolved_lang.split('-')[0].lower()
                  resolved_accept = accept_lang or f"{resolved_lang},{primary};q=0.9"
                  if primary not in resolved_accept.lower():
                      log_msg("EdgeLaunch", f"WARNING: accept_lang '{accept_lang}' doesn't match lang_code '{resolved_lang}' — correcting for fingerprint consistency.")
                      resolved_accept = f"{resolved_lang},{primary};q=0.9"
                  cmd_parts.append(f'--lang={resolved_lang}')
                  cmd_parts.append(f'--accept-lang="{resolved_accept}"')
                  # NOTE: there is no real --timezone switch on stock Edge/Chromium; the
                  # 'Apply Proxy-Matched Locale, Timezone & Language' step already set the
                  # actual OS timezone (Set-TimeZone/tzutil), which is what the JS Intl API reads.
                  log_msg("EdgeLaunch", f"MASKING -> lang={resolved_lang} | accept-lang={resolved_accept} | OS timezone={tz_iana} (set earlier via tzutil, not a launch flag)")

              if use_proxy and proxy_server and proxy_server.strip():
                  if "://" in proxy_server:
                      cmd_parts.append(f'--proxy-server="{proxy_server}"')
                  else:
                      cmd_parts.append(f'--proxy-server="http://{proxy_server}"')
                  log_msg("EdgeLaunch", f"Attempt {attempt_num}: Proxy injected -> {proxy_server}")
              else:
                  log_msg("EdgeLaunch", f"Attempt {attempt_num}: Direct mode (no proxy)")

              cmd_parts.append(f'"{target_url.strip()}"')

              cmd = ' '.join(cmd_parts)
              log_msg("EdgeLaunch", f"Attempt {attempt_num} CMD: {cmd[:200]}...")

              try:
                  subprocess.Popen(cmd, shell=True)
                  log_msg("EdgeLaunch", f"Attempt {attempt_num}: Edge process spawned successfully.")
                  return True
              except Exception as e:
                  log_msg("EdgeLaunch", f"Attempt {attempt_num}: Popen failed: {e}")
                  try:
                      os.system(f'start "" {cmd}')
                      log_msg("EdgeLaunch", f"Attempt {attempt_num}: os.system fallback executed.")
                      return True
                  except Exception as e2:
                      log_msg("EdgeLaunch", f"Attempt {attempt_num}: os.system also failed: {e2}")
                      return False

          def verify_edge_launch(target_url, edge_exe, proxy_server, use_proxy, lang_code, accept_lang, apply_masking, tz_iana):
              for attempt in range(1, 6):
                  launch_edge_guaranteed(target_url, edge_exe, proxy_server, use_proxy, lang_code, accept_lang, apply_masking, tz_iana, attempt_num=attempt)
                  start_wait = time.time()

                  if use_proxy and PROXY_USER and PROXY_PASS:
                      log_msg("EdgeLaunch", "Authenticated Proxy. Waiting up to 10s for proxy auth dialog...")
                      auth_found = False
                      while time.time() - start_wait < 10:
                          desktop_chk = Desktop(backend="uia")
                          try:
                              for w in desktop_chk.windows(visible_only=True):
                                  wt = w.window_text() or ""
                                  if _is_proxy_auth_dialog(wt):
                                      auth_found = True
                                      break
                                  if "Microsoft Edge" in wt or "Edge" in wt:
                                      u, p = _is_auth_dialog_by_structure(w)
                                      if u and p:
                                          auth_found = True
                                          break
                          except Exception: pass

                          if auth_found: break
                          time.sleep(1)

                      if auth_found:
                          log_msg("EdgeLaunch", "Proxy auth dialog detected. Edge launched correctly.")
                          return True
                      else:
                          log_msg("EdgeLaunch", "No proxy auth dialog within 10s. Relaunching...")
                          os.system("taskkill /F /IM msedge.exe >nul 2>&1")
                          time.sleep(2)
                  else:
                      log_msg("EdgeLaunch", "Direct mode. Waiting up to 12s for Edge URL to load...")
                      url_loaded = False
                      while time.time() - start_wait < 12:
                          desktop_chk = Desktop(backend="uia")
                          try:
                              for w in desktop_chk.windows(visible_only=True):
                                  wt = w.window_text() or ""
                                  wt_lower = wt.lower()
                                  if ("microsoft edge" in wt_lower or "msedge" in wt_lower):
                                      if wt_lower not in ["microsoft edge", "edge", "new tab", ""]:
                                          url_loaded = True
                                          break
                          except Exception: pass

                          if url_loaded: break
                          time.sleep(1)

                      if url_loaded:
                          log_msg("EdgeLaunch", "URL loaded. Edge launched correctly.")
                          return True
                      else:
                          log_msg("EdgeLaunch", "URL did not load within 12s. Relaunching...")
                          os.system("taskkill /F /IM msedge.exe >nul 2>&1")
                          time.sleep(2)
              return False

          def detect_edge_error(edge_window):
              try:
                  error_kw = [
                      "can't reach this page", "err_connection_closed",
                      "err_proxy_connection_failed", "err_connection_reset",
                      "err_connection_timed_out", "site can't be reached",
                      "checking the proxy and the firewall", "err_empty_response",
                      "err_network_changed"
                  ]

                  title = (edge_window.window_text() or "").lower()
                  if any(kw in title for kw in error_kw):
                      return True

                  try:
                      for doc in edge_window.descendants(control_type="Document"):
                          name = (doc.element_info.name or "").lower()
                          if any(kw in name for kw in error_kw):
                              return True
                  except Exception: pass

                  try:
                      for text_el in edge_window.descendants(control_type="Text"):
                          txt = (text_el.window_text() or "").lower()
                          if any(kw in txt for kw in error_kw):
                              return True
                  except Exception: pass

              except Exception:
                  pass
              return False

          def click_element_robust(el, label, fallback_x=None, fallback_y=None):
              clicked = False
              try:
                  el.click_input()
                  log_msg(label, "Clicked via pywinauto click_input()")
                  clicked = True
              except Exception: pass

              if not clicked:
                  try:
                      el.invoke()
                      log_msg(label, "Clicked via UIA Invoke pattern")
                      clicked = True
                  except Exception: pass

              if not clicked:
                  try:
                      rect = el.rectangle()
                      cx, cy = rect.mid_point().x, rect.mid_point().y
                      sw, sh = pyautogui.size()
                      if 0 <= cx <= sw and 0 <= cy <= sh:
                          pyautogui.moveTo(cx, cy, duration=0.2)
                          pyautogui.click()
                          time.sleep(0.1)
                          pyautogui.click()
                          log_msg(label, f"Clicked via PyAutoGUI at ({cx}, {cy})")
                          clicked = True
                  except Exception: pass

              return clicked

          def dismiss_cookie_popups_before_download(edge_window, software_type):
              """
              Dedicated pre-download cookie dismissal.
              Runs up to 3 passes with gaps to clear any cookie consent overlay
              before the download button scan. Uses accent-folded matching so
              French/German/etc cookie buttons ("Accepter tout", "Akzeptieren") match.
              Returns True if at least one cookie button was clicked.
              """
              clicked_any = False
              for _attempt in range(3):
                  found_this_pass = False
                  try:
                      for btn in edge_window.descendants(control_type="Button"):
                          try:
                              btn_txt = (btn.window_text() or "").strip()
                          except Exception:
                              btn_txt = ""
                          if not btn_txt or len(btn_txt) > 60:
                              continue
                          if _matches_any(btn_txt, COOKIE_CONSENT_KEYWORDS):
                              log_msg("PreDLCookies", f"Cookie btn (attempt {_attempt+1}): '{btn_txt}' — clicking...")
                              try:
                                  btn.click_input()
                                  found_this_pass = True
                                  clicked_any = True
                                  time.sleep(1.5)
                                  break
                              except Exception as _e:
                                  log_msg("PreDLCookies", f"click failed: {_e}")
                  except Exception as _ex:
                      log_msg("PreDLCookies", f"scan error: {_ex}")
                  if not found_this_pass:
                      break
                  time.sleep(2)
              if clicked_any:
                  log_msg("PreDLCookies", "Cookie overlay dismissed. Waiting 2s for page to settle...")
                  time.sleep(2)
              return clicked_any


          def robust_click_download_button(edge_window, software_type):
              sw, sh = pyautogui.size()

              # PRE-STEP: dismiss cookie/consent overlays that may block the download button.
              # Critical on non-English pages (FR, DE, ES...) where the cookie popup
              # appears on top of the hero download button before we can click it.
              dismiss_cookie_popups_before_download(edge_window, software_type)

              log_msg("DL-Engine", f"Pass 1: Scanning Button/Hyperlink/Text for download keywords...")
              try:
                  for ctrl_type in ["Button", "Hyperlink", "Text", "Pane", "Custom"]:
                      for el in edge_window.descendants(control_type=ctrl_type):
                          try:
                              txt = (el.window_text() or "").strip()
                              nm  = (el.element_info.name or "").strip()
                          except Exception:
                              continue
                          combined = f"{txt} {nm}".lower()
                          if not combined.strip(): continue
                          if len(combined) > 80: continue
                          if any(kw in combined for kw in DOWNLOAD_BUTTON_KEYWORDS):
                              log_msg("DL-Engine", f"Pass 1 match: '{combined[:60]}' ({ctrl_type})")
                              if click_element_robust(el, "DL-Engine-P1"):
                                  return True
              except Exception as e:
                  log_msg("DL-Engine", f"Pass 1 failed: {e}")

              log_msg("DL-Engine", f"Pass 2: Broad descendant scan for download keywords...")
              try:
                  for el in edge_window.descendants():
                      try:
                          txt = (el.window_text() or "").strip()
                      except Exception:
                          txt = ""
                      if not txt or len(txt) > 60: continue
                      if any(kw in txt.lower() for kw in DOWNLOAD_BUTTON_KEYWORDS):
                          try:
                              ctrl_type = el.element_info.control_type
                          except Exception:
                              ctrl_type = "Unknown"
                          log_msg("DL-Engine", f"Pass 2 match: '{txt[:60]}' ({ctrl_type})")
                          if click_element_robust(el, "DL-Engine-P2"):
                              return True
              except Exception as e:
                  log_msg("DL-Engine", f"Pass 2 failed: {e}")

              log_msg("DL-Engine", f"Pass 3: Scanning automation IDs / class names for download hints...")
              dl_id_hints = ["download", "cta", "btn-download", "hero-btn", "get-btn",
                             "install-btn", "download-btn", "dl-btn"]
              try:
                  for el in edge_window.descendants():
                      try:
                          aid = (el.element_info.automation_id or "").lower()
                          cls = (el.element_info.class_name or "").lower()
                      except Exception:
                          continue
                      if any(hint in aid or hint in cls for hint in dl_id_hints):
                          log_msg("DL-Engine", f"Pass 3 match via ID/class: aid='{aid}' cls='{cls}'")
                          if click_element_robust(el, "DL-Engine-P3"):
                              return True
              except Exception as e:
                  log_msg("DL-Engine", f"Pass 3 failed: {e}")

              log_msg("DL-Engine", f"Pass 4: Visual region scan — large hero-area buttons (language-independent)...")
              try:
                  candidate_buttons = []
                  for el in edge_window.descendants(control_type="Button"):
                      try:
                          rect  = el.rectangle()
                          cx_el = rect.mid_point().x
                          cy_el = rect.mid_point().y
                          width  = rect.right  - rect.left
                          height = rect.bottom - rect.top
                          if (width > 80 and height > 25
                                  and cy_el < (sh * 0.75)
                                  and cx_el > (sw * 0.15) and cx_el < (sw * 0.85)):
                              txt = (el.window_text() or "").strip()
                              nm  = (el.element_info.name or "").strip()
                              candidate_buttons.append((width * height, el, cx_el, cy_el, txt or nm))
                      except Exception:
                          continue
                  candidate_buttons.sort(key=lambda x: x[0], reverse=True)
                  skip_kw = ["menu", "nav", "close", "sign", "log", "cookie", "privacy",
                             "search", "home", "back", "settings", "cookies",
                             "accepter", "accept", "consent", "akzeptieren", "aceptar",
                             "aceitar", "accetta", "accepteren", "zaakceptuj"]
                  for area, el, cx_el, cy_el, label in candidate_buttons[:8]:
                      log_msg("DL-Engine", f"Pass 4 candidate: '{label[:50]}' size={area} at ({cx_el},{cy_el})")
                      if any(s in label.lower() for s in skip_kw):
                          log_msg("DL-Engine", f"  -> skipped (matches skip_kw)")
                          continue
                      if click_element_robust(el, "DL-Engine-P4"):
                          return True
              except Exception as e:
                  log_msg("DL-Engine", f"Pass 4 failed: {e}")

              log_msg("DL-Engine", "All 4 passes exhausted. Returning False.")
              return False

          def _is_address_bar_control(ctrl):
              try:
                  wt  = (ctrl.window_text() or "").lower().strip()
                  aid = ""
                  cls = ""
                  try: aid = (ctrl.element_info.automation_id or "").lower()
                  except Exception: pass
                  try: cls = (ctrl.element_info.class_name or "").lower()
                  except Exception: pass
                  for name in ADDRESS_BAR_NAMES:
                      if name in wt or name in aid:
                          return True
                  for aid_kw in ADDRESS_BAR_AUTOMATION_IDS:
                      if aid_kw.lower() in aid:
                          return True
                  if "omnibox" in cls or "addressbar" in cls:
                      return True
              except Exception:
                  pass
              return False

          _FOLD_SPECIAL_MAP = str.maketrans({
              'ł': 'l', 'Ł': 'L', 'đ': 'd', 'Đ': 'D', 'ø': 'o', 'Ø': 'O',
              'ß': 'ss', 'æ': 'ae', 'Æ': 'AE', 'œ': 'oe', 'Œ': 'OE', 'ı': 'i',
          })

          def _fold(text):
              """Lowercase + strip diacritics (accents, tildes, cedillas, etc.) so
              keyword matching is language-robust: 'sesion' matches 'sesión',
              'contrasena' matches 'contraseña', 'hasło' matches 'hasło'/'haslo', and so
              on, regardless of which accented/unaccented form is hardcoded in a list.
              A handful of letters (ł, đ, ø, ß...) don't decompose under NFKD, so they
              are mapped explicitly first."""
              if not text:
                  return ""
              pre = text.translate(_FOLD_SPECIAL_MAP)
              nfkd = unicodedata.normalize('NFKD', pre)
              stripped = ''.join(ch for ch in nfkd if not unicodedata.combining(ch))
              return stripped.lower().strip()

          def _matches_any(text, keyword_list):
              if not text: return False
              tl = _fold(text)
              return any(_fold(kw) in tl for kw in keyword_list)

          def _proxy_host_hint():
              srv = (PROXY_SERVER or "").replace("http://", "").replace("https://", "")
              host = srv.split("@")[-1].split(":")[0].strip()
              return host if len(host) >= 4 else ""

          _PROXY_HOST_HINT = ""  # resolved lazily on first use, after USE_PROXY/PROXY_SERVER are loaded

          def _window_mentions_proxy_host(text):
              global _PROXY_HOST_HINT
              if not text: return False
              if not _PROXY_HOST_HINT:
                  _PROXY_HOST_HINT = _proxy_host_hint()
              return bool(_PROXY_HOST_HINT) and _PROXY_HOST_HINT.lower() in text.lower()

          def _is_proxy_auth_dialog(window_text):
              if not window_text: return False
              return _matches_any(window_text, PROXY_AUTH_TITLE_KEYWORDS) or _window_mentions_proxy_host(window_text)

          # ---------------------------------------------------------------------------
          # PROXY AUTH: ONE-SHOT STATE + WEB-PAGE PROTECTION
          #
          # Proxy credentials are typed ONCE. After the credentials were submitted, or
          # once the page has loaded with no prompt (= proxy already authenticated),
          # nothing is ever typed again. In addition, text boxes / buttons that belong
          # to the WEB PAGE (everything inside a "Document" control) are never touched,
          # so a login / search / newsletter form on the site can't receive the proxy
          # username or password - not even before the one-shot flag is set.
          # ---------------------------------------------------------------------------
          PROXY_AUTH_STATE = {"done": False, "reason": "", "done_time": 0.0, "late_reinjects": 0,
                              "page_ok_ticks": 0, "last_prompt_seen": 0.0, "started": 0.0, "valve_logged": False}
          LATE_PROMPT_WINDOW_SEC = 90   # a GENUINE proxy prompt (names the proxy host) may still be answered this long after "done"
          LATE_REINJECT_MAX = 2         # ...at most this many more times


          def _reset_proxy_auth_state():
              PROXY_AUTH_STATE.update({"done": False, "reason": "", "done_time": 0.0, "late_reinjects": 0,
                                       "page_ok_ticks": 0, "last_prompt_seen": 0.0, "started": time.time(), "valve_logged": False})


          def _mark_proxy_auth_done(reason):
              if PROXY_AUTH_STATE["done"]:
                  return
              PROXY_AUTH_STATE["done"] = True
              PROXY_AUTH_STATE["reason"] = reason
              PROXY_AUTH_STATE["done_time"] = time.time()
              log_msg("ProxyAuth", "=" * 60)
              log_msg("ProxyAuth", f"PROXY AUTH DONE ({reason}).")
              log_msg("ProxyAuth", "Proxy credentials will NOT be typed again into any text box (web page fields are never touched).")
              log_msg("ProxyAuth", f"Only a genuine proxy prompt that names the proxy host may be answered again: max {LATE_REINJECT_MAX}x within {LATE_PROMPT_WINDOW_SEC}s.")
              log_msg("ProxyAuth", "=" * 60)


          def _page_control_keys(container, control_type):
              """Runtime-ids of every control of this type that lives inside web content (a Document control)."""
              keys = set()
              try:
                  docs = container.descendants(control_type="Document")
              except Exception:
                  return keys, False
              for doc in docs:
                  try:
                      for c in doc.descendants(control_type=control_type):
                          try:
                              keys.add(tuple(c.element_info.runtime_id))
                          except Exception:
                              pass
                  except Exception:
                      return keys, False
              return keys, True


          def _outside_page(container, control_type):
              """Controls of this type that are browser UI / dialogs - NEVER web page content."""
              try:
                  all_c = container.descendants(control_type=control_type)
              except Exception:
                  return []
              keys, ok = _page_control_keys(container, control_type)
              if not ok:
                  return []          # cannot tell page content from browser UI -> fail closed (touch nothing)
              if not keys:
                  return list(all_c)
              out = []
              for c in all_c:
                  try:
                      rid = tuple(c.element_info.runtime_id)
                  except Exception:
                      rid = None
                  if rid is not None and rid in keys:
                      continue
                  out.append(c)
              return out


          def _edge_has_proxy_prompt(edge_window):
              """True when BROWSER-UI (not web page) text boxes are showing in the Edge window and they look like the
              proxy credential prompt: the classic 2-field layout, or the proxy host is named in the dialog text."""
              try:
                  edits = [c for c in _outside_page(edge_window, "Edit") if not _is_address_bar_control(c)]
              except Exception:
                  return False
              if not edits:
                  return False
              if len(edits) == 2:
                  return True
              try:
                  for t in edge_window.descendants(control_type="Text")[:300]:
                      tt = t.window_text() or ""
                      if tt and _window_mentions_proxy_host(tt):
                          return True
              except Exception:
                  pass
              return False


          def _find_genuine_proxy_prompt(desktop, edge_window):
              """STRICT (used after 'done'): only a window/dialog that NAMES THE PROXY HOST qualifies."""
              try:
                  for w in desktop.windows(visible_only=True):
                      try:
                          awt = w.window_text() or ""
                      except Exception:
                          continue
                      if "Microsoft Edge" in awt:
                          continue
                      if _window_mentions_proxy_host(awt):
                          return w
                      try:
                          for t in w.descendants(control_type="Text")[:60]:
                              if _window_mentions_proxy_host(t.window_text() or ""):
                                  return w
                      except Exception:
                          pass
              except Exception:
                  pass
              if edge_window is not None and _edge_has_proxy_prompt(edge_window):
                  try:
                      for t in edge_window.descendants(control_type="Text")[:300]:
                          if _window_mentions_proxy_host(t.window_text() or ""):
                              return edge_window
                  except Exception:
                      pass
              return None


          def _page_loaded_without_prompt(edge_window):
              """True when a real page is rendered in Edge and no browser-UI credential prompt is showing."""
              try:
                  wt = (edge_window.window_text() or "").strip().lower()
                  base = re.sub(r"\s*[-\u2013\u2014]\s*[^-\u2013\u2014]*microsoft\W*edge\s*$", "", wt).strip()
                  if base in ("", "microsoft edge", "edge", "new tab", "about:blank"):
                      return False
                  if _edge_has_proxy_prompt(edge_window):
                      return False
                  count = 0
                  for doc in edge_window.descendants(control_type="Document"):
                      count += len(doc.children())
                  return count >= 3
              except Exception:
                  return False


          def _window_looks_like_auth_dialog(window, allow_structural=False):
              """Classifier for SEPARATE top-level windows (web page content can never be a top-level window).
              Title keyword (accent-folded) or proxy host named in the window text. The pure 2-field structural
              rule is OFF by default - for the dialog embedded in Edge use _edge_has_proxy_prompt() instead."""
              try:
                  wt = window.window_text() or ""
              except Exception:
                  wt = ""
              if _is_proxy_auth_dialog(wt):
                  return True
              try:
                  snippets = []
                  for t in window.descendants(control_type="Text")[:30]:
                      try:
                          tt = t.window_text()
                      except Exception:
                          tt = ""
                      if tt:
                          snippets.append(tt)
                  combined = " ".join(snippets)
                  if combined and (_matches_any(combined, PROXY_AUTH_TITLE_KEYWORDS) or _window_mentions_proxy_host(combined)):
                      return True
              except Exception:
                  pass
              if allow_structural:
                  try:
                      edits = [c for c in _outside_page(window, "Edit") if not _is_address_bar_control(c)]
                      if len(edits) == 2:
                          return True
                  except Exception:
                      pass
              return False


          def _find_username_fields(container):
              results = []
              try:
                  for ctrl in _outside_page(container, "Edit"):
                      if _is_address_bar_control(ctrl): continue
                      try: wt = ctrl.window_text() or ""
                      except Exception: wt = ""
                      try: name = ctrl.element_info.name or ""
                      except Exception: name = ""
                      if _matches_any(wt + " " + name, USERNAME_FIELD_KEYWORDS):
                          results.append(ctrl)
              except Exception: pass
              return results

          def _find_password_fields(container):
              results = []
              try:
                  for ctrl in _outside_page(container, "Edit"):
                      if _is_address_bar_control(ctrl): continue
                      try: wt = ctrl.window_text() or ""
                      except Exception: wt = ""
                      try: name = ctrl.element_info.name or ""
                      except Exception: name = ""
                      if _matches_any(wt + " " + name, PASSWORD_FIELD_KEYWORDS):
                          results.append(ctrl)
                          continue
                      try:
                          legacy = ctrl.legacy_properties()
                          state = int(legacy.get("State", 0) or 0)
                          if state & 0x20000000:  # STATE_SYSTEM_PROTECTED - real UIA signal for a password box
                              results.append(ctrl)
                              continue
                      except Exception: pass
                      try:
                          cls = ctrl.element_info.class_name or ""
                          if "password" in cls.lower():
                              results.append(ctrl)
                      except Exception: pass
              except Exception: pass
              return results

          def _find_submit_button(container):
              try:
                  for btn in _outside_page(container, "Button"):
                      try: wt = btn.window_text() or ""
                      except Exception: wt = ""
                      try: name = btn.element_info.name or ""
                      except Exception: name = ""
                      if _matches_any(wt + " " + name, SUBMIT_BUTTON_KEYWORDS):
                          return btn
              except Exception: pass
              return None

          def _is_auth_dialog_by_structure(window):
              try:
                  all_edits = [c for c in _outside_page(window, "Edit") if not _is_address_bar_control(c)]
                  if len(all_edits) == 2:
                      return all_edits[0], all_edits[1]
              except Exception: pass
              return None, None

          def _is_download_done_window(text):
              if not text: return False
              t = text.lower().strip()
              t = t.replace(" - microsoft edge", "").replace("- microsoft edge", "").strip()
              return any(frag.lower() in t for frag in DOWNLOAD_DONE_TITLES)

          def _is_interference_window(text):
              if not text: return False
              tl = text.lower().strip()
              for exact in INTERFERENCE_TITLES:
                  if tl == exact.lower().strip():
                      return True
              for sub in INTERFERENCE_SUBSTRINGS:
                  if sub in tl:
                      return True
              if tl.startswith("administrator:") and "edge" not in tl:
                  return True
              return False

          def _is_target_software_window(text, software_type):
              if not text: return False
              tl = text.lower()
              if software_type == "avg":
                  return "avg" in tl
              elif software_type == "opera_gx":
                  return ("opera" in tl and "gx" in tl) or "opera gx" in tl
              elif software_type in ["opera_one", "opera_smart_link", "dynamic_opera", "ad_mvn"]:
                  return "opera" in tl and "edge" not in tl and "chrome web store" not in tl
              return False

          def dismiss_interference_windows(desktop, software_type, label=""):
              dismissed_any = False
              try:
                  all_windows = desktop.windows(visible_only=True)
              except Exception:
                  return False

              for window in all_windows:
                  try:
                      wt = window.window_text()
                      if not wt: continue
                      if "Microsoft Edge" in wt or "msedge" in wt.lower(): continue
                      if _is_target_software_window(wt, software_type): continue
                      if not _is_interference_window(wt): continue

                      log_msg("WinGuard", f"Interference window detected: '{wt}' [{label}]")
                      closed = False

                      try:
                          window.set_focus()
                          time.sleep(0.25)
                          send_keys('%{F4}')
                          time.sleep(0.4)
                          closed = True
                          log_msg("WinGuard", f"Closed '{wt}' via Alt+F4.")
                      except Exception as e:
                          log_msg("WinGuard", f"Alt+F4 failed for '{wt}': {e}")

                      if not closed:
                          try:
                              window.close()
                              time.sleep(0.3)
                              closed = True
                              log_msg("WinGuard", f"Closed '{wt}' via window.close().")
                          except Exception as e:
                              log_msg("WinGuard", f"window.close() failed for '{wt}': {e}")

                      if not closed:
                          try:
                              window.minimize()
                              time.sleep(0.25)
                              log_msg("WinGuard", f"Minimized '{wt}' as fallback.")
                              closed = True
                          except Exception as e:
                              log_msg("WinGuard", f"minimize() failed for '{wt}': {e}")

                      if closed:
                          dismissed_any = True
                  except Exception:
                      pass

              return dismissed_any

          def robust_maximize_opera_window(desktop, software_type, label=""):
              found_window = None
              dismiss_interference_windows(desktop, software_type, label=f"{label}-pre-dismiss")
              time.sleep(0.3)

              for attempt in range(1, 6):
                  log_msg("MaximizeOp", f"[{label}] Window search attempt {attempt}/5...")
                  try:
                      for w in desktop.windows(visible_only=True):
                          wt = w.window_text()
                          if wt and _is_target_software_window(wt, software_type):
                              found_window = w
                              log_msg("MaximizeOp", f"[{label}] Found window: '{wt}'")
                              break
                  except Exception as e:
                      log_msg("MaximizeOp", f"[{label}] Window search error: {e}")

                  if found_window: break
                  log_msg("MaximizeOp", f"[{label}] Not found yet. Waiting 3s...")
                  time.sleep(3)

              if not found_window:
                  log_msg("MaximizeOp", f"[{label}] ERROR: Window not found after 5 attempts.")
                  return None

              try:
                  found_window.set_focus(); time.sleep(0.4)
                  found_window.maximize(); time.sleep(0.5)
              except Exception as e:
                  log_msg("MaximizeOp", f"[{label}] Strategy 1 failed: {e}")

              try:
                  found_window.set_focus(); time.sleep(0.3)
                  send_keys('{VK_LWIN down}{UP}{VK_LWIN up}'); time.sleep(0.4)
                  send_keys('{VK_LWIN down}{UP}{VK_LWIN up}'); time.sleep(0.4)
              except Exception as e:
                  log_msg("MaximizeOp", f"[{label}] Strategy 2 failed: {e}")

              try:
                  hwnd = found_window.handle
                  ctypes.windll.user32.ShowWindow(hwnd, 9); time.sleep(0.4)
              except Exception as e:
                  log_msg("MaximizeOp", f"[{label}] Strategy 3 failed: {e}")

              try:
                  user32 = ctypes.windll.user32
                  sw = user32.GetSystemMetrics(0)
                  sh = user32.GetSystemMetrics(1)
                  hwnd = found_window.handle
                  user32.SetWindowPos(hwnd, -1, 0, 0, sw, sh, 0x0040 | 0x0020); time.sleep(0.3)
                  user32.SetWindowPos(hwnd, -2, 0, 0, sw, sh, 0x0040 | 0x0020); time.sleep(0.3)
              except Exception as e:
                  log_msg("MaximizeOp", f"[{label}] Strategy 4 failed: {e}")

              try:
                  found_window.set_focus(); time.sleep(0.2)
                  found_window.maximize(); time.sleep(0.3)
                  found_window.set_focus(); time.sleep(0.2)
              except Exception as e:
                  log_msg("MaximizeOp", f"[{label}] Strategy 5 failed: {e}")

              log_msg("MaximizeOp", f"[{label}] Maximize sequence complete: '{found_window.window_text()}'")
              return found_window

