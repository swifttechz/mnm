          def _opera_window_looks_like_onboarding(wt):
              """True only while the GX/Opera onboarding wizard is still on screen."""
              if not wt:
                  return False
              tlf = _fold(wt)
              if any(h in tlf for h in [_fold(x) for x in OPERA_HOME_HINTS]):
                  return False
