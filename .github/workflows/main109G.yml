          PRE_PROXY_SERVER: ${{ matrix.proxy_server }}
          PRE_PROXY_USER: ${{ matrix.proxy_user }}
          PRE_PROXY_PASS: ${{ matrix.proxy_pass }}
          PRE_PROXY_TYPE: ${{ matrix.proxy_type }}
          PRE_PROXY_CC: ${{ matrix.proxy_country_code }}
          PRE_PROXY_CITY: ${{ matrix.proxy_city }}
          PRE_PROXY_REGION: ${{ matrix.proxy_region }}
          PRE_PROXY_IP: ${{ matrix.proxy_real_ip }}
          UNIQUE_IP_INPUT: ${{ inputs.unique_ip }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PRE_TZ_WIN: ${{ matrix.timezone_windows }}
          PRE_TZ_IANA: ${{ matrix.timezone_iana }}
          PRE_LOCALE: ${{ matrix.windows_locale }}
          PRE_KB: ${{ matrix.windows_keyboard }}
        run: |
          import os, time, sys, uuid, json, re, random

          try:
              import requests
              import urllib3
          except ImportError:
              import subprocess
              subprocess.check_call([sys.executable, "-m", "pip", "install", "requests", "urllib3", "--quiet"])
              import requests
              import urllib3

          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          # ------------------------------------------------------------------
          # 1) Use the proxy claimed from the pool by the previous step.
          # 2) Otherwise (no proxy from pool) fall back to API-key generation below.
          # ------------------------------------------------------------------
          active_proxy = None
          use_proxy = False
          absolute_idx = int(os.environ.get("ABSOLUTE_IDX", "1"))

          pool_file = os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "pool_proxy.json")
          if os.path.isfile(pool_file):
              try:
                  with open(pool_file, "r", encoding="utf-8") as fh:
                      p = json.load(fh)
                  active_proxy = {
                      'server': (p.get("server_with_proto") or p.get("server") or "").replace("http://", "").replace("https://", ""),
                      'server_with_proto': p.get("server_with_proto") or p.get("server") or "",
                      'username': p.get("username") or "",
                      'password': p.get("password") or "",
                      'proxy_type_label': p.get("proxy_type_label") or "pool",
                      'country_code': (p.get("country_code") or "US").upper(),
                      'city': p.get("city") or "",
                      'region': p.get("region") or "",
                      'ip': p.get("ip") or "unknown",
                      'timezone_windows': p.get("timezone_windows") or "UTC",
                      'timezone_iana': p.get("timezone_iana") or "UTC",
                      'windows_locale': p.get("windows_locale") or "en-US",
                      'windows_keyboard': p.get("windows_keyboard") or "0409:00000409",
                      'working': True
                  }
                  use_proxy = True
                  print("========== USING PROXY FROM POOL (no API-key generation) ==========")
                  print(f"Pool proxy #{p.get('seq')} '{p.get('name')}' ({p.get('assigned_origin')}) -> IP {active_proxy['ip']} ({active_proxy['country_code']}) | provider: {active_proxy['proxy_type_label']}")
              except Exception as e:
                  print(f"[ProxyPool] Could not read pool proxy file ({e}). Falling back to API key generation.")
                  active_proxy = None
          else:
              print("[ProxyPool] No pool proxy file present for this device.")

          preassigned = os.environ.get("PREASSIGNED", "false").lower() == "true"
          if active_proxy is not None:
              print("[ProxyPool] Pool proxy in use -> skipping on-demand API key generation.")
          elif preassigned and os.environ.get("PRE_PROXY_SERVER"):
              print("========== USING PRE-ASSIGNED BATCH PROXY (from matrix) ==========")
              active_proxy = {
                  'server': os.environ.get("PRE_PROXY_SERVER", "").replace("http://", "").replace("https://", ""),
                  'server_with_proto': os.environ.get("PRE_PROXY_SERVER", ""),
                  'username': os.environ.get("PRE_PROXY_USER", ""),
                  'password': os.environ.get("PRE_PROXY_PASS", ""),
                  'proxy_type_label': os.environ.get("PRE_PROXY_TYPE", "batch"),
                  'country_code': os.environ.get("PRE_PROXY_CC", "US"),
                  'city': os.environ.get("PRE_PROXY_CITY", ""),
                  'region': os.environ.get("PRE_PROXY_REGION", ""),
                  'ip': os.environ.get("PRE_PROXY_IP", "unknown"),
                  'timezone_windows': os.environ.get("PRE_TZ_WIN", "UTC"),
                  'timezone_iana': os.environ.get("PRE_TZ_IANA", "UTC"),
                  'windows_locale': os.environ.get("PRE_LOCALE", "en-US"),
                  'windows_keyboard': os.environ.get("PRE_KB", "0409:00000409"),
                  'working': True
              }
              use_proxy = True
              print(f"Pre-assigned: {active_proxy['proxy_type_label']} -> IP {active_proxy['ip']} ({active_proxy['country_code']})")
          else:
              proxy_input = os.environ.get("API_KEY_INPUT", "").strip()
              without_proxy = os.environ.get("WITHOUT_PROXY", "false").lower() == "true"
              country_input = os.environ.get("COUNTRY", "USA")
              fallback_country_input = os.environ.get("FALLBACK_COUNTRY", "No Fallback")
              mobile = os.environ.get("MOBILE", "false").lower() == "true"
              sticky = os.environ.get("STICKY", "false").lower() == "true"
              absolute_idx = int(os.environ.get("ABSOLUTE_IDX", "1")) - 1
              task_index = int(os.environ.get("TASK_INDEX", "1"))

              try:
                  num_installs = int(os.environ.get("NUM_INSTALLS", "0"))
              except ValueError:
                  num_installs = 0

              try:
                  num_clicks = int(os.environ.get("NUM_CLICKS", "0"))
              except ValueError:
                  num_clicks = 0

              try:
                  num_surfs = int(os.environ.get("NUM_SURFS", "0"))
              except ValueError:
                  num_surfs = 0

              tasks_total = num_installs + num_clicks + num_surfs
              short_os = os.environ.get("SHORT_OS", "OS")
              short_sw = os.environ.get("SHORT_SW", "SW")
              action_cap = os.environ.get("ACTION", "task").capitalize()
              profile_tag = os.environ.get("PROFILE_TAG", "").strip()

              country_map = {
                  "USA": "us", "UK": "gb", "Canada": "ca", "Australia": "au", "Germany": "de", "France": "fr",
                  "Brazil": "br", "Mexico": "mx", "Spain": "es", "Vietnam": "vn", "Switzerland": "ch",
                  "Indonesia": "id", "Italy": "it", "Netherlands": "nl", "Poland": "pl"
              }
              cc_input = country_map.get(country_input, "us")

              def country_code_to_locale(cc):
                  _map = {"US": "en-US", "GB": "en-GB", "CA": "en-CA", "AU": "en-AU", "DE": "de-DE",
                          "FR": "fr-FR", "BR": "pt-BR", "MX": "es-MX", "ES": "es-ES", "VN": "vi-VN",
                          "CH": "de-CH", "ID": "id-ID", "IT": "it-IT", "NL": "nl-NL", "PL": "pl-PL"}
                  return _map.get(cc.upper(), "en-US")

              def country_code_to_keyboard(cc):
                  _map = {"US": "0409:00000409", "GB": "0809:00000809", "CA": "1009:00000409",
                          "AU": "0C09:00000409", "DE": "0407:00000407", "FR": "040C:0000040C",
                          "BR": "0416:00000416", "MX": "080A:0000080A", "ES": "0C0A:0000080A",
                          "VN": "042A:0000042A", "CH": "0807:00000807", "ID": "0421:00000409",
                          "IT": "0410:00000410", "NL": "0413:00020409", "PL": "0415:00000415"}
                  return _map.get(cc.upper(), "0409:00000409")

              def tz_to_windows_tz(iana_tz):
                  _map = {"America/New_York": "Eastern Standard Time", "America/Chicago": "Central Standard Time",
                          "America/Denver": "Mountain Standard Time", "America/Phoenix": "US Mountain Standard Time",
                          "America/Los_Angeles": "Pacific Standard Time", "America/Toronto": "Eastern Standard Time",
                          "America/Sao_Paulo": "E. South America Standard Time",
                          "America/Mexico_City": "Central Standard Time (Mexico)",
                          "Europe/London": "GMT Standard Time", "Europe/Paris": "Romance Standard Time",
                          "Europe/Berlin": "W. Europe Standard Time", "Europe/Madrid": "Romance Standard Time",
                          "Europe/Rome": "W. Europe Standard Time", "Europe/Amsterdam": "W. Europe Standard Time",
                          "Europe/Warsaw": "Central European Standard Time",
                          "Asia/Ho_Chi_Minh": "SE Asia Standard Time", "Europe/Zurich": "W. Europe Standard Time",
                          "Asia/Jakarta": "SE Asia Standard Time", "Australia/Sydney": "AUS Eastern Standard Time"}
                  return _map.get(iana_tz, "UTC")

              def _ipc_api(method, path, body=None):
                  import os, json, urllib.request, urllib.error
                  base = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
                  data = json.dumps(body).encode() if body is not None else None
                  headers = {"Authorization": f"Bearer {os.environ.get('GH_TOKEN', '')}", "Accept": "application/vnd.github+json",
                             "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "ip-claim-client"}
                  if data is not None:
                      headers["Content-Type"] = "application/json"
                  req = urllib.request.Request(base + path, data=data, method=method, headers=headers)
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return r.status, r.read()
                  except urllib.error.HTTPError as e:
                      try:
                          return e.code, e.read()
                      except Exception:
                          return e.code, b""
                  except Exception as e:
                      return 0, str(e).encode()


              def ip_claim(ip):
                  """Atomically claims an exit IP for THIS workflow run (a git ref can only be created once).
                  Returns 'claimed' (we own it) | 'taken' (another device already used it) | 'error' (claim API unusable)."""
                  import os, re, time
                  repo = os.environ.get("REPO", "")
                  sha = os.environ.get("GITHUB_SHA", "")
                  run = f"{os.environ.get('RUN_ID', '0')}-{os.environ.get('RUN_ATTEMPT', '1')}"
                  tag = re.sub(r"[^0-9A-Za-z._-]", "_", str(ip))
                  if not repo or not sha or not tag:
                      return "error"
                  for ref in (f"refs/ipclaims/{run}/{tag}", f"refs/tags/ipclaim-{run}-{tag}"):
                      for _try in range(2):
                          st, _ = _ipc_api("POST", f"/repos/{repo}/git/refs", {"ref": ref, "sha": sha})
                          if st == 201:
                              return "claimed"
                          if st in (0, 500, 502, 503, 504):
                              time.sleep(1.5)
                              continue
                          break
                      st2, _ = _ipc_api("GET", f"/repos/{repo}/git/ref/{ref[len('refs/'):]}")
                      if st2 == 200:
                          return "taken"
                  return "error"
              UNIQUE_IP = os.environ.get("UNIQUE_IP_INPUT", "false").lower() == "true"

              def build_success_dict(pinfo, proto, cc, cname, ip, city, region, tz):
                  return {
                      **pinfo,
                      'working': True,
                      'working_protocol': proto,
                      'server_with_proto': f"http://{pinfo['host']}:{pinfo['port']}",
                      'country_code': cc,
                      'country_name': cname,
                      'ip': ip,
                      'city': city,
                      'region': region,
                      'timezone_iana': tz,
                      'timezone_windows': tz_to_windows_tz(tz),
                      'windows_locale': country_code_to_locale(cc),
                      'windows_keyboard': country_code_to_keyboard(cc)
                  }

              def validate_proxy(pinfo):
                  protocols_to_test = ['http', 'socks5']
                  endpoints = [
                      ("http://ip-api.com/json/", "ip-api.com"),
                      ("https://ipinfo.io/json", "ipinfo.io"),
                      ("http://ipwho.is/", "ipwho.is"),
                      ("https://api.myip.com", "myip.com")
                  ]

                  for proto in protocols_to_test:
                      auth_str = f"{pinfo['username']}:{pinfo['password']}@" if pinfo.get('username') else ""
                      test_url = f"{proto}://{auth_str}{pinfo['host']}:{pinfo['port']}"
                      proxies_cfg = {"http": test_url, "https": test_url}
                      print(f"      -> Ping testing via {proto.upper()}: {pinfo['host']}:{pinfo['port']}")

                      for url, name in endpoints:
                          try:
                              resp = requests.get(url, proxies=proxies_cfg, timeout=15, verify=False)
                              if resp.status_code == 200:
                                  data = resp.json()
                                  cc = tz = city = region = ""
                                  ip = "unknown"

                                  if name == "ip-api.com" and data.get('status') == 'success':
                                      cc = data.get('countryCode')
                                      tz = data.get('timezone')
                                      ip = data.get('query')
                                      city = data.get('city')
                                      region = data.get('regionName')
                                  elif name == "ipinfo.io" and "ip" in data:
                                      cc = data.get('country')
                                      tz = data.get('timezone')
                                      ip = data.get('ip')
                                      city = data.get('city')
                                      region = data.get('region')
                                  elif name == "ipwho.is" and data.get('success'):
                                      cc = data.get('country_code')
                                      tz = data.get('timezone', {}).get('id')
                                      ip = data.get('ip')
                                      city = data.get('city')
                                      region = data.get('region')
                                  elif name == "myip.com" and "ip" in data:
                                      cc = data.get('cc')
                                      ip = data.get('ip')

                                  if ip and ip != "unknown":
                                      if UNIQUE_IP:
                                          claim = ip_claim(ip)
                                          if claim == "taken":
                                              print(f"      -> IP {ip} already used by another device this run (Unique IP) - rejecting, will keep generating.")
                                              continue
                                          print(f"      -> SUCCESS: Pinged {name} via {proto.upper()} | IP {ip} is UNIQUE (claimed).")
                                      else:
                                          print(f"      -> SUCCESS: Pinged {name} via {proto.upper()}")
                                      return build_success_dict(pinfo, proto, cc or 'US', cc or 'US', ip, city or '', region or '', tz or 'UTC')
                          except Exception as e:
                              print(f"         - {name} failed: {type(e).__name__}")

                  return {'working': False, **pinfo}

              def parse_generic_proxy(proxy_str):
                  original = proxy_str.strip()
                  if not original: return None
                  protocol = 'http'
                  rest = original
                  if '://' in rest:
                      protocol, rest = rest.split('://', 1)
                      if protocol.lower() == 'geolocation':
                          protocol = 'http'

                  rest = re.sub(r':(\d+):[A-Za-z].*$', r':\1', rest)

                  match_up_hp = re.search(r'([^:@\s]+):([^:@\s]+)@([^:@\s]+):(\d+)', rest)
                  if match_up_hp:
                      user, pwd, host, port = match_up_hp.groups()
                      return {'original': original, 'protocol': protocol, 'username': user, 'password': pwd,
                              'host': host, 'port': int(port), 'server': f"{host}:{port}",
                              'country_name': None, 'country_code': None,
                              'url': f"{protocol}://{user}:{pwd}@{host}:{port}"}

                  match_hp_up = re.search(r'^([^:@\s]+):(\d+):([^:@\s]+):([^:@\s]+)', rest)
                  if match_hp_up:
                      host, port, user, pwd = match_hp_up.groups()
                      return {'original': original, 'protocol': protocol, 'username': user, 'password': pwd,
                              'host': host, 'port': int(port), 'server': f"{host}:{port}",
                              'country_name': None, 'country_code': None,
                              'url': f"{protocol}://{user}:{pwd}@{host}:{port}"}

                  match_up_hp2 = re.search(r'^([^:@\s]+):([^:@\s]+):([^:@\s]+):(\d+)', rest)
                  if match_up_hp2:
                      user, pwd, host, port = match_up_hp2.groups()
                      return {'original': original, 'protocol': protocol, 'username': user, 'password': pwd,
                              'host': host, 'port': int(port), 'server': f"{host}:{port}",
                              'country_name': None, 'country_code': None,
                              'url': f"{protocol}://{user}:{pwd}@{host}:{port}"}

                  match_hp = re.search(r'^([^:@\s]+):(\d+)', rest)
                  if match_hp:
                      host, port = match_hp.groups()
                      return {'original': original, 'protocol': protocol, 'username': '', 'password': '',
                              'host': host, 'port': int(port), 'server': f"{host}:{port}",
                              'country_name': None, 'country_code': None,
                              'url': f"{protocol}://{host}:{port}"}

                  return None

              bytesflow_proxies = []
              manual_proxies = []
              scrapeops_keys = []
              floppy_keys = []
              redscrape_keys = []
              gologin_keys = []

              if proxy_input and not without_proxy:
                  SCRAPEOPS_KEY_RE = re.compile(r'^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$', re.IGNORECASE)
                  FLOPPY_KEY_RE = re.compile(r'^[A-Za-z0-9_]{30,80}$')
