          def handle_automation(software_type, action_mode, profile_tag="P1", timeout=450):
              desktop = Desktop(backend="uia")
              start_time = time.time()
              proxy_auth_time = start_time

              log_msg("UI-Engine", f"Started. Action: {action_mode.upper()} | Type: {software_type} | Profile: {profile_tag}")
              log_msg("UI-Engine", f"Target URL: {TARGET_URL}")

              if not TARGET_URL or TARGET_URL.strip() == "":
                  log_msg("UI-Engine", "FATAL: TARGET_URL is empty. Exiting.")
                  sys.exit(1)

              log_msg("UI-Engine", "Booting Edge via verified launcher...")
              if not verify_edge_launch(TARGET_URL, EDGE_EXE, PROXY_SERVER, USE_PROXY, LANG_CODE, ACCEPT_LANG, APPLY_MASKING, TZ_IANA):
                  log_msg("UI-Engine", "FATAL: Could not verify Edge launch. Exiting.")
                  sys.exit(1)

              download_clicked = False
              download_started = False
              last_dl_click_time = time.time()
              keep_mouse_sequence_done = False
              keep_mouse_step = 0
              keep_mouse_last_try = 0
              download_click_attempts = 0
              MAX_DOWNLOAD_CLICK_ATTEMPTS = 3
              last_download_reattempt_time = 0

              smart_link_interstitial_done = False
              smart_link_interstitial_time = 0

              sentinel_path = os.path.join(tempfile.gettempdir(), "download_done.flag")
              installer_executed_sentinel = os.path.join(tempfile.gettempdir(), "installer_executed.flag")
              download_windows_closed = False

              actual_software = software_type
              sentinel_read_done = False

              opera_one_installer_executed_time = None
              opera_one_post_install_done = False
              opera_gx_installer_executed_time = None
              opera_gx_post_install_done = False
              avg_installer_executed_time = None
              avg_post_install_done = False

              last_interference_sweep = 0
              INTERFERENCE_SWEEP_INTERVAL = 2

              last_auth_inject_time = 0
              AUTH_INJECT_COOLDOWN = 8
              last_auth_scan = 0
              AUTH_SCAN_INTERVAL = 2
              last_late_check = 0
              LATE_VALVE_INTERVAL = 6
              _reset_proxy_auth_state()

              surf_simulation_executed = False
              opera_onboarding_handled = False
              last_opera_onboarding_try = 0
              OPERA_ONBOARD_RETRY_COOLDOWN = 10

              while time.time() - start_time < timeout:
                  try:
                      desktop = Desktop(backend="uia")
                      edge_window = None
                      opera_window = None
                      avg_window = None

                      for window in desktop.windows(visible_only=True):
                          wt = window.window_text()
                          if not wt: continue
                          if "Microsoft Edge" in wt or "sudetyj" in wt or "Chrome Web Store" in wt or "Edge" in wt:
                              edge_window = window
                          if "Opera" in wt or "Speed Dial" in wt or "Start Page" in wt or "Welcome" in wt:
                              if "Microsoft Edge" not in wt and "Edge" not in wt and "Chrome Web Store" not in wt:
                                  opera_window = window
                          if "AVG" in wt:
                              avg_window = window

                      if action_mode == "install" and download_clicked and not download_started:
                          if time.time() - last_dl_click_time > 120:
                              log_msg("Timeout", "120 seconds since download click with no download. Aborting.")
                              with open(os.path.join(tempfile.gettempdir(), "abort_install.flag"), "w") as f:
                                  f.write("abort")
                              sys.exit(0)

                      if edge_window and action_mode == 'install':
                          wt_check = (edge_window.window_text() or "").strip()
                          elapsed_total = time.time() - start_time
                          if elapsed_total > 20 and wt_check.lower() in ["microsoft edge", "edge", "new tab", ""]:
                              log_msg("EdgeURLGuard", f"Edge has blank title '{wt_check}' after {elapsed_total:.0f}s. Relaunching...")
                              verify_edge_launch(TARGET_URL, EDGE_EXE, PROXY_SERVER, USE_PROXY, LANG_CODE, ACCEPT_LANG, APPLY_MASKING, TZ_IANA)
                              proxy_auth_time = time.time()
                              _reset_proxy_auth_state()
                              continue

                      if edge_window and action_mode == 'install':
                          if detect_edge_error(edge_window):
                              log_msg("EdgeError", "FATAL: Proxy/Connection error detected! Relaunching Edge...")
                              verify_edge_launch(TARGET_URL, EDGE_EXE, PROXY_SERVER, USE_PROXY, LANG_CODE, ACCEPT_LANG, APPLY_MASKING, TZ_IANA)
                              start_time = time.time()
                              proxy_auth_time = time.time()
                              last_auth_inject_time = 0
                              _reset_proxy_auth_state()
                              download_clicked = False
                              download_started = False
                              download_click_attempts = 0
                              keep_mouse_sequence_done = False
                              download_windows_closed = False
                              time.sleep(2)
                              continue

                      now = time.time()
                      if now - last_interference_sweep >= INTERFERENCE_SWEEP_INTERVAL:
                          dismiss_interference_windows(desktop, software_type, label="continuous")
                          last_interference_sweep = now

                      if (opera_window and not opera_onboarding_handled
                              and (now - last_opera_onboarding_try) >= OPERA_ONBOARD_RETRY_COOLDOWN):
                          last_opera_onboarding_try = now
                          log_msg("OperaOnboard", f"Opera-family window detected: '{opera_window.window_text()}'. Checking for first-run onboarding...")
                          try:
                              cleared = dismiss_opera_onboarding(desktop, software_type, label="OperaOnboard")
                              opera_onboarding_handled = bool(cleared)
                          except Exception as e:
                              log_msg("OperaOnboard", f"dismiss_opera_onboarding exception: {e}")

                      # =======================================================
                      # PROXY AUTH - ONE-SHOT.
                      # Once credentials were submitted (or the page loaded with no prompt,
                      # i.e. the proxy is already authenticated) this block never types
                      # credentials again. Web page text boxes are never touched.
                      # =======================================================
                      if USE_PROXY:
                          if not PROXY_AUTH_STATE["done"]:
                              if now - last_auth_scan >= AUTH_SCAN_INTERVAL:
                                  last_auth_scan = now
                                  auth_injected_this_tick = False
                                  seen_prompt = False
                                  try:
                                      for auth_window in desktop.windows(visible_only=True):
                                          awt = auth_window.window_text() or ""
                                          if "Microsoft Edge" in awt and awt != "Microsoft Edge": continue
                                          if _is_target_software_window(awt, software_type): continue
                                          if _window_looks_like_auth_dialog(auth_window):
                                              seen_prompt = True
                                              log_msg("ProxyAuth", f"[TopLevel] Auth dialog: '{awt}' - injecting...")
                                              if inject_proxy_auth(auth_window, label=f"toplevel-{awt[:30]}"):
                                                  auth_injected_this_tick = True
                                                  break
                                  except Exception: pass

                                  if not auth_injected_this_tick and edge_window:
                                      try:
                                          if _edge_has_proxy_prompt(edge_window):
                                              seen_prompt = True
                                              log_msg("ProxyAuth", "[Edge-UI] Browser-UI credential prompt detected (web page fields excluded) - injecting...")
                                              if inject_proxy_auth(edge_window, label="edge-ui"):
                                                  auth_injected_this_tick = True
                                      except Exception: pass

                                  if auth_injected_this_tick:
                                      last_auth_inject_time = now
                                      proxy_auth_time = time.time()
                                      _mark_proxy_auth_done("credentials submitted")
                                  elif seen_prompt:
                                      PROXY_AUTH_STATE["page_ok_ticks"] = 0
                                      PROXY_AUTH_STATE["last_prompt_seen"] = now
                                  elif (edge_window and (now - PROXY_AUTH_STATE["started"]) > 10
                                        and (now - PROXY_AUTH_STATE["last_prompt_seen"]) > 5):
                                      if _page_loaded_without_prompt(edge_window):
                                          PROXY_AUTH_STATE["page_ok_ticks"] += 1
                                          if PROXY_AUTH_STATE["page_ok_ticks"] >= 3:
                                              _mark_proxy_auth_done("page loaded with no proxy prompt - proxy already authenticated")
                                      else:
                                          PROXY_AUTH_STATE["page_ok_ticks"] = 0
                          else:
                              # Late-prompt valve: ONLY a prompt that names the proxy host, a few times, for a short while.
                              age = now - PROXY_AUTH_STATE["done_time"]
                              if age <= LATE_PROMPT_WINDOW_SEC and PROXY_AUTH_STATE["late_reinjects"] < LATE_REINJECT_MAX:
                                  if now - last_late_check >= LATE_VALVE_INTERVAL:
                                      last_late_check = now
                                      try:
                                          late_target = _find_genuine_proxy_prompt(desktop, edge_window)
                                      except Exception:
                                          late_target = None
                                      if late_target is not None:
                                          PROXY_AUTH_STATE["late_reinjects"] += 1
                                          log_msg("ProxyAuth", f"[LatePrompt] A genuine proxy prompt (names the proxy host) is showing again - re-submitting ({PROXY_AUTH_STATE['late_reinjects']}/{LATE_REINJECT_MAX}).")
                                          if inject_proxy_auth(late_target, label="late-prompt", allow_late=True):
                                              last_auth_inject_time = now
                                              proxy_auth_time = time.time()
                              elif not PROXY_AUTH_STATE["valve_logged"]:
                                  PROXY_AUTH_STATE["valve_logged"] = True
                                  log_msg("ProxyAuth", "Late-prompt window closed: proxy credential injection is fully disabled for the rest of this task.")

                      if not download_windows_closed and os.path.exists(sentinel_path):
                          log_msg("Sentinel", "Download flag detected. Initiating Edge cleanup sequence...")
                          for attempt in range(1, 8):
                              still_open = close_download_windows(desktop, attempt_label=f"#{attempt}")
                              time.sleep(2)
                              if not still_open:
                                  break
                          download_windows_closed = True
                          download_started = True
                          edge_window = None

                      if not sentinel_read_done and os.path.exists(installer_executed_sentinel):
                          try:
                              with open(installer_executed_sentinel, "r") as f:
                                  flag_content = f.read().strip()
                                  if flag_content in ["opera_one", "opera_gx", "avg"]:
                                      actual_software = flag_content
                                      log_msg("UI-Engine", f"Actual software resolved from sentinel: {actual_software}")
                          except Exception: pass
                          sentinel_read_done = True

                      if action_mode == "install":
                          if actual_software == "opera_one" and not opera_one_post_install_done:
                              if opera_one_installer_executed_time is None and sentinel_read_done:
                                  opera_one_installer_executed_time = time.time()
                                  log_msg("PostInstall-OP1", "Installer sentinel detected. Post-install fires in 25s.")
                              elif opera_one_installer_executed_time is not None and (time.time() - opera_one_installer_executed_time) >= 25:
                                  log_msg("PostInstall-OP1", "25s threshold reached. Launching Opera One post-install.")
                                  opera_one_post_install_sequence(opera_window, software_type=actual_software)
                                  opera_one_post_install_done = True

                          if actual_software == "opera_gx" and not opera_gx_post_install_done:
                              if opera_gx_installer_executed_time is None and sentinel_read_done:
                                  opera_gx_installer_executed_time = time.time()
                                  log_msg("PostInstall-OPGX", "Installer sentinel detected. Post-install fires in 40s.")
                              elif opera_gx_installer_executed_time is not None and (time.time() - opera_gx_installer_executed_time) >= 40:
                                  log_msg("PostInstall-OPGX", "40s threshold reached. Launching Opera GX post-install.")
                                  opera_gx_post_install_sequence(opera_window)
                                  opera_gx_post_install_done = True

                          if actual_software == "avg" and not avg_post_install_done:
                              if avg_installer_executed_time is None and sentinel_read_done:
                                  avg_installer_executed_time = time.time()
                                  log_msg("PostInstall-AVG", "Sentinel detected. Post-install fires in 60s.")
                              elif avg_installer_executed_time is not None and (time.time() - avg_installer_executed_time) >= 60:
                                  log_msg("PostInstall-AVG", "60s threshold reached. Launching AVG post-install.")
                                  avg_post_install_sequence(avg_window)
                                  avg_post_install_done = True

                      if edge_window:
                          try:
                              for btn in edge_window.descendants(control_type="Button"):
                                  try: btn_txt = (btn.window_text() or "").strip()
                                  except Exception: btn_txt = ""
                                  if btn_txt and _matches_any(btn_txt, COOKIE_CONSENT_KEYWORDS):
                                      try:
                                          log_msg("Cookies", f"Found consent button: '{btn_txt}'. Clicking...")
                                          btn.click_input()
                                          time.sleep(1)
                                          break
                                      except Exception: pass
                          except Exception: pass

                      if edge_window and software_type == "opera_smart_link":
                          elapsed = time.time() - proxy_auth_time
                          if not smart_link_interstitial_done and elapsed > 40:
                              try:
                                  log_msg("SmartLink", f"{elapsed:.1f}s elapsed. Executing TAB + ENTER interstitial bypass...")
                                  edge_window.set_focus(); time.sleep(0.5)
                                  send_keys('{TAB}'); time.sleep(1)
                                  send_keys('{ENTER}')
                              except Exception as e:
                                  log_msg("SmartLink", f"Bypass failed: {e}")
                              smart_link_interstitial_done = True
                              smart_link_interstitial_time = time.time()
                              proxy_auth_time = time.time()

                      # =======================================================
                      # POST-LOAD BEHAVIOUR (click + surf pathways): surf / scroll / none
                      # =======================================================
                      if action_mode in ("surf", "click"):
                          if software_type == "opera_smart_link":
                              if not smart_link_interstitial_done:
                                  time.sleep(1)
                                  continue
                              elif action_mode == "click" and time.time() - smart_link_interstitial_time < 15:
                                  time.sleep(1)
                                  continue

                          if POST_BEHAVIOR in ("surf", "scroll"):
                              elapsed_surf = time.time() - proxy_auth_time
                              if not surf_simulation_executed and elapsed_surf > 6 and edge_window:
                                  surf_simulation_executed = True
                                  if POST_BEHAVIOR == "surf":
                                      log_msg("UI-Engine", f"Post-load behaviour: SURF ({action_mode} pathway) - domain-locked surfing.")
                                      run_human_surfing_simulation(desktop, edge_window, profile_tag=profile_tag)
                                  else:
                                      log_msg("UI-Engine", f"Post-load behaviour: SCROLL ({action_mode} pathway) - scrolling up/down on the opened page.")
                                      run_scroll_session(desktop, edge_window)
                                  log_msg("UI-Engine", "Post-load behaviour complete. Terminating python loop cleanly.")
                                  sys.exit(0)

                          time.sleep(1)
                          continue

                      # =======================================================
                      # INSTALL PATHWAY HANDLING
                      # =======================================================
                      can_click_download = True
                      if software_type == "opera_smart_link":
                          if not smart_link_interstitial_done or (time.time() - smart_link_interstitial_time < 15):
                              can_click_download = False

                      if (edge_window and action_mode == "install" and can_click_download
                              and software_type in ["opera_gx", "opera_one", "ad_mvn",
                                                    "dynamic_opera", "opera_smart_link", "avg"]):
                          elapsed = time.time() - proxy_auth_time

                          if not download_clicked and elapsed > 30:
                              log_msg("DL-Engine", f"{elapsed:.1f}s elapsed. PRIMARY: Initiating download button detection...")
                              try: edge_window.set_focus()
                              except Exception: pass

                              robust_click_download_button(edge_window, software_type)

                              download_clicked = True
                              download_click_attempts = 1
                              last_dl_click_time = time.time()
                              last_download_reattempt_time = time.time()
                              keep_mouse_step = 0
                              keep_mouse_last_try = 0

                          elif (download_clicked and not download_started
                                and download_click_attempts < MAX_DOWNLOAD_CLICK_ATTEMPTS
                                and (time.time() - last_download_reattempt_time) > 20
                                and not keep_mouse_sequence_done):
                              log_msg("DL-Engine", f"Re-attempt {download_click_attempts + 1}/{MAX_DOWNLOAD_CLICK_ATTEMPTS}...")
                              try: edge_window.set_focus()
                              except Exception: pass
                              time.sleep(0.5)
                              robust_click_download_button(edge_window, software_type)
                              download_click_attempts += 1
                              last_download_reattempt_time = time.time()

                      if download_clicked and not keep_mouse_sequence_done and edge_window:
                          elapsed_since_dl = now - last_dl_click_time
                          if elapsed_since_dl >= 5 and keep_mouse_step < 4:
                              if (now - keep_mouse_last_try) >= 5:
                                  keep_mouse_step += 1
                                  try: edge_window.set_focus()
                                  except Exception: pass
                                  time.sleep(0.5)
                                  send_keys('^j')
                                  time.sleep(1.5)

                                  clicked_keep = False
                                  try:
                                      for btn in edge_window.descendants(control_type="Button"):
                                          txt = (btn.window_text() or "").lower()
                                          nm = (btn.element_info.name or "").lower()
                                          combined = f"{txt} {nm}"
                                          if any(kw in combined for kw in KEEP_KW):
                                              if click_element_robust(btn, "KeepMouse"):
                                                  clicked_keep = True
                                                  break
                                  except Exception: pass

                                  if clicked_keep:
                                      keep_mouse_sequence_done = True
                                      download_started = True
                                  else:
                                      keep_mouse_last_try = time.time()

                          if keep_mouse_step >= 4 and not keep_mouse_sequence_done:
                              keep_mouse_sequence_done = True

                      if edge_window and action_mode == "install":
                          add_ext_btns = edge_window.descendants(control_type="Button", title="Add extension")
                          if add_ext_btns:
                              try:
                                  edge_window.set_focus(); time.sleep(0.5)
                                  add_ext_btns[0].click_input()
                                  log_msg("Extension", "Clicked 'Add extension'. Waiting 2s...")
                                  time.sleep(2)
                              except Exception as e:
                                  log_msg("Extension", f"Failed to click 'Add extension': {e}")
                          else:
                              for btn_name in ["Add to Chrome", "Get"]:
                                  install_btns = edge_window.descendants(control_type="Button", title=btn_name)
                                  if install_btns:
                                      try:
                                          edge_window.set_focus(); time.sleep(0.5)
                                          install_btns[0].click_input()
                                          log_msg("Extension", f"Clicked '{btn_name}'. Waiting 2s...")
                                          time.sleep(2)
                                          break
                                      except Exception as e:
                                          log_msg("Extension", f"Failed to click '{btn_name}': {e}")

                  except Exception:
                      pass
                  time.sleep(1)

          if __name__ == "__main__":
              software_choice_raw = sys.argv[1] if len(sys.argv) > 1 else "01. Opera OfferGate - Ahmad"
              software_type = sys.argv[2] if len(sys.argv) > 2 else "opera_one"
              action_mode   = sys.argv[3] if len(sys.argv) > 3 else "install"
              profile_tag   = sys.argv[4] if len(sys.argv) > 4 else "P1"
              handle_automation(software_type, action_mode, profile_tag=profile_tag)
          '@

          $handlerPyBytes = [System.Text.UTF8Encoding]::new($false).GetBytes($handlerPy)
          [System.IO.File]::WriteAllBytes("$env:TEMP\auto_handler.py", $handlerPyBytes)

          Write-Host "[UI-Engine] Spinning up background Python process..." -ForegroundColor DarkGray
          Start-Process -FilePath "python" `
              -ArgumentList "-u `"$env:TEMP\auto_handler.py`" `"$env:SOFTWARE_CHOICE`" `"$env:SOFTWARE_TYPE`" `"$env:ACTION_MODE`" `"$env:PROFILE_TAG`"" `
              -WindowStyle Hidden

          $dlFolder    = "$env:USERPROFILE\Downloads"
          $timeoutSecs = 450
          $softwareType = $env:SOFTWARE_TYPE
          $exeFilter   = $env:EXE_FILTER
          $sentinelPath = "$env:TEMP\download_done.flag"
          $installerExecutedSentinel = "$env:TEMP\installer_executed.flag"

          if ($env:ACTION_MODE -eq "install") {
              Write-Host "[Watcher] Action mode is INSTALL. Initializing download directory monitor..." -ForegroundColor Cyan
              $installJob = Start-Job -ScriptBlock {
                  param($dlFolder, $timeoutSecs, $softwareType, $exeFilter, $sentinelPath, $installerExecutedSentinel)
                  $deadline  = (Get-Date).AddSeconds($timeoutSecs)
                  $installed = $false

                  Write-Output "[$($softwareType.ToUpper())-WATCHER] Tracking directory: $dlFolder"
                  Write-Output "[$($softwareType.ToUpper())-WATCHER] Awaiting file matching: $exeFilter"

                  while (-not $installed -and (Get-Date) -lt $deadline) {
                      if (Test-Path "$env:TEMP\abort_install.flag") {
                          Write-Output "[$($softwareType.ToUpper())-WATCHER] Abort flag detected. Ending watcher."
                          break
                      }

                      $candidates = Get-ChildItem -Path $dlFolder -Filter $exeFilter -ErrorAction SilentlyContinue |
                          Where-Object { $_.Name -notmatch '\.(crdownload|part|tmp)$' } |
                          Sort-Object LastWriteTime -Descending

                      if ($candidates.Count -gt 0) {
                          $file = $candidates[0]
                          Write-Output "[$($softwareType.ToUpper())-WATCHER] SUCCESS: Payload binary found -> $($file.Name)"

                          try { Set-Content -Path $sentinelPath -Value "done" -ErrorAction SilentlyContinue } catch {}

                          Write-Output "[$($softwareType.ToUpper())-WATCHER] Aggressively closing Edge download tabs..."
                          for ($closeAttempt = 1; $closeAttempt -le 4; $closeAttempt++) {
                              try {
                                  $wsh = New-Object -ComObject WScript.Shell
                                  $edgeProcs = Get-Process -Name "msedge" -ErrorAction SilentlyContinue |
                                      Where-Object { $_.MainWindowHandle -ne 0 } |
                                      Sort-Object StartTime -Descending

                                  if ($edgeProcs) {
                                      foreach ($edgeProc in $edgeProcs) {
                                          $wsh.AppActivate($edgeProc.Id)
                                          Start-Sleep -Milliseconds 600
                                          $wsh.SendKeys("^w")
                                          Start-Sleep -Milliseconds 400
                                          $wsh.SendKeys("^w")
                                          Start-Sleep -Milliseconds 400
                                      }
                                  } else {
                                      $wsh.SendKeys("^w")
                                      Start-Sleep -Milliseconds 500
                                      $wsh.SendKeys("^w")
                                  }

                                  Start-Sleep -Milliseconds 800
                                  $remaining = Get-Process -Name "msedge" -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 }
                                  if (-not $remaining) {
                                      break
                                  }
                              } catch {}
                              Start-Sleep -Milliseconds 500
                          }

                          $remainingAfter = Get-Process -Name "msedge" -ErrorAction SilentlyContinue
                          if ($remainingAfter) {
                              Stop-Process -Name "msedge" -Force -ErrorAction SilentlyContinue
                          }

                          $actualSoftware = $softwareType
                          if ($softwareType -in @("ad_mvn", "dynamic_opera", "opera_smart_link")) {
                              if ($file.Name -match "OperaGX") { $actualSoftware = "opera_gx" }
                              elseif ($file.Name -match "Opera.*Setup|Opera") { $actualSoftware = "opera_one" }
                              elseif ($file.Name -match "avg") { $actualSoftware = "avg" }
                              else { $actualSoftware = "opera_one" }
                          }

                          Write-Output "[$($actualSoftware.ToUpper())-INSTALL] Fingerprinted as: $actualSoftware"
                          $locked = $true
                          while ($locked) {
                              Start-Sleep -Seconds 2
                              try {
                                  $s = [System.IO.File]::Open($file.FullName, 'Open', 'Read', 'None')
                                  $s.Close(); $locked = $false
                              } catch { }
                          }

                          try { Set-Content -Path $installerExecutedSentinel -Value $actualSoftware -ErrorAction SilentlyContinue } catch {}
                          try {
                              Start-Process -FilePath $file.FullName -ArgumentList "/silent" -Wait
                              Set-Content -Path "$env:TEMP\software_downloaded_success.flag" -Value "true" -ErrorAction SilentlyContinue
                          } catch {}

                          $installed = $true
                      } else {
                          Start-Sleep -Seconds 5
                      }
                  }
              } -ArgumentList $dlFolder, $timeoutSecs, $softwareType, $exeFilter, $sentinelPath, $installerExecutedSentinel
          }

          Write-Host "[System] Closing any lingering Edge processes..." -ForegroundColor DarkGray
          Stop-Process -Name "msedge" -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          Write-Host "[System] UI-Engine (Python) will autonomously manage Edge..." -ForegroundColor Cyan
          Write-Host "========== RUNTIME EXECUTION ==========" -ForegroundColor Cyan

          if ($env:ACTION_MODE -eq "install") {
              Write-Host "[Runtime] Operating in INSTALL pathway. Monitoring watcher job..." -ForegroundColor Cyan
              $deadline = (Get-Date).AddSeconds($timeoutSecs)
              while ($true) {
                  $output = Receive-Job -Job $installJob -ErrorAction SilentlyContinue
                  if ($output) { foreach ($line in $output) { Write-Host $line } }
                  if ($installJob.State -eq 'Completed' -or $installJob.State -eq 'Failed' -or (Get-Date) -gt $deadline) { break }
                  Start-Sleep -Seconds 5
              }
              Write-Host "[Runtime] Install job concluded. Task complete." -ForegroundColor Green

              if (Test-Path "$env:TEMP\software_downloaded_success.flag") {
                  Write-Host "[Runtime] Software downloaded and installed successfully." -ForegroundColor Green
                  "SOFTWARE_DOWNLOADED=true" | Out-File -FilePath $env:GITHUB_ENV -Append
              } else {
                  Write-Host "[Runtime] Software NOT downloaded. Skipping Keep-Alive." -ForegroundColor Yellow
              }

          } elseif ($env:POST_BEHAVIOR -in @("surf", "scroll")) {
              Write-Host "============================================================" -ForegroundColor Cyan
              Write-Host " $($env:ACTION_MODE.ToUpper()) pathway | post-load behaviour: $($env:POST_BEHAVIOR.ToUpper())" -ForegroundColor Cyan
              if ($env:POST_BEHAVIOR -eq "surf") {
                  Write-Host " Visitor Profile: $env:PROFILE_TAG (domain-locked surfing)" -ForegroundColor Yellow
              } else {
                  Write-Host " Scroll session: up/down scrolling with per-scroll randomised parameters" -ForegroundColor Yellow
              }
              Write-Host " Runtime       : randomised per session, HARD CAP 180s" -ForegroundColor Yellow
              Write-Host "============================================================" -ForegroundColor Cyan

              $surfDurationFile = "$env:TEMP\surf_duration.txt"
              $surfDoneFlag     = "$env:TEMP\surf_done.flag"
              $surfStatsFile    = "$env:TEMP\surf_stats.json"
              $surfHardCap      = 180   # max seconds of surfing (engine clock, starts when surfing begins)
              $startupCeiling   = 240   # max seconds to wait for the engine to begin (Edge launch, proxy auth, interstitial)
              $graceAfter       = 20    # slack after the assigned runtime before the watcher forces the end
              $step             = 5
              $elapsed          = 0
              $surfBeganAt      = -1
              $resolvedDuration = $surfHardCap

              while ($true) {
                  if (Test-Path $surfDoneFlag) {
                      $ranFor = if ($surfBeganAt -ge 0) { $elapsed - $surfBeganAt } else { $elapsed }
                      Write-Host "[SURF-RUNTIME] Profile $env:PROFILE_TAG reported completion after ${ranFor}s of surfing." -ForegroundColor Green
                      break
                  }

                  if ($surfBeganAt -lt 0 -and (Test-Path $surfDurationFile)) {
                      try {
                          $val = [int](Get-Content -Path $surfDurationFile -Raw).Trim()
                          if ($val -ge 10 -and $val -le $surfHardCap) { $resolvedDuration = $val }
                      } catch {}
                      $surfBeganAt = $elapsed
                      Write-Host "[SURF-RUNTIME] Surf engine started at ${elapsed}s (startup took ${elapsed}s). Assigned runtime: ${resolvedDuration}s (cap ${surfHardCap}s)." -ForegroundColor Green
                  }

                  if ($surfBeganAt -ge 0) {
                      $surfElapsed = $elapsed - $surfBeganAt
                      if ($surfElapsed -ge ($resolvedDuration + $graceAfter)) {
                          Write-Host "[SURF-RUNTIME] Runtime budget exceeded (${surfElapsed}s of ${resolvedDuration}s + ${graceAfter}s grace). Concluding session." -ForegroundColor Yellow
                          break
                      }
                      $pct = [math]::Min(100, [int](100 * $surfElapsed / [math]::Max(1, $resolvedDuration)))
                      Write-Host "[SURF-RUNTIME] Browsing active [$env:PROFILE_TAG]: $surfElapsed / $resolvedDuration s ($pct%)" -ForegroundColor Cyan
                  } else {
                      if ($elapsed -ge $startupCeiling) {
                          Write-Host "[SURF-RUNTIME] Surf engine never started within ${startupCeiling}s. Concluding session." -ForegroundColor Red
                          break
                      }
                      Write-Host "[SURF-RUNTIME] Waiting for surf engine to start (Edge launch / proxy auth / page load): $elapsed / $startupCeiling s" -ForegroundColor DarkGray
                  }

                  $unexpectedDownloads = Get-ChildItem -Path $dlFolder -File -ErrorAction SilentlyContinue
                  if ($unexpectedDownloads.Count -gt 0) {
                      Write-Host "[Safety-Purge] Purging download leak in surf mode! ($($unexpectedDownloads.Count) files)..." -ForegroundColor Red
                      Remove-Item -Path "$dlFolder\*" -Force -Recurse -ErrorAction SilentlyContinue
                  }

                  Start-Sleep -Seconds $step
                  $elapsed += $step
              }

              if (Test-Path $surfStatsFile) {
                  Write-Host "[SURF-RUNTIME] Session report: $(Get-Content -Path $surfStatsFile -Raw)" -ForegroundColor Magenta
              }
              Write-Host "[Runtime] Surf tracking complete ($elapsed s total incl. startup). All actions finished." -ForegroundColor Green
              Write-Host "[Runtime] Surf pathway exiting cleanly." -ForegroundColor Magenta
              exit 0

          } else {
              Write-Host "[Runtime] Operating in CLICK-ONLY pathway. Installations bypassed." -ForegroundColor Magenta

              if ($env:SOFTWARE_TYPE -eq "opera_smart_link") {
                  Write-Host "[Runtime] Allowing 75 seconds for TAB/ENTER interstitial routing..." -ForegroundColor Yellow
              } else {
                  Write-Host "[Runtime] Allowing 75 seconds for webpage to fully load..." -ForegroundColor Yellow
              }

              $clickStart      = Get-Date
              $clickTotal      = 75
              $step            = 15
              $reloadFired     = $false
              $reloadThreshold = Get-Random -Minimum 20 -Maximum 61

              Write-Host "[$env:SOFTWARE_TYPE] Click session started. Reload threshold: ${reloadThreshold}s" -ForegroundColor DarkGray

              for ($w = 0; $w -lt $clickTotal; $w += $step) {
                  Write-Host "[$env:SOFTWARE_TYPE] Click tracker: $w / $clickTotal seconds elapsed..." -ForegroundColor Yellow

                  $unexpectedDownloads = Get-ChildItem -Path $dlFolder -File -ErrorAction SilentlyContinue
                  if ($unexpectedDownloads.Count -gt 0) {
                      Write-Host "[Safety-Purge] Blocking auto-download leak! Purging $($unexpectedDownloads.Count) file(s)..." -ForegroundColor Red
                      Remove-Item -Path "$dlFolder\*" -Force -Recurse -ErrorAction SilentlyContinue
                  }

                  if (-not $reloadFired) {
                      $elapsed = [int]((Get-Date) - $clickStart).TotalSeconds
                      if ($elapsed -ge $reloadThreshold) {
                          Write-Host "[$env:SOFTWARE_TYPE] Reload threshold at ${elapsed}s. Executing F5 reload..." -ForegroundColor Cyan
                          try {
                              $wsh = New-Object -ComObject WScript.Shell
                              $wsh.SendKeys('{F5}')
                              Write-Host "[$env:SOFTWARE_TYPE] F5 sent successfully." -ForegroundColor Green
                          } catch {
                              Write-Host "[$env:SOFTWARE_TYPE] F5 reload failed: $_" -ForegroundColor Red
                          }
                          $reloadFired = $true
                      }
                  }

                  Start-Sleep -Seconds $step
              }

              Write-Host "[Runtime] Click tracking complete (75s). All click-path tasks finished." -ForegroundColor Green
              Write-Host "[Runtime] Click pathway exiting cleanly." -ForegroundColor Magenta
              exit 0
          }

      - name: "Failure Guard (cancel run if 3+ devices fail at the same step)"
        if: ${{ failure() }}
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          JOB_DISPLAY_NAME: ${{ matrix.display_name }}
          FAIL_CANCEL_THRESHOLD: '3'
        run: |
          import os, sys, json, time, urllib.request, urllib.error
          from collections import Counter

          TH = int(os.environ.get("FAIL_CANCEL_THRESHOLD", "3"))
          REPO = os.environ["REPO"]
          RUN_ID = os.environ["RUN_ID"]
          ME = os.environ.get("JOB_DISPLAY_NAME", "")
          API = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
          HDR = {"Authorization": f"Bearer {os.environ.get('GH_TOKEN', '')}", "Accept": "application/vnd.github+json",
                 "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "failure-guard"}
          GUARD_STEP = "Failure Guard"
          DEVICE_MARKER = "Gate - Wait for Initial 5% Proxy Pool"


          def say(m=""):
              print(m, flush=True)


          def call(method, path):
              req = urllib.request.Request(API + path, method=method, headers=HDR)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  try:
                      return e.code, e.read()
                  except Exception:
                      return e.code, b""
              except Exception as e:
                  return 0, str(e).encode()


          def list_jobs():
              jobs = []
              for page in range(1, 11):
                  st, body = call("GET", f"/repos/{REPO}/actions/runs/{RUN_ID}/jobs?per_page=100&page={page}&filter=latest")
                  if st != 200:
                      break
                  batch = json.loads(body).get("jobs", [])
                  jobs += batch
                  if len(batch) < 100:
                      break
              return jobs


          def is_device_job(job):
              return any((s.get("name") or "").startswith(DEVICE_MARKER) for s in job.get("steps", []))


          def failed_step(job):
              for s in job.get("steps", []):
                  if s.get("conclusion") == "failure" and not (s.get("name") or "").startswith(GUARD_STEP):
                      return s.get("name")
              return None


          say("=" * 72)
          say(f" FAILURE GUARD  |  job: {ME}  |  threshold: {TH} device jobs failing on the SAME step")
          say("=" * 72)

          my_step = None
          by_step = {}
          for attempt in range(4):
              time.sleep(4 if attempt == 0 else 6)       # let step conclusions propagate in the API
              jobs = list_jobs()
              devices = [j for j in jobs if is_device_job(j)]
              mine = next((j for j in devices if j.get("name") == ME), None)
              my_step = failed_step(mine) if mine else None
              by_step = {}
              for j in devices:
                  fs = failed_step(j)
                  if fs and (j.get("conclusion") == "failure" or j.get("status") == "in_progress"):
                      by_step.setdefault(fs, []).append(j.get("name"))
              if my_step:
                  break

          if not my_step:
              say("[Guard] Could not determine which step failed for this job (API lag?). Not cancelling.")
              sys.exit(0)

          counts = Counter({k: len(v) for k, v in by_step.items()})
          say(f"[Guard] This job failed at step: '{my_step}'")
          for step, names in sorted(by_step.items(), key=lambda kv: -len(kv[1])):
              say(f"[Guard]   {len(names):>3} device job(s) failed at '{step}': {', '.join(names[:8])}{' ...' if len(names) > 8 else ''}")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if counts[my_step] >= TH:
              say("")
              say("!" * 72)
              say(f"::error title=Run cancelled by Failure Guard::{counts[my_step]} device jobs failed at the same step '{my_step}' - cancelling the whole run.")
              say("!" * 72)
              st, body = call("POST", f"/repos/{REPO}/actions/runs/{RUN_ID}/cancel")
              say(f"[Guard] Cancel request sent -> HTTP {st}")
              if summary:
                  with open(summary, "a", encoding="utf-8") as fh:
                      fh.write(f"## Run cancelled by Failure Guard\n{counts[my_step]} device jobs failed at the same step: **{my_step}**\n\n"
                               + "\n".join(f"- {n}" for n in by_step[my_step]) + "\n")
          else:
              say(f"[Guard] {counts[my_step]}/{TH} failures at this step so far - run continues.")
              if summary:
                  with open(summary, "a", encoding="utf-8") as fh:
                      fh.write(f"Failure Guard: {counts[my_step]}/{TH} device jobs failed at `{my_step}` - run continues.\n")


      - name: Keep Runner Alive
        if: always() && matrix.action_mode == 'install' && env.SOFTWARE_DOWNLOADED == 'true'
        shell: pwsh
        env:
          KEEP_ALIVE_INPUT: ${{ inputs.keep_alive_duration }}
        run: |
          Write-Host "Session lifecycle fully executed." -ForegroundColor Green

          $durationMins = [int]($env:KEEP_ALIVE_INPUT -replace '[^\d]', '')
          $durationSecs = $durationMins * 60

          Write-Host "Leaving runner online for $durationMins minutes ($durationSecs seconds)..." -ForegroundColor Cyan
          Start-Sleep -Seconds $durationSecs

  ip_claims_cleanup:
    name: "Unique IP - Report & Cleanup"
    needs: [prepare_matrix, remote_session]
    if: ${{ always() && inputs.unique_ip == true }}
    runs-on: ubuntu-latest
    steps:
      - name: "Report claimed IPs and delete claim refs"
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          import os, json, urllib.request, urllib.error

          REPO = os.environ["REPO"]
          RUN = f"{os.environ['RUN_ID']}-{os.environ.get('RUN_ATTEMPT', '1')}"
          API = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
          HDR = {"Authorization": f"Bearer {os.environ.get('GH_TOKEN', '')}", "Accept": "application/vnd.github+json",
                 "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "ip-claims-cleanup"}


          def call(method, path):
              req = urllib.request.Request(API + path, method=method, headers=HDR)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  try:
                      return e.code, e.read()
                  except Exception:
                      return e.code, b""
              except Exception as e:
                  return 0, str(e).encode()


          refs = []
          for prefix in (f"ipclaims/{RUN}/", f"tags/ipclaim-{RUN}-"):
              st, body = call("GET", f"/repos/{REPO}/git/matching-refs/{prefix}")
              if st == 200:
                  try:
                      refs += [r["ref"] for r in json.loads(body)]
                  except Exception:
                      pass

          ips = []
          for ref in refs:
              tail = ref.split(f"ipclaims/{RUN}/", 1)[1] if f"ipclaims/{RUN}/" in ref else ref.split(f"ipclaim-{RUN}-", 1)[-1]
              ips.append(tail)

          print("=" * 60)
          print(f" UNIQUE-IP RECORDS FOR THIS RUN: {len(ips)} unique exit IP(s) were used")
          print("=" * 60)
          for ip in sorted(ips):
              print(f"  {ip}")

          summ = os.environ.get("GITHUB_STEP_SUMMARY")
          if summ:
              with open(summ, "a", encoding="utf-8") as fh:
                  fh.write(f"## Unique IP records\n**{len(ips)}** distinct exit IPs were claimed by devices in this run.\n\n")
                  if ips:
                      fh.write("```\n" + "\n".join(sorted(ips)) + "\n```\n")

          deleted = 0
          for ref in refs:
              st, _ = call("DELETE", f"/repos/{REPO}/git/{ref}")
              if st in (200, 204):
                  deleted += 1
          print(f"Cleaned up {deleted}/{len(refs)} claim refs.")
