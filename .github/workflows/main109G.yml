          def get_visitor_profile(profile_tag):
              try:
                  p_id = int(re.sub(r"[^\d]", "", profile_tag))
              except Exception:
                  p_id = random.randint(1, 100)
              p_id = max(1, min(100, p_id))

              arch = ARCHETYPES[(p_id - 1) * len(ARCHETYPES) // 100]
              rng = random.Random(p_id * 7919 + 13)   # deterministic "person" per profile id

              def u(key):
                  lo, hi = arch[key]
                  return rng.uniform(lo, hi)

              dur_low = min(u("dur_low"), SURF_HARD_CAP_SEC - 25)
              dur_high = min(max(u("dur_high"), dur_low + 15), SURF_HARD_CAP_SEC)
              weights = {k: rng.uniform(lo, hi) for k, (lo, hi) in arch["weights"].items()}
              links_lo, links_hi = arch["links"]
              base_links = rng.randint(links_lo, links_hi)

              # Per-session mood: genuinely random each run, so the same profile never behaves identically twice
              mood = random.uniform(0.85, 1.15)
              energy = random.uniform(0.90, 1.12)
              link_target = max(0, min(6, base_links + random.choice([-1, 0, 0, 1])))

              pause_min = u("pause_min") * mood
              pause_max = pause_min + u("pause_span") * mood
              speed = u("speed") * energy

              return {
                  "profile_id": f"P{p_id}",
                  "archetype": arch["name"],
                  "dur_low": dur_low,
                  "dur_high": dur_high,
                  "dur_mode_pos": u("mode_pos"),
                  "duration_min": int(dur_low),
                  "duration_max": int(dur_high),
                  "scroll_speed": "fast" if speed > 1.15 else ("slow" if speed < 0.9 else "medium"),
                  "speed": speed,
                  "pause_min": pause_min,
                  "pause_max": pause_max,
                  "down_scroll_prob": u("down"),
                  "link_click_target": link_target,
                  "subpage_stay": u("stay") * mood,
                  "text_select_prob": u("select"),
                  "idle_prob": u("idle"),
                  "idle_len": arch["idle_len"],
                  "key_scroll_prob": u("key"),
                  "bounce_prob": u("bounce"),
                  "sticky_prob": u("sticky"),
                  "footer_prob": u("footer"),
                  "glance": u("glance"),
                  "overshoot_prob": u("overshoot"),
                  "max_depth": 2,
                  "weights": weights,
                  "mood": mood,
              }


          def sample_session_duration(profile):
              """Randomised total runtime (page load included). Never above SURF_HARD_CAP_SEC."""
              lo, hi = profile["dur_low"], profile["dur_high"]
              mode = lo + (hi - lo) * profile["dur_mode_pos"]
              kind = "normal"
              d = random.triangular(lo, hi, mode)
              roll = random.random()
              if roll < profile["bounce_prob"]:
                  kind = "early-bounce"
                  d = random.uniform(SURF_MIN_SEC, max(SURF_MIN_SEC + 8, lo * 0.65))
              elif roll > 1.0 - profile["sticky_prob"]:
                  kind = "highly-engaged"
                  d = random.uniform(hi * 0.90, hi)
              d *= random.uniform(0.95, 1.05)
              d = int(max(SURF_MIN_SEC, min(d, SURF_HARD_CAP_SEC - 5)))
              return d, kind


          # ---------------------------------------------------------------------------
          # Page load verifier (deadline aware)
          # ---------------------------------------------------------------------------
          def wait_for_page_to_fully_load(edge_window, timeout=35):
              timeout = max(2, min(timeout, surf_remaining() - 1))
              log_msg("PageVerifier", f"Verifying webpage load and DOM stabilization (max {timeout:.0f}s)...")
              start_check = time.time()
              last_descendant_count = -1
              stable_ticks = 0

              while (time.time() - start_check) < timeout:
                  try:
                      wt = (edge_window.window_text() or "").strip()
                      wt_lower = wt.lower()
                      if wt_lower in ["microsoft edge", "edge", "new tab", "about:blank", ""]:
                          time.sleep(1)
                          continue

                      count = 0
                      for doc in edge_window.descendants(control_type="Document"):
                          count += len(doc.children())

                      if count > 0:
                          if count == last_descendant_count:
                              stable_ticks += 1
                              if stable_ticks >= 3:
                                  log_msg("PageVerifier", f"Page verified as fully loaded and stable. Title: '{wt[:50]}' (Elements: {count})")
                                  return True
                          else:
                              stable_ticks = 0
                              last_descendant_count = count
                      else:
                          desc_cnt = len(edge_window.descendants())
                          if desc_cnt > 15:
                              log_msg("PageVerifier", f"DOM elements active ({desc_cnt} nodes). Page ready.")
                              return True
                  except Exception:
                      pass
                  time.sleep(1)

              log_msg("PageVerifier", "Timeout reached waiting for page load. Proceeding with best-effort state.")
              return True


          # ---------------------------------------------------------------------------
          # Mouse: curved (bezier) paths, variable speed, occasional overshoot+correct
          # ---------------------------------------------------------------------------
          def _clamp_screen(x, y):
              try:
                  sw, sh = pyautogui.size()
              except Exception:
                  sw, sh = 1920, 1080
              return int(max(3, min(sw - 4, x))), int(max(3, min(sh - 4, y)))


          def _bezier_path(x1, y1, x2, y2, steps):
              dist = math.hypot(x2 - x1, y2 - y1) or 1.0
              nx, ny = -(y2 - y1) / dist, (x2 - x1) / dist
              bend1 = random.uniform(-0.22, 0.22) * dist
              bend2 = random.uniform(-0.22, 0.22) * dist
              c1 = (x1 + (x2 - x1) * 0.30 + nx * bend1, y1 + (y2 - y1) * 0.30 + ny * bend1)
              c2 = (x1 + (x2 - x1) * 0.70 + nx * bend2, y1 + (y2 - y1) * 0.70 + ny * bend2)
              pts = []
              for i in range(1, steps + 1):
                  t = i / steps
                  t = t * t * (3 - 2 * t)  # smoothstep easing: slow start/end, fast middle
                  a = (1 - t) ** 3
                  b = 3 * (1 - t) ** 2 * t
                  c = 3 * (1 - t) * t ** 2
                  d = t ** 3
                  pts.append((a * x1 + b * c1[0] + c * c2[0] + d * x2, a * y1 + b * c1[1] + c * c2[1] + d * y2))
              return pts


          def human_smooth_move(x, y, duration=None, speed=1.0, overshoot_prob=0.0):
              try:
                  x, y = _clamp_screen(x, y)
                  cx, cy = pyautogui.position()
                  dist = math.hypot(x - cx, y - cy)
                  if dist < 4:
                      return
                  if duration is None:
                      duration = max(0.18, min(1.4, dist / (950.0 * max(0.4, speed)) + random.uniform(0.08, 0.28)))
                  duration = min(duration, max(0.1, surf_remaining() - 0.5))

                  targets = [(x, y)]
                  if overshoot_prob and dist > 220 and random.random() < overshoot_prob:
                      ox, oy = _clamp_screen(x + random.randint(-28, 28), y + random.randint(-22, 22))
                      targets = [(ox, oy), (x, y)]

                  for idx, (tx, ty) in enumerate(targets):
                      seg_dur = duration if idx == 0 else random.uniform(0.12, 0.28)
                      sx, sy = pyautogui.position()
                      steps = int(max(8, min(55, math.hypot(tx - sx, ty - sy) / 14)))
                      for (px, py) in _bezier_path(sx, sy, tx, ty, steps):
                          px, py = _clamp_screen(px, py)
                          pyautogui.moveTo(px, py, duration=0, _pause=False)
                          time.sleep(seg_dur / steps)
                  if random.random() < 0.40:
                      jx, jy = random.randint(-4, 4), random.randint(-4, 4)
                      pyautogui.moveRel(jx, jy, duration=random.uniform(0.05, 0.15), _pause=False)
              except Exception:
                  pass


          def ensure_pointer_on_content(speed=1.0):
              """Mouse-wheel only scrolls the page when the pointer is over it."""
              try:
                  sw, sh = pyautogui.size()
                  x, y = pyautogui.position()
                  if y < sh * 0.22 or y > sh * 0.94 or x < sw * 0.05 or x > sw * 0.95:
                      human_smooth_move(random.randint(int(sw * 0.25), int(sw * 0.75)),
                                        random.randint(int(sh * 0.35), int(sh * 0.75)), speed=speed)
              except Exception:
                  pass


          # ---------------------------------------------------------------------------
          # Scrolling: EVERY scroll draws its own fresh parameter set (tick count, step
          # size, per-tick jitter, easing strength, momentum, tick delay range,
          # hesitation, overshoot, settle pause, pointer drift...). No two scrolls are
          # ever executed with the same numbers.
          # ---------------------------------------------------------------------------
          def sample_scroll_params(direction="down", intensity="medium", speed=1.0, overshoot_prob=0.10):
              base = {"short": (2, 5, 60, 130), "medium": (3, 9, 80, 190), "long": (7, 15, 110, 260)}.get(intensity, (3, 9, 80, 190))
              return {
                  "direction": direction,
                  "intensity": intensity,
                  "ticks": random.randint(base[0], base[1]),
                  "step": random.randint(base[2], base[3]),
                  "step_jitter": random.uniform(0.05, 0.30),
                  "ease": random.uniform(0.25, 1.0),
                  "momentum": random.uniform(-0.25, 0.25),
                  "tick_delay": (random.uniform(0.025, 0.07), random.uniform(0.09, 0.24)),
                  "speed": speed * random.uniform(0.85, 1.20),
                  "hesitate_prob": random.uniform(0.0, 0.10),
                  "hesitate_len": (random.uniform(0.15, 0.35), random.uniform(0.45, 1.0)),
                  "overshoot_prob": min(0.5, overshoot_prob * random.uniform(0.5, 1.6)),
                  "overshoot_ticks": random.randint(1, 3),
                  "settle_pause": (random.uniform(0.15, 0.40), random.uniform(0.50, 1.30)),
                  "pointer_drift": random.random() < 0.35,
              }


          def describe_scroll_params(p):
              return (f"{p['direction'].upper()} {p['intensity']} | ticks={p['ticks']} step={p['step']}±{p['step_jitter']:.0%} "
                      f"ease={p['ease']:.2f} mom={p['momentum']:+.2f} delay={p['tick_delay'][0]:.2f}-{p['tick_delay'][1]:.2f}s "
                      f"hes={p['hesitate_prob']:.0%} ovs={p['overshoot_prob']:.0%}")


          def human_natural_scroll(direction="down", intensity="medium", overshoot_prob=0.10, speed=1.0, params=None):
              """Eased wheel scroll. Pass params=None (default) to draw a brand-new parameter set for this scroll."""
              p = params or sample_scroll_params(direction, intensity, speed, overshoot_prob)
              try:
                  ensure_pointer_on_content(p["speed"])
                  sign = -1 if direction == "down" else 1
                  n = max(1, p["ticks"])
                  for i in range(n):
                      if surf_remaining() <= 1:
                          return p
                      pos = (i + 0.5) / n
                      ease_factor = (1.0 - p["ease"]) + p["ease"] * (0.35 + 1.10 * math.sin(math.pi * pos))
                      momentum_factor = 1.0 + p["momentum"] * (pos - 0.5) * 2.0
                      jitter = random.uniform(1.0 - p["step_jitter"], 1.0 + p["step_jitter"])
                      amount = int(sign * p["step"] * ease_factor * momentum_factor * jitter)
                      if amount == 0:
                          amount = sign * 30
                      pyautogui.scroll(amount, _pause=False)
                      lo, hi = p["tick_delay"]
                      time.sleep(random.uniform(lo, hi) / max(0.6, p["speed"]))
                      if p["pointer_drift"] and random.random() < 0.25:
                          pyautogui.moveRel(random.randint(-6, 6), random.randint(-4, 4), duration=0.05, _pause=False)
                      if random.random() < p["hesitate_prob"]:
                          surf_sleep(random.uniform(*p["hesitate_len"]))

                  if random.random() < p["overshoot_prob"]:
                      surf_sleep(random.uniform(0.2, 0.5))
                      for _ in range(p["overshoot_ticks"]):
                          pyautogui.scroll(int(-sign * random.randint(30, 90)), _pause=False)
                          time.sleep(random.uniform(0.04, 0.12))
                  surf_sleep(random.uniform(*p["settle_pause"]))
              except Exception:
                  pass
              return p


          def human_key_scroll(direction="down"):
              """Keyboard scrolling with a randomly chosen style each time."""
              try:
                  ensure_pointer_on_content()
                  style = random.choice(["page", "page", "arrow", "arrow", "burst"])
                  if style == "page":
                      key = "pagedown" if direction == "down" else "pageup"
                      pyautogui.press(key, presses=random.randint(1, 3), interval=random.uniform(0.30, 1.0), _pause=False)
                  elif style == "arrow":
                      key = "down" if direction == "down" else "up"
                      pyautogui.press(key, presses=random.randint(2, 12), interval=random.uniform(0.03, 0.14), _pause=False)
                  else:
                      key = "down" if direction == "down" else "up"
                      for _ in range(random.randint(2, 3)):
                          pyautogui.press(key, presses=random.randint(3, 7), interval=random.uniform(0.04, 0.10), _pause=False)
                          surf_sleep(random.uniform(0.25, 0.9))
                  surf_sleep(random.uniform(0.3, 0.9))
                  return style
              except Exception:
                  return "error"


          # ---------------------------------------------------------------------------
          # Reading / idle / selection behaviours (all deadline aware)
          # ---------------------------------------------------------------------------
          def human_reading_pause(min_s=2.5, max_s=6.5, parked_prob=0.15):
              pause_time = random.uniform(min_s, max_s)
              pause_time = min(pause_time, max(0.0, surf_remaining() - 1.0))
              if pause_time < 0.3:
                  return
              parked = random.random() < parked_prob   # eyes on page, hand off the mouse
              log_msg("Reader", f"Reading pause ({pause_time:.1f}s){' - mouse parked' if parked else ''}...")
              start_p = time.time()
              while time.time() - start_p < pause_time:
                  if not parked and random.random() < 0.35:
                      dx, dy = random.randint(-20, 20), random.randint(-12, 12)
                      pyautogui.moveRel(dx, dy, duration=random.uniform(0.2, 0.45), _pause=False)
                  time.sleep(min(random.uniform(0.4, 0.9), max(0.05, pause_time - (time.time() - start_p))))


          def human_idle_away(profile):
              lo, hi = profile["idle_len"]
              d = min(random.uniform(lo, hi), max(0.0, surf_remaining() - 8.0))
              if d < 1.5:
                  return False
              log_msg("HumanSurf", f"Attention drift: looking away from screen for {d:.1f}s (no input)...")
              surf_sleep(d)
              return True


          def human_text_selection_simulation():
              try:
                  sw, sh = pyautogui.size()
                  sx = random.randint(int(sw * 0.25), int(sw * 0.65))
                  sy = random.randint(int(sh * 0.35), int(sh * 0.75))
                  human_smooth_move(sx, sy)
                  pyautogui.mouseDown()
                  drag_len = random.randint(60, 240)
                  pyautogui.moveRel(drag_len, random.randint(-6, 6), duration=random.uniform(0.3, 0.7))
                  pyautogui.mouseUp()
                  log_msg("Reader", f"Simulated text highlighting ({drag_len}px).")
                  surf_sleep(random.uniform(0.8, 1.8))
              except Exception:
                  try:
                      pyautogui.mouseUp()
                  except Exception:
                      pass


          # ---------------------------------------------------------------------------
          # SITE LOCK
          # Once the (short) URL has redirected and the real page is loaded and stable,
          # the exact host (domain + sub-domain) is locked. During surfing:
          #   * links whose destination host differs are NEVER clicked
          #     (techxstudio.exblog.jp/30552337/ = OK, www.exblog.jp = rejected)
          #   * if a click / redirect / popup still lands elsewhere, the engine returns
          #     immediately (Alt+Left -> close stray tab -> navigate straight home)
          #   * a sentinel re-checks the address bar every few seconds
          # If the address bar cannot be read at all, link clicking is DISABLED
          # (fail closed) - the session only scrolls/reads.
          # ---------------------------------------------------------------------------
          _ADDR_CTRL = None
          _SITE = {"host": None, "home_url": None, "short_host": None, "locked": False, "readable": False}
          _INTERNAL_SCHEMES = ("chrome-error", "edge-error", "about", "edge", "chrome", "data", "blob", "file",
                               "view-source", "devtools", "chrome-extension", "extension")
          FILE_EXT_RE = re.compile(r"\.(pdf|zip|rar|7z|exe|msi|apk|dmg|iso|torrent|mp4|mkv|avi|mp3|docx?|xlsx?|pptx?|csv)(\?|#|$)", re.I)


          def _norm_host(h):
              h = (h or "").strip().lower()
              h = h.split("@")[-1]
              if h.startswith("["):          # ipv6 literal
                  return h
              h = h.split(":")[0]
              if h.startswith("www."):
                  h = h[4:]
              return h


          def parse_url_host(raw):
              """Returns (normalised_host | '__internal__' | None, full_url_with_scheme | None)."""
              if not raw:
                  return None, None
              s = str(raw).strip().strip("\"'")
              if not s or " " in s:
                  return None, None
              m = re.match(r"^([a-zA-Z][a-zA-Z0-9+.\-]*)://(.*)$", s)
              scheme, rest = (m.group(1).lower(), m.group(2)) if m else (None, s)
              if scheme in _INTERNAL_SCHEMES or (scheme is None and re.match(r"^(about|edge|chrome):", s.lower())):
                  return "__internal__", None
              host = _norm_host(re.split(r"[/?#]", rest, 1)[0])
              if not host or not re.match(r"^[\w\-\.\[\]:]+$", host, re.UNICODE):
                  return None, None
              if "." not in host and host != "localhost" and not host.startswith("["):
                  return None, None
              return host, f"{scheme or 'https'}://{rest}"


          def _find_addr_ctrl(edge_window):
              try:
                  for ed in edge_window.descendants(control_type="Edit"):
                      try:
                          aid = (ed.element_info.automation_id or "").lower()
                      except Exception:
                          aid = ""
                      if "addresseditbox" in aid or "addressfield" in aid or "locationbar" in aid:
                          return ed
                  for ed in edge_window.descendants(control_type="Edit"):
                      fn = globals().get("_is_address_bar_control")
                      if fn and fn(ed):
                          return ed
              except Exception:
                  pass
              return None


          def get_current_url(edge_window):
              """Reads the address bar value (cached control, 3 different getters)."""
              global _ADDR_CTRL
              for _ in range(2):
                  try:
                      if _ADDR_CTRL is None:
                          _ADDR_CTRL = _find_addr_ctrl(edge_window)
                      if _ADDR_CTRL is None:
                          return None
                      val = None
                      for getter in (lambda c: c.get_value(), lambda c: c.iface_value.CurrentValue, lambda c: c.window_text()):
                          try:
                              val = getter(_ADDR_CTRL)
                              if val:
                                  break
                          except Exception:
                              continue
                      if val:
                          return str(val).strip()
                      _ADDR_CTRL = None
                  except Exception:
                      _ADDR_CTRL = None
              return None


          def lock_site(edge_window, initial_url, max_wait=20):
              """Waits until the short URL has redirected and the real page is stable, then locks the host."""
              _SITE.update({"host": None, "home_url": None, "locked": False, "readable": False})
              short_host, _ = parse_url_host(initial_url)
              _SITE["short_host"] = short_host
              t0 = time.time()
              last, last_full, stable = None, None, 0
              while (time.time() - t0) < max_wait and surf_remaining() > 8:
                  host, full = parse_url_host(get_current_url(edge_window))
                  if host and host != "__internal__":
                      _SITE["readable"] = True
                      if host == last:
                          stable += 1
                      else:
                          last, last_full, stable = host, full, 1
                      moved = (short_host is None) or (host != short_host)
                      if stable >= 3 and (moved or (time.time() - t0) > 10):
                          break
                  else:
                      stable = 0
                  time.sleep(1.0)

              if last:
                  _SITE.update({"host": last, "home_url": last_full, "locked": True})
                  moved_txt = "redirect resolved" if (short_host and last != short_host) else "no redirect observed"
                  log_msg("SiteLock", f"LOCKED to host '{last}' ({moved_txt}; short-link host: {short_host or 'n/a'}; waited {time.time() - t0:.1f}s)")
                  log_msg("SiteLock", f"Home URL: {last_full}")
                  log_msg("SiteLock", f"Rule: only links on '{last}' are clickable. Everything else (other domains / other sub-domains) is rejected.")
              else:
                  log_msg("SiteLock", "WARNING: could not read the address bar / URL never stabilised. Link clicking DISABLED (fail-closed); scrolling/reading only.")
              return _SITE["locked"]


          def _site_host_now(edge_window):
              return parse_url_host(get_current_url(edge_window))


          def _set_clipboard_and_paste(edge_window, url):
              try:
                  import tkinter
                  r = tkinter.Tk()
                  r.withdraw()
                  r.clipboard_clear()
                  r.clipboard_append(url)
                  r.update()
                  send_keys('^l')
                  time.sleep(0.4)
                  send_keys('^v')
                  time.sleep(0.3)
                  send_keys('{ENTER}')
                  try:
                      r.destroy()
                  except Exception:
                      pass
                  return True
              except Exception:
                  return False


          def _escape_for_send_keys(s):
              out = []
              for ch in s:
                  if ch in "+^%~(){}[]":
                      out.append("{" + ch + "}")
                  elif ch == " ":
                      out.append("{SPACE}")
                  else:
                      out.append(ch)
              return "".join(out)


          def navigate_to_url(edge_window, url):
              try:
                  edge_window.set_focus()
              except Exception:
                  pass
              time.sleep(0.3)
              if _set_clipboard_and_paste(edge_window, url):
                  return
              send_keys('^l')
              time.sleep(0.4)
              send_keys(_escape_for_send_keys(url), pause=0.01)
              time.sleep(0.2)
              send_keys('{ENTER}')


          def recover_to_site(edge_window, label="Recover"):
              """Back to the locked host: history back -> close stray tab -> navigate home."""
              if not _SITE["locked"]:
                  return True

              def on_site():
                  host, _ = _site_host_now(edge_window)
                  return host == _SITE["host"], host

              for i in range(2):
                  try:
                      edge_window.set_focus()
                      send_keys('%{LEFT}')
                  except Exception:
                      pass
                  surf_sleep(random.uniform(1.6, 2.6))
                  wait_for_page_to_fully_load(edge_window, 10)
                  ok, host = on_site()
                  log_msg("SiteLock", f"[{label}] history-back #{i + 1}: now on '{host}' ({'OK' if ok else 'still off-site'})")
                  if ok:
                      return True

              try:
                  tabs = len(edge_window.descendants(control_type="TabItem"))
              except Exception:
                  tabs = 1
              if tabs >= 2:
                  try:
                      send_keys('^w')
                  except Exception:
                      pass
                  surf_sleep(1.6)
                  ok, host = on_site()
                  log_msg("SiteLock", f"[{label}] closed stray tab ({tabs} tabs were open): now on '{host}' ({'OK' if ok else 'still off-site'})")
                  if ok:
                      return True

              log_msg("SiteLock", f"[{label}] navigating straight to home URL {_SITE['home_url']}")
              navigate_to_url(edge_window, _SITE["home_url"])
              surf_sleep(random.uniform(2.2, 3.2))
              wait_for_page_to_fully_load(edge_window, 15)
              ok, host = on_site()
              log_msg("SiteLock", f"[{label}] after direct navigation: on '{host}' ({'OK' if ok else 'FAILED'})")
              return ok


          def site_sentinel(edge_window, label="Sentinel"):
              """True when still on the locked host (or when it cannot be checked). Recovers when off-site."""
              if not _SITE["locked"] or not _SITE["readable"]:
                  return True
              host, _ = _site_host_now(edge_window)
              if host is None or host == _SITE["host"]:
                  return True
              log_msg("SiteLock", f"[{label}] LEFT THE SITE: now on '{host}' (locked: '{_SITE['host']}'). Recovering...")
              SURF_STATS["escapes_recovered"] += 1
              return recover_to_site(edge_window, label)


          # ---------------------------------------------------------------------------
          # Link finder (site-lock aware): every candidate's destination is classified
          # BEFORE clicking. Off-site, file, mailto/javascript links are never clicked.
          # ---------------------------------------------------------------------------
          def get_link_href(el):
              for getter in (lambda e: e.iface_value.CurrentValue, lambda e: e.legacy_properties().get("Value")):
                  try:
                      v = getter(el)
                      if v and isinstance(v, str) and len(v.strip()) > 1:
                          return v.strip()
                  except Exception:
                      continue
              return None


          def classify_href(href):
              """'same' | 'off' | 'bad' | 'unknown' (destination cannot be read)."""
              if not href:
                  return "unknown"
              h = href.strip()
              low = h.lower()
              if low.startswith(("javascript:", "mailto:", "tel:", "sms:", "blob:", "data:", "file:", "ftp:")):
                  return "bad"
              if low.startswith("#"):
                  return "same"
              if FILE_EXT_RE.search(low.split("#")[0]):
                  return "bad"
              if "://" not in h and (h.startswith("/") or h.startswith("?") or "." not in h.split("/")[0]):
                  return "same"       # relative link -> same host by definition
              host, _ = parse_url_host(h)
              if host is None or host == "__internal__":
                  return "unknown"
              return "same" if host == _SITE["host"] else "off"


          def _collect_link_candidates(edge_window, control_types, sw, sh):
              found = []
              for ct in control_types:
                  try:
                      els = edge_window.descendants(control_type=ct)
                  except Exception:
                      continue
                  for el in els[:500]:
                      try:
                          txt = (el.window_text() or "").strip()
                          nm = (el.element_info.name or "").strip()
                          combined = f"{txt} {nm}".lower().strip()
                          if not combined or len(combined) > 70 or combined in _CLICKED_LABELS:
                              continue
                          if any(bad in combined for bad in DANGEROUS_CLICK_KEYWORDS):
                              continue
                          rect = el.rectangle()
                          cx, cy = rect.mid_point().x, rect.mid_point().y
                          if not ((sw * 0.08) < cx < (sw * 0.92) and (sh * 0.28) < cy < (sh * 0.90)):
                              continue
                          href = get_link_href(el)
                          found.append({"el": el, "cx": cx, "cy": cy, "label": combined, "href": href,
                                        "status": classify_href(href), "type": ct,
                                        "safe_kw": any(good in combined for good in SAFE_SURF_KEYWORDS)})
                      except Exception:
                          continue
              return found


          def find_and_interact_middle_or_downside(edge_window, speed=1.0, overshoot_prob=0.1):
              """Clicks ONE same-site link. Returns a dict describing the click, or None."""
              if not _SITE["locked"] or not _SITE["readable"]:
                  log_msg("LinkFinder", "Site lock inactive (address bar unreadable) -> link clicking disabled for safety.")
                  return None

              sw, sh = pyautogui.size()
              t0 = time.time()
              log_msg("LinkFinder", f"Scanning for links on '{_SITE['host']}' (middle/lower page area)...")

              cands = _collect_link_candidates(edge_window, ["Hyperlink"], sw, sh)
              same = [c for c in cands if c["status"] == "same"]
              unknown = [c for c in cands if c["status"] == "unknown"]
              if not same:
                  cands += _collect_link_candidates(edge_window, ["Button", "MenuItem", "TabItem"], sw, sh)
                  same = [c for c in cands if c["status"] == "same"]
                  unknown = [c for c in cands if c["status"] == "unknown"]

              off = [c for c in cands if c["status"] == "off"]
              bad = [c for c in cands if c["status"] == "bad"]
              SURF_STATS["links_rejected_offsite"] += len(off)
              SURF_STATS["links_rejected_bad"] += len(bad)
              log_msg("LinkFinder", f"Scan done in {time.time() - t0:.1f}s: same-site={len(same)} unknown-dest={len(unknown)} "
                                    f"REJECTED off-site={len(off)} file/mailto/js={len(bad)}")
              for c in off[:3]:
                  log_msg("LinkFinder", f"  rejected off-site: '{c['label'][:35]}' -> {(c['href'] or '')[:80]}")

              pool, mode = [], ""
              if same:
                  safe = [c for c in same if c["safe_kw"]]
                  pool = safe if (safe and random.random() < 0.75) else same
                  mode = "same-site (destination verified before click)"
              elif unknown:
                  pool = [c for c in unknown if c["type"] in ("Hyperlink", "Button", "MenuItem", "TabItem")]
                  mode = "destination unreadable -> will verify after click and return if it leaves the site"
              if not pool:
                  log_msg("LinkFinder", "No safe same-site link available right now.")
                  return None

              pool.sort(key=lambda x: x["cy"], reverse=True)
              chosen = random.choice(pool[:min(10, len(pool))])
              _CLICKED_LABELS.add(chosen["label"])
              log_msg("LinkFinder", f"Chosen: '{chosen['label'][:40]}' ({chosen['type']}) -> {(chosen['href'] or 'dest unknown')[:80]} [{mode}]")

              human_smooth_move(chosen["cx"], chosen["cy"], speed=speed, overshoot_prob=overshoot_prob)
              surf_sleep(random.uniform(0.25, 0.9))
              clicked = False
              if random.random() < 0.85:
                  try:
                      chosen["el"].click_input()
                      clicked = True
                  except Exception:
                      pass
              if not clicked:
                  pyautogui.click(chosen["cx"], chosen["cy"])
              log_msg("LinkFinder", "Clicked.")
              return {"label": chosen["label"], "href": chosen["href"], "status": chosen["status"]}


          # ---------------------------------------------------------------------------
          # Action picker: weighted by persona, shaped by session phase, anti-repetition
          # ---------------------------------------------------------------------------
          def pick_action(profile, phase, history, clicks_executed, depth, remaining, link_allowed=True, safe_mode=False):
              w = dict(profile["weights"])
              w["idle"] = w.get("idle", 0.0) + profile["idle_prob"] * 0.5
              w["select"] = w.get("select", 0.0) * (0.5 + profile["text_select_prob"])
              if phase == "early":
                  w["read"] *= 1.3
                  w["link"] *= 0.5
              elif phase == "late":
                  w["link"] *= 0.5
                  w["scroll"] *= 1.15
              if (not link_allowed or safe_mode or clicks_executed >= profile["link_click_target"]
                      or remaining <= 40 or depth >= profile["max_depth"]):
                  w["link"] = 0.0
              if safe_mode:
                  w["select"] = 0.0
                  w["idle"] = 0.0
              if remaining < 14:
                  w["idle"] = 0.0
                  w["select"] = 0.0
              if len(history) >= 2 and history[-1] == history[-2]:
                  w[history[-1]] = w.get(history[-1], 0.0) * 0.15
              keys = [k for k in w if w[k] > 0]
              if not keys:
                  return "scroll"
              return random.choices(keys, weights=[w[k] for k in keys])[0]


          def write_surf_flag(name, text):
              try:
                  with open(os.path.join(tempfile.gettempdir(), name), "w") as f:
                      f.write(text)
              except Exception:
                  pass


          def refresh_edge_window(desktop, old_window):
              """Re-acquire the Edge window if the handle went stale."""
              global _ADDR_CTRL
              try:
                  old_window.window_text()
                  return old_window
              except Exception:
                  pass
              try:
                  for w in desktop.windows(visible_only=True):
                      try:
                          if "edge" in (w.window_text() or "").lower() and "Chrome_WidgetWin" in (w.class_name() or ""):
                              _ADDR_CTRL = None
                              log_msg("HumanSurf", "Edge window handle was stale - re-acquired.")
                              return w
                      except Exception:
                          continue
              except Exception:
                  pass
              return old_window


          def _reset_surf_state():
              global _ADDR_CTRL
              _ADDR_CTRL = None
              _CLICKED_LABELS.clear()
              for k in SURF_STATS:
                  SURF_STATS[k] = 0
              _SITE.update({"host": None, "home_url": None, "short_host": None, "locked": False, "readable": False})


          def _surf_body(desktop, edge_window, profile, clock, duration_kind):
              sw, sh = pyautogui.size()
              speed = profile["speed"]
              ovs = profile["overshoot_prob"]

              # ---- page load + site lock (counts against the 180s cap) ----
              wait_for_page_to_fully_load(edge_window, timeout=18)
              lock_site(edge_window, globals().get("TARGET_URL", ""), max_wait=18)
              link_allowed = _SITE["locked"] and _SITE["readable"]

              log_msg("HumanSurf", "Initial landing glance. User observing top content...")
              human_reading_pause(min_s=profile["glance"] * 0.8, max_s=profile["glance"] * 1.4, parked_prob=0.3)

              if surf_remaining() > 5:
                  log_msg("HumanSurf", "Beginning first natural scroll down into middle content...")
                  p = human_natural_scroll("down", random.choice(["short", "medium"]), ovs, speed)
                  log_msg("Scroll", describe_scroll_params(p))
                  SURF_STATS["scroll"] += 1
                  human_reading_pause(profile["pause_min"], profile["pause_max"])

              clicks_executed = 0
              subpage_depth = 0
              subpage_entered_time = 0.0
              current_stay = profile["subpage_stay"]
              footer_done = False
              history = []
              err_streak = 0
              safe_mode = False
              next_sentinel = time.time() + random.uniform(6, 10)

              while surf_remaining() > 1.0:
                  remaining = surf_remaining()
                  frac = clock.elapsed() / clock.total
                  phase = "early" if frac < 0.25 else ("late" if frac > 0.75 else "mid")

                  try:
                      edge_window.set_focus()
                  except Exception:
                      edge_window = refresh_edge_window(desktop, edge_window)

                  # ---- periodic site sentinel (catches JS redirects / popups / ad hops) ----
                  if time.time() >= next_sentinel and remaining > 6:
                      next_sentinel = time.time() + random.uniform(7, 13)
                      try:
                          if not site_sentinel(edge_window, "Sentinel"):
                              subpage_depth = 0
                      except Exception as e:
                          log_msg("SiteLock", f"Sentinel error: {e}")

                  tag = f"[t={clock.elapsed():.0f}/{clock.total}s|{phase}]"

                  try:
                      if (not footer_done and frac > 0.45 and remaining > 20 and random.random() < profile["footer_prob"] * 0.25):
                          footer_done = True
                          SURF_STATS["footer_dive"] += 1
                          log_msg("HumanSurf", f"{tag} Heading to the footer area (long scroll down)...")
                          for _ in range(random.randint(2, 3)):
                              p = human_natural_scroll("down", "long", ovs, speed)
                              log_msg("Scroll", describe_scroll_params(p))
                          human_reading_pause(profile["pause_min"], profile["pause_max"])
                          history.append("scroll")
                          err_streak = 0
                          continue

                      action = pick_action(profile, phase, history, clicks_executed, subpage_depth, remaining,
                                           link_allowed=link_allowed, safe_mode=safe_mode)
                      history.append(action)

                      if action == "scroll":
                          direction = "down" if random.random() < profile["down_scroll_prob"] else "up"
                          if profile["scroll_speed"] == "fast":
                              intensity = random.choice(["medium", "long", "long"])
                          elif profile["scroll_speed"] == "slow":
                              intensity = random.choice(["short", "short", "medium"])
                          else:
                              intensity = random.choice(["short", "medium", "medium", "long"])
                          if random.random() < profile["key_scroll_prob"]:
                              style = human_key_scroll(direction)
                              log_msg("HumanSurf", f"{tag} Keyboard scroll {direction.upper()} ({style})")
                              SURF_STATS["keyscroll"] += 1
                          else:
                              p = human_natural_scroll(direction, intensity, ovs, speed)
                              log_msg("HumanSurf", f"{tag} Scroll -> {describe_scroll_params(p)}")
                              SURF_STATS["scroll"] += 1

                      elif action == "scroll_back":
                          p = human_natural_scroll("up", random.choice(["short", "medium"]), ovs, speed)
                          log_msg("HumanSurf", f"{tag} Re-reading: scroll back -> {describe_scroll_params(p)}")
                          human_reading_pause(profile["pause_min"], profile["pause_max"])
                          SURF_STATS["scroll_back"] += 1

                      elif action == "read":
                          human_reading_pause(profile["pause_min"], profile["pause_max"])
                          SURF_STATS["read"] += 1

                      elif action == "keyscroll":
                          direction = "down" if random.random() < profile["down_scroll_prob"] else "up"
                          style = human_key_scroll(direction)
                          log_msg("HumanSurf", f"{tag} Keyboard scroll {direction.upper()} ({style})")
                          SURF_STATS["keyscroll"] += 1

                      elif action == "select":
                          human_text_selection_simulation()
                          SURF_STATS["select"] += 1

                      elif action == "idle":
                          if human_idle_away(profile):
                              SURF_STATS["idle"] += 1

                      elif action == "link":
                          log_msg("HumanSurf", f"{tag} Link interaction ({clicks_executed + 1}/{profile['link_click_target']})...")
                          pre_raw = get_current_url(edge_window)
                          res = find_and_interact_middle_or_downside(edge_window, speed, ovs)
                          if res:
                              clicks_executed += 1
                              SURF_STATS["link"] += 1
                              surf_sleep(random.uniform(2.0, 3.5))
                              wait_for_page_to_fully_load(edge_window, 12)
                              post_raw = get_current_url(edge_window)
                              host, _ = parse_url_host(post_raw)
                              if host and host != _SITE["host"]:
                                  log_msg("SiteLock", f"{tag} Click led OFF-SITE ('{host}'). Returning immediately.")
                                  SURF_STATS["escapes_recovered"] += 1
                                  recover_to_site(edge_window, "post-click")
                                  subpage_depth = 0
                              elif post_raw and post_raw != pre_raw:
                                  subpage_depth += 1
                                  subpage_entered_time = time.time()
                                  current_stay = profile["subpage_stay"] * random.uniform(0.8, 1.25)
                                  log_msg("SiteLock", f"{tag} Navigated within '{_SITE['host']}' -> {str(post_raw)[:80]} (depth {subpage_depth})")
                                  p = human_natural_scroll("down", "short", ovs, speed)
                                  log_msg("Scroll", describe_scroll_params(p))
                                  human_reading_pause(max(2.5, profile["pause_min"]), max(5.0, profile["pause_max"]))
                              else:
                                  log_msg("HumanSurf", f"{tag} Click did not change the page (in-page element).")

                      else:  # rove
                          rx = random.randint(int(sw * 0.15), int(sw * 0.85))
                          ry = random.randint(int(sh * 0.30), int(sh * 0.80))
                          log_msg("HumanSurf", f"{tag} Eye-tracking mouse move to ({rx}, {ry})...")
                          human_smooth_move(rx, ry, speed=speed, overshoot_prob=ovs)
                          surf_sleep(random.uniform(0.5, 1.4))
                          SURF_STATS["rove"] += 1

                      # ---- back navigation once the subpage has been inspected long enough ----
                      if subpage_depth > 0 and (time.time() - subpage_entered_time) > current_stay and surf_remaining() > 10:
                          if random.random() < 0.75:
                              log_msg("HumanSurf", f"[t={clock.elapsed():.0f}/{clock.total}s] Subpage inspected. Navigating Back (Alt + Left Arrow)...")
                              edge_window.set_focus()
                              send_keys('%{LEFT}')
                              surf_sleep(random.uniform(2.0, 3.2))
                              wait_for_page_to_fully_load(edge_window, 12)
                              subpage_depth = max(0, subpage_depth - 1)
                              SURF_STATS["back_nav"] += 1
                              site_sentinel(edge_window, "after-back")

                      err_streak = 0
                  except Exception as e:
                      err_streak += 1
                      SURF_STATS["errors"] += 1
                      log_msg("HumanSurf", f"{tag} Action error ({err_streak} in a row): {type(e).__name__}: {e}")
                      if err_streak >= 5 and not safe_mode:
                          safe_mode = True
                          log_msg("HumanSurf", "Too many consecutive errors -> SAFE MODE (scroll/read only, no link clicks).")
                      surf_sleep(1.0)

                  surf_sleep(random.uniform(0.5, 1.4))

              # final guard: make sure the session ends on the locked site
              try:
                  site_sentinel(edge_window, "final")
              except Exception:
                  pass
              return clicks_executed


          def run_human_surfing_simulation(desktop, edge_window, profile_tag="P1"):
              global _SURF_CLOCK
              _reset_surf_state()
              profile = get_visitor_profile(profile_tag)
              session_duration, duration_kind = sample_session_duration(profile)
              _SURF_CLOCK = SurfClock(session_duration)
              clock = _SURF_CLOCK

              write_surf_flag("surf_duration.txt", str(clock.total))
              write_surf_flag("surf_start.txt", str(int(time.time())))

              log_msg("HumanSurf", "============================================================")
              log_msg("HumanSurf", f" VISITOR PROFILE LOADED: [{profile['profile_id']}] {profile['archetype'].upper()}")
              log_msg("HumanSurf", "============================================================")
              log_msg("HumanSurf", f"Persona traits : speed={profile['speed']:.2f} ({profile['scroll_speed']}) | pause={profile['pause_min']:.1f}-{profile['pause_max']:.1f}s | down-scroll={profile['down_scroll_prob']:.0%} | mood={profile['mood']:.2f}")
              log_msg("HumanSurf", f"Behaviour      : link target={profile['link_click_target']} | subpage stay~{profile['subpage_stay']:.0f}s | select={profile['text_select_prob']:.0%} | idle={profile['idle_prob']:.0%} | keyboard-scroll={profile['key_scroll_prob']:.0%} | footer-dive={profile['footer_prob']:.0%}")
              log_msg("HumanSurf", f"Runtime window : {profile['duration_min']}-{profile['duration_max']}s (hard cap {SURF_HARD_CAP_SEC}s)")
              log_msg("HumanSurf", f"SESSION RUNTIME ASSIGNED: {clock.total}s [{duration_kind}] (includes page load + site lock)")

              clicks_executed = 0
              try:
                  clicks_executed = _surf_body(desktop, edge_window, profile, clock, duration_kind)
              except Exception as e:
                  log_msg("HumanSurf", f"Surf session aborted by unexpected error: {type(e).__name__}: {e}")
              finally:
                  actual = clock.elapsed()
                  write_surf_flag("surf_stats.json", json.dumps({
                      "mode": "surf", "profile": profile["profile_id"], "archetype": profile["archetype"],
                      "assigned_sec": clock.total, "actual_sec": round(actual, 1), "kind": duration_kind,
                      "site_locked_host": _SITE["host"], "links_followed": clicks_executed, "actions": SURF_STATS,
                  }))
                  write_surf_flag("surf_done.flag", "done")
                  log_msg("HumanSurf", "============================================================")
                  log_msg("HumanSurf", f" SURF SESSION COMPLETE [{profile['profile_id']}] {profile['archetype']}")
                  log_msg("HumanSurf", f" Runtime  : {actual:.1f}s of {clock.total}s assigned (hard cap {SURF_HARD_CAP_SEC}s)")
                  log_msg("HumanSurf", f" Site lock: {_SITE['host'] or 'NOT LOCKED'} | off-site links rejected: {SURF_STATS['links_rejected_offsite']} | escapes recovered: {SURF_STATS['escapes_recovered']}")
                  log_msg("HumanSurf", f" Links    : {clicks_executed} followed (target {profile['link_click_target']}) | Back-navs: {SURF_STATS['back_nav']}")
                  log_msg("HumanSurf", f" Actions  : {SURF_STATS}")
                  log_msg("HumanSurf", "============================================================")


          # ---------------------------------------------------------------------------
          # SCROLL-ONLY SESSION (click path with the Scroll checkmark, or surf path when
          # only Scroll is ticked): scrolls up and down on the page that was opened.
          # Every single scroll uses freshly randomised parameters.
          # ---------------------------------------------------------------------------
          SCROLL_SESSION_RANGE = (45, 95)   # total runtime incl. page load, seconds (never above the 180s hard cap)


          def run_scroll_session(desktop, edge_window):
              global _SURF_CLOCK
              _reset_surf_state()
              total = random.randint(*SCROLL_SESSION_RANGE)
              _SURF_CLOCK = SurfClock(total)
              clock = _SURF_CLOCK
              write_surf_flag("surf_duration.txt", str(clock.total))
              write_surf_flag("surf_start.txt", str(int(time.time())))
              log_msg("Scroll", "============================================================")
              log_msg("Scroll", f" SCROLL SESSION: runtime assigned {clock.total}s (range {SCROLL_SESSION_RANGE[0]}-{SCROLL_SESSION_RANGE[1]}s, cap {SURF_HARD_CAP_SEC}s)")
              log_msg("Scroll", "============================================================")
              downs = ups = pauses = keys = errors = 0
              try:
                  wait_for_page_to_fully_load(edge_window, timeout=20)
                  human_reading_pause(min_s=random.uniform(1.0, 2.0), max_s=random.uniform(2.5, 4.5), parked_prob=0.3)
                  while surf_remaining() > 1.0:
                      frac = clock.elapsed() / clock.total
                      try:
                          try:
                              edge_window.set_focus()
                          except Exception:
                              edge_window = refresh_edge_window(desktop, edge_window)
                          roll = random.random()
                          p_down = max(0.2, 0.75 - 0.55 * frac)         # mostly down early, mostly up late
                          if roll < 0.68:
                              direction = "down" if random.random() < p_down else "up"
                              intensity = random.choices(["short", "medium", "long"], weights=[3, 4, 2])[0]
                              p = human_natural_scroll(direction, intensity, 0.10, random.uniform(0.8, 1.3))
                              log_msg("Scroll", f"[t={clock.elapsed():.0f}/{clock.total}s] {describe_scroll_params(p)}")
                              if direction == "down":
                                  downs += 1
                              else:
                                  ups += 1
                          elif roll < 0.90:
                              human_reading_pause(random.uniform(0.8, 1.6), random.uniform(2.0, 5.0), parked_prob=random.uniform(0.1, 0.5))
                              pauses += 1
                          else:
                              direction = "down" if random.random() < p_down else "up"
                              style = human_key_scroll(direction)
                              log_msg("Scroll", f"[t={clock.elapsed():.0f}/{clock.total}s] keyboard {direction.upper()} ({style})")
                              keys += 1
                      except Exception as e:
                          errors += 1
                          log_msg("Scroll", f"scroll action error: {type(e).__name__}: {e}")
                          surf_sleep(1.0)
                      surf_sleep(random.uniform(0.3, 1.1))
              except Exception as e:
                  log_msg("Scroll", f"Scroll session aborted by unexpected error: {type(e).__name__}: {e}")
              finally:
                  actual = clock.elapsed()
                  write_surf_flag("surf_stats.json", json.dumps({
                      "mode": "scroll", "assigned_sec": clock.total, "actual_sec": round(actual, 1),
                      "scroll_down": downs, "scroll_up": ups, "pauses": pauses, "keyboard": keys, "errors": errors,
                  }))
                  write_surf_flag("surf_done.flag", "done")
                  log_msg("Scroll", f"SCROLL SESSION COMPLETE: {actual:.1f}s of {clock.total}s | down={downs} up={ups} pauses={pauses} keyboard={keys} errors={errors}")

