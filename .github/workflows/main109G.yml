          # ---------------------------------------------------------------------------
          # Session clock: every sub-action asks it how much time is left, so the engine
          # can never run past the hard cap (even inside page-load waits / pauses).
          # ---------------------------------------------------------------------------
          class SurfClock:
              def __init__(self, total_sec):
                  self.t0 = time.time()
                  self.total = max(10, min(int(total_sec), SURF_HARD_CAP_SEC))

              def elapsed(self):
                  return time.time() - self.t0

              def remaining(self):
                  return self.total - self.elapsed()


          _SURF_CLOCK = None
          _CLICKED_LABELS = set()
          SURF_STATS = {"scroll": 0, "keyscroll": 0, "read": 0, "select": 0, "link": 0,
                        "rove": 0, "idle": 0, "scroll_back": 0, "back_nav": 0, "footer_dive": 0,
                        "escapes_recovered": 0, "links_rejected_offsite": 0, "links_rejected_bad": 0, "errors": 0}


          def surf_remaining():
              if _SURF_CLOCK is None:
                  return 9999.0
              return _SURF_CLOCK.remaining()


          def surf_sleep(sec):
              """Sleep but never beyond the surf deadline."""
              time.sleep(max(0.0, min(sec, surf_remaining())))


