  remote_session:
    name: ${{ matrix.display_name }}
    # GitHub cannot start a dependent job while another job is still running, and the combined Proxy Pool job
    # keeps running (continuous feed). So device runners start alongside it and the FIRST step below holds
    # each device at a gate until the initial 5% chunk exists. No device does any work before that.
    needs: prepare_matrix
    if: ${{ needs.prepare_matrix.outputs.has_tasks == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.num_devices) }}
      matrix: ${{ fromJson(needs.prepare_matrix.outputs.matrix) }}

    steps:
      - name: "Gate - Wait for Initial 5% Proxy Pool"
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          POOL_ENABLED: ${{ inputs.generate_all_proxies == true && inputs.use_without_proxy != true && 'true' || 'false' }}
          TASK_INDEX: ${{ matrix.task_index }}
          TASKS_TOTAL: ${{ needs.prepare_matrix.outputs.tasks_total }}
          POOL_TOTAL: ${{ needs.prepare_matrix.outputs.pool_total }}
          INITIAL_TARGET: ${{ needs.prepare_matrix.outputs.initial_target }}
          CHUNK_SIZE: ${{ needs.prepare_matrix.outputs.chunk_size }}
          POOL_MODE: gate
          GATE_WAIT_MINUTES: '20'
        run: |
          import os, sys, json, time, io, zipfile, subprocess
          import urllib.request, urllib.error


          def say(m=""):
              print(m, flush=True)


          def geti(k, d=0):
              try:
                  return int(os.environ.get(k, str(d)))
              except Exception:
                  return d


          TASK = geti("TASK_INDEX", 1)
          TASKS_TOTAL = geti("TASKS_TOTAL")
          POOL_TOTAL = geti("POOL_TOTAL")
          INITIAL = max(1, geti("INITIAL_TARGET", 1))
          CHUNK_SIZE = max(1, geti("CHUNK_SIZE", 10))
          WAIT_MIN = geti("POOL_WAIT_MINUTES", 12)
          POOL_ENABLED = os.environ.get("POOL_ENABLED", "false").lower() == "true"
          TEMP = os.environ.get("RUNNER_TEMP", ".")
          OUT = os.path.join(TEMP, "pool_proxy.json")
          GH_ENV = os.environ.get("GITHUB_ENV")
          TOKEN = os.environ.get("GH_TOKEN", "")
          REPO = os.environ.get("REPO", "")
          RUN_ID = os.environ.get("RUN_ID", "")
          API = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
          HDR = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "proxy-pool-client",
          }


          def set_env(k, v):
              if GH_ENV:
                  with open(GH_ENV, "a", encoding="utf-8") as f:
                      f.write(f"{k}={v}\n")


          def finish_none(reason):
              say(f"[Pool] RESULT: no pool proxy for device #{TASK} ({reason})")
              say("[Pool] -> Device will FALL BACK to API-key proxy generation (last resort).")
              set_env("POOL_PROXY_SOURCE", "none")
              sys.exit(0)


          MODE = os.environ.get("POOL_MODE", "fetch")
          GATE_WAIT_MIN = geti("GATE_WAIT_MINUTES", 20)
          say("=" * 72)
          say(f" DEVICE #{TASK}: " + ("GATE - WAIT FOR THE INITIAL 5% PROXY POOL" if MODE == "gate" else "ACQUIRE PROXY FROM POOL"))
          say("=" * 72)
          say(f"[Pool] Needs proxy number      : #{TASK}  (pool = tasks {TASKS_TOTAL} + spares {max(0, POOL_TOTAL - TASKS_TOTAL)} = {POOL_TOTAL})")

          if not POOL_ENABLED:
              say("[Pool] Pool is disabled or was skipped (use_without_proxy / generate_all_proxies off).")
              set_env("POOL_PROXY_SOURCE", "none")
              sys.exit(0)

          if os.path.isfile(OUT):
              os.remove(OUT)


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *a, **k):
                  return None


          def gh_json(url):
              last = None
              for i in range(3):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=HDR), timeout=30) as r:
                          return json.loads(r.read())
                  except urllib.error.HTTPError as e:
                      last = e
                      if e.code in (500, 502, 503, 504) and i < 2:
                          time.sleep(2)
                          continue
                      raise
                  except Exception as e:
                      last = e
                      time.sleep(2)
              raise last


          def list_artifacts(name=None):
              url = f"{API}/repos/{REPO}/actions/runs/{RUN_ID}/artifacts?per_page=100"
              if name:
                  url += f"&name={name}"
              return [a for a in gh_json(url).get("artifacts", []) if not a.get("expired")]


          def download_zip(art_id):
              url = f"{API}/repos/{REPO}/actions/artifacts/{art_id}/zip"
              opener = urllib.request.build_opener(NoRedirect)
              try:
                  with opener.open(urllib.request.Request(url, headers=HDR), timeout=30) as r:
                      return r.read()
              except urllib.error.HTTPError as e:
                  if e.code in (301, 302, 303, 307, 308):
                      loc = e.headers.get("Location")
                      with urllib.request.urlopen(urllib.request.Request(loc, headers={"User-Agent": "proxy-pool-client"}), timeout=60) as r2:
                          return r2.read()
                  raise


          _job_cache = {"id": None}


          def find_pool_job():
              if _job_cache["id"]:
                  try:
                      return gh_json(f"{API}/repos/{REPO}/actions/jobs/{_job_cache['id']}")
                  except Exception:
                      _job_cache["id"] = None
              for page in range(1, 11):
                  data = gh_json(f"{API}/repos/{REPO}/actions/runs/{RUN_ID}/jobs?per_page=100&page={page}&filter=latest")
                  jobs = data.get("jobs", [])
                  for j in jobs:
                      if (j.get("name") or "").startswith("Proxy Pool"):
                          _job_cache["id"] = j["id"]
                          return j
                  if len(jobs) < 100:
                      break
              return None


          def chunk_job_state(c):
              """'finished' when the pool job (or that chunk's upload step) is done, 'running', or 'unknown'."""
              job = find_pool_job()
              if not job:
                  return "unknown"
              if job.get("status") == "completed":
                  return "finished"
              prefix = f"Chunk {c:03d} - Upload"
              for st in job.get("steps", []):
                  if (st.get("name") or "").startswith(prefix):
                      return "finished" if st.get("status") == "completed" else "running"
              return "running"


          def chunk_for(seq):
              if seq <= INITIAL:
                  return 0
              return 1 + (seq - INITIAL - 1) // CHUNK_SIZE


          _cache = {}


          def get_chunk(c, deadline):
              if c in _cache:
                  return _cache[c]
              name = f"proxy-chunk-{c:03d}"
              last_status = 0.0
              last_job = 0.0
              finished_seen = False
              waited_from = time.time()
              while True:
                  arts = list_artifacts(name)
                  if arts:
                      blob = download_zip(arts[0]["id"])
                      with zipfile.ZipFile(io.BytesIO(blob)) as z:
                          fn = [n for n in z.namelist() if n.endswith(".json")][0]
                          data = json.loads(z.read(fn))
                      _cache[c] = data
                      say(f"[Pool] Chunk {c} loaded ({data.get('generated')}/{data.get('requested')} proxies, range #{data.get('start_seq')}-#{data.get('end_seq')})")
                      return data
                  if c == 0:
                      say("[Pool] Chunk 0 artifact missing although the initial pool job already finished.")
                      return None
                  if finished_seen:
                      say(f"[Pool] Chunk {c} generator job finished but produced no artifact.")
                      return None
                  now = time.time()
                  if now - last_job >= 45:
                      last_job = now
                      try:
                          st = chunk_job_state(c)
                      except Exception as e:
                          st = "unknown"
                          say(f"[Pool] (job state check failed: {type(e).__name__})")
                      if st == "finished":
                          finished_seen = True
                          time.sleep(5)
                          continue
                  if now >= deadline:
                      say(f"[Pool] Gave up waiting for chunk {c} after {int(now - waited_from)}s.")
                      return None
                  if now - last_status >= 60 or last_status == 0:
                      last_status = now
                      say(f"[Pool] Waiting for chunk {c} (proxy batch still generating)... {int(now - waited_from)}s elapsed, limit {WAIT_MIN} min")
                  time.sleep(15)


          def quick_check(p):
              try:
                  import requests, urllib3
              except ImportError:
                  subprocess.check_call([sys.executable, "-m", "pip", "install", "requests", "urllib3", "--quiet"])
                  import requests, urllib3
              urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
              auth = f"{p['username']}:{p['password']}@" if p.get("username") else ""
              url = f"http://{auth}{p['host']}:{p['port']}"
              cfg = {"http": url, "https": url}
              for attempt in range(2):
                  for ep in ("http://ip-api.com/json/", "https://ipinfo.io/json"):
                      try:
                          r = requests.get(ep, proxies=cfg, timeout=15, verify=False)
                          if r.status_code == 200 and ("ip" in r.json() or "query" in r.json()):
                              return True
                      except Exception:
                          pass
                  time.sleep(2)
              return False


          def find_seq(data, seq):
              if not data:
                  return None
              for p in data.get("proxies", []):
                  if p.get("seq") == seq:
                      return p
              return None


          def run_gate():
              wait_s = GATE_WAIT_MIN * 60
              t0 = time.time()
              last_log = 0.0
              say("[Gate] Runner is up. Holding here until the initial 5% proxy pool (chunk 0) has been uploaded...")
              while True:
                  try:
                      if list_artifacts("proxy-chunk-000"):
                          say(f"[Gate] Initial pool is READY after {int(time.time() - t0)}s -> device may proceed.")
                          return
                  except Exception as e:
                      say(f"[Gate] artifact check error: {type(e).__name__}")
                  try:
                      st = chunk_job_state(0)
                  except Exception:
                      st = "unknown"
                  if st == "finished":
                      time.sleep(5)
                      try:
                          if list_artifacts("proxy-chunk-000"):
                              say("[Gate] Initial pool is READY -> device may proceed.")
                              return
                      except Exception:
                          pass
                      say("[Gate] Pool job finished WITHOUT an initial chunk -> continuing; this device will use the API-key fallback.")
                      return
                  now = time.time()
                  if now - t0 >= wait_s:
                      say(f"::warning title=Gate::Initial pool not ready after {GATE_WAIT_MIN} min -> continuing (API-key fallback).")
                      return
                  if now - last_log >= 30:
                      last_log = now
                      say(f"[Gate] ...still generating the initial 5% (pool job state: {st}) - waited {int(now - t0)}s of max {GATE_WAIT_MIN * 60}s")
                  time.sleep(10)


          if MODE == "gate":
              run_gate()
              sys.exit(0)


          try:
              visible = sorted(a["name"] for a in list_artifacts() if a["name"].startswith("proxy-chunk-"))
              say(f"[Pool] Chunks visible right now : {len(visible)} -> {', '.join(visible) if visible else 'none'}")

              deadline = time.time() + WAIT_MIN * 60
              c = chunk_for(TASK)
              say(f"[Pool] Proxy #{TASK} lives in chunk {c} (artifact proxy-chunk-{c:03d})")
              chosen, origin = None, ""

              p = find_seq(get_chunk(c, deadline), TASK)
              if p:
                  say(f"[Pool] Found proxy #{TASK} '{p['name']}' -> IP {p['ip']} ({p['country_code']}). Health-checking...")
                  if quick_check(p):
                      chosen, origin = p, "primary"
                  else:
                      say(f"[Pool] Proxy #{TASK} failed the device-side health check.")
              else:
                  say(f"[Pool] Proxy #{TASK} is not present in chunk {c}.")

              if not chosen:
                  extra = POOL_TOTAL - TASKS_TOTAL
                  if extra > 0:
                      say(f"[Pool] Trying spare proxies (#{TASKS_TOTAL + 1}-#{POOL_TOTAL}) before touching the API key...")
                      for attempt in range(3):
                          sp = TASKS_TOTAL + 1 + ((TASK * 7 + attempt * 13) % extra)
                          sc = chunk_for(sp)
                          try:
                              cand = find_seq(get_chunk(sc, time.time()), sp)
                          except Exception as e:
                              cand = None
                              say(f"[Pool] spare lookup error: {type(e).__name__}")
                          if cand and quick_check(cand):
                              chosen, origin = cand, f"spare #{sp}"
                              break
                          say(f"[Pool] Spare #{sp} unavailable.")

              if not chosen:
                  finish_none("proxy missing/unhealthy and no spare available")

              if len(chosen.get("password", "")) >= 8:
                  print(f"::add-mask::{chosen['password']}", flush=True)
              chosen["assigned_origin"] = origin
              with open(OUT, "w", encoding="utf-8") as f:
                  json.dump(chosen, f)
              set_env("POOL_PROXY_SOURCE", "pool")
              set_env("POOL_PROXY_NAME", chosen["name"])
              say("")
              say(f"[Pool] RESULT: device #{TASK} uses POOL proxy #{chosen['seq']} ({origin})")
              say(f"[Pool]   dashboard name : {chosen['name']}   (app.gologin.com/proxy)")
              say(f"[Pool]   exit IP        : {chosen['ip']} | {chosen['country_code']} {chosen.get('city', '')}")
              say(f"[Pool]   provider       : {chosen['source']}")
              say("[Pool] API-key generation will NOT be used for this device.")
          except SystemExit:
              raise
          except Exception as e:
              say(f"::warning title=Pool fetch::{type(e).__name__}: {e}")
              finish_none(f"pool lookup error {type(e).__name__}")

      - name: Device Spawn Delay (Batch Intermission)
        shell: python
        env:
          DELAY_SECONDS: ${{ matrix.delay_seconds }}
          BATCH_IDX: ${{ matrix.batch_idx }}
          ABSOLUTE_IDX: ${{ matrix.absolute_idx }}
        run: |
          import os, time

          try:
              delay = int(os.environ.get("DELAY_SECONDS", "0"))
          except Exception:
              delay = 0

          batch = os.environ.get("BATCH_IDX", "0")
          idx = os.environ.get("ABSOLUTE_IDX", "1")

          if delay > 0:
              print(f"--- BATCH {batch} INTERMISSION ACTIVE ---")
              print(f"Device {idx} belongs to Batch {batch}.")
              print(f"Applying uniform batch spawn delay: Sleeping for {delay} seconds to stagger execution...")
              time.sleep(delay)
              print("Intermission delay complete. Proceeding with payload tasks.")
          else:
              print(f"Device {idx} (Batch {batch}) requires no spawn delay. Executing immediately.")

      - name: Acquire Proxy From Pool (wait for batch, API key only as last resort)
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          POOL_ENABLED: ${{ inputs.generate_all_proxies == true && inputs.use_without_proxy != true && 'true' || 'false' }}
          TASK_INDEX: ${{ matrix.task_index }}
          TASKS_TOTAL: ${{ needs.prepare_matrix.outputs.tasks_total }}
          POOL_TOTAL: ${{ needs.prepare_matrix.outputs.pool_total }}
          INITIAL_TARGET: ${{ needs.prepare_matrix.outputs.initial_target }}
          CHUNK_SIZE: ${{ needs.prepare_matrix.outputs.chunk_size }}
          POOL_MODE: fetch
          POOL_WAIT_MINUTES: '12'
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REUSE_PROXIES: ${{ inputs.reuse_proxies }}
          UNIQUE_IP: ${{ inputs.unique_ip }}
        run: |
          import os, sys, json, time, io, zipfile, subprocess
          import urllib.request, urllib.error

          def _ipc_api(method, path, body=None):
              import os, json, urllib.request, urllib.error
              base = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
              data = json.dumps(body).encode() if body is not None else None
              headers = {"Authorization": f"Bearer {os.environ.get('GH_TOKEN', '')}", "Accept": "application/vnd.github+json",
                         "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "ip-claim-client"}
              if data is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(base + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  try:
                      return e.code, e.read()
                  except Exception:
                      return e.code, b""
              except Exception as e:
                  return 0, str(e).encode()


          def ip_claim(ip):
              """Atomically claims an exit IP for THIS workflow run (a git ref can only be created once).
              Returns 'claimed' (we own it) | 'taken' (another device already used it) | 'error' (claim API unusable)."""
              import os, re, time
              repo = os.environ.get("REPO", "")
              sha = os.environ.get("GITHUB_SHA", "")
              run = f"{os.environ.get('RUN_ID', '0')}-{os.environ.get('RUN_ATTEMPT', '1')}"
              tag = re.sub(r"[^0-9A-Za-z._-]", "_", str(ip))
              if not repo or not sha or not tag:
                  return "error"
              for ref in (f"refs/ipclaims/{run}/{tag}", f"refs/tags/ipclaim-{run}-{tag}"):
                  for _try in range(2):
                      st, _ = _ipc_api("POST", f"/repos/{repo}/git/refs", {"ref": ref, "sha": sha})
                      if st == 201:
                          return "claimed"
                      if st in (0, 500, 502, 503, 504):
                          time.sleep(1.5)
                          continue
                      break
                  st2, _ = _ipc_api("GET", f"/repos/{repo}/git/ref/{ref[len('refs/'):]}")
                  if st2 == 200:
                      return "taken"
              return "error"


          def say(m=""):
              print(m, flush=True)


          def geti(k, d=0):
              try:
                  return int(os.environ.get(k, str(d)))
              except Exception:
                  return d


          TASK = geti("TASK_INDEX", 1)
          TASKS_TOTAL = geti("TASKS_TOTAL")
          POOL_TOTAL = geti("POOL_TOTAL")
          INITIAL = max(1, geti("INITIAL_TARGET", 1))
          CHUNK_SIZE = max(1, geti("CHUNK_SIZE", 10))
          WAIT_MIN = geti("POOL_WAIT_MINUTES", 12)
          POOL_ENABLED = os.environ.get("POOL_ENABLED", "false").lower() == "true"
          TEMP = os.environ.get("RUNNER_TEMP", ".")
          OUT = os.path.join(TEMP, "pool_proxy.json")
          GH_ENV = os.environ.get("GITHUB_ENV")
          TOKEN = os.environ.get("GH_TOKEN", "")
          REPO = os.environ.get("REPO", "")
          RUN_ID = os.environ.get("RUN_ID", "")
          API = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
          HDR = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "proxy-pool-client",
          }


          def set_env(k, v):
              if GH_ENV:
                  with open(GH_ENV, "a", encoding="utf-8") as f:
                      f.write(f"{k}={v}\n")


          def finish_none(reason):
              say(f"[Pool] RESULT: no pool proxy for device #{TASK} ({reason})")
              say("[Pool] -> Device will FALL BACK to API-key proxy generation (last resort).")
              set_env("POOL_PROXY_SOURCE", "none")
              sys.exit(0)


          MODE = os.environ.get("POOL_MODE", "fetch")
          GATE_WAIT_MIN = geti("GATE_WAIT_MINUTES", 20)
          REUSE = os.environ.get("REUSE_PROXIES", "false").lower() == "true"
          UNIQUE = os.environ.get("UNIQUE_IP", "false").lower() == "true"


          def probe_proxy(p):
              """Device-time check THROUGH the proxy. Returns {'ip','cc','tz','city','region'} or None.
              Pool proxies are generated earlier and their exit IPs drift, so the IP is always re-read here."""
              try:
                  import requests, urllib3
              except ImportError:
                  subprocess.check_call([sys.executable, "-m", "pip", "install", "requests", "urllib3", "--quiet"])
                  import requests, urllib3
              urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
              auth = f"{p['username']}:{p['password']}@" if p.get("username") else ""
              url = f"http://{auth}{p['host']}:{p['port']}"
              cfg = {"http": url, "https": url}
              eps = [("http://ip-api.com/json/", "ip-api"), ("https://ipinfo.io/json", "ipinfo"),
                     ("http://ipwho.is/", "ipwho"), ("https://api.myip.com", "myip")]
              for attempt in range(2):
                  for ep, nm in eps:
                      try:
                          r = requests.get(ep, proxies=cfg, timeout=15, verify=False)
                          if r.status_code != 200:
                              continue
                          d = r.json()
                          ip = cc = tz = city = region = None
                          if nm == "ip-api" and d.get("status") == "success":
                              ip, cc, tz, city, region = d.get("query"), d.get("countryCode"), d.get("timezone"), d.get("city"), d.get("regionName")
                          elif nm == "ipinfo" and d.get("ip"):
                              ip, cc, tz, city, region = d.get("ip"), d.get("country"), d.get("timezone"), d.get("city"), d.get("region")
                          elif nm == "ipwho" and d.get("success"):
                              ip, cc, tz, city, region = d.get("ip"), d.get("country_code"), (d.get("timezone") or {}).get("id"), d.get("city"), d.get("region")
                          elif nm == "myip" and d.get("ip"):
                              ip, cc = d.get("ip"), d.get("cc")
                          if ip:
                              return {"ip": str(ip), "cc": (cc or "").upper(), "tz": tz or "", "city": city or "", "region": region or ""}
                      except Exception:
                          pass
                  time.sleep(2)
              return None


          def find_seq(data, seq):
              if not data:
                  return None
              for p in data.get("proxies", []):
                  if p.get("seq") == seq:
                      return p
              return None


          def load_all_available():
              """Every proxy that exists in the pool right now, sorted by number (needed to wrap around when reusing)."""
              allp = {}
              try:
                  for a in list_artifacts():
                      if not a["name"].startswith("proxy-chunk-"):
                          continue
                      try:
                          c = int(a["name"].rsplit("-", 1)[1])
                      except Exception:
                          continue
                      try:
                          data = get_chunk(c, time.time())
                      except Exception:
                          data = None
                      for p in (data or {}).get("proxies", []):
                          allp[p["seq"]] = p
              except Exception as e:
                  say(f"[Pool] could not enumerate pool chunks: {type(e).__name__}")
              return [allp[k] for k in sorted(allp)]


          _tried = set()


          def try_candidate(p, origin, idx, total):
              """Device-time verification of one pool proxy. Returns the accepted (refreshed) record or None."""
              seq = p.get("seq")
              if seq in _tried:
                  return None
              _tried.add(seq)
              say(f"[Pool] Candidate {idx}/{total}: proxy #{seq} '{p.get('name')}' ({origin}) - IP recorded at pool time: {p.get('ip')}")
              info = probe_proxy(p)
              if not info:
                  say("[Pool]   -> UNHEALTHY: no exit IP could be read through this proxy on this device. Skipping.")
                  return None
              now_ip = info["ip"]
              if p.get("ip") and now_ip != p.get("ip"):
                  say(f"[Pool]   exit IP CHANGED since the pool was generated: {p.get('ip')} -> {now_ip}  (re-checked on this device)")
              else:
                  say(f"[Pool]   exit IP on this device: {now_ip}")

              claim = "off"
              if UNIQUE:
                  claim = ip_claim(now_ip)
                  if claim == "taken":
                      say(f"[Pool]   -> IP {now_ip} is ALREADY USED by another device in this run. Skipping this proxy (Unique IP).")
                      return None
                  if claim == "claimed":
                      say(f"[Pool]   -> IP {now_ip} is UNIQUE and is now recorded for this device.")
                  else:
                      say("::warning title=Unique IP::Claim API unavailable - continuing WITHOUT uniqueness guarantee for this device.")

              rec = dict(p)
              rec["ip_pool_recorded"] = p.get("ip")
              rec["ip"] = now_ip
              rec["ip_verified_on_device"] = True
              rec["ip_claim"] = claim
              if info["city"]:
                  rec["city"] = info["city"]
              if info["region"]:
                  rec["region"] = info["region"]
              if info["cc"] and info["cc"] != (p.get("country_code") or "").upper():
                  say(f"[Pool]   country changed {p.get('country_code')} -> {info['cc']}: locale / timezone / keyboard re-derived so masking matches the real exit IP.")
                  rec["country_code"] = info["cc"]
                  rec["country_name"] = info["cc"]
                  tz = info["tz"] or rec.get("timezone_iana") or "UTC"
                  rec["timezone_iana"] = tz
                  rec["timezone_windows"] = tz_to_windows_tz(tz)
                  rec["windows_locale"] = country_code_to_locale(info["cc"])
                  rec["windows_keyboard"] = country_code_to_keyboard(info["cc"])
              elif info["tz"] and not rec.get("timezone_iana"):
                  rec["timezone_iana"] = info["tz"]
                  rec["timezone_windows"] = tz_to_windows_tz(info["tz"])
              return rec


          def candidates(primary):
              """Lazy candidate order for this device.
              Reuse OFF: primary #N -> spare proxies (the extra 10-15%).
              Reuse ON : primary #N (or, when the pool is used up, the wrap-around position) and then walk the whole
                         pool in order, wrapping from the last proxy back to proxy #1."""
              if primary:
                  yield primary, "primary"
              if REUSE:
                  pool = load_all_available()
                  if not pool:
                      return
                  n = len(pool)
                  if primary:
                      start = next((i for i, x in enumerate(pool) if x["seq"] == primary["seq"]), (TASK - 1) % n) + 1
                      note = "reuse"
                  else:
                      start = (TASK - 1) % n
                      note = f"reuse wrap-around (pool has {n} proxies, device #{TASK} -> position {start + 1})"
                      say(f"[Pool] REUSE enabled: {note}")
                  for k in range(min(n, 40)):
                      x = pool[(start + k) % n]
                      yield x, f"reuse #{x['seq']}"
              else:
                  extra = POOL_TOTAL - TASKS_TOTAL
                  if extra > 0:
                      seqs = list(range(TASKS_TOTAL + 1, POOL_TOTAL + 1))
                      random.Random(TASK).shuffle(seqs)
                      for sp in seqs[: (10 if UNIQUE else 3)]:
                          try:
                              cand = find_seq(get_chunk(chunk_for(sp), time.time()), sp)
                          except Exception:
                              cand = None
                          if cand:
                              yield cand, f"spare #{sp}"

          say("=" * 72)
          say(f" DEVICE #{TASK}: " + ("GATE - WAIT FOR THE INITIAL 5% PROXY POOL" if MODE == "gate" else "ACQUIRE PROXY FROM POOL"))
          say("=" * 72)
          say(f"[Pool] Needs proxy number      : #{TASK}  (pool = tasks {TASKS_TOTAL} + spares {max(0, POOL_TOTAL - TASKS_TOTAL)} = {POOL_TOTAL})")

          if not POOL_ENABLED:
              say("[Pool] Pool is disabled or was skipped (use_without_proxy / generate_all_proxies off).")
              set_env("POOL_PROXY_SOURCE", "none")
              sys.exit(0)

          if os.path.isfile(OUT):
              os.remove(OUT)


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *a, **k):
                  return None


          def gh_json(url):
              last = None
              for i in range(3):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=HDR), timeout=30) as r:
                          return json.loads(r.read())
                  except urllib.error.HTTPError as e:
                      last = e
                      if e.code in (500, 502, 503, 504) and i < 2:
                          time.sleep(2)
                          continue
                      raise
                  except Exception as e:
                      last = e
                      time.sleep(2)
              raise last


          def list_artifacts(name=None):
              url = f"{API}/repos/{REPO}/actions/runs/{RUN_ID}/artifacts?per_page=100"
              if name:
                  url += f"&name={name}"
              return [a for a in gh_json(url).get("artifacts", []) if not a.get("expired")]


          def download_zip(art_id):
              url = f"{API}/repos/{REPO}/actions/artifacts/{art_id}/zip"
              opener = urllib.request.build_opener(NoRedirect)
              try:
                  with opener.open(urllib.request.Request(url, headers=HDR), timeout=30) as r:
                      return r.read()
              except urllib.error.HTTPError as e:
                  if e.code in (301, 302, 303, 307, 308):
                      loc = e.headers.get("Location")
                      with urllib.request.urlopen(urllib.request.Request(loc, headers={"User-Agent": "proxy-pool-client"}), timeout=60) as r2:
                          return r2.read()
                  raise


          _job_cache = {"id": None}


          def find_pool_job():
              if _job_cache["id"]:
                  try:
                      return gh_json(f"{API}/repos/{REPO}/actions/jobs/{_job_cache['id']}")
                  except Exception:
                      _job_cache["id"] = None
              for page in range(1, 11):
                  data = gh_json(f"{API}/repos/{REPO}/actions/runs/{RUN_ID}/jobs?per_page=100&page={page}&filter=latest")
                  jobs = data.get("jobs", [])
                  for j in jobs:
                      if (j.get("name") or "").startswith("Proxy Pool"):
                          _job_cache["id"] = j["id"]
                          return j
                  if len(jobs) < 100:
                      break
              return None


          def chunk_job_state(c):
              """'finished' when the pool job (or that chunk's upload step) is done, 'running', or 'unknown'."""
              job = find_pool_job()
              if not job:
                  return "unknown"
              if job.get("status") == "completed":
                  return "finished"
              prefix = f"Chunk {c:03d} - Upload"
              for st in job.get("steps", []):
                  if (st.get("name") or "").startswith(prefix):
                      return "finished" if st.get("status") == "completed" else "running"
              return "running"


          def chunk_for(seq):
              if seq <= INITIAL:
                  return 0
              return 1 + (seq - INITIAL - 1) // CHUNK_SIZE


          _cache = {}


          def get_chunk(c, deadline):
              if c in _cache:
                  return _cache[c]
              name = f"proxy-chunk-{c:03d}"
              last_status = 0.0
              last_job = 0.0
              finished_seen = False
              waited_from = time.time()
              while True:
                  arts = list_artifacts(name)
                  if arts:
                      blob = download_zip(arts[0]["id"])
                      with zipfile.ZipFile(io.BytesIO(blob)) as z:
                          fn = [n for n in z.namelist() if n.endswith(".json")][0]
                          data = json.loads(z.read(fn))
                      _cache[c] = data
                      say(f"[Pool] Chunk {c} loaded ({data.get('generated')}/{data.get('requested')} proxies, range #{data.get('start_seq')}-#{data.get('end_seq')})")
                      return data
                  if c == 0:
                      say("[Pool] Chunk 0 artifact missing although the initial pool job already finished.")
                      return None
                  if finished_seen:
                      say(f"[Pool] Chunk {c} generator job finished but produced no artifact.")
                      return None
                  now = time.time()
                  if now - last_job >= 45:
                      last_job = now
                      try:
                          st = chunk_job_state(c)
                      except Exception as e:
                          st = "unknown"
                          say(f"[Pool] (job state check failed: {type(e).__name__})")
                      if st == "finished":
                          finished_seen = True
                          time.sleep(5)
                          continue
                  if now >= deadline:
                      say(f"[Pool] Gave up waiting for chunk {c} after {int(now - waited_from)}s.")
                      return None
                  if now - last_status >= 60 or last_status == 0:
                      last_status = now
                      say(f"[Pool] Waiting for chunk {c} (proxy batch still generating)... {int(now - waited_from)}s elapsed, limit {WAIT_MIN} min")
                  time.sleep(15)


          def quick_check(p):
              try:
                  import requests, urllib3
              except ImportError:
                  subprocess.check_call([sys.executable, "-m", "pip", "install", "requests", "urllib3", "--quiet"])
                  import requests, urllib3
              urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
              auth = f"{p['username']}:{p['password']}@" if p.get("username") else ""
              url = f"http://{auth}{p['host']}:{p['port']}"
              cfg = {"http": url, "https": url}
              for attempt in range(2):
                  for ep in ("http://ip-api.com/json/", "https://ipinfo.io/json"):
                      try:
                          r = requests.get(ep, proxies=cfg, timeout=15, verify=False)
                          if r.status_code == 200 and ("ip" in r.json() or "query" in r.json()):
                              return True
                      except Exception:
                          pass
                  time.sleep(2)
              return False


          def find_seq(data, seq):
              if not data:
                  return None
              for p in data.get("proxies", []):
                  if p.get("seq") == seq:
                      return p
              return None


          def run_gate():
              wait_s = GATE_WAIT_MIN * 60
              t0 = time.time()
              last_log = 0.0
              say("[Gate] Runner is up. Holding here until the initial 5% proxy pool (chunk 0) has been uploaded...")
              while True:
                  try:
                      if list_artifacts("proxy-chunk-000"):
                          say(f"[Gate] Initial pool is READY after {int(time.time() - t0)}s -> device may proceed.")
                          return
                  except Exception as e:
                      say(f"[Gate] artifact check error: {type(e).__name__}")
                  try:
                      st = chunk_job_state(0)
                  except Exception:
                      st = "unknown"
                  if st == "finished":
                      time.sleep(5)
                      try:
                          if list_artifacts("proxy-chunk-000"):
                              say("[Gate] Initial pool is READY -> device may proceed.")
                              return
                      except Exception:
                          pass
                      say("[Gate] Pool job finished WITHOUT an initial chunk -> continuing; this device will use the API-key fallback.")
                      return
                  now = time.time()
                  if now - t0 >= wait_s:
                      say(f"::warning title=Gate::Initial pool not ready after {GATE_WAIT_MIN} min -> continuing (API-key fallback).")
                      return
                  if now - last_log >= 30:
                      last_log = now
                      say(f"[Gate] ...still generating the initial 5% (pool job state: {st}) - waited {int(now - t0)}s of max {GATE_WAIT_MIN * 60}s")
                  time.sleep(10)


          if MODE == "gate":
              run_gate()
              sys.exit(0)


          try:
              visible = sorted(a["name"] for a in list_artifacts() if a["name"].startswith("proxy-chunk-"))
              say(f"[Pool] Chunks visible right now : {len(visible)} -> {', '.join(visible) if visible else 'none'}")
              say(f"[Pool] Options                  : Reuse Proxies = {REUSE} | Unique IP = {UNIQUE}")

              deadline = time.time() + WAIT_MIN * 60
              primary = None
              if TASK <= POOL_TOTAL:
                  c = chunk_for(TASK)
                  say(f"[Pool] Proxy #{TASK} lives in chunk {c} (artifact proxy-chunk-{c:03d})")
                  primary = find_seq(get_chunk(c, deadline), TASK)
                  if not primary:
                      say(f"[Pool] Proxy #{TASK} is not present in chunk {c}.")
              else:
                  say(f"[Pool] Device #{TASK} is beyond the planned pool size ({POOL_TOTAL}) - the pool is used up.")

              chosen, origin = None, ""
              tried = 0
              max_tries = 40 if REUSE else (11 if UNIQUE else 4)
              for cand, how in candidates(primary):
                  tried += 1
                  if tried > max_tries:
                      break
                  accepted = try_candidate(cand, how, tried, "?")
                  if accepted:
                      chosen, origin = accepted, how
                      break

              if not chosen:
                  finish_none(f"no usable pool proxy after {tried} candidate(s)" + (" (Unique IP rejected the rest)" if UNIQUE else ""))

              if len(chosen.get("password", "")) >= 8:
                  print(f"::add-mask::{chosen['password']}", flush=True)
              chosen["assigned_origin"] = origin
              with open(OUT, "w", encoding="utf-8") as f:
                  json.dump(chosen, f)
              set_env("POOL_PROXY_SOURCE", "pool")
              set_env("POOL_PROXY_NAME", chosen["name"])
              set_env("POOL_PROXY_IP", chosen["ip"])
              say("")
              say(f"[Pool] RESULT: device #{TASK} uses POOL proxy #{chosen['seq']} ({origin})")
              say(f"[Pool]   dashboard name : {chosen['name']}   (app.gologin.com/proxy)")
              say(f"[Pool]   exit IP        : {chosen['ip']} (verified on this device) | {chosen['country_code']} {chosen.get('city', '')}")
              say(f"[Pool]   unique-IP claim: {chosen.get('ip_claim')}")
              say(f"[Pool]   provider       : {chosen['source']}")
              say("[Pool] API-key generation will NOT be used for this device.")
              summ = os.environ.get("GITHUB_STEP_SUMMARY")
              if summ:
                  with open(summ, "a", encoding="utf-8") as fh:
                      fh.write(f"### Device #{TASK} proxy\n- Pool proxy **#{chosen['seq']}** `{chosen['name']}` ({origin})\n"
                               f"- Exit IP (verified on device): **{chosen['ip']}** (pool recorded: {chosen.get('ip_pool_recorded')})\n"
                               f"- Unique-IP claim: **{chosen.get('ip_claim')}** | Reuse: {REUSE}\n")
          except SystemExit:
              raise
          except Exception as e:
              say(f"::warning title=Pool fetch::{type(e).__name__}: {e}")
              finish_none(f"pool lookup error {type(e).__name__}")
          except SystemExit:
              raise
          except Exception as e:
              say(f"::warning title=Pool fetch::{type(e).__name__}: {e}")
              finish_none(f"pool lookup error {type(e).__name__}")

      - name: Runner Proxy & Identity Provisioning
        shell: python
        env:
          API_KEY_INPUT: ${{ inputs.scrapeops_api_key }}
          WITHOUT_PROXY: ${{ inputs.use_without_proxy }}
          COUNTRY: ${{ inputs.proxy_country }}
          FALLBACK_COUNTRY: ${{ inputs.fallback_country }}
          MOBILE: ${{ inputs.mobile_proxies }}
          STICKY: ${{ inputs.sticky_sessions }}
          TASK_INDEX: ${{ matrix.task_index }}
          ABSOLUTE_IDX: ${{ matrix.absolute_idx }}
          NUM_INSTALLS: ${{ inputs.num_installs }}
          NUM_CLICKS: ${{ inputs.num_clicks }}
          NUM_SURFS: ${{ inputs.num_surfs }}
          SHORT_OS: ${{ matrix.short_os_tag }}
          SHORT_SW: ${{ matrix.short_sw_tag }}
