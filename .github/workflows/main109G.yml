          def _snapshot_window_state(win):
              try:
                  wt = win.window_text() or ""
              except Exception:
                  wt = ""
              try:
                  btn_count = len(win.descendants(control_type="Button"))
              except Exception:
                  btn_count = -1
              return f"{wt}|{btn_count}"


          def dismiss_opera_onboarding(desktop, software_type, label="OperaOnboard"):
              """
              Robustly pushes the newly-installed Opera / Opera GX browser through its
              first-run onboarding wizard ("Welcome to Opera GX" / theme picker / N-step
              tour) so a real homepage (Speed Dial / Start Page) is reached.

              Priority per attempt:
                1) SKIP button (UIA exact title match, then folded partial match) -> 1 click bypasses the whole wizard
                2) NEXT / CONTINUE button -> advances one step (loop re-tries, so works for any step count)
                3) DONE / FINISH / GET STARTED button -> closes the wizard on the final step
                4) Proportional coordinate click (bottom-left=skip, bottom-right=next) when no
                   accessible control could be found at all (fully custom-drawn UI)
                5) Keyboard Tab-cycle + Enter, verified by comparing window state before/after
              Every step is verified against the window's actual state, so it keeps pushing
              forward (or stops) however many steps the wizard turns out to have - it never
              blindly fires a fixed number of key presses.
              """
              win = robust_maximize_opera_window(desktop, software_type, label=f"{label}-focus")
              if not win:
                  log_msg(label, "No Opera window found to check for onboarding. Skipping.")
                  return True  # nothing to dismiss

              try:
                  wt0 = win.window_text() or ""
              except Exception:
                  wt0 = ""
              if not _opera_window_looks_like_onboarding(wt0):
                  log_msg(label, f"Window '{wt0}' does not look like onboarding — already on homepage.")
                  return True

              log_msg(label, f"Onboarding wizard detected: '{wt0}'. Beginning verified bypass sequence...")
              max_attempts = 14
              stuck_count = 0
              deadline = time.time() + 45

              for attempt in range(1, max_attempts + 1):
                  if time.time() > deadline:
                      log_msg(label, "Bypass deadline reached (45s). Giving up for now.")
                      break

                  try:
                      if not win.is_visible():
                          log_msg(label, "Window no longer visible — treating as dismissed.")
                          return True
                      cur_wt = win.window_text() or ""
                  except Exception:
                      log_msg(label, "Window handle invalid (likely closed) — treating as dismissed.")
                      return True

                  if not _opera_window_looks_like_onboarding(cur_wt):
                      log_msg(label, f"Onboarding cleared after {attempt - 1} action(s). Now on: '{cur_wt}'")
                      return True

                  before = _snapshot_window_state(win)
                  acted = False
                  action_name = ""

                  if click_opera_button_multilingual(desktop, win, software_type, OPERA_SKIP_KEYWORDS,
                                                      label=f"{label}-skip-{attempt}"):
                      acted, action_name = True, "SKIP"
                  elif click_opera_button_multilingual(desktop, win, software_type, OPERA_NEXT_KEYWORDS,
                                                        label=f"{label}-next-{attempt}"):
                      acted, action_name = True, "NEXT"
                  elif click_opera_button_multilingual(desktop, win, software_type, OPERA_DONE_KEYWORDS,
                                                        label=f"{label}-done-{attempt}"):
                      acted, action_name = True, "DONE"

                  if not acted and stuck_count >= 1:
                      try:
                          rect = win.rectangle()
                          w, h = rect.width(), rect.height()
                          if attempt % 2 == 1:
                              fx, fy = rect.left + int(w * 0.07), rect.top + int(h * 0.90)
                              action_name = "coord-skip-guess"
                          else:
                              fx, fy = rect.left + int(w * 0.90), rect.top + int(h * 0.90)
                              action_name = "coord-next-guess"
                          pyautogui.moveTo(fx, fy, duration=0.25)
                          pyautogui.click()
                          acted = True
                          log_msg(label, f"[{attempt}/{max_attempts}] No accessible button found — proportional coordinate click ({action_name}) at ({fx}, {fy}).")
                      except Exception as e:
                          log_msg(label, f"Coordinate fallback failed: {e}")

                  if not acted and stuck_count >= 3:
                      tabs = min(2 + stuck_count, 8)
                      log_msg(label, f"[{attempt}/{max_attempts}] UI automation + coordinate guesses stuck — keyboard fallback: {tabs}x TAB then ENTER.")
                      try:
                          win.set_focus()
                          time.sleep(0.3)
                          send_keys('{TAB}' * tabs)
                          time.sleep(0.25)
                          send_keys('{ENTER}')
                          acted, action_name = True, f"keyboard({tabs}xTAB+ENTER)"
                      except Exception as e:
                          log_msg(label, f"Keyboard fallback failed: {e}")

                  if acted:
                      log_msg(label, f"[{attempt}/{max_attempts}] Action: {action_name}. Waiting for transition...")
                  else:
                      log_msg(label, f"[{attempt}/{max_attempts}] No action could be taken this round.")

                  time.sleep(random.uniform(1.1, 1.6))

                  after = _snapshot_window_state(win)
                  if after == before:
                      stuck_count += 1
                  else:
                      stuck_count = 0

              try:
                  final_wt = win.window_text() or ""
              except Exception:
                  final_wt = "(window closed)"
              still_stuck = _opera_window_looks_like_onboarding(final_wt)
              if still_stuck:
                  log_msg(label, f"WARNING: Onboarding still showing after {max_attempts} attempts: '{final_wt}'. Continuing anyway.")
              else:
                  log_msg(label, f"Onboarding bypass finished. Now on: '{final_wt}'")
              return not still_stuck

          def inject_proxy_auth(window, label="", allow_late=False):
              if not USE_PROXY or not PROXY_USER or not PROXY_PASS:
                  return False
              if PROXY_AUTH_STATE["done"] and not allow_late:
                  return False   # one-shot: the proxy is already authenticated, never type credentials again

              try:
                  user_fields = _find_username_fields(window)
                  pass_fields = _find_password_fields(window)

                  if (user_fields and not pass_fields) or (pass_fields and not user_fields):
                      try:
                          all_edits = [c for c in _outside_page(window, "Edit") if not _is_address_bar_control(c)]
                      except Exception:
                          all_edits = []
                      if len(all_edits) == 2:
                          known = (user_fields or pass_fields)[0]
                          other = [c for c in all_edits if c != known]
                          if other:
                              if user_fields and not pass_fields:
                                  pass_fields = [other[0]]
                                  log_msg("ProxyAuth", f"[{label}] Password field had no locale match — inferred as the other field in this 2-field dialog.")
                              else:
                                  user_fields = [other[0]]
                                  log_msg("ProxyAuth", f"[{label}] Username field had no locale match — inferred as the other field in this 2-field dialog.")

                  if not user_fields or not pass_fields:
                      u_struct, p_struct = _is_auth_dialog_by_structure(window)
                      if u_struct and p_struct:
                          log_msg("ProxyAuth", f"[{label}] Using structural detection (2-field dialog, no label matched in either field).")
                          user_fields = [u_struct]
                          pass_fields = [p_struct]

                  if user_fields and pass_fields:
                      if _is_address_bar_control(user_fields[0]) or _is_address_bar_control(pass_fields[0]):
                          log_msg("ProxyAuth", f"[{label}] BLOCKED — fields are address bars. Skipping.")
                          return False

                      log_msg("ProxyAuth", f"[{label}] Injecting {PROXY_TYPE} credentials. User={PROXY_USER[:25]}...")
                      window.set_focus()
                      time.sleep(0.5)

                      try:
                          user_fields[0].click_input(); time.sleep(0.2)
                          send_keys('^a'); time.sleep(0.1)
                          send_keys('{DELETE}'); time.sleep(0.1)
                          user_fields[0].type_keys(PROXY_USER, with_spaces=True, pause=0.02)
                          time.sleep(0.3)
                      except Exception as eu:
                          log_msg("ProxyAuth", f"[{label}] Username field type failed: {eu}")

                      try:
                          pass_fields[0].click_input(); time.sleep(0.2)
                          send_keys('^a'); time.sleep(0.1)
                          send_keys('{DELETE}'); time.sleep(0.1)
                          pass_fields[0].type_keys(PROXY_PASS, with_spaces=True, pause=0.02)
                          time.sleep(0.3)
                      except Exception as ep:
                          log_msg("ProxyAuth", f"[{label}] Password field type failed: {ep}")

                      signed_in = False
                      submit_btn = _find_submit_button(window)
                      if submit_btn:
                          try:
                              submit_btn.click_input()
                              log_msg("ProxyAuth", f"[{label}] Submit button clicked. Auth submitted.")
                              signed_in = True
                          except Exception as eb:
                              log_msg("ProxyAuth", f"[{label}] Submit button click failed: {eb}")

                      if not signed_in:
                          try:
                              pass_fields[0].click_input(); time.sleep(0.2)
                              send_keys('{ENTER}')
                              log_msg("ProxyAuth", f"[{label}] Submitted via ENTER fallback.")
                              signed_in = True
                          except Exception as ek:
                              log_msg("ProxyAuth", f"[{label}] ENTER fallback failed: {ek}")

                      return signed_in

                  else:
                      wt = ""
                      try: wt = window.window_text() or ""
                      except Exception: pass

                      if not _is_proxy_auth_dialog(wt):
                          log_msg("ProxyAuth", f"[{label}] No auth fields and window '{wt}' is not an auth dialog. Skipping.")
                          return False

                      try:
                          has_doc = len(window.descendants(control_type="Document")) > 0
                      except Exception:
                          has_doc = True
                      if has_doc:
                          log_msg("ProxyAuth", f"[{label}] Refusing blind keyboard typing: this window contains web page content.")
                          return False
                      log_msg("ProxyAuth", f"[{label}] No Edit fields — trying keyboard Tab injection.")
                      window.set_focus(); time.sleep(0.5)
                      send_keys('^a{DELETE}'); time.sleep(0.1)
                      for ch in PROXY_USER:
                          send_keys(ch if ch.isalnum() or ch in '.-_=@' else '{%s}' % ch)
                          time.sleep(0.01)
                      send_keys('{TAB}'); time.sleep(0.3)
                      send_keys('^a{DELETE}'); time.sleep(0.1)
                      for ch in PROXY_PASS:
                          send_keys(ch if ch.isalnum() or ch in '.-_=@' else '{%s}' % ch)
                          time.sleep(0.01)
                      time.sleep(0.2)
                      send_keys('{ENTER}')
                      log_msg("ProxyAuth", f"[{label}] Keyboard-only auth submitted.")
                      return True

              except Exception as e:
                  log_msg("ProxyAuth", f"[{label}] inject_proxy_auth exception: {e}")
                  return False

          # =========================================================================
          # 100 VISITOR PROFILES ENGINE (P1 - P100) & ADVANCED SURF SIMULATOR  (v3: site lock + per-scroll variation)
          #  - HARD CAP: whole surf engine (page load + browsing) never exceeds 180s
          #  - Randomised runtime per session (triangular + bounce / sticky outliers)
          #  - 100 deterministic personas (8 archetypes) + per-session mood variation
          #  - Curved (bezier) mouse paths, eased scrolling, keyboard scrolling,
          #    idle/away moments, weighted + phase-aware action selection
          # =========================================================================

          SURF_HARD_CAP_SEC = 180   # absolute maximum runtime of the surf engine
          SURF_MIN_SEC = 35         # shortest allowed session

