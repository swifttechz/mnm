          # ---------------------------------------------------------------------------
          # Session clock: every sub-action asks it how much time is left, so the engine
          # can never run past the hard cap (even inside page-load waits / pauses).
          # ---------------------------------------------------------------------------
          class SurfClock:
              def __init__(self, total_sec):
                  self.t0 = time.time()
                  self.total = max(10, min(int(total_sec), SURF_HARD_CAP_SEC))

              def elapsed(self):
                  return time.time() - self.t0

              def remaining(self):
                  return self.total - self.elapsed()


