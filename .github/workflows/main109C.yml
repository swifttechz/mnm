        description: 'Proxy Pool Mode (5% pool first, then keeps feeding devices)'
        required: true
        type: boolean
        default: true

permissions:
  actions: write
  contents: write

jobs:
  save_inputs:
    name: Auto-Save Last Inputs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          ref: ${{ github.ref }}
      - name: Update YAML Defaults
        shell: python
        env:
          GITHUB_WORKFLOW_NAME: ${{ github.workflow }}
          IN_OS: ${{ inputs.os_version }}
          IN_EMAIL: ${{ inputs.getscreen_email }}
          IN_DEV: ${{ inputs.num_devices }}
          IN_DELAY: ${{ inputs.delay_between_devices }}
          IN_KEEPALIVE: ${{ inputs.keep_alive_duration }}
          IN_INST: ${{ inputs.num_installs }}
          IN_CLK: ${{ inputs.num_clicks }}
          IN_SURF: ${{ inputs.num_surfs }}
          IN_SW: ${{ inputs.software_choice }}
          IN_MASKING: ${{ inputs.apply_masking }}
          IN_NOPROXY: ${{ inputs.use_without_proxy }}
          IN_COUNTRY: ${{ inputs.proxy_country }}
          IN_FALLBACK: ${{ inputs.fallback_country }}
          IN_MOBILE: ${{ inputs.mobile_proxies }}
          IN_STICKY: ${{ inputs.sticky_sessions }}
          IN_PROXY_INPUT: ${{ inputs.scrapeops_api_key }}
          IN_GENERATE_ALL: ${{ inputs.generate_all_proxies }}
        run: |
          import os, re, glob

          workflow_name = os.getenv("GITHUB_WORKFLOW_NAME", "Parallel mx10.9C")
          workflow_dir = ".github/workflows"
          target_file = None

          for filepath in glob.glob(os.path.join(workflow_dir, "*.yml")) + glob.glob(os.path.join(workflow_dir, "*.yaml")):
              try:
                  with open(filepath, "r", encoding="utf-8") as f:
                      content = f.read()
                      if re.search(r"^name:\s*['\"]?" + re.escape(workflow_name) + r"['\"]?\s*$", content, re.MULTILINE):
                          target_file = filepath
                          break
              except Exception:
                  continue

          if not target_file:
              print(f"Error: Could not find workflow file matching name '{workflow_name}'")
              exit(0)

          print(f"Found target workflow file: {target_file}")

          updates = {
              "os_version": os.getenv("IN_OS"),
              "getscreen_email": os.getenv("IN_EMAIL"),
              "num_devices": os.getenv("IN_DEV"),
              "delay_between_devices": os.getenv("IN_DELAY"),
              "keep_alive_duration": os.getenv("IN_KEEPALIVE"),
              "num_installs": os.getenv("IN_INST"),
              "num_clicks": os.getenv("IN_CLK"),
              "num_surfs": os.getenv("IN_SURF"),
              "software_choice": os.getenv("IN_SW"),
              "manual_software_url": "",
              "run_manual_link": "false",
              "apply_masking": os.getenv("IN_MASKING"),
              "use_without_proxy": os.getenv("IN_NOPROXY"),
              "proxy_country": os.getenv("IN_COUNTRY"),
              "fallback_country": os.getenv("IN_FALLBACK"),
              "mobile_proxies": os.getenv("IN_MOBILE"),
              "sticky_sessions": os.getenv("IN_STICKY"),
              "generate_all_proxies": os.getenv("IN_GENERATE_ALL")
          }

          raw_proxies = os.getenv("IN_PROXY_INPUT", "").split()
          valid_keys = []
          scrapeops_re = re.compile(r"^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$", re.IGNORECASE)
          floppy_re = re.compile(r"^[A-Za-z0-9_]{30,80}$")
          redscrape_re = re.compile(r"^[0-9a-f]{32}$", re.IGNORECASE)
          gologin_re = re.compile(r"^ey[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$")

          for p in raw_proxies:
              if gologin_re.match(p):
                  valid_keys.append(p)
                  continue
              if "bytesflows.com" in p.lower() or ":" in p or "@" in p or "://" in p or "." in p:
                  if len(p) > 5 and re.search(r'[a-zA-Z0-9]', p):
                      valid_keys.append(p)
                  continue
              if scrapeops_re.match(p) or floppy_re.match(p) or redscrape_re.match(p):
                  valid_keys.append(p)

          updates["scrapeops_api_key"] = " ".join(valid_keys)

          with open(target_file, "r", encoding="utf-8") as f:
              lines = f.readlines()

          out_lines = []
          current_input = None
          input_indent = 0

          input_key_pattern = re.compile(r"^([ \t]*)([a-zA-Z0-9_]+):\s*$")
          default_pattern = re.compile(r"^([ \t]+)default:\s*(.*)$")

          in_inputs_section = False

          bool_keys = ["run_manual_link", "apply_masking", "use_without_proxy", "mobile_proxies", "sticky_sessions", "generate_all_proxies"]

          for line in lines:
              if re.match(r"^[ \t]*inputs:\s*$", line):
                  in_inputs_section = True

              if in_inputs_section and re.match(r"^[ \t]*(permissions|jobs|env):\s*$", line):
                  in_inputs_section = False

              if in_inputs_section:
                  match = input_key_pattern.match(line)
                  if match:
                      indent = len(match.group(1))
                      key = match.group(2)

                      if key in updates:
                          current_input = key
                          input_indent = indent
                      elif current_input and indent <= input_indent:
                          current_input = None

                  if current_input:
                      def_match = default_pattern.match(line)
                      if def_match:
                          val = updates[current_input]
                          if val is None: val = ""

                          if current_input in bool_keys:
                              rep = "true" if str(val).lower() in ["true", "1", "yes"] else "false"
                          else:
                              safe_val = str(val).replace("'", "''")
                              rep = f"'{safe_val}'"

                          line = f"{def_match.group(1)}default: {rep}\n"
                          current_input = None

              out_lines.append(line)

          with open(target_file, "w", encoding="utf-8") as f:
              f.writelines(out_lines)

          print("YAML inputs successfully updated & saved!")
      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .github/workflows/
          git commit -m "Auto-update workflow inputs from last execution" || echo "No changes to save"
          git push origin HEAD || echo "Push skipped"

  prepare_matrix:
    name: Check Inputs & Prepare Runners
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_tasks: ${{ steps.set-matrix.outputs.has_tasks }}
      tasks_total: ${{ steps.set-matrix.outputs.tasks_total }}
      num_devices: ${{ steps.set-matrix.outputs.num_devices }}
      pool_total: ${{ steps.set-matrix.outputs.pool_total }}
      initial_target: ${{ steps.set-matrix.outputs.initial_target }}
      chunk_size: ${{ steps.set-matrix.outputs.chunk_size }}
      chunk_count: ${{ steps.set-matrix.outputs.chunk_count }}
      chunks_total: ${{ steps.set-matrix.outputs.chunks_total }}
      chunk_matrix: ${{ steps.set-matrix.outputs.chunk_matrix }}
      extra_pct: ${{ steps.set-matrix.outputs.extra_pct }}
    steps:
      - name: Generate Dynamic Matrix Queue
        id: set-matrix
        shell: python
        env:
          EMAIL: ${{ inputs.getscreen_email }}
          NUM_INSTALLS: ${{ inputs.num_installs }}
          NUM_CLICKS: ${{ inputs.num_clicks }}
          NUM_SURFS: ${{ inputs.num_surfs }}
          OS_VERSION: ${{ inputs.os_version }}
          NUM_DEVICES: ${{ inputs.num_devices }}
          DELAY_CHOICE: ${{ inputs.delay_between_devices }}
          SOFTWARE_CHOICE: ${{ inputs.software_choice }}
          MANUAL_URL: ${{ inputs.manual_software_url }}
          RUN_MANUAL: ${{ inputs.run_manual_link }}
          GENERATE_ALL_PROXIES: ${{ inputs.generate_all_proxies }}
          # true = initial chunk is max(5% of pool, num_devices) so the very first wave of devices is fully covered
          INITIAL_FLOOR_TO_DEVICES: 'true'
          API_KEY_INPUT: ${{ inputs.scrapeops_api_key }}
          WITHOUT_PROXY: ${{ inputs.use_without_proxy }}
          COUNTRY: ${{ inputs.proxy_country }}
          FALLBACK_COUNTRY: ${{ inputs.fallback_country }}
          MOBILE: ${{ inputs.mobile_proxies }}
          STICKY: ${{ inputs.sticky_sessions }}
        run: |
          import os, json, random, re, time, uuid, sys

          print("========== INITIALIZING MATRIX GENERATION ==========")

          try:
              num_installs = int(os.environ.get("NUM_INSTALLS", "5"))
          except ValueError:
              num_installs = 5

          try:
              num_clicks = int(os.environ.get("NUM_CLICKS", "1"))
          except ValueError:
              num_clicks = 1

          try:
              num_surfs = int(os.environ.get("NUM_SURFS", "0"))
          except ValueError:
              num_surfs = 0

          try:
              num_devices = int(os.environ.get("NUM_DEVICES", "1"))
          except ValueError:
              num_devices = 1

          tasks_total = num_installs + num_clicks + num_surfs

          if tasks_total == 0:
              print("No tasks configured (installs=0, clicks=0, surfs=0). Exiting.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("matrix={\"include\":[]}\n")
                  f.write("has_tasks=false\n")
              exit(0)
          else:
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("has_tasks=true\n")

          action_list = ["install"] * num_installs + ["click"] * num_clicks + ["surf"] * num_surfs
          random.shuffle(action_list)

          print(f"[Action Matrix] Total Tasks Queued: {tasks_total} (Installs: {num_installs}, Clicks: {num_clicks}, Surfs: {num_surfs})")
          print(f"[Action Matrix] Randomized Queue  : {action_list}")

          run_manual = os.environ.get("RUN_MANUAL", "false").lower() == "true"
          manual_url_input = os.environ.get("MANUAL_URL", "").strip()
          manual_url = manual_url_input if run_manual else ""
          software_choice_raw = os.environ.get("SOFTWARE_CHOICE", "01. Opera OfferGate - Ahmad")

          software_choice = re.sub(r'^\d+\.\s*', '', software_choice_raw).strip()
          os_version = os.environ.get("OS_VERSION", "windows-2025")
          email = os.environ.get("EMAIL", "").strip()
          delay_choice = os.environ.get("DELAY_CHOICE", "0 minutes")

          delay_map = {
              "1-2 minutes": (60, 120),
              "2-4 minutes": (120, 240),
              "3-6 minutes": (180, 360),
              "4-8 minutes": (240, 480),
              "5-10 minutes": (300, 600)
          }

          batch_delays = {}
          max_batches = (tasks_total // num_devices) + 2
          for b in range(1, max_batches):
              if delay_choice in delay_map:
                  min_s, max_s = delay_map[delay_choice]
                  batch_delays[b] = random.randint(min_s, max_s)
              else:
                  batch_delays[b] = 0

          mob_opera_urls = {
              "Mob Opera - Techx": "https://dub.sh/techxmbxsmrt",
          }
          avg_urls = {
              "AVG - Techx": "https://techx.short.gy/techxavg",
          }
          opera_gx_urls = {
              "OperaGX - Fahmad": "https://dub.sh/fahmadxopx",
              "OperaGX - Oliver": "https://dub.sh/oliverxopx",
              "OperaGX - Mahal":  "https://dub.sh/mahalxopx",
              "OperaGX - Mobeen": "https://dub.sh/mobeenxopx",
              "OperaGX - Tufayl": "https://dub.sh/tufaylxopx",
              "OperaGX - Admax-Techx": "https://admaxflow.com/track.php?cid=2912&pid=127&subid1=adxopx",
          }
          opera_one_urls = {}
          opera_urls = {
              "Opera - Harrari": "https://dub.sh/harrarixsmrt",
              "Opera - AD":      "https://dub.sh/adxsmrt",
              "Opera - Mahal":   "https://dub.sh/mahalxsmrt",
              "Opera - Oliver":  "https://dub.sh/oliverxsmrt",
              "Opera - Mobeen":  "https://dub.sh/mobeenxsmrt",
              "Opera - Fahmad":  "https://dub.sh/fahmadxsmrt",
              "Opera - Peggy":   "https://dub.sh/peggyxsmrt",
              "Opera - Tufayl":  "https://dub.sh/tufaylxsmrt",
          }
          ad_mvn_urls = {
              "Ad-MVN - F.Ahmadx":  "https://dub.sh/f.ahmadxadmvn",
              "Ad-MVN - WillDougly":"https://dub.sh/wlmdglyxadmvn",
              "Ad-MVN - YTX":       "https://dub.sh/ytxyzxadmvn",
              "Ad-MVN - F.Mazari":     "https://dub.sh/fmazarixadmvn",
          }
          opera_ofg_urls = {
              "Opera OfferGate - Ahmad": "https://dub.sh/ahmadxofg",
          }

          all_urls = {**mob_opera_urls, **avg_urls, **opera_urls, **opera_one_urls, **opera_gx_urls, **ad_mvn_urls, **opera_ofg_urls}

          if manual_url:
              target_url = manual_url
              if target_url.endswith("xsmrt"):
                  software_type = "opera_smart_link"
                  exe_filter = "*Opera*Setup*.exe"
              elif target_url.endswith("xavg"):
                  software_type = "avg"
                  exe_filter = "*avg*.exe"
              elif target_url.endswith("xopo"):
                  software_type = "opera_one"
                  exe_filter = "OperaSetup*.exe"
              elif target_url.endswith("xopx"):
                  software_type = "opera_gx"
                  exe_filter = "OperaGXSetup*.exe"
              elif target_url.endswith("xadmvn"):
                  software_type = "ad_mvn"
                  exe_filter = "*Opera*Setup*.exe"
              elif target_url.endswith("xofg"):
                  software_type = "opera_one"
                  exe_filter = "OperaSetup*.exe"
              else:
                  software_type = "opera_smart_link"
                  exe_filter = "*.exe"
          else:
              target_url = all_urls.get(software_choice, opera_ofg_urls.get("Opera OfferGate - Ahmad", "https://dub.sh/ahmadxofg"))

              if software_choice.startswith("Mob Opera") or software_choice.startswith("Opera - "):
                  software_type = "opera_smart_link"
                  exe_filter = "*Opera*Setup*.exe"
              elif software_choice.startswith("Ad-MVN"):
                  software_type = "ad_mvn"
                  exe_filter = "*Opera*Setup*.exe"
              elif software_choice.startswith("Opera OfferGate"):
                  software_type = "opera_one"
                  exe_filter = "OperaSetup*.exe"
              elif software_choice.startswith("OperaGX"):
                  software_type = "opera_gx"
                  exe_filter = "OperaGXSetup*.exe"
              elif software_choice.startswith("OperaOne"):
                  software_type = "opera_one"
                  exe_filter = "OperaSetup*.exe"
              else:
                  software_type = "avg"
                  exe_filter = "*avg*.exe"

          def short_os(os_ver):
              if os_ver == "windows-2025": return "Win25"
              elif os_ver == "windows-2022": return "Win22"
              elif os_ver == "windows-11-arm": return "Win11A"
              return "Win" + os_ver.replace("windows-", "").replace("-", "")

          def short_software(choice):
              prefix_map = {"Mob Opera": "MOB", "Opera OfferGate": "OFG", "OperaGX": "OPX", "OperaOne": "OPO", "Ad-MVN": "MVN", "AVG": "AVG", "Opera": "OP"}
              for key, prefix in prefix_map.items():
                  if choice.startswith(key):
                      parts = choice.split(" - ", 1)
                      list_name = parts[1].replace(" ", "") if len(parts) > 1 else ""
                      return f"{prefix}-{list_name}"
              return choice.replace(" ", "").replace("-", "")

          short_os_tag = short_os(os_version)
          short_sw_tag = "MANUAL" if manual_url else short_software(software_choice)

          # ========== BATCH PROXY GENERATION ==========
          generate_all = os.environ.get("GENERATE_ALL_PROXIES", "false").lower() == "true"
          without_proxy = os.environ.get("WITHOUT_PROXY", "false").lower() == "true"
          proxy_input = os.environ.get("API_KEY_INPUT", "").strip()
          country_input = os.environ.get("COUNTRY", "USA")
          fallback_country_input = os.environ.get("FALLBACK_COUNTRY", "No Fallback")
          mobile = os.environ.get("MOBILE", "false").lower() == "true"
          sticky = os.environ.get("STICKY", "false").lower() == "true"

          country_map = {
              "USA": "us", "UK": "gb", "Canada": "ca", "Australia": "au", "Germany": "de", "France": "fr",
              "Brazil": "br", "Mexico": "mx", "Spain": "es", "Vietnam": "vn", "Switzerland": "ch",
              "Indonesia": "id", "Italy": "it", "Netherlands": "nl", "Poland": "pl"
          }
          cc_input = country_map.get(country_input, "us")

          # ========== PROXY POOL PLAN ==========
          # pool_total = tasks + 10-15% extra buffer.
          # Chunk 0 (initial) = 5% of pool_total, generated BEFORE any device starts.
          # Remaining proxies are produced by a continuous feed (chunk matrix) while devices run.
          import math
          initial_pct = 5
          extra_pct = random.randint(10, 15)
          extra_count = math.ceil(tasks_total * extra_pct / 100.0)
          pool_total = tasks_total + extra_count
          initial_target = math.ceil(pool_total * initial_pct / 100.0)
          floor_devices = os.environ.get("INITIAL_FLOOR_TO_DEVICES", "true").lower() == "true"
          if floor_devices:
              initial_target = max(initial_target, num_devices)
          initial_target = max(1, min(initial_target, pool_total))
          remaining = pool_total - initial_target
          chunk_size = max(10, num_devices)
          if remaining > 0:
              chunk_size = max(chunk_size, math.ceil(remaining / 200.0))
          chunk_count = math.ceil(remaining / chunk_size) if remaining > 0 else 0

          chunk_includes = []
          nxt = initial_target + 1
          for k in range(1, chunk_count + 1):
              end = min(nxt + chunk_size - 1, pool_total)
              chunk_includes.append({
                  "chunk_idx": k, "start_seq": nxt, "end_seq": end, "size": end - nxt + 1,
                  "artifact_name": f"proxy-chunk-{k:03d}", "file_name": f"proxy_chunk_{k:03d}.json",
              })
              nxt = end + 1

          preassigned_proxies = []
          pool_active = generate_all and not without_proxy
          print("========== PROXY POOL PLAN ==========")
          print(f"[Pool] Pool mode active        : {pool_active} (generate_all={generate_all}, without_proxy={without_proxy})")
          print(f"[Pool] Tasks / devices         : {tasks_total} tasks, {num_devices} in parallel")
          print(f"[Pool] Extra buffer            : {extra_pct}% = +{extra_count} proxies")
          print(f"[Pool] Total proxies planned   : {pool_total}")
          print(f"[Pool] Initial pool (chunk 0)  : {initial_target} proxies ({initial_target / pool_total * 100:.1f}% of pool; 5% target{', raised to num_devices' if floor_devices and initial_target == num_devices else ''})")
          print(f"[Pool] Continuous feed         : {remaining} proxies in {chunk_count} chunk(s) of up to {chunk_size}")
          for c in chunk_includes:
              print(f"[Pool]   chunk {c['chunk_idx']:>3}: proxies #{c['start_seq']}-#{c['end_seq']} ({c['size']})")
          print("[Pool] Device #N always takes pool proxy #N. API-key generation per device is last-resort only.")
          print("[Matrix] All tasks start with preassigned_proxy=false; devices fetch their proxy from the pool.")

          # Visitor profiles: shuffled deck so surf tasks get DIFFERENT profiles (no repeats until all 100 are used)
          surf_total = action_list.count("surf")
          _profile_deck = []
          while len(_profile_deck) < surf_total:
              _block = list(range(1, 101))
              random.shuffle(_block)
              _profile_deck.extend(_block)
          _profile_deck = _profile_deck[:surf_total]
          if surf_total:
              print(f"[Surf] {surf_total} surf task(s) -> {len(set(_profile_deck))} distinct visitor profiles (of 100). Runtime cap 180s, randomised per session.")

          includes = []
          for i in range(tasks_total):
              action_mode = action_list[i]
              absolute_idx = i + 1
              batch_idx = (absolute_idx - 1) // num_devices

              delay_sec = batch_delays.get(batch_idx, 0) if batch_idx > 0 else 0

              profile_id = _profile_deck.pop(0) if action_mode == "surf" else None
              profile_tag = f"P{profile_id}" if profile_id else ""
              display_name = f"{absolute_idx}-{short_os_tag}-{short_sw_tag}-{action_mode.capitalize()}" + (f"-{profile_tag}" if profile_tag else "")

              entry = {
                  "task_index":    absolute_idx,
                  "absolute_idx":  absolute_idx,
                  "batch_idx":     batch_idx,
                  "delay_seconds": delay_sec,
                  "email":         email,
                  "os":            os_version,
                  "target_url":    target_url,
                  "software_type": software_type,
                  "exe_filter":    exe_filter,
                  "action_mode":   action_mode,
                  "action_cap":    action_mode.capitalize(),
                  "short_os_tag":  short_os_tag,
                  "short_sw_tag":  short_sw_tag,
                  "profile_tag":   profile_tag,
                  "display_name":  display_name,
                  "preassigned_proxy": "false"
              }

              includes.append(entry)
              print(f"[Task Queued] {display_name} | Batch: {batch_idx} | Delay: {delay_sec}s | Action: {action_mode}")

          if not includes:
              print("Error: Valid configuration could not be generated. Exiting.")
              exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps({'include': includes})}\n")
              f.write(f"tasks_total={tasks_total}\n")
              f.write(f"num_devices={num_devices}\n")
              f.write(f"pool_total={pool_total}\n")
              f.write(f"initial_target={initial_target}\n")
              f.write(f"chunk_size={chunk_size}\n")
              f.write(f"chunk_count={chunk_count}\n")
              f.write(f"chunks_total={chunk_count + 1}\n")
              f.write(f"extra_pct={extra_pct}\n")
              f.write(f"chunk_matrix={json.dumps({'include': chunk_includes})}\n")
          print("========== MATRIX STRUCTURE COMPLETE ==========")
          print(f"[Matrix] {len(includes)} tasks queued. Proxy Pool Initial job generates the first {initial_target} proxies, then devices start.")



  proxy_pool_initial:
    name: "Proxy Pool - Initial 5% (Chunk 0) - devices wait for this"
    needs: prepare_matrix
    if: ${{ needs.prepare_matrix.outputs.has_tasks == 'true' && inputs.generate_all_proxies == true && inputs.use_without_proxy != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      generated: ${{ steps.generate.outputs.generated }}
      pool_now: ${{ steps.generate.outputs.pool_now }}
    steps:
      - name: Pool Plan Overview
        env:
          TASKS_TOTAL: ${{ needs.prepare_matrix.outputs.tasks_total }}
          POOL_TOTAL: ${{ needs.prepare_matrix.outputs.pool_total }}
          INITIAL_TARGET: ${{ needs.prepare_matrix.outputs.initial_target }}
          EXTRA_PCT: ${{ needs.prepare_matrix.outputs.extra_pct }}
          CHUNK_SIZE: ${{ needs.prepare_matrix.outputs.chunk_size }}
          CHUNK_COUNT: ${{ needs.prepare_matrix.outputs.chunk_count }}
        run: |
          echo "============================================================"
          echo " PROXY POOL PLAN"
          echo "============================================================"
          echo "Tasks (devices total)      : $TASKS_TOTAL"
          echo "Extra buffer               : ${EXTRA_PCT}%"
          echo "Total proxies planned      : $POOL_TOTAL"
          echo "Step 1 (this job)          : generate initial $INITIAL_TARGET proxies (chunk 0)"
          echo "Step 2 (device jobs)       : start only after step 1 and take pool proxy #N"
          echo "Step 3 (continuous feed)   : $CHUNK_COUNT chunk(s) of up to $CHUNK_SIZE, generated while devices run"
          {
            echo "## Proxy Pool Plan"
            echo "- Tasks: **$TASKS_TOTAL** | Extra buffer: **${EXTRA_PCT}%** | Planned pool: **$POOL_TOTAL**"
            echo "- Initial chunk (before devices): **$INITIAL_TARGET**"
            echo "- Continuous feed: **$CHUNK_COUNT** chunk(s) of up to **$CHUNK_SIZE**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Initial 5% Proxy Pool (Chunk 0)
        id: generate
        shell: python
        env:
          CHUNK_IDX: '0'
          START_SEQ: '1'
          END_SEQ: ${{ needs.prepare_matrix.outputs.initial_target }}
          CHUNKS_TOTAL: ${{ needs.prepare_matrix.outputs.chunks_total }}
          OUT_FILE: proxy_chunk_000.json
          TASKS_TOTAL: ${{ needs.prepare_matrix.outputs.tasks_total }}
          POOL_TOTAL: ${{ needs.prepare_matrix.outputs.pool_total }}
          NUM_DEVICES: ${{ needs.prepare_matrix.outputs.num_devices }}
          API_KEY_INPUT: ${{ inputs.scrapeops_api_key }}
          COUNTRY: ${{ inputs.proxy_country }}
          FALLBACK_COUNTRY: ${{ inputs.fallback_country }}
          MOBILE: ${{ inputs.mobile_proxies }}
          STICKY: ${{ inputs.sticky_sessions }}
        run: |
          import os, sys, json, re, time, random, string, glob, datetime, subprocess

          try:
              import requests, urllib3
          except ImportError:
              subprocess.check_call([sys.executable, "-m", "pip", "install", "requests[socks]", "urllib3", "--quiet"])
              import requests, urllib3
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)


          def say(m=""):
              print(m, flush=True)


          def group(t):
              print("::group::" + t, flush=True)


          def endgroup():
              print("::endgroup::", flush=True)


          def geti(k, d=0):
              try:
                  return int(os.environ.get(k, str(d)))
              except Exception:
                  return d


          def bar(done, total, width=30):
              pct = (done / total * 100.0) if total else 0.0
              filled = int(width * min(done, total) / total) if total else 0
              return "[" + "#" * filled + "-" * (width - filled) + f"] {pct:5.1f}%"


          def rand_letters(n=6):
              return "".join(random.choices(string.ascii_lowercase, k=n))


          def now_iso():
              return datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")


          # ----------------------------------------------------------------------------
          # Config
          # ----------------------------------------------------------------------------
          CHUNK_IDX = geti("CHUNK_IDX")
          START_SEQ = geti("START_SEQ", 1)
          END_SEQ = geti("END_SEQ", 1)
          TASKS_TOTAL = geti("TASKS_TOTAL")
          POOL_TOTAL = geti("POOL_TOTAL")
          CHUNKS_TOTAL = geti("CHUNKS_TOTAL", 1)
          NUM_DEVICES = geti("NUM_DEVICES", 1)
          COUNT = max(0, END_SEQ - START_SEQ + 1)
          OUT_FILE = os.environ.get("OUT_FILE", f"proxy_chunk_{CHUNK_IDX:03d}.json")
          PRIOR_DIR = os.environ.get("PRIOR_DIR", "prior_chunks")
          IS_INITIAL = CHUNK_IDX == 0
          TAG = "INITIAL 5%" if IS_INITIAL else f"CHUNK {CHUNK_IDX}/{CHUNKS_TOTAL - 1}"

          proxy_input = os.environ.get("API_KEY_INPUT", "").strip()
          country_input = os.environ.get("COUNTRY", "USA")
          fallback_input = os.environ.get("FALLBACK_COUNTRY", "No Fallback")
          mobile = os.environ.get("MOBILE", "false").lower() == "true"
          sticky = os.environ.get("STICKY", "false").lower() == "true"

          country_map = {
              "USA": "us", "UK": "gb", "Canada": "ca", "Australia": "au", "Germany": "de", "France": "fr",
              "Brazil": "br", "Mexico": "mx", "Spain": "es", "Vietnam": "vn", "Switzerland": "ch",
              "Indonesia": "id", "Italy": "it", "Netherlands": "nl", "Poland": "pl",
          }
          cc_primary = country_map.get(country_input, "us").upper()
          cc_fallback = None if fallback_input == "No Fallback" else country_map.get(fallback_input, "us").upper()


          def country_code_to_locale(cc):
              _m = {"US": "en-US", "GB": "en-GB", "CA": "en-CA", "AU": "en-AU", "DE": "de-DE",
                    "FR": "fr-FR", "BR": "pt-BR", "MX": "es-MX", "ES": "es-ES", "VN": "vi-VN",
                    "CH": "de-CH", "ID": "id-ID", "IT": "it-IT", "NL": "nl-NL", "PL": "pl-PL"}
              return _m.get(cc.upper(), "en-US")


          def country_code_to_keyboard(cc):
              _m = {"US": "0409:00000409", "GB": "0809:00000809", "CA": "1009:00000409",
                    "AU": "0C09:00000409", "DE": "0407:00000407", "FR": "040C:0000040C",
                    "BR": "0416:00000416", "MX": "080A:0000080A", "ES": "0C0A:0000080A",
                    "VN": "042A:0000042A", "CH": "0807:00000807", "ID": "0421:00000409",
                    "IT": "0410:00000410", "NL": "0413:00020409", "PL": "0415:00000415"}
              return _m.get(cc.upper(), "0409:00000409")


          def tz_to_windows_tz(iana_tz):
              _m = {"America/New_York": "Eastern Standard Time", "America/Chicago": "Central Standard Time",
                    "America/Denver": "Mountain Standard Time", "America/Phoenix": "US Mountain Standard Time",
                    "America/Los_Angeles": "Pacific Standard Time", "America/Toronto": "Eastern Standard Time",
                    "America/Sao_Paulo": "E. South America Standard Time",
                    "America/Mexico_City": "Central Standard Time (Mexico)",
                    "Europe/London": "GMT Standard Time", "Europe/Paris": "Romance Standard Time",
                    "Europe/Berlin": "W. Europe Standard Time", "Europe/Madrid": "Romance Standard Time",
                    "Europe/Rome": "W. Europe Standard Time", "Europe/Amsterdam": "W. Europe Standard Time",
                    "Europe/Warsaw": "Central European Standard Time",
                    "Asia/Ho_Chi_Minh": "SE Asia Standard Time", "Europe/Zurich": "W. Europe Standard Time",
                    "Asia/Jakarta": "SE Asia Standard Time", "Australia/Sydney": "AUS Eastern Standard Time"}
              return _m.get(iana_tz, "UTC")


          # ----------------------------------------------------------------------------
          # Banner + plan
          # ----------------------------------------------------------------------------
          prior_count, prior_chunks = 0, 0
          for fp in glob.glob(os.path.join(PRIOR_DIR, "**", "proxy_chunk_*.json"), recursive=True):
              try:
                  with open(fp, "r", encoding="utf-8") as fh:
                      d = json.load(fh)
                  if d.get("chunk_idx") == CHUNK_IDX:
                      continue
                  prior_count += len(d.get("proxies", []))
                  prior_chunks += 1
              except Exception:
                  pass

          say("=" * 72)
          say(f" PROXY POOL GENERATION  |  {TAG}")
          say("=" * 72)
          say(f"[Pool] Tasks total            : {TASKS_TOTAL}")
          say(f"[Pool] Pool total (tasks+extra): {POOL_TOTAL}  (extra buffer = {POOL_TOTAL - TASKS_TOTAL})")
          say(f"[Pool] This chunk range       : #{START_SEQ} -> #{END_SEQ}  ({COUNT} proxies)")
          say(f"[Pool] Already in pool        : {prior_count} proxies across {prior_chunks} earlier chunk(s)")
          say(f"[Pool] Pool progress (before) : {bar(prior_count, POOL_TOTAL)}  {prior_count}/{POOL_TOTAL}")
          say(f"[Pool] Country                : {cc_primary} | Fallback: {cc_fallback or 'none'} | Mobile: {mobile} | Sticky: {sticky}")
          say(f"[Pool] Naming format          : <number>-<COUNTRY>-<6 random letters>   e.g. {START_SEQ}-{cc_primary}-{rand_letters()}")
          say("")

          # ----------------------------------------------------------------------------
          # Key / proxy parsing
          # ----------------------------------------------------------------------------
          SCRAPEOPS_RE = re.compile(r"^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$", re.IGNORECASE)
          REDSCRAPE_RE = re.compile(r"^[0-9a-f]{32}$", re.IGNORECASE)
          GOLOGIN_RE = re.compile(r"^ey[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$")
          FLOPPY_RE = re.compile(r"^[A-Za-z0-9_]{30,80}$")

          gologin_keys, bytesflow_proxies, scrapeops_keys, manual_proxies = [], [], [], []
          other_keys = 0
          for item in proxy_input.split():
              item = item.strip()
              if not item:
                  continue
              if GOLOGIN_RE.match(item):
                  gologin_keys.append(item)
              elif "bytesflows.com" in item.lower():
                  bytesflow_proxies.append(item)
              elif REDSCRAPE_RE.match(item):
                  other_keys += 1
              elif SCRAPEOPS_RE.match(item):
                  scrapeops_keys.append(item)
              elif FLOPPY_RE.match(item) and len(item) >= 30:
                  other_keys += 1
              elif (":" in item or "@" in item or "://" in item or "." in item) and len(item) > 5:
                  manual_proxies.append(item)


          def parse_generic_proxy(proxy_str):
              original = proxy_str.strip()
              if not original:
                  return None
              protocol, rest = "http", original
              if "://" in rest:
                  protocol, rest = rest.split("://", 1)
                  if protocol.lower() == "geolocation":
                      protocol = "http"
              rest = re.sub(r":(\d+):[A-Za-z].*$", r":\1", rest)
              m = re.search(r"([^:@\s]+):([^:@\s]+)@([^:@\s]+):(\d+)", rest)
              if m:
                  u, p, h, pt = m.groups()
                  return {"username": u, "password": p, "host": h, "port": int(pt)}
              m = re.search(r"^([^:@\s]+):(\d+):([^:@\s]+):([^:@\s]+)", rest)
              if m:
                  h, pt, u, p = m.groups()
                  return {"username": u, "password": p, "host": h, "port": int(pt)}
              m = re.search(r"^([^:@\s]+):([^:@\s]+):([^:@\s]+):(\d+)", rest)
              if m:
                  u, p, h, pt = m.groups()
                  return {"username": u, "password": p, "host": h, "port": int(pt)}
              m = re.search(r"^([^:@\s]+):(\d+)", rest)
              if m:
                  h, pt = m.groups()
                  return {"username": "", "password": "", "host": h, "port": int(pt)}
              return None


          # ----------------------------------------------------------------------------
          # Validation (HTTP only - the device Edge launcher consumes http://host:port)
          # ----------------------------------------------------------------------------
          def validate_proxy(pinfo):
              auth = f"{pinfo['username']}:{pinfo['password']}@" if pinfo.get("username") else ""
              url = f"http://{auth}{pinfo['host']}:{pinfo['port']}"
              cfg = {"http": url, "https": url}
              endpoints = [
                  ("http://ip-api.com/json/", "ip-api.com"),
                  ("https://ipinfo.io/json", "ipinfo.io"),
                  ("http://ipwho.is/", "ipwho.is"),
                  ("https://api.myip.com", "myip.com"),
              ]
              for ep, name in endpoints:
                  t0 = time.time()
                  try:
                      r = requests.get(ep, proxies=cfg, timeout=15, verify=False)
                      if r.status_code != 200:
                          say(f"      - {name}: HTTP {r.status_code}")
                          continue
                      d = r.json()
                      cc = tz = city = region = ""
                      ip = None
                      if name == "ip-api.com" and d.get("status") == "success":
                          cc, tz, ip, city, region = d.get("countryCode"), d.get("timezone"), d.get("query"), d.get("city"), d.get("regionName")
                      elif name == "ipinfo.io" and "ip" in d:
                          cc, tz, ip, city, region = d.get("country"), d.get("timezone"), d.get("ip"), d.get("city"), d.get("region")
                      elif name == "ipwho.is" and d.get("success"):
                          cc, tz, ip, city, region = d.get("country_code"), (d.get("timezone") or {}).get("id"), d.get("ip"), d.get("city"), d.get("region")
                      elif name == "myip.com" and "ip" in d:
                          cc, ip = d.get("cc"), d.get("ip")
                      if ip:
                          say(f"      - validated via {name} in {int((time.time() - t0) * 1000)} ms -> IP {ip} ({cc})")
                          return {"ip": ip, "cc": (cc or "US").upper(), "tz": tz or "UTC", "city": city or "",
                                  "region": region or "", "latency_ms": int((time.time() - t0) * 1000)}
                  except Exception as e:
                      say(f"      - {name} failed: {type(e).__name__}")
              return None


          # ----------------------------------------------------------------------------
          # Providers: each returns (pinfo | None, error_text)
          # ----------------------------------------------------------------------------
          GOLOGIN_API = "https://api.gologin.com"
          _logged_gologin_shape = {"done": False}


          def make_gologin(seq, cc, name, tries):
              key = gologin_keys[(seq // 15 + tries) % len(gologin_keys)]
              say(f"      - GoLogin API key ...{key[-6:]} -> creating proxy named '{name}' (country={cc}, mobile={mobile})")
              try:
                  r = requests.post(
                      f"{GOLOGIN_API}/users-proxies/mobile-proxy",
                      headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json"},
                      json={"countryCode": cc.lower(), "isMobile": mobile, "isDC": False, "customName": name},
                      timeout=25, verify=False,
                  )
              except Exception as e:
                  return None, f"request error {type(e).__name__}: {e}"
              if r.status_code == 429:
                  say("      - GoLogin rate limit (429) -> backing off 12s")
                  time.sleep(12)
                  return None, "rate limited (429)"
              if r.status_code not in (200, 201):
                  return None, f"HTTP {r.status_code}: {r.text[:160]}"
              try:
                  d = r.json()
              except Exception:
                  return None, "non-JSON response"
              if not _logged_gologin_shape["done"]:
                  say(f"      - GoLogin response fields: {sorted(d.keys()) if isinstance(d, dict) else type(d).__name__}")
                  _logged_gologin_shape["done"] = True
              host = d.get("host") or d.get("ip") or d.get("server") or "proxy.gologin.com"
              port = d.get("port") or d.get("httpPort") or 8080
              user = d.get("username") or d.get("user") or d.get("login") or ""
              pwd = d.get("password") or d.get("pass") or ""
              pid = d.get("id") or d.get("_id") or d.get("proxyId") or ""
              say(f"      - CREATED in GoLogin account as '{name}' (id={pid or 'n/a'}) -> visible at app.gologin.com/proxy")
              return {"username": user, "password": pwd, "host": host, "port": int(port), "gologin_id": pid}, ""


          def make_bytesflow(seq, cc, name, tries):
              base = parse_generic_proxy(bytesflow_proxies[tries % len(bytesflow_proxies)])
              if not base or not base.get("username"):
                  return None, "could not parse BytesFlow proxy string"
              m = re.search(r"^(?:u-)?([A-Za-z0-9]+)", base["username"])
              base_user = m.group(1) if m else base["username"].split("-")[0]
              user = "-".join([f"u-{base_user}", f"loc-{cc}", "t-10", f"s-{rand_letters(8)}"])
              return {"username": user, "password": base["password"], "host": base["host"], "port": base["port"]}, ""


          def make_scrapeops(seq, cc, name, tries):
              key = scrapeops_keys[(seq // 15 + tries) % len(scrapeops_keys)]
              user = f"scrapeops.country={cc.lower()}"
              if mobile:
                  user += ".mobile=true"
              if sticky:
                  user += f".sticky_session=p{seq}{rand_letters(4)}"
              return {"username": user, "password": key, "host": "residential-proxy.scrapeops.io", "port": 8181}, ""


          def make_manual(seq, cc, name, tries):
              p = parse_generic_proxy(manual_proxies[(seq - 1 + tries) % len(manual_proxies)])
              if not p:
                  return None, "could not parse manual proxy string"
              return p, ""


          providers = []  # (label, fn, lenient_country_when_no_fallback)
          if gologin_keys:
              providers.append(("gologin", make_gologin, True))
          if bytesflow_proxies:
              providers.append(("bytesflow", make_bytesflow, False))
          if scrapeops_keys:
              providers.append(("scrapeops", make_scrapeops, False))
          if manual_proxies:
              providers.append(("manual", make_manual, True))

          say(f"[Pool] Providers detected      : " + (", ".join(p[0] for p in providers) if providers else "NONE"))
          if other_keys:
              say(f"[Pool] NOTE: {other_keys} key(s) of types not supported by the pool (Redscrape/FloppyData) are ignored here; devices handle them on-demand.")

          collected = []
          failures = []
          started = time.time()
          MAX_CONSEC = 10
          MAX_ATTEMPTS = COUNT * 4 + 10
          attempts = 0
          consec = 0
          seq_fail = 0
          prov_idx = 0

          if not providers:
              say("::error title=Proxy Pool::No supported proxy provider/API key found in the input. Devices will fall back to on-demand generation.")
          elif COUNT <= 0:
              say("[Pool] Nothing to generate for this chunk.")
          else:
              while len(collected) < COUNT and attempts < MAX_ATTEMPTS:
                  label, fn, lenient = providers[prov_idx]
                  seq = START_SEQ + len(collected)
                  expected = cc_primary
                  if cc_fallback and seq_fail >= 7 and cc_fallback != cc_primary:
                      expected = cc_fallback
                  name = f"{seq}-{expected}-{rand_letters()}"
                  attempts += 1
                  t0 = time.time()
                  group(f"[{TAG}] Proxy #{seq} ({len(collected) + 1}/{COUNT}) | attempt {seq_fail + 1} | provider={label}")
                  pinfo, err = fn(seq, expected, name, seq_fail)
                  res = None
                  if pinfo:
                      res = validate_proxy(pinfo)
                      if res and not (res["cc"] == expected or (lenient and cc_fallback is None)):
                          say(f"      - country mismatch: got {res['cc']} expected {expected}")
                          err = f"country mismatch {res['cc']} != {expected}"
                          res = None
                      elif not res:
                          err = "validation failed (no echo endpoint reachable through proxy)"
                          if label == "gologin":
                              say(f"      - NOTE: proxy '{name}' exists in GoLogin dashboard but failed validation (not deleted).")
                  endgroup()

                  if pinfo and res:
                      if len(pinfo.get("password", "")) >= 8:
                          print(f"::add-mask::{pinfo['password']}", flush=True)
                      rec = {
                          "seq": seq, "name": name, "gologin_id": pinfo.get("gologin_id", ""), "source": label,
                          "host": pinfo["host"], "port": pinfo["port"],
                          "username": pinfo.get("username", ""), "password": pinfo.get("password", ""),
                          "server": f"{pinfo['host']}:{pinfo['port']}",
                          "server_with_proto": f"http://{pinfo['host']}:{pinfo['port']}",
                          "proxy_type_label": label, "working": True,
                          "country_code": res["cc"], "country_name": res["cc"], "ip": res["ip"],
                          "city": res["city"], "region": res["region"],
                          "timezone_iana": res["tz"], "timezone_windows": tz_to_windows_tz(res["tz"]),
                          "windows_locale": country_code_to_locale(res["cc"]),
                          "windows_keyboard": country_code_to_keyboard(res["cc"]),
                          "latency_ms": res["latency_ms"], "chunk_idx": CHUNK_IDX, "created_at": now_iso(),
                      }
                      collected.append(rec)
                      consec = 0
                      seq_fail = 0
                      total_now = prior_count + len(collected)
                      say(f"[Pool] OK  #{seq:<4} '{name}' | IP {res['ip']} | {res['cc']} {res['city']} | {int(time.time() - t0)}s")
                      say(f"[Pool]     chunk {len(collected)}/{COUNT} {bar(len(collected), COUNT, 20)} | POOL {total_now}/{POOL_TOTAL} {bar(total_now, POOL_TOTAL)}")
                  else:
                      consec += 1
                      seq_fail += 1
                      failures.append({"seq": seq, "name": name, "reason": err})
                      say(f"[Pool] FAIL #{seq:<4} '{name}' | {err} | consecutive failures: {consec}/{MAX_CONSEC}")
                      if consec >= MAX_CONSEC:
                          if prov_idx + 1 < len(providers):
                              prov_idx += 1
                              consec = 0
                              say(f"[Pool] Switching provider -> {providers[prov_idx][0]}")
                          else:
                              say(f"::warning title=Proxy Pool {TAG}::Stopping early after {consec} consecutive failures (quota/limit?). Generated {len(collected)}/{COUNT}.")
                              break
                  time.sleep(0.7)

          # ----------------------------------------------------------------------------
          # Output
          # ----------------------------------------------------------------------------
          elapsed = int(time.time() - started)
          total_after = prior_count + len(collected)
          payload = {
              "chunk_idx": CHUNK_IDX, "start_seq": START_SEQ, "end_seq": END_SEQ, "requested": COUNT,
              "generated": len(collected), "failed_attempts": len(failures), "created_at": now_iso(),
              "proxies": collected,
          }
          with open(OUT_FILE, "w", encoding="utf-8") as fh:
              json.dump(payload, fh, indent=2)

          say("")
          say("=" * 72)
          say(f" {TAG} COMPLETE in {elapsed}s")
          say("=" * 72)
          say(f"[Pool] Generated this chunk : {len(collected)}/{COUNT}  (failed attempts: {len(failures)})")
          say(f"[Pool] Pool now holds       : {total_after}/{POOL_TOTAL}  {bar(total_after, POOL_TOTAL)}")
          say(f"[Pool] Covers tasks         : {min(total_after, TASKS_TOTAL)}/{TASKS_TOTAL} (+{max(0, total_after - TASKS_TOTAL)} spare)")
          say(f"[Pool] Artifact             : {OUT_FILE}")
          if collected:
              say("[Pool] Names created in GoLogin dashboard (app.gologin.com/proxy):" if gologin_keys else "[Pool] Proxy names:")
              say("       " + ", ".join(p["name"] for p in collected))
          if len(collected) < COUNT:
              say(f"::warning title=Proxy Pool {TAG}::Only {len(collected)}/{COUNT} proxies generated. Devices needing the missing numbers fall back to API-key generation.")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(f"## Proxy Pool - {TAG}\n\n")
                  fh.write(f"- Range: **#{START_SEQ} - #{END_SEQ}** ({COUNT} requested)\n")
                  fh.write(f"- Generated this chunk: **{len(collected)}/{COUNT}** | failed attempts: {len(failures)} | time: {elapsed}s\n")
                  fh.write(f"- Pool progress: **{total_after}/{POOL_TOTAL}** ({(total_after / POOL_TOTAL * 100.0) if POOL_TOTAL else 0:.1f}%)\n")
                  fh.write(f"- Tasks covered: {min(total_after, TASKS_TOTAL)}/{TASKS_TOTAL}\n\n")
                  if collected:
                      fh.write("| # | Dashboard name | IP | Country | City | Latency |\n|---|---|---|---|---|---|\n")
                      for p in collected:
                          fh.write(f"| {p['seq']} | `{p['name']}` | {p['ip']} | {p['country_code']} | {p['city']} | {p['latency_ms']} ms |\n")
                  if failures:
                      fh.write("\n<details><summary>Failed attempts</summary>\n\n")
                      for f_ in failures[:50]:
                          fh.write(f"- #{f_['seq']} `{f_['name']}`: {f_['reason']}\n")
                      fh.write("\n</details>\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"generated={len(collected)}\n")
              fh.write(f"pool_now={total_after}\n")

          if len(collected) == 0 and COUNT > 0:
              say(f"::error title=Proxy Pool {TAG}::Zero proxies generated for this chunk.")
              sys.exit(1)

      - name: Upload Chunk 0 Artifact (proxy-chunk-000)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-chunk-000
          path: proxy_chunk_000.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Initial Pool Ready
        if: always()
        run: |
          echo "============================================================"
          echo " INITIAL POOL STEP FINISHED - generated: ${{ steps.generate.outputs.generated }} / ${{ needs.prepare_matrix.outputs.initial_target }}"
          echo " Device jobs may start now. Continuous feed starts in parallel."
          echo "============================================================"

  proxy_pool_continuous:
    name: "Proxy Pool Chunk ${{ matrix.chunk_idx }} [#${{ matrix.start_seq }}-${{ matrix.end_seq }}]"
    needs: [prepare_matrix, proxy_pool_initial]
    if: ${{ !cancelled() && needs.proxy_pool_initial.result == 'success' && needs.prepare_matrix.outputs.chunk_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.prepare_matrix.outputs.chunk_matrix) }}
    steps:
      - name: Load Earlier Chunks (for cumulative stats)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: proxy-chunk-*
          merge-multiple: true
          path: prior_chunks

      - name: Generate Chunk ${{ matrix.chunk_idx }} (continuous feed)
        id: generate
        shell: python
        env:
          CHUNK_IDX: ${{ matrix.chunk_idx }}
          START_SEQ: ${{ matrix.start_seq }}
          END_SEQ: ${{ matrix.end_seq }}
          CHUNKS_TOTAL: ${{ needs.prepare_matrix.outputs.chunks_total }}
          OUT_FILE: ${{ matrix.file_name }}
          TASKS_TOTAL: ${{ needs.prepare_matrix.outputs.tasks_total }}
          POOL_TOTAL: ${{ needs.prepare_matrix.outputs.pool_total }}
          NUM_DEVICES: ${{ needs.prepare_matrix.outputs.num_devices }}
          API_KEY_INPUT: ${{ inputs.scrapeops_api_key }}
          COUNTRY: ${{ inputs.proxy_country }}
          FALLBACK_COUNTRY: ${{ inputs.fallback_country }}
          MOBILE: ${{ inputs.mobile_proxies }}
          STICKY: ${{ inputs.sticky_sessions }}
        run: |
          import os, sys, json, re, time, random, string, glob, datetime, subprocess

          try:
              import requests, urllib3
          except ImportError:
              subprocess.check_call([sys.executable, "-m", "pip", "install", "requests[socks]", "urllib3", "--quiet"])
              import requests, urllib3
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)


          def say(m=""):
              print(m, flush=True)


          def group(t):
              print("::group::" + t, flush=True)


          def endgroup():
              print("::endgroup::", flush=True)


          def geti(k, d=0):
              try:
                  return int(os.environ.get(k, str(d)))
              except Exception:
                  return d


          def bar(done, total, width=30):
              pct = (done / total * 100.0) if total else 0.0
              filled = int(width * min(done, total) / total) if total else 0
              return "[" + "#" * filled + "-" * (width - filled) + f"] {pct:5.1f}%"


          def rand_letters(n=6):
              return "".join(random.choices(string.ascii_lowercase, k=n))


          def now_iso():
              return datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")


          # ----------------------------------------------------------------------------
          # Config
          # ----------------------------------------------------------------------------
          CHUNK_IDX = geti("CHUNK_IDX")
          START_SEQ = geti("START_SEQ", 1)
          END_SEQ = geti("END_SEQ", 1)
          TASKS_TOTAL = geti("TASKS_TOTAL")
          POOL_TOTAL = geti("POOL_TOTAL")
          CHUNKS_TOTAL = geti("CHUNKS_TOTAL", 1)
          NUM_DEVICES = geti("NUM_DEVICES", 1)
          COUNT = max(0, END_SEQ - START_SEQ + 1)
          OUT_FILE = os.environ.get("OUT_FILE", f"proxy_chunk_{CHUNK_IDX:03d}.json")
          PRIOR_DIR = os.environ.get("PRIOR_DIR", "prior_chunks")
          IS_INITIAL = CHUNK_IDX == 0
          TAG = "INITIAL 5%" if IS_INITIAL else f"CHUNK {CHUNK_IDX}/{CHUNKS_TOTAL - 1}"

          proxy_input = os.environ.get("API_KEY_INPUT", "").strip()
          country_input = os.environ.get("COUNTRY", "USA")
          fallback_input = os.environ.get("FALLBACK_COUNTRY", "No Fallback")
          mobile = os.environ.get("MOBILE", "false").lower() == "true"
          sticky = os.environ.get("STICKY", "false").lower() == "true"

          country_map = {
              "USA": "us", "UK": "gb", "Canada": "ca", "Australia": "au", "Germany": "de", "France": "fr",
              "Brazil": "br", "Mexico": "mx", "Spain": "es", "Vietnam": "vn", "Switzerland": "ch",
              "Indonesia": "id", "Italy": "it", "Netherlands": "nl", "Poland": "pl",
          }
          cc_primary = country_map.get(country_input, "us").upper()
          cc_fallback = None if fallback_input == "No Fallback" else country_map.get(fallback_input, "us").upper()


          def country_code_to_locale(cc):
              _m = {"US": "en-US", "GB": "en-GB", "CA": "en-CA", "AU": "en-AU", "DE": "de-DE",
                    "FR": "fr-FR", "BR": "pt-BR", "MX": "es-MX", "ES": "es-ES", "VN": "vi-VN",
                    "CH": "de-CH", "ID": "id-ID", "IT": "it-IT", "NL": "nl-NL", "PL": "pl-PL"}
              return _m.get(cc.upper(), "en-US")


          def country_code_to_keyboard(cc):
              _m = {"US": "0409:00000409", "GB": "0809:00000809", "CA": "1009:00000409",
                    "AU": "0C09:00000409", "DE": "0407:00000407", "FR": "040C:0000040C",
                    "BR": "0416:00000416", "MX": "080A:0000080A", "ES": "0C0A:0000080A",
                    "VN": "042A:0000042A", "CH": "0807:00000807", "ID": "0421:00000409",
                    "IT": "0410:00000410", "NL": "0413:00020409", "PL": "0415:00000415"}
              return _m.get(cc.upper(), "0409:00000409")


          def tz_to_windows_tz(iana_tz):
              _m = {"America/New_York": "Eastern Standard Time", "America/Chicago": "Central Standard Time",
                    "America/Denver": "Mountain Standard Time", "America/Phoenix": "US Mountain Standard Time",
                    "America/Los_Angeles": "Pacific Standard Time", "America/Toronto": "Eastern Standard Time",
                    "America/Sao_Paulo": "E. South America Standard Time",
                    "America/Mexico_City": "Central Standard Time (Mexico)",
                    "Europe/London": "GMT Standard Time", "Europe/Paris": "Romance Standard Time",
                    "Europe/Berlin": "W. Europe Standard Time", "Europe/Madrid": "Romance Standard Time",
                    "Europe/Rome": "W. Europe Standard Time", "Europe/Amsterdam": "W. Europe Standard Time",
                    "Europe/Warsaw": "Central European Standard Time",
                    "Asia/Ho_Chi_Minh": "SE Asia Standard Time", "Europe/Zurich": "W. Europe Standard Time",
                    "Asia/Jakarta": "SE Asia Standard Time", "Australia/Sydney": "AUS Eastern Standard Time"}
              return _m.get(iana_tz, "UTC")


          # ----------------------------------------------------------------------------
          # Banner + plan
          # ----------------------------------------------------------------------------
          prior_count, prior_chunks = 0, 0
          for fp in glob.glob(os.path.join(PRIOR_DIR, "**", "proxy_chunk_*.json"), recursive=True):
              try:
                  with open(fp, "r", encoding="utf-8") as fh:
                      d = json.load(fh)
                  if d.get("chunk_idx") == CHUNK_IDX:
                      continue
                  prior_count += len(d.get("proxies", []))
                  prior_chunks += 1
              except Exception:
                  pass

          say("=" * 72)
          say(f" PROXY POOL GENERATION  |  {TAG}")
          say("=" * 72)
          say(f"[Pool] Tasks total            : {TASKS_TOTAL}")
          say(f"[Pool] Pool total (tasks+extra): {POOL_TOTAL}  (extra buffer = {POOL_TOTAL - TASKS_TOTAL})")
          say(f"[Pool] This chunk range       : #{START_SEQ} -> #{END_SEQ}  ({COUNT} proxies)")
          say(f"[Pool] Already in pool        : {prior_count} proxies across {prior_chunks} earlier chunk(s)")
          say(f"[Pool] Pool progress (before) : {bar(prior_count, POOL_TOTAL)}  {prior_count}/{POOL_TOTAL}")
          say(f"[Pool] Country                : {cc_primary} | Fallback: {cc_fallback or 'none'} | Mobile: {mobile} | Sticky: {sticky}")
          say(f"[Pool] Naming format          : <number>-<COUNTRY>-<6 random letters>   e.g. {START_SEQ}-{cc_primary}-{rand_letters()}")
          say("")

          # ----------------------------------------------------------------------------
          # Key / proxy parsing
          # ----------------------------------------------------------------------------
          SCRAPEOPS_RE = re.compile(r"^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$", re.IGNORECASE)
          REDSCRAPE_RE = re.compile(r"^[0-9a-f]{32}$", re.IGNORECASE)
          GOLOGIN_RE = re.compile(r"^ey[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$")
          FLOPPY_RE = re.compile(r"^[A-Za-z0-9_]{30,80}$")

          gologin_keys, bytesflow_proxies, scrapeops_keys, manual_proxies = [], [], [], []
          other_keys = 0
          for item in proxy_input.split():
              item = item.strip()
              if not item:
                  continue
              if GOLOGIN_RE.match(item):
                  gologin_keys.append(item)
              elif "bytesflows.com" in item.lower():
                  bytesflow_proxies.append(item)
              elif REDSCRAPE_RE.match(item):
                  other_keys += 1
              elif SCRAPEOPS_RE.match(item):
                  scrapeops_keys.append(item)
              elif FLOPPY_RE.match(item) and len(item) >= 30:
                  other_keys += 1
              elif (":" in item or "@" in item or "://" in item or "." in item) and len(item) > 5:
                  manual_proxies.append(item)


          def parse_generic_proxy(proxy_str):
              original = proxy_str.strip()
              if not original:
                  return None
              protocol, rest = "http", original
              if "://" in rest:
                  protocol, rest = rest.split("://", 1)
                  if protocol.lower() == "geolocation":
                      protocol = "http"
              rest = re.sub(r":(\d+):[A-Za-z].*$", r":\1", rest)
              m = re.search(r"([^:@\s]+):([^:@\s]+)@([^:@\s]+):(\d+)", rest)
              if m:
                  u, p, h, pt = m.groups()
                  return {"username": u, "password": p, "host": h, "port": int(pt)}
              m = re.search(r"^([^:@\s]+):(\d+):([^:@\s]+):([^:@\s]+)", rest)
              if m:
                  h, pt, u, p = m.groups()
                  return {"username": u, "password": p, "host": h, "port": int(pt)}
              m = re.search(r"^([^:@\s]+):([^:@\s]+):([^:@\s]+):(\d+)", rest)
              if m:
                  u, p, h, pt = m.groups()
                  return {"username": u, "password": p, "host": h, "port": int(pt)}
              m = re.search(r"^([^:@\s]+):(\d+)", rest)
              if m:
                  h, pt = m.groups()
                  return {"username": "", "password": "", "host": h, "port": int(pt)}
              return None


          # ----------------------------------------------------------------------------
          # Validation (HTTP only - the device Edge launcher consumes http://host:port)
          # ----------------------------------------------------------------------------
          def validate_proxy(pinfo):
              auth = f"{pinfo['username']}:{pinfo['password']}@" if pinfo.get("username") else ""
              url = f"http://{auth}{pinfo['host']}:{pinfo['port']}"
              cfg = {"http": url, "https": url}
              endpoints = [
                  ("http://ip-api.com/json/", "ip-api.com"),
                  ("https://ipinfo.io/json", "ipinfo.io"),
                  ("http://ipwho.is/", "ipwho.is"),
                  ("https://api.myip.com", "myip.com"),
              ]
              for ep, name in endpoints:
                  t0 = time.time()
                  try:
                      r = requests.get(ep, proxies=cfg, timeout=15, verify=False)
                      if r.status_code != 200:
                          say(f"      - {name}: HTTP {r.status_code}")
                          continue
                      d = r.json()
                      cc = tz = city = region = ""
                      ip = None
                      if name == "ip-api.com" and d.get("status") == "success":
                          cc, tz, ip, city, region = d.get("countryCode"), d.get("timezone"), d.get("query"), d.get("city"), d.get("regionName")
                      elif name == "ipinfo.io" and "ip" in d:
                          cc, tz, ip, city, region = d.get("country"), d.get("timezone"), d.get("ip"), d.get("city"), d.get("region")
                      elif name == "ipwho.is" and d.get("success"):
                          cc, tz, ip, city, region = d.get("country_code"), (d.get("timezone") or {}).get("id"), d.get("ip"), d.get("city"), d.get("region")
                      elif name == "myip.com" and "ip" in d:
                          cc, ip = d.get("cc"), d.get("ip")
                      if ip:
                          say(f"      - validated via {name} in {int((time.time() - t0) * 1000)} ms -> IP {ip} ({cc})")
                          return {"ip": ip, "cc": (cc or "US").upper(), "tz": tz or "UTC", "city": city or "",
                                  "region": region or "", "latency_ms": int((time.time() - t0) * 1000)}
                  except Exception as e:
                      say(f"      - {name} failed: {type(e).__name__}")
              return None


          # ----------------------------------------------------------------------------
          # Providers: each returns (pinfo | None, error_text)
          # ----------------------------------------------------------------------------
          GOLOGIN_API = "https://api.gologin.com"
          _logged_gologin_shape = {"done": False}


          def make_gologin(seq, cc, name, tries):
              key = gologin_keys[(seq // 15 + tries) % len(gologin_keys)]
              say(f"      - GoLogin API key ...{key[-6:]} -> creating proxy named '{name}' (country={cc}, mobile={mobile})")
              try:
                  r = requests.post(
                      f"{GOLOGIN_API}/users-proxies/mobile-proxy",
                      headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json"},
                      json={"countryCode": cc.lower(), "isMobile": mobile, "isDC": False, "customName": name},
                      timeout=25, verify=False,
                  )
              except Exception as e:
                  return None, f"request error {type(e).__name__}: {e}"
              if r.status_code == 429:
                  say("      - GoLogin rate limit (429) -> backing off 12s")
                  time.sleep(12)
                  return None, "rate limited (429)"
              if r.status_code not in (200, 201):
                  return None, f"HTTP {r.status_code}: {r.text[:160]}"
              try:
                  d = r.json()
              except Exception:
                  return None, "non-JSON response"
              if not _logged_gologin_shape["done"]:
                  say(f"      - GoLogin response fields: {sorted(d.keys()) if isinstance(d, dict) else type(d).__name__}")
                  _logged_gologin_shape["done"] = True
              host = d.get("host") or d.get("ip") or d.get("server") or "proxy.gologin.com"
              port = d.get("port") or d.get("httpPort") or 8080
              user = d.get("username") or d.get("user") or d.get("login") or ""
              pwd = d.get("password") or d.get("pass") or ""
              pid = d.get("id") or d.get("_id") or d.get("proxyId") or ""
              say(f"      - CREATED in GoLogin account as '{name}' (id={pid or 'n/a'}) -> visible at app.gologin.com/proxy")
              return {"username": user, "password": pwd, "host": host, "port": int(port), "gologin_id": pid}, ""


          def make_bytesflow(seq, cc, name, tries):
              base = parse_generic_proxy(bytesflow_proxies[tries % len(bytesflow_proxies)])
              if not base or not base.get("username"):
                  return None, "could not parse BytesFlow proxy string"
              m = re.search(r"^(?:u-)?([A-Za-z0-9]+)", base["username"])
              base_user = m.group(1) if m else base["username"].split("-")[0]
              user = "-".join([f"u-{base_user}", f"loc-{cc}", "t-10", f"s-{rand_letters(8)}"])
              return {"username": user, "password": base["password"], "host": base["host"], "port": base["port"]}, ""


          def make_scrapeops(seq, cc, name, tries):
              key = scrapeops_keys[(seq // 15 + tries) % len(scrapeops_keys)]
              user = f"scrapeops.country={cc.lower()}"
              if mobile:
                  user += ".mobile=true"
              if sticky:
                  user += f".sticky_session=p{seq}{rand_letters(4)}"
              return {"username": user, "password": key, "host": "residential-proxy.scrapeops.io", "port": 8181}, ""


          def make_manual(seq, cc, name, tries):
              p = parse_generic_proxy(manual_proxies[(seq - 1 + tries) % len(manual_proxies)])
              if not p:
                  return None, "could not parse manual proxy string"
              return p, ""


          providers = []  # (label, fn, lenient_country_when_no_fallback)
          if gologin_keys:
              providers.append(("gologin", make_gologin, True))
          if bytesflow_proxies:
              providers.append(("bytesflow", make_bytesflow, False))
          if scrapeops_keys:
              providers.append(("scrapeops", make_scrapeops, False))
          if manual_proxies:
              providers.append(("manual", make_manual, True))

          say(f"[Pool] Providers detected      : " + (", ".join(p[0] for p in providers) if providers else "NONE"))
          if other_keys:
              say(f"[Pool] NOTE: {other_keys} key(s) of types not supported by the pool (Redscrape/FloppyData) are ignored here; devices handle them on-demand.")

          collected = []
          failures = []
          started = time.time()
          MAX_CONSEC = 10
          MAX_ATTEMPTS = COUNT * 4 + 10
          attempts = 0
          consec = 0
          seq_fail = 0
          prov_idx = 0

          if not providers:
              say("::error title=Proxy Pool::No supported proxy provider/API key found in the input. Devices will fall back to on-demand generation.")
          elif COUNT <= 0:
              say("[Pool] Nothing to generate for this chunk.")
          else:
              while len(collected) < COUNT and attempts < MAX_ATTEMPTS:
                  label, fn, lenient = providers[prov_idx]
                  seq = START_SEQ + len(collected)
                  expected = cc_primary
                  if cc_fallback and seq_fail >= 7 and cc_fallback != cc_primary:
                      expected = cc_fallback
                  name = f"{seq}-{expected}-{rand_letters()}"
                  attempts += 1
                  t0 = time.time()
                  group(f"[{TAG}] Proxy #{seq} ({len(collected) + 1}/{COUNT}) | attempt {seq_fail + 1} | provider={label}")
                  pinfo, err = fn(seq, expected, name, seq_fail)
                  res = None
                  if pinfo:
                      res = validate_proxy(pinfo)
                      if res and not (res["cc"] == expected or (lenient and cc_fallback is None)):
                          say(f"      - country mismatch: got {res['cc']} expected {expected}")
                          err = f"country mismatch {res['cc']} != {expected}"
                          res = None
                      elif not res:
                          err = "validation failed (no echo endpoint reachable through proxy)"
                          if label == "gologin":
                              say(f"      - NOTE: proxy '{name}' exists in GoLogin dashboard but failed validation (not deleted).")
                  endgroup()

                  if pinfo and res:
                      if len(pinfo.get("password", "")) >= 8:
                          print(f"::add-mask::{pinfo['password']}", flush=True)
                      rec = {
                          "seq": seq, "name": name, "gologin_id": pinfo.get("gologin_id", ""), "source": label,
                          "host": pinfo["host"], "port": pinfo["port"],
                          "username": pinfo.get("username", ""), "password": pinfo.get("password", ""),
                          "server": f"{pinfo['host']}:{pinfo['port']}",
                          "server_with_proto": f"http://{pinfo['host']}:{pinfo['port']}",
                          "proxy_type_label": label, "working": True,
                          "country_code": res["cc"], "country_name": res["cc"], "ip": res["ip"],
                          "city": res["city"], "region": res["region"],
                          "timezone_iana": res["tz"], "timezone_windows": tz_to_windows_tz(res["tz"]),
                          "windows_locale": country_code_to_locale(res["cc"]),
                          "windows_keyboard": country_code_to_keyboard(res["cc"]),
                          "latency_ms": res["latency_ms"], "chunk_idx": CHUNK_IDX, "created_at": now_iso(),
                      }
                      collected.append(rec)
                      consec = 0
                      seq_fail = 0
                      total_now = prior_count + len(collected)
                      say(f"[Pool] OK  #{seq:<4} '{name}' | IP {res['ip']} | {res['cc']} {res['city']} | {int(time.time() - t0)}s")
                      say(f"[Pool]     chunk {len(collected)}/{COUNT} {bar(len(collected), COUNT, 20)} | POOL {total_now}/{POOL_TOTAL} {bar(total_now, POOL_TOTAL)}")
                  else:
                      consec += 1
                      seq_fail += 1
                      failures.append({"seq": seq, "name": name, "reason": err})
                      say(f"[Pool] FAIL #{seq:<4} '{name}' | {err} | consecutive failures: {consec}/{MAX_CONSEC}")
                      if consec >= MAX_CONSEC:
                          if prov_idx + 1 < len(providers):
                              prov_idx += 1
                              consec = 0
                              say(f"[Pool] Switching provider -> {providers[prov_idx][0]}")
                          else:
                              say(f"::warning title=Proxy Pool {TAG}::Stopping early after {consec} consecutive failures (quota/limit?). Generated {len(collected)}/{COUNT}.")
                              break
                  time.sleep(0.7)

          # ----------------------------------------------------------------------------
          # Output
          # ----------------------------------------------------------------------------
          elapsed = int(time.time() - started)
          total_after = prior_count + len(collected)
          payload = {
              "chunk_idx": CHUNK_IDX, "start_seq": START_SEQ, "end_seq": END_SEQ, "requested": COUNT,
              "generated": len(collected), "failed_attempts": len(failures), "created_at": now_iso(),
              "proxies": collected,
          }
          with open(OUT_FILE, "w", encoding="utf-8") as fh:
              json.dump(payload, fh, indent=2)

          say("")
          say("=" * 72)
          say(f" {TAG} COMPLETE in {elapsed}s")
          say("=" * 72)
          say(f"[Pool] Generated this chunk : {len(collected)}/{COUNT}  (failed attempts: {len(failures)})")
          say(f"[Pool] Pool now holds       : {total_after}/{POOL_TOTAL}  {bar(total_after, POOL_TOTAL)}")
          say(f"[Pool] Covers tasks         : {min(total_after, TASKS_TOTAL)}/{TASKS_TOTAL} (+{max(0, total_after - TASKS_TOTAL)} spare)")
          say(f"[Pool] Artifact             : {OUT_FILE}")
          if collected:
              say("[Pool] Names created in GoLogin dashboard (app.gologin.com/proxy):" if gologin_keys else "[Pool] Proxy names:")
              say("       " + ", ".join(p["name"] for p in collected))
          if len(collected) < COUNT:
              say(f"::warning title=Proxy Pool {TAG}::Only {len(collected)}/{COUNT} proxies generated. Devices needing the missing numbers fall back to API-key generation.")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(f"## Proxy Pool - {TAG}\n\n")
                  fh.write(f"- Range: **#{START_SEQ} - #{END_SEQ}** ({COUNT} requested)\n")
                  fh.write(f"- Generated this chunk: **{len(collected)}/{COUNT}** | failed attempts: {len(failures)} | time: {elapsed}s\n")
                  fh.write(f"- Pool progress: **{total_after}/{POOL_TOTAL}** ({(total_after / POOL_TOTAL * 100.0) if POOL_TOTAL else 0:.1f}%)\n")
                  fh.write(f"- Tasks covered: {min(total_after, TASKS_TOTAL)}/{TASKS_TOTAL}\n\n")
                  if collected:
                      fh.write("| # | Dashboard name | IP | Country | City | Latency |\n|---|---|---|---|---|---|\n")
                      for p in collected:
                          fh.write(f"| {p['seq']} | `{p['name']}` | {p['ip']} | {p['country_code']} | {p['city']} | {p['latency_ms']} ms |\n")
                  if failures:
                      fh.write("\n<details><summary>Failed attempts</summary>\n\n")
                      for f_ in failures[:50]:
                          fh.write(f"- #{f_['seq']} `{f_['name']}`: {f_['reason']}\n")
                      fh.write("\n</details>\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"generated={len(collected)}\n")
              fh.write(f"pool_now={total_after}\n")

          if len(collected) == 0 and COUNT > 0:
              say(f"::error title=Proxy Pool {TAG}::Zero proxies generated for this chunk.")
              sys.exit(1)

      - name: Upload Chunk Artifact (${{ matrix.artifact_name }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.file_name }}
          retention-days: 1
          if-no-files-found: ignore

  proxy_pool_report:
    name: "Proxy Pool - Final Report"
    needs: [prepare_matrix, proxy_pool_initial, proxy_pool_continuous]
    if: ${{ !cancelled() && needs.proxy_pool_initial.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download All Chunks
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: proxy-chunk-*
          merge-multiple: true
          path: pool

      - name: Build Pool Report
        shell: python
        env:
          TASKS_TOTAL: ${{ needs.prepare_matrix.outputs.tasks_total }}
          POOL_TOTAL: ${{ needs.prepare_matrix.outputs.pool_total }}
          INITIAL_TARGET: ${{ needs.prepare_matrix.outputs.initial_target }}
          EXTRA_PCT: ${{ needs.prepare_matrix.outputs.extra_pct }}
          CHUNK_COUNT: ${{ needs.prepare_matrix.outputs.chunk_count }}
        run: |
          import os, json, glob
          from collections import Counter


          def geti(k, d=0):
              try:
                  return int(os.environ.get(k, str(d)))
              except Exception:
                  return d


          POOL_TOTAL = geti("POOL_TOTAL")
          TASKS_TOTAL = geti("TASKS_TOTAL")
          INITIAL = geti("INITIAL_TARGET")
          EXTRA_PCT = geti("EXTRA_PCT")
          CHUNKS = geti("CHUNK_COUNT") + 1

          chunks, proxies = [], []
          for fp in sorted(glob.glob("pool/**/proxy_chunk_*.json", recursive=True)):
              try:
                  with open(fp, "r", encoding="utf-8") as fh:
                      d = json.load(fh)
                  chunks.append(d)
                  proxies.extend(d.get("proxies", []))
              except Exception as e:
                  print(f"[Report] could not read {fp}: {e}")

          seqs = {p["seq"] for p in proxies}
          missing = [s for s in range(1, POOL_TOTAL + 1) if s not in seqs]


          def ranges(nums):
              out, start, prev = [], None, None
              for n in nums:
                  if start is None:
                      start = prev = n
                  elif n == prev + 1:
                      prev = n
                  else:
                      out.append((start, prev))
                      start = prev = n
              if start is not None:
                  out.append((start, prev))
              return ", ".join(f"#{a}" if a == b else f"#{a}-#{b}" for a, b in out)


          total = len(proxies)
          pct = (total / POOL_TOTAL * 100.0) if POOL_TOTAL else 0.0
          countries = Counter(p.get("country_code", "?") for p in proxies)
          sources = Counter(p.get("source", "?") for p in proxies)

          lines = []
          lines.append("# Proxy Pool - Final Report\n")
          lines.append(f"| Metric | Value |\n|---|---|")
          lines.append(f"| Tasks (devices) | {TASKS_TOTAL} |")
          lines.append(f"| Extra buffer | {EXTRA_PCT}% |")
          lines.append(f"| Planned pool size | {POOL_TOTAL} |")
          lines.append(f"| Initial chunk (5% target) | {INITIAL} |")
          lines.append(f"| Chunks planned / completed | {CHUNKS} / {len(chunks)} |")
          lines.append(f"| **Proxies generated** | **{total}/{POOL_TOTAL} ({pct:.1f}%)** |")
          lines.append(f"| Tasks covered | {min(total, TASKS_TOTAL)}/{TASKS_TOTAL} |")
          lines.append(f"| Spare proxies | {max(0, total - TASKS_TOTAL)} |")
          lines.append(f"| Countries | {dict(countries)} |")
          lines.append(f"| Providers | {dict(sources)} |")
          lines.append(f"| Missing numbers | {ranges(missing) if missing else 'none'} |")
          lines.append("")
          lines.append("## Per-chunk results\n")
          lines.append("| Chunk | Range | Generated | Failed attempts |\n|---|---|---|---|")
          for d in sorted(chunks, key=lambda x: x.get("chunk_idx", 0)):
              lines.append(f"| {d.get('chunk_idx')} | #{d.get('start_seq')}-#{d.get('end_seq')} | {d.get('generated')}/{d.get('requested')} | {d.get('failed_attempts')} |")
          lines.append("")
          lines.append("## Names in the GoLogin dashboard (app.gologin.com/proxy)\n")
          lines.append("These proxies are never deleted by this workflow.\n")
          names = [p["name"] for p in sorted(proxies, key=lambda x: x["seq"])]
          lines.append("```\n" + "\n".join(names) + "\n```" if names else "_none_")

          report = "\n".join(lines)
          print(report)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(report + "\n")

          if missing:
              print(f"::warning title=Proxy Pool::{len(missing)} proxy number(s) missing: {ranges(missing)}")
          print(f"::notice title=Proxy Pool::{total}/{POOL_TOTAL} generated ({pct:.1f}%)")


  remote_session:
    name: ${{ matrix.display_name }}
    # Waits for the INITIAL pool job only. The continuous feed runs in parallel.
    # !cancelled() keeps devices running even if the pool job was skipped/failed (API-key fallback).
    needs: [prepare_matrix, proxy_pool_initial]
    if: ${{ !cancelled() && needs.prepare_matrix.result == 'success' && needs.prepare_matrix.outputs.has_tasks == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.num_devices) }}
      matrix: ${{ fromJson(needs.prepare_matrix.outputs.matrix) }}

    steps:
      - name: Device Spawn Delay (Batch Intermission)
        shell: python
        env:
          DELAY_SECONDS: ${{ matrix.delay_seconds }}
          BATCH_IDX: ${{ matrix.batch_idx }}
          ABSOLUTE_IDX: ${{ matrix.absolute_idx }}
        run: |
          import os, time

          try:
              delay = int(os.environ.get("DELAY_SECONDS", "0"))
          except Exception:
              delay = 0

          batch = os.environ.get("BATCH_IDX", "0")
          idx = os.environ.get("ABSOLUTE_IDX", "1")

          if delay > 0:
              print(f"--- BATCH {batch} INTERMISSION ACTIVE ---")
              print(f"Device {idx} belongs to Batch {batch}.")
              print(f"Applying uniform batch spawn delay: Sleeping for {delay} seconds to stagger execution...")
              time.sleep(delay)
              print("Intermission delay complete. Proceeding with payload tasks.")
          else:
              print(f"Device {idx} (Batch {batch}) requires no spawn delay. Executing immediately.")

      - name: Acquire Proxy From Pool (wait for batch, API key only as last resort)
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          POOL_ENABLED: ${{ needs.proxy_pool_initial.result != 'skipped' && 'true' || 'false' }}
          TASK_INDEX: ${{ matrix.task_index }}
          TASKS_TOTAL: ${{ needs.prepare_matrix.outputs.tasks_total }}
          POOL_TOTAL: ${{ needs.prepare_matrix.outputs.pool_total }}
          INITIAL_TARGET: ${{ needs.prepare_matrix.outputs.initial_target }}
          CHUNK_SIZE: ${{ needs.prepare_matrix.outputs.chunk_size }}
          POOL_WAIT_MINUTES: '12'
        run: |
          import os, sys, json, time, io, zipfile, subprocess
          import urllib.request, urllib.error


          def say(m=""):
              print(m, flush=True)


          def geti(k, d=0):
              try:
                  return int(os.environ.get(k, str(d)))
              except Exception:
                  return d


          TASK = geti("TASK_INDEX", 1)
          TASKS_TOTAL = geti("TASKS_TOTAL")
          POOL_TOTAL = geti("POOL_TOTAL")
          INITIAL = max(1, geti("INITIAL_TARGET", 1))
          CHUNK_SIZE = max(1, geti("CHUNK_SIZE", 10))
          WAIT_MIN = geti("POOL_WAIT_MINUTES", 12)
          POOL_ENABLED = os.environ.get("POOL_ENABLED", "false").lower() == "true"
          TEMP = os.environ.get("RUNNER_TEMP", ".")
          OUT = os.path.join(TEMP, "pool_proxy.json")
          GH_ENV = os.environ.get("GITHUB_ENV")
          TOKEN = os.environ.get("GH_TOKEN", "")
          REPO = os.environ.get("REPO", "")
          RUN_ID = os.environ.get("RUN_ID", "")
          API = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
          HDR = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "proxy-pool-client",
          }


          def set_env(k, v):
              if GH_ENV:
                  with open(GH_ENV, "a", encoding="utf-8") as f:
                      f.write(f"{k}={v}\n")


          def finish_none(reason):
              say(f"[Pool] RESULT: no pool proxy for device #{TASK} ({reason})")
              say("[Pool] -> Device will FALL BACK to API-key proxy generation (last resort).")
              set_env("POOL_PROXY_SOURCE", "none")
              sys.exit(0)


          say("=" * 72)
          say(f" DEVICE #{TASK}: ACQUIRE PROXY FROM POOL")
          say("=" * 72)
          say(f"[Pool] Needs proxy number      : #{TASK}  (pool = tasks {TASKS_TOTAL} + spares {max(0, POOL_TOTAL - TASKS_TOTAL)} = {POOL_TOTAL})")

          if not POOL_ENABLED:
              say("[Pool] Pool is disabled or was skipped (use_without_proxy / generate_all_proxies off).")
              set_env("POOL_PROXY_SOURCE", "none")
              sys.exit(0)

          if os.path.isfile(OUT):
              os.remove(OUT)


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *a, **k):
                  return None


          def gh_json(url):
              last = None
              for i in range(3):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=HDR), timeout=30) as r:
                          return json.loads(r.read())
                  except urllib.error.HTTPError as e:
                      last = e
                      if e.code in (500, 502, 503, 504) and i < 2:
                          time.sleep(2)
                          continue
                      raise
                  except Exception as e:
                      last = e
                      time.sleep(2)
              raise last


          def list_artifacts(name=None):
              url = f"{API}/repos/{REPO}/actions/runs/{RUN_ID}/artifacts?per_page=100"
              if name:
                  url += f"&name={name}"
              return [a for a in gh_json(url).get("artifacts", []) if not a.get("expired")]


          def download_zip(art_id):
              url = f"{API}/repos/{REPO}/actions/artifacts/{art_id}/zip"
              opener = urllib.request.build_opener(NoRedirect)
              try:
                  with opener.open(urllib.request.Request(url, headers=HDR), timeout=30) as r:
                      return r.read()
              except urllib.error.HTTPError as e:
                  if e.code in (301, 302, 303, 307, 308):
                      loc = e.headers.get("Location")
                      with urllib.request.urlopen(urllib.request.Request(loc, headers={"User-Agent": "proxy-pool-client"}), timeout=60) as r2:
                          return r2.read()
                  raise


          def chunk_job_state(c):
              """Returns 'finished', 'running' or 'unknown' for the generator job of chunk c."""
              prefix = f"Proxy Pool Chunk {c} "
              for page in range(1, 11):
                  data = gh_json(f"{API}/repos/{REPO}/actions/runs/{RUN_ID}/jobs?per_page=100&page={page}&filter=latest")
                  jobs = data.get("jobs", [])
                  for j in jobs:
                      if (j.get("name") or "").startswith(prefix):
                          return "finished" if j.get("status") == "completed" else "running"
                  if len(jobs) < 100:
                      break
              return "unknown"


          def chunk_for(seq):
              if seq <= INITIAL:
                  return 0
              return 1 + (seq - INITIAL - 1) // CHUNK_SIZE


          _cache = {}


          def get_chunk(c, deadline):
              if c in _cache:
                  return _cache[c]
              name = f"proxy-chunk-{c:03d}"
              last_status = 0.0
              last_job = 0.0
              finished_seen = False
              waited_from = time.time()
              while True:
                  arts = list_artifacts(name)
                  if arts:
                      blob = download_zip(arts[0]["id"])
                      with zipfile.ZipFile(io.BytesIO(blob)) as z:
                          fn = [n for n in z.namelist() if n.endswith(".json")][0]
                          data = json.loads(z.read(fn))
                      _cache[c] = data
                      say(f"[Pool] Chunk {c} loaded ({data.get('generated')}/{data.get('requested')} proxies, range #{data.get('start_seq')}-#{data.get('end_seq')})")
                      return data
                  if c == 0:
                      say("[Pool] Chunk 0 artifact missing although the initial pool job already finished.")
                      return None
                  if finished_seen:
                      say(f"[Pool] Chunk {c} generator job finished but produced no artifact.")
                      return None
                  now = time.time()
                  if now - last_job >= 45:
                      last_job = now
                      try:
                          st = chunk_job_state(c)
                      except Exception as e:
                          st = "unknown"
                          say(f"[Pool] (job state check failed: {type(e).__name__})")
                      if st == "finished":
                          finished_seen = True
                          time.sleep(5)
                          continue
                  if now >= deadline:
                      say(f"[Pool] Gave up waiting for chunk {c} after {int(now - waited_from)}s.")
                      return None
                  if now - last_status >= 60 or last_status == 0:
                      last_status = now
                      say(f"[Pool] Waiting for chunk {c} (proxy batch still generating)... {int(now - waited_from)}s elapsed, limit {WAIT_MIN} min")
                  time.sleep(15)


          def quick_check(p):
              try:
                  import requests, urllib3
              except ImportError:
                  subprocess.check_call([sys.executable, "-m", "pip", "install", "requests", "urllib3", "--quiet"])
                  import requests, urllib3
              urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
              auth = f"{p['username']}:{p['password']}@" if p.get("username") else ""
              url = f"http://{auth}{p['host']}:{p['port']}"
              cfg = {"http": url, "https": url}
              for attempt in range(2):
                  for ep in ("http://ip-api.com/json/", "https://ipinfo.io/json"):
                      try:
                          r = requests.get(ep, proxies=cfg, timeout=15, verify=False)
                          if r.status_code == 200 and ("ip" in r.json() or "query" in r.json()):
                              return True
                      except Exception:
                          pass
                  time.sleep(2)
              return False


          def find_seq(data, seq):
              if not data:
                  return None
              for p in data.get("proxies", []):
                  if p.get("seq") == seq:
                      return p
              return None


          try:
              visible = sorted(a["name"] for a in list_artifacts() if a["name"].startswith("proxy-chunk-"))
              say(f"[Pool] Chunks visible right now : {len(visible)} -> {', '.join(visible) if visible else 'none'}")

              deadline = time.time() + WAIT_MIN * 60
              c = chunk_for(TASK)
              say(f"[Pool] Proxy #{TASK} lives in chunk {c} (artifact proxy-chunk-{c:03d})")
              chosen, origin = None, ""

              p = find_seq(get_chunk(c, deadline), TASK)
              if p:
                  say(f"[Pool] Found proxy #{TASK} '{p['name']}' -> IP {p['ip']} ({p['country_code']}). Health-checking...")
                  if quick_check(p):
                      chosen, origin = p, "primary"
                  else:
                      say(f"[Pool] Proxy #{TASK} failed the device-side health check.")
              else:
                  say(f"[Pool] Proxy #{TASK} is not present in chunk {c}.")

              if not chosen:
                  extra = POOL_TOTAL - TASKS_TOTAL
                  if extra > 0:
                      say(f"[Pool] Trying spare proxies (#{TASKS_TOTAL + 1}-#{POOL_TOTAL}) before touching the API key...")
                      for attempt in range(3):
                          sp = TASKS_TOTAL + 1 + ((TASK * 7 + attempt * 13) % extra)
                          sc = chunk_for(sp)
                          try:
                              cand = find_seq(get_chunk(sc, time.time()), sp)
                          except Exception as e:
                              cand = None
                              say(f"[Pool] spare lookup error: {type(e).__name__}")
                          if cand and quick_check(cand):
                              chosen, origin = cand, f"spare #{sp}"
                              break
                          say(f"[Pool] Spare #{sp} unavailable.")

              if not chosen:
                  finish_none("proxy missing/unhealthy and no spare available")

              if len(chosen.get("password", "")) >= 8:
                  print(f"::add-mask::{chosen['password']}", flush=True)
              chosen["assigned_origin"] = origin
              with open(OUT, "w", encoding="utf-8") as f:
                  json.dump(chosen, f)
              set_env("POOL_PROXY_SOURCE", "pool")
              set_env("POOL_PROXY_NAME", chosen["name"])
              say("")
              say(f"[Pool] RESULT: device #{TASK} uses POOL proxy #{chosen['seq']} ({origin})")
              say(f"[Pool]   dashboard name : {chosen['name']}   (app.gologin.com/proxy)")
              say(f"[Pool]   exit IP        : {chosen['ip']} | {chosen['country_code']} {chosen.get('city', '')}")
              say(f"[Pool]   provider       : {chosen['source']}")
              say("[Pool] API-key generation will NOT be used for this device.")
          except SystemExit:
              raise
          except Exception as e:
              say(f"::warning title=Pool fetch::{type(e).__name__}: {e}")
              finish_none(f"pool lookup error {type(e).__name__}")


      - name: Runner Proxy & Identity Provisioning
        shell: python
        env:
          API_KEY_INPUT: ${{ inputs.scrapeops_api_key }}
          WITHOUT_PROXY: ${{ inputs.use_without_proxy }}
          COUNTRY: ${{ inputs.proxy_country }}
          FALLBACK_COUNTRY: ${{ inputs.fallback_country }}
          MOBILE: ${{ inputs.mobile_proxies }}
          STICKY: ${{ inputs.sticky_sessions }}
          TASK_INDEX: ${{ matrix.task_index }}
          ABSOLUTE_IDX: ${{ matrix.absolute_idx }}
          NUM_INSTALLS: ${{ inputs.num_installs }}
          NUM_CLICKS: ${{ inputs.num_clicks }}
          NUM_SURFS: ${{ inputs.num_surfs }}
          SHORT_OS: ${{ matrix.short_os_tag }}
          SHORT_SW: ${{ matrix.short_sw_tag }}
          ACTION: ${{ matrix.action_mode }}
          PROFILE_TAG: ${{ matrix.profile_tag }}
          PREASSIGNED: ${{ matrix.preassigned_proxy }}
          PRE_PROXY_SERVER: ${{ matrix.proxy_server }}
          PRE_PROXY_USER: ${{ matrix.proxy_user }}
          PRE_PROXY_PASS: ${{ matrix.proxy_pass }}
          PRE_PROXY_TYPE: ${{ matrix.proxy_type }}
          PRE_PROXY_CC: ${{ matrix.proxy_country_code }}
          PRE_PROXY_CITY: ${{ matrix.proxy_city }}
          PRE_PROXY_REGION: ${{ matrix.proxy_region }}
          PRE_PROXY_IP: ${{ matrix.proxy_real_ip }}
          PRE_TZ_WIN: ${{ matrix.timezone_windows }}
          PRE_TZ_IANA: ${{ matrix.timezone_iana }}
          PRE_LOCALE: ${{ matrix.windows_locale }}
          PRE_KB: ${{ matrix.windows_keyboard }}
        run: |
          import os, time, sys, uuid, json, re, random

          try:
              import requests
              import urllib3
          except ImportError:
              import subprocess
              subprocess.check_call([sys.executable, "-m", "pip", "install", "requests", "urllib3", "--quiet"])
              import requests
              import urllib3

          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          # ------------------------------------------------------------------
          # 1) Use the proxy claimed from the pool by the previous step.
          # 2) Otherwise (no proxy from pool) fall back to API-key generation below.
          # ------------------------------------------------------------------
          active_proxy = None
          use_proxy = False
          absolute_idx = int(os.environ.get("ABSOLUTE_IDX", "1"))

          pool_file = os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "pool_proxy.json")
          if os.path.isfile(pool_file):
              try:
                  with open(pool_file, "r", encoding="utf-8") as fh:
                      p = json.load(fh)
                  active_proxy = {
                      'server': (p.get("server_with_proto") or p.get("server") or "").replace("http://", "").replace("https://", ""),
                      'server_with_proto': p.get("server_with_proto") or p.get("server") or "",
                      'username': p.get("username") or "",
                      'password': p.get("password") or "",
                      'proxy_type_label': p.get("proxy_type_label") or "pool",
                      'country_code': (p.get("country_code") or "US").upper(),
                      'city': p.get("city") or "",
                      'region': p.get("region") or "",
                      'ip': p.get("ip") or "unknown",
                      'timezone_windows': p.get("timezone_windows") or "UTC",
                      'timezone_iana': p.get("timezone_iana") or "UTC",
                      'windows_locale': p.get("windows_locale") or "en-US",
                      'windows_keyboard': p.get("windows_keyboard") or "0409:00000409",
                      'working': True
                  }
                  use_proxy = True
                  print("========== USING PROXY FROM POOL (no API-key generation) ==========")
                  print(f"Pool proxy #{p.get('seq')} '{p.get('name')}' ({p.get('assigned_origin')}) -> IP {active_proxy['ip']} ({active_proxy['country_code']}) | provider: {active_proxy['proxy_type_label']}")
              except Exception as e:
                  print(f"[ProxyPool] Could not read pool proxy file ({e}). Falling back to API key generation.")
                  active_proxy = None
          else:
              print("[ProxyPool] No pool proxy file present for this device.")

          preassigned = os.environ.get("PREASSIGNED", "false").lower() == "true"
          if active_proxy is not None:
              print("[ProxyPool] Pool proxy in use -> skipping on-demand API key generation.")
          elif preassigned and os.environ.get("PRE_PROXY_SERVER"):
              print("========== USING PRE-ASSIGNED BATCH PROXY (from matrix) ==========")
              active_proxy = {
                  'server': os.environ.get("PRE_PROXY_SERVER", "").replace("http://", "").replace("https://", ""),
                  'server_with_proto': os.environ.get("PRE_PROXY_SERVER", ""),
                  'username': os.environ.get("PRE_PROXY_USER", ""),
                  'password': os.environ.get("PRE_PROXY_PASS", ""),
                  'proxy_type_label': os.environ.get("PRE_PROXY_TYPE", "batch"),
                  'country_code': os.environ.get("PRE_PROXY_CC", "US"),
                  'city': os.environ.get("PRE_PROXY_CITY", ""),
                  'region': os.environ.get("PRE_PROXY_REGION", ""),
                  'ip': os.environ.get("PRE_PROXY_IP", "unknown"),
                  'timezone_windows': os.environ.get("PRE_TZ_WIN", "UTC"),
                  'timezone_iana': os.environ.get("PRE_TZ_IANA", "UTC"),
                  'windows_locale': os.environ.get("PRE_LOCALE", "en-US"),
                  'windows_keyboard': os.environ.get("PRE_KB", "0409:00000409"),
                  'working': True
              }
              use_proxy = True
              print(f"Pre-assigned: {active_proxy['proxy_type_label']} -> IP {active_proxy['ip']} ({active_proxy['country_code']})")
          else:
              proxy_input = os.environ.get("API_KEY_INPUT", "").strip()
              without_proxy = os.environ.get("WITHOUT_PROXY", "false").lower() == "true"
              country_input = os.environ.get("COUNTRY", "USA")
              fallback_country_input = os.environ.get("FALLBACK_COUNTRY", "No Fallback")
              mobile = os.environ.get("MOBILE", "false").lower() == "true"
              sticky = os.environ.get("STICKY", "false").lower() == "true"
              absolute_idx = int(os.environ.get("ABSOLUTE_IDX", "1")) - 1
              task_index = int(os.environ.get("TASK_INDEX", "1"))

              try:
                  num_installs = int(os.environ.get("NUM_INSTALLS", "0"))
              except ValueError:
                  num_installs = 0

              try:
                  num_clicks = int(os.environ.get("NUM_CLICKS", "0"))
              except ValueError:
                  num_clicks = 0

              try:
                  num_surfs = int(os.environ.get("NUM_SURFS", "0"))
              except ValueError:
                  num_surfs = 0

              tasks_total = num_installs + num_clicks + num_surfs
              short_os = os.environ.get("SHORT_OS", "OS")
              short_sw = os.environ.get("SHORT_SW", "SW")
              action_cap = os.environ.get("ACTION", "task").capitalize()
              profile_tag = os.environ.get("PROFILE_TAG", "").strip()

              country_map = {
                  "USA": "us", "UK": "gb", "Canada": "ca", "Australia": "au", "Germany": "de", "France": "fr",
                  "Brazil": "br", "Mexico": "mx", "Spain": "es", "Vietnam": "vn", "Switzerland": "ch",
                  "Indonesia": "id", "Italy": "it", "Netherlands": "nl", "Poland": "pl"
              }
              cc_input = country_map.get(country_input, "us")

              def country_code_to_locale(cc):
                  _map = {"US": "en-US", "GB": "en-GB", "CA": "en-CA", "AU": "en-AU", "DE": "de-DE",
                          "FR": "fr-FR", "BR": "pt-BR", "MX": "es-MX", "ES": "es-ES", "VN": "vi-VN",
                          "CH": "de-CH", "ID": "id-ID", "IT": "it-IT", "NL": "nl-NL", "PL": "pl-PL"}
                  return _map.get(cc.upper(), "en-US")

              def country_code_to_keyboard(cc):
                  _map = {"US": "0409:00000409", "GB": "0809:00000809", "CA": "1009:00000409",
                          "AU": "0C09:00000409", "DE": "0407:00000407", "FR": "040C:0000040C",
                          "BR": "0416:00000416", "MX": "080A:0000080A", "ES": "0C0A:0000080A",
                          "VN": "042A:0000042A", "CH": "0807:00000807", "ID": "0421:00000409",
                          "IT": "0410:00000410", "NL": "0413:00020409", "PL": "0415:00000415"}
                  return _map.get(cc.upper(), "0409:00000409")

              def tz_to_windows_tz(iana_tz):
                  _map = {"America/New_York": "Eastern Standard Time", "America/Chicago": "Central Standard Time",
                          "America/Denver": "Mountain Standard Time", "America/Phoenix": "US Mountain Standard Time",
                          "America/Los_Angeles": "Pacific Standard Time", "America/Toronto": "Eastern Standard Time",
                          "America/Sao_Paulo": "E. South America Standard Time",
                          "America/Mexico_City": "Central Standard Time (Mexico)",
                          "Europe/London": "GMT Standard Time", "Europe/Paris": "Romance Standard Time",
                          "Europe/Berlin": "W. Europe Standard Time", "Europe/Madrid": "Romance Standard Time",
                          "Europe/Rome": "W. Europe Standard Time", "Europe/Amsterdam": "W. Europe Standard Time",
                          "Europe/Warsaw": "Central European Standard Time",
                          "Asia/Ho_Chi_Minh": "SE Asia Standard Time", "Europe/Zurich": "W. Europe Standard Time",
                          "Asia/Jakarta": "SE Asia Standard Time", "Australia/Sydney": "AUS Eastern Standard Time"}
                  return _map.get(iana_tz, "UTC")

              def build_success_dict(pinfo, proto, cc, cname, ip, city, region, tz):
                  return {
                      **pinfo,
                      'working': True,
                      'working_protocol': proto,
                      'server_with_proto': f"http://{pinfo['host']}:{pinfo['port']}",
                      'country_code': cc,
                      'country_name': cname,
                      'ip': ip,
                      'city': city,
                      'region': region,
                      'timezone_iana': tz,
                      'timezone_windows': tz_to_windows_tz(tz),
                      'windows_locale': country_code_to_locale(cc),
                      'windows_keyboard': country_code_to_keyboard(cc)
                  }

              def validate_proxy(pinfo):
                  protocols_to_test = ['http', 'socks5']
                  endpoints = [
                      ("http://ip-api.com/json/", "ip-api.com"),
                      ("https://ipinfo.io/json", "ipinfo.io"),
                      ("http://ipwho.is/", "ipwho.is"),
                      ("https://api.myip.com", "myip.com")
                  ]

                  for proto in protocols_to_test:
                      auth_str = f"{pinfo['username']}:{pinfo['password']}@" if pinfo.get('username') else ""
                      test_url = f"{proto}://{auth_str}{pinfo['host']}:{pinfo['port']}"
                      proxies_cfg = {"http": test_url, "https": test_url}
                      print(f"      -> Ping testing via {proto.upper()}: {pinfo['host']}:{pinfo['port']}")

                      for url, name in endpoints:
                          try:
                              resp = requests.get(url, proxies=proxies_cfg, timeout=15, verify=False)
                              if resp.status_code == 200:
                                  data = resp.json()
                                  cc = tz = city = region = ""
                                  ip = "unknown"

                                  if name == "ip-api.com" and data.get('status') == 'success':
                                      cc = data.get('countryCode')
                                      tz = data.get('timezone')
                                      ip = data.get('query')
                                      city = data.get('city')
                                      region = data.get('regionName')
                                  elif name == "ipinfo.io" and "ip" in data:
                                      cc = data.get('country')
                                      tz = data.get('timezone')
                                      ip = data.get('ip')
                                      city = data.get('city')
                                      region = data.get('region')
                                  elif name == "ipwho.is" and data.get('success'):
                                      cc = data.get('country_code')
                                      tz = data.get('timezone', {}).get('id')
                                      ip = data.get('ip')
                                      city = data.get('city')
                                      region = data.get('region')
                                  elif name == "myip.com" and "ip" in data:
                                      cc = data.get('cc')
                                      ip = data.get('ip')

                                  if ip and ip != "unknown":
                                      print(f"      -> SUCCESS: Pinged {name} via {proto.upper()}")
                                      return build_success_dict(pinfo, proto, cc or 'US', cc or 'US', ip, city or '', region or '', tz or 'UTC')
                          except Exception as e:
                              print(f"         - {name} failed: {type(e).__name__}")

                  return {'working': False, **pinfo}

              def parse_generic_proxy(proxy_str):
                  original = proxy_str.strip()
                  if not original: return None
                  protocol = 'http'
                  rest = original
                  if '://' in rest:
                      protocol, rest = rest.split('://', 1)
                      if protocol.lower() == 'geolocation':
                          protocol = 'http'

                  rest = re.sub(r':(\d+):[A-Za-z].*$', r':\1', rest)

                  match_up_hp = re.search(r'([^:@\s]+):([^:@\s]+)@([^:@\s]+):(\d+)', rest)
                  if match_up_hp:
                      user, pwd, host, port = match_up_hp.groups()
                      return {'original': original, 'protocol': protocol, 'username': user, 'password': pwd,
                              'host': host, 'port': int(port), 'server': f"{host}:{port}",
                              'country_name': None, 'country_code': None,
                              'url': f"{protocol}://{user}:{pwd}@{host}:{port}"}

                  match_hp_up = re.search(r'^([^:@\s]+):(\d+):([^:@\s]+):([^:@\s]+)', rest)
                  if match_hp_up:
                      host, port, user, pwd = match_hp_up.groups()
                      return {'original': original, 'protocol': protocol, 'username': user, 'password': pwd,
                              'host': host, 'port': int(port), 'server': f"{host}:{port}",
                              'country_name': None, 'country_code': None,
                              'url': f"{protocol}://{user}:{pwd}@{host}:{port}"}

                  match_up_hp2 = re.search(r'^([^:@\s]+):([^:@\s]+):([^:@\s]+):(\d+)', rest)
                  if match_up_hp2:
                      user, pwd, host, port = match_up_hp2.groups()
                      return {'original': original, 'protocol': protocol, 'username': user, 'password': pwd,
                              'host': host, 'port': int(port), 'server': f"{host}:{port}",
                              'country_name': None, 'country_code': None,
                              'url': f"{protocol}://{user}:{pwd}@{host}:{port}"}

                  match_hp = re.search(r'^([^:@\s]+):(\d+)', rest)
                  if match_hp:
                      host, port = match_hp.groups()
                      return {'original': original, 'protocol': protocol, 'username': '', 'password': '',
                              'host': host, 'port': int(port), 'server': f"{host}:{port}",
                              'country_name': None, 'country_code': None,
                              'url': f"{protocol}://{host}:{port}"}

                  return None

              bytesflow_proxies = []
              manual_proxies = []
              scrapeops_keys = []
              floppy_keys = []
              redscrape_keys = []
              gologin_keys = []

              if proxy_input and not without_proxy:
                  SCRAPEOPS_KEY_RE = re.compile(r'^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$', re.IGNORECASE)
                  FLOPPY_KEY_RE = re.compile(r'^[A-Za-z0-9_]{30,80}$')
                  REDSCRAPE_KEY_RE = re.compile(r'^[0-9a-f]{32}$', re.IGNORECASE)
                  GOLOGIN_KEY_RE = re.compile(r'^ey[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$')

                  raw_items = proxy_input.split()
                  for item in raw_items:
                      item = item.strip()
                      if not item: continue

                      if GOLOGIN_KEY_RE.match(item):
                          gologin_keys.append(item)
                      elif "bytesflows.com" in item.lower():
                          bytesflow_proxies.append(item)
                      elif REDSCRAPE_KEY_RE.match(item):
                          redscrape_keys.append(item)
                      elif SCRAPEOPS_KEY_RE.match(item):
                          scrapeops_keys.append(item)
                      elif FLOPPY_KEY_RE.match(item) and len(item) >= 30:
                          floppy_keys.append(item)
                      elif ':' in item or '@' in item or '://' in item or '.' in item:
                          if len(item) > 5:
                              manual_proxies.append(item)

              active_proxy = None
              use_proxy = False
              MAX_ATTEMPTS = 20

              if not without_proxy:
                  print("========== FALLBACK: NO PROXY FROM POOL -> GENERATING WITH API KEY ON DEVICE ==========")
              print(f"========== DEVICE PROXY INITIALIZATION ==========")
              print(f"Task Global Index: {task_index} / {tasks_total}")

              if without_proxy:
                  print("Proxy disabled manually.")

              elif gologin_keys:
                  GOLOGIN_API_BASE = "https://api.gologin.com"
                  for attempt in range(MAX_ATTEMPTS):
                      current_expected_cc = cc_input.upper()
                      if attempt >= 7 and fallback_country_input != "No Fallback":
                          fallback_cc = country_map.get(fallback_country_input, "us").upper()
                          if current_expected_cc != fallback_cc:
                              current_expected_cc = fallback_cc
                              print(f"      -> Fallback: Switching to selected fallback country {current_expected_cc}...")

                      key_idx = (absolute_idx // 15 + attempt) % len(gologin_keys)
                      current_key = gologin_keys[key_idx]
                      print(f"[GoLogin] Generating Residential Proxy using API Key ending in ...{current_key[-8:]} (Attempt {attempt+1}/{MAX_ATTEMPTS})")

                      headers = {
                          "Authorization": f"Bearer {current_key}",
                          "Content-Type": "application/json"
                      }
                      payload = {
                          "countryCode": current_expected_cc.lower(),
                          "isMobile": mobile,
                          "isDC": False,
                          "customName": f"{task_index}-{current_expected_cc}-{''.join(random.choices('abcdefghijklmnopqrstuvwxyz', k=6))}"
                      }

                      try:
                          resp = requests.post(f"{GOLOGIN_API_BASE}/users-proxies/mobile-proxy",
                                               headers=headers, json=payload, timeout=15, verify=False)
                          if resp.status_code in [200, 201]:
                              data = resp.json()
                              host = data.get("host") or data.get("ip") or data.get("server") or "proxy.gologin.com"
                              port = data.get("port") or data.get("httpPort") or 8080
                              username = data.get("username") or data.get("user") or data.get("login") or ""
                              password = data.get("password") or data.get("pass") or ""

                              pinfo = {
                                  'username': username, 'password': password,
                                  'host': host, 'port': int(port), 'server': f"{host}:{port}",
                                  'url': f"http://{username}:{password}@{host}:{port}" if username else f"http://{host}:{port}"
                              }

                              res = validate_proxy(pinfo)
                              if res['working']:
                                  actual_cc = (res.get('country_code') or '').upper()
                                  if actual_cc == current_expected_cc or fallback_country_input == "No Fallback":
                                      active_proxy = res
                                      active_proxy['proxy_type_label'] = 'gologin'
                                      use_proxy = True
                                      print(f"SUCCESS: GoLogin PRIMARY residential proxy active [{res['working_protocol'].upper()}] -> IP: {res['ip']} | CC: {actual_cc}")
                                      break
                                  else:
                                      print(f"      -> WARNING: GoLogin IP Country '{actual_cc}' != expected '{current_expected_cc}'. Retrying...")
                                      time.sleep(2)
                              else:
                                  if attempt < MAX_ATTEMPTS - 1:
                                      time.sleep(2)
                                  else:
                                      print("FATAL: Failed to validate GoLogin residential proxy after attempts. Aborting script.")
                                      sys.exit(1)
                          else:
                              print(f"      -> GoLogin API request failed with status {resp.status_code}: {resp.text}")
                              time.sleep(2)
                      except Exception as e:
                          print(f"      -> GoLogin API error: {e}")
                          if attempt < MAX_ATTEMPTS - 1:
                              time.sleep(2)
                          else:
                              print("FATAL: Failed to connect to GoLogin API after attempts. Aborting script.")
                              sys.exit(1)

              elif bytesflow_proxies:
                  print(f"[BytesFlow] Parsing provided proxy and dynamically assigning parameters...")
                  for attempt in range(MAX_ATTEMPTS):
                      print(f"Testing BytesFlow Proxy Rotation (Attempt {attempt+1}/{MAX_ATTEMPTS})...")

                      raw_p = bytesflow_proxies[attempt % len(bytesflow_proxies)]
                      pinfo_temp = parse_generic_proxy(raw_p)

                      if pinfo_temp and pinfo_temp['username']:
                          usr = pinfo_temp['username']
                          pwd = pinfo_temp['password']
                          hst = pinfo_temp['host']
                          prt = pinfo_temp['port']

                          bmatch = re.search(r"^(?:u-)?([A-Za-z0-9]+)", usr)
                          base_user = bmatch.group(1) if bmatch else usr.split("-")[0]

                          current_expected_cc = cc_input.upper()
                          if attempt >= 7 and fallback_country_input != "No Fallback":
                              fallback_cc = country_map.get(fallback_country_input, "us").upper()
                              if current_expected_cc != fallback_cc:
                                  current_expected_cc = fallback_cc
                                  print(f"      -> Fallback: Using selected alternative country {current_expected_cc}...")

                          params = [f"u-{base_user}", f"loc-{current_expected_cc}", "t-10",
                                    f"s-{str(uuid.uuid4().hex)[:8]}"]
                          new_user = "-".join(params)

                          pinfo = {
                              'username': new_user, 'password': pwd, 'host': hst, 'port': int(prt),
                              'server': f"{hst}:{prt}", 'url': f"http://{new_user}:{pwd}@{hst}:{prt}"
                          }

                          res = validate_proxy(pinfo)
                          if res['working']:
                              actual_cc = (res.get('country_code') or '').upper()
                              if actual_cc == current_expected_cc:
                                  active_proxy = res
                                  active_proxy['proxy_type_label'] = 'bytesflow'
                                  use_proxy = True
                                  print(f"SUCCESS: BytesFlow PRIMARY proxy active [{res['working_protocol'].upper()}] -> IP: {res['ip']} | CC: {actual_cc}")
                                  break
                              else:
                                  print(f"      -> WARNING: IP Country '{actual_cc}' does NOT match requested '{current_expected_cc}'. Generating a new session...")
                                  if attempt < MAX_ATTEMPTS - 1:
                                      time.sleep(2)
                                  else:
                                      print("FATAL: Failed to find matching country proxy after all attempts. Aborting.")
                                      sys.exit(1)
                          else:
                              if attempt < MAX_ATTEMPTS - 1:
                                  print("      -> Proxy failed to ping. Waiting 2 seconds before generating a new session...")
                                  time.sleep(2)
                              else:
                                  print("FATAL: Failed to find working BytesFlow proxy after all attempts. Aborting script.")
                                  sys.exit(1)
                      else:
                          print("FATAL: Could not cleanly parse the BytesFlow provided format. Aborting script.")
                          sys.exit(1)

              elif redscrape_keys:
                  REDSCRAPE_API_BASE = "https://api.redscrape.com"
                  REDSCRAPE_FALLBACK_BASE = "https://redscrape.com/api"

                  key_idx = (absolute_idx // 15) % len(redscrape_keys)
                  current_key = redscrape_keys[key_idx]

                  print(f"[Redscrape] Using API Key: ...{current_key[-8:]}")

                  proxy_password = None
                  proxy_host = "dc0f.redscrape.com"
                  proxy_port = 7777

                  headers = {
                      "Authorization": f"Bearer {current_key}",
                      "X-API-Key": current_key,
                      "Content-Type": "application/json"
                  }

                  creds_endpoints = [
                      f"{REDSCRAPE_API_BASE}/v1/credentials",
                      f"{REDSCRAPE_API_BASE}/v1/account",
                      f"{REDSCRAPE_API_BASE}/credentials",
                      f"{REDSCRAPE_API_BASE}/api/v1/credentials",
                      f"{REDSCRAPE_FALLBACK_BASE}/v1/credentials",
                      f"{REDSCRAPE_FALLBACK_BASE}/credentials",
                  ]

                  print(f"[Redscrape] Attempting to retrieve credentials from API...")
                  for endpoint in creds_endpoints:
                      if proxy_password:
                          break
                      for auth_method in ["header", "query"]:
                          try:
                              if auth_method == "header":
                                  resp = requests.get(endpoint, headers=headers, timeout=12, verify=False)
                              else:
                                  resp = requests.get(endpoint, params={"api_key": current_key}, timeout=12, verify=False)

                              if resp.status_code == 200:
                                  data = resp.json()
                                  proxy_password = (data.get("password") or data.get("proxy_password") or
                                                    data.get("pass") or data.get("proxy_pass"))
                                  proxy_host = (data.get("host") or data.get("proxy_host") or
                                                data.get("endpoint") or data.get("server") or proxy_host)
                                  proxy_port = (data.get("port") or data.get("proxy_port") or proxy_port)
                                  if proxy_password:
                                      print(f"      -> Credentials retrieved from API: host={proxy_host}, port={proxy_port}")
                                      break
                          except Exception:
                              continue

                  if not proxy_password:
                      print(f"[Redscrape] Credentials API unavailable. Trying proxy generation endpoints...")
                      gen_endpoints = [
                          (f"{REDSCRAPE_API_BASE}/v1/proxies/generate", "GET"),
                          (f"{REDSCRAPE_API_BASE}/v1/proxies", "GET"),
                          (f"{REDSCRAPE_API_BASE}/v1/proxies", "POST"),
                          (f"{REDSCRAPE_API_BASE}/proxies", "GET"),
                          (f"{REDSCRAPE_API_BASE}/api/v1/proxies", "GET"),
                          (f"{REDSCRAPE_FALLBACK_BASE}/v1/proxies/generate", "GET"),
                          (f"{REDSCRAPE_FALLBACK_BASE}/v1/proxies", "GET"),
                          (f"{REDSCRAPE_FALLBACK_BASE}/proxies", "GET"),
                          (f"https://redscrape.com/api/v1/proxies/generate", "GET"),
                          (f"https://redscrape.com/api/proxies", "GET"),
                      ]

                      for endpoint, method in gen_endpoints:
                          if proxy_password:
                              break
                          for auth_method in ["header", "query"]:
                              try:
                                  params = {
                                      "country": cc_input.lower(), "count": "1",
                                      "protocol": "http", "format": "json",
                                  }
                                  if sticky:
                                      params["session"] = "true"
                                      params["session_id"] = str(random.randint(10000000, 99999999))
                                      params["session_duration"] = "300"
                                  if mobile:
                                      params["mobile"] = "true"

                                  if auth_method == "header":
                                      if method == "POST":
                                          resp = requests.post(endpoint, headers=headers, json=params, timeout=12, verify=False)
                                      else:
                                          resp = requests.get(endpoint, headers=headers, params=params, timeout=12, verify=False)
                                  else:
                                      params["api_key"] = current_key
                                      if method == "POST":
                                          resp = requests.post(endpoint, params=params, timeout=12, verify=False)
                                      else:
                                          resp = requests.get(endpoint, params=params, timeout=12, verify=False)

                                  if resp.status_code == 200:
                                      data = resp.json()
                                      proxies = (data.get("proxies") or data.get("data") or
                                                 data.get("proxy") or data.get("list") or [])
                                      if isinstance(proxies, str):
                                          proxies = [proxies]
                                      if proxies and len(proxies) > 0:
                                          p = proxies[0]
                                          if isinstance(p, str):
                                              pinfo_temp = parse_generic_proxy(p)
                                              if pinfo_temp:
                                                  proxy_password = pinfo_temp.get('password')
                                                  proxy_host = pinfo_temp.get('host', proxy_host)
                                                  proxy_port = pinfo_temp.get('port', proxy_port)
                                          elif isinstance(p, dict):
                                              proxy_password = (p.get('password') or p.get('pass'))
                                              proxy_host = (p.get('host') or p.get('endpoint') or proxy_host)
                                              proxy_port = (p.get('port') or proxy_port)
                                      if proxy_password:
                                          print(f"      -> Proxy generated via API: host={proxy_host}, port={proxy_port}")
                                          break
                              except Exception:
                                  continue

                  if not proxy_password:
                      print(f"[Redscrape] API unavailable. Checking for existing redscrape proxy strings in input...")
                      for mp in manual_proxies:
                          if "redscrape.com" in mp.lower():
                              mp_info = parse_generic_proxy(mp)
                              if mp_info and mp_info.get('password'):
                                  proxy_password = mp_info['password']
                                  proxy_host = mp_info.get('host', proxy_host)
                                  proxy_port = mp_info.get('port', proxy_port)
                                  print(f"      -> Extracted credentials from existing proxy string.")
                                  break

                  if not proxy_password:
                      print(f"[Redscrape] WARNING: Could not retrieve credentials. Using API key as last resort...")
                      proxy_password = current_key

                  print(f"[Redscrape] Credentials resolved. Host={proxy_host}, Port={proxy_port}")

                  for attempt in range(MAX_ATTEMPTS):
                      current_expected_cc = cc_input.upper()
                      if attempt >= 7 and fallback_country_input != "No Fallback":
                          fallback_cc = country_map.get(fallback_country_input, "us").upper()
                          if current_expected_cc != fallback_cc:
                              current_expected_cc = fallback_cc
                              print(f"      -> Fallback: Switching to selected fallback country {current_expected_cc}...")

                      print(f"[Redscrape] Generating proxy (Attempt {attempt+1}/{MAX_ATTEMPTS})...")

                      session_id = random.randint(10000000, 99999999)
                      session_duration = 300

                      if sticky:
                          username = f"session-{session_duration}-id-{session_id}-{current_expected_cc}"
                      else:
                          username = f"session-{session_duration}-{current_expected_cc}"

                      if mobile:
                          username += "-mobile"

                      pinfo = {
                          'username': username, 'password': proxy_password,
                          'host': proxy_host, 'port': int(proxy_port),
                          'server': f"{proxy_host}:{proxy_port}",
                          'url': f"http://{username}:{proxy_password}@{proxy_host}:{proxy_port}"
                      }

                      print(f"      -> Constructed proxy: {username}:***@{proxy_host}:{proxy_port}")

                      res = validate_proxy(pinfo)
                      if res['working']:
                          actual_cc = (res.get('country_code') or '').upper()
                          if actual_cc == current_expected_cc:
                              active_proxy = res
                              active_proxy['proxy_type_label'] = 'redscrape'
                              use_proxy = True
                              print(f"SUCCESS: Redscrape PRIMARY proxy active [{res['working_protocol'].upper()}] -> IP: {res['ip']} | CC: {actual_cc}")
                              break
                          else:
                              print(f"      -> WARNING: Redscrape IP Country '{actual_cc}' != expected '{current_expected_cc}'. Retrying...")
                              time.sleep(2)
                      else:
                          if attempt < MAX_ATTEMPTS - 1:
                              print(f"      -> Proxy failed to ping. Waiting 2 seconds...")
                              time.sleep(2)
                          else:
                              print("FATAL: All Redscrape attempts failed to ping. Aborting script.")
                              sys.exit(1)

              elif manual_proxies:
                  print(f"[Manual Proxy] Assigning Proxies via stride distribution (Total: {len(manual_proxies)}, Tasks: {tasks_total})...")
                  for attempt in range(MAX_ATTEMPTS):
                      current_expected_cc = cc_input.upper()
                      if attempt >= 7 and fallback_country_input != "No Fallback":
                          current_expected_cc = country_map.get(fallback_country_input, "US").upper()

                      print(f"Testing Manual Proxy (Attempt {attempt+1}/{MAX_ATTEMPTS})...")
                      idx = (absolute_idx + attempt * tasks_total) % len(manual_proxies)
                      raw_p = manual_proxies[idx]
                      pinfo = parse_generic_proxy(raw_p)

                      if not pinfo:
                          print(f"      -> Failed to parse proxy string: {raw_p}")
                          continue

                      res = validate_proxy(pinfo)
                      if res['working']:
                          actual_cc = (res.get('country_code') or '').upper()
                          if actual_cc == current_expected_cc or fallback_country_input == "No Fallback":
                              active_proxy = res
                              active_proxy['proxy_type_label'] = 'manual'
                              use_proxy = True
                              print(f"SUCCESS: Active PRIMARY manual proxy [{res['working_protocol'].upper()}] -> IP: {res['ip']} | CC: {actual_cc}")
                              break
                          else:
                              print(f"      -> WARNING: Manual proxy IP Country '{actual_cc}' != expected '{current_expected_cc}'. Trying next...")
                              time.sleep(2)
                      else:
                          if attempt < MAX_ATTEMPTS - 1:
                              time.sleep(2)
                          else:
                              print("FATAL: Failed to find working Manual proxy after attempts. Aborting script.")
                              sys.exit(1)

              elif floppy_keys:
                  FLOPPY_BASE = "https://api.floppydata.net"
                  proxy_type = "mobile" if mobile else "residential"

                  for attempt in range(MAX_ATTEMPTS):
                      current_expected_cc = cc_input.upper()
                      if attempt >= 7 and fallback_country_input != "No Fallback":
                          fallback_cc = country_map.get(fallback_country_input, "us").upper()
                          if current_expected_cc != fallback_cc:
                              current_expected_cc = fallback_cc
                              print(f"      -> Fallback: Switching to selected fallback country {current_expected_cc}...")

                      key_idx = (absolute_idx // 15 + attempt) % len(floppy_keys)
                      current_key = floppy_keys[key_idx]
                      print(f"[FloppyData] Testing API Key ending in ...{current_key[-4:]} (Attempt {attempt+1}/{MAX_ATTEMPTS})")

                      try:
                          creds_resp = requests.get(f"{FLOPPY_BASE}/v1/rotating/smartParamsCredentials",
                                                    headers={"X-Api-Key": current_key}, timeout=12)
                          if creds_resp.status_code != 200: continue
                          creds_data = creds_resp.json()

                          params = {"type": proxy_type, "country": current_expected_cc,
                                    "protocol": "http", "rotation": "0" if sticky else "-1"}
                          if sticky: params["session"] = f"t{task_index}p_{str(uuid.uuid4())[:4]}_{attempt}"

                          builder_resp = requests.get(f"{FLOPPY_BASE}/v1/rotating/smartParamsBuilder",
                                                      headers={"X-Api-Key": current_key}, params=params, timeout=12)
                          b_data = builder_resp.json()

                          user = b_data.get("username", creds_data.get("username", ""))
                          pwd  = b_data.get("password", creds_data.get("password", ""))
                          host = b_data.get("host", "geo.g-w.info")
                          port = b_data.get("port", 10080)

                          pinfo = {
                              'username': user, 'password': pwd, 'host': host, 'port': int(port),
                              'server': f"{host}:{port}", 'url': f"http://{user}:{pwd}@{host}:{port}"
                          }

                          res = validate_proxy(pinfo)
                          if res['working']:
                              actual_cc = (res.get('country_code') or '').upper()
                              if actual_cc == current_expected_cc:
                                  active_proxy = res
                                  active_proxy['proxy_type_label'] = 'floppydata'
                                  use_proxy = True
                                  print(f"SUCCESS: FloppyData PRIMARY proxy active [{res['working_protocol'].upper()}] -> IP: {res['ip']} | CC: {actual_cc}")
                                  break
                              else:
                                  print(f"      -> WARNING: FloppyData IP Country '{actual_cc}' != expected '{current_expected_cc}'. Retrying...")
                                  time.sleep(2)
                          else:
                              if attempt < MAX_ATTEMPTS - 1:
                                  time.sleep(2)
                              else:
                                  print("FATAL: Failed to find working FloppyData proxy. Aborting script.")
                                  sys.exit(1)
                      except Exception as e:
                          if attempt == MAX_ATTEMPTS - 1:
                              print("FATAL: Failed to connect to FloppyData API after attempts. Aborting script.")
                              sys.exit(1)

              elif scrapeops_keys:
                  for attempt in range(MAX_ATTEMPTS):
                      current_expected_cc = cc_input.upper()
                      api_cc_param = cc_input.lower()

                      if attempt >= 7 and fallback_country_input != "No Fallback":
                          fallback_cc = country_map.get(fallback_country_input, "us").upper()
                          if current_expected_cc != fallback_cc:
                              current_expected_cc = fallback_cc
                              api_cc_param = fallback_cc.lower()
                              print(f"      -> Fallback: Switching to selected fallback country {current_expected_cc}...")

                      key_idx = (absolute_idx // 15 + attempt) % len(scrapeops_keys)
                      current_key = scrapeops_keys[key_idx]
                      print(f"[ScrapeOps] Testing API Key ending in ...{current_key[-4:]} (Attempt {attempt+1}/{MAX_ATTEMPTS})")

                      proxy_user = f"scrapeops.country={api_cc_param}"
                      if mobile: proxy_user += ".mobile=true"

                      sess1 = f"t{task_index}p{str(uuid.uuid4())[:4]}"
                      user1 = proxy_user + (f".sticky_session={sess1}" if sticky else "")

                      pinfo = {
                          'username': user1, 'password': current_key,
                          'host': 'residential-proxy.scrapeops.io', 'port': 8181,
                          'server': 'residential-proxy.scrapeops.io:8181',
                          'url': f"http://{user1}:{current_key}@residential-proxy.scrapeops.io:8181"
                      }

                      res = validate_proxy(pinfo)
                      if res['working']:
                          actual_cc = (res.get('country_code') or '').upper()
                          if actual_cc == current_expected_cc:
                              active_proxy = res
                              active_proxy['proxy_type_label'] = 'scrapeops'
                              use_proxy = True
                              print(f"SUCCESS: ScrapeOps PRIMARY proxy active [{res['working_protocol'].upper()}] -> IP: {res['ip']} | CC: {actual_cc}")
                              break
                          else:
                              print(f"      -> WARNING: ScrapeOps IP Country '{actual_cc}' != expected '{current_expected_cc}'. Retrying...")
                              time.sleep(2)
                      else:
                          if attempt < MAX_ATTEMPTS - 1:
                              time.sleep(2)
                          else:
                              print("FATAL: All ScrapeOps attempts failed to ping. Aborting script.")
                              sys.exit(1)

              if proxy_input and not without_proxy and not active_proxy:
                  print("FATAL: Failed to parse or connect to any provided proxies. Aborting script.")
                  sys.exit(1)

              if not active_proxy:
                  active_proxy = {
                      'server': '', 'server_with_proto': '', 'username': '', 'password': '',
                      'proxy_type_label': 'none', 'country_code': 'US', 'city': '', 'region': '',
                      'ip': 'direct', 'timezone_windows': 'UTC', 'timezone_iana': 'UTC',
                      'windows_locale': 'en-US', 'windows_keyboard': '0409:00000409'
                  }

          cc_final = (active_proxy.get('country_code') or 'US').upper()
          device_name = f"T{os.environ.get('TASK_INDEX','1')}-{os.environ.get('SHORT_OS','OS')}-{os.environ.get('SHORT_SW','SW')}-{os.environ.get('ACTION','task').capitalize()}-{cc_final}" + (f"-{os.environ.get('PROFILE_TAG','')}" if os.environ.get('PROFILE_TAG') else "")
          print(f"Assigned Identity: {device_name}")

          env_file = os.environ.get('GITHUB_ENV')
          with open(env_file, 'a', encoding='utf-8') as f:
              f.write(f"PROXY_SERVER={active_proxy.get('server_with_proto', active_proxy.get('server', ''))}\n")
              f.write(f"PROXY_USER={active_proxy.get('username', '')}\n")
              f.write(f"PROXY_PASS={active_proxy.get('password', '')}\n")
              f.write(f"PROXY_TYPE={active_proxy.get('proxy_type_label', 'none')}\n")
              f.write(f"USE_PROXY={'true' if use_proxy else 'false'}\n")
              f.write(f"PROXY_COUNTRY_CODE={cc_final}\n")
              f.write(f"PROXY_CITY={active_proxy.get('city', '')}\n")
              f.write(f"PROXY_REGION={active_proxy.get('region', '')}\n")
              f.write(f"PROXY_REAL_IP={active_proxy.get('ip', 'direct')}\n")
              f.write(f"TIMEZONE_WINDOWS={active_proxy.get('timezone_windows', 'UTC')}\n")
              f.write(f"TIMEZONE_IANA={active_proxy.get('timezone_iana', 'UTC')}\n")
              f.write(f"WINDOWS_LOCALE={active_proxy.get('windows_locale', 'en-US')}\n")
              f.write(f"WINDOWS_KEYBOARD={active_proxy.get('windows_keyboard', '0409:00000409')}\n")
              f.write(f"DEVICE_NAME={device_name}\n")
              f.write(f"PROFILE_TAG={os.environ.get('PROFILE_TAG', '')}\n")

      - name: Disable Windows Defender & Edge SmartScreen
        shell: pwsh
        run: |
          Write-Host "========== SYSTEM PREPARATION ==========" -ForegroundColor Cyan
          Write-Host "[Defender] Disabling Windows Defender Realtime Monitoring..." -ForegroundColor Yellow
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Write-Host "[Defender] Disabling PUA Protection..." -ForegroundColor Yellow
          Set-MpPreference -PUAProtection 0 -ErrorAction SilentlyContinue
          Write-Host "[Defender] Disabling BlockAtFirstSeen..." -ForegroundColor Yellow
          Set-MpPreference -DisableBlockAtFirstSeen $true -ErrorAction SilentlyContinue
          Write-Host "[Defender] Disabling IOAV Protection..." -ForegroundColor Yellow
          Set-MpPreference -DisableIOAVProtection $true -ErrorAction SilentlyContinue

          Write-Host "[Registry] Enforcing Edge SmartScreen bypass policies..." -ForegroundColor Cyan
          $edgePolicy = "HKLM:\SOFTWARE\Policies\Microsoft\Edge"
          if (-not (Test-Path $edgePolicy)) { New-Item -Path $edgePolicy -Force | Out-Null }
          Set-ItemProperty -Path $edgePolicy -Name "SmartScreenEnabled" -Value 0
          Set-ItemProperty -Path $edgePolicy -Name "SmartScreenPuaEnabled" -Value 0
          Set-ItemProperty -Path $edgePolicy -Name "PreventSmartScreenPromptOverride" -Value 0
          Set-ItemProperty -Path $edgePolicy -Name "PreventSmartScreenPromptOverrideForFiles" -Value 0

          $exemptPath = "$edgePolicy\ExemptDomainFileTypePairsFromFileTypeDownloadWarnings"
          if (-not (Test-Path $exemptPath)) { New-Item -Path $exemptPath -Force | Out-Null }
          Set-ItemProperty -Path $exemptPath -Name "1" -Value '{"domains":["*"],"file_extension":"exe"}'
          Write-Host "[Registry] Edge EXEs whitelisted from all warnings." -ForegroundColor Green

      - name: Apply Proxy-Matched Locale, Timezone & Language
        if: inputs.apply_masking
        shell: pwsh
        run: |
          $tz      = $env:TIMEZONE_WINDOWS
          $locale  = $env:WINDOWS_LOCALE
          $kb      = $env:WINDOWS_KEYBOARD
          $country = $env:PROXY_COUNTRY_CODE
          $city    = $env:PROXY_CITY
          $region  = $env:PROXY_REGION
          $realIp  = $env:PROXY_REAL_IP
          $tzIana  = $env:TIMEZONE_IANA

          Write-Host "============================================================" -ForegroundColor Cyan
          Write-Host " OS-Level Locale & Fingerprint Alignment Engine Active" -ForegroundColor Cyan
          Write-Host " Real Proxy IP   : $realIp" -ForegroundColor Gray
          Write-Host " Location        : $city, $region, $country" -ForegroundColor Gray
          Write-Host " IANA Timezone   : $tzIana" -ForegroundColor Gray
          Write-Host " Windows TZ      : $tz" -ForegroundColor Gray
          Write-Host " Windows Locale  : $locale" -ForegroundColor Gray
          Write-Host " Keyboard Layout : $kb" -ForegroundColor Gray
          Write-Host "============================================================" -ForegroundColor Cyan

          if ($tz -and $tz -ne "UTC") {
              try {
                  Set-TimeZone -Id $tz -ErrorAction Stop
                  Write-Host "[Locale] Timezone set to: $tz" -ForegroundColor Green
              } catch {
                  Write-Host "[Locale] WARNING: Could not set timezone '$tz': $_" -ForegroundColor Yellow
                  try {
                      tzutil /s "$tz"
                      Write-Host "[Locale] Timezone set via tzutil: $tz" -ForegroundColor Green
                  } catch {
                      Write-Host "[Locale] tzutil also failed. Skipping timezone change." -ForegroundColor Red
                  }
              }
          } else {
              Write-Host "[Locale] Timezone is UTC or unset — skipping." -ForegroundColor DarkGray
          }

          try {
              Set-WinSystemLocale -SystemLocale $locale -ErrorAction Stop
              Write-Host "[Locale] System locale set to: $locale" -ForegroundColor Green
          } catch {
              Write-Host "[Locale] WARNING: Set-WinSystemLocale failed for '$locale': $_" -ForegroundColor Yellow
          }

          try {
              Set-WinUILanguageOverride -Language $locale -ErrorAction Stop
              Write-Host "[Locale] UI language override set to: $locale" -ForegroundColor Green
          } catch {
              Write-Host "[Locale] WARNING: Set-WinUILanguageOverride failed for '$locale': $_" -ForegroundColor Yellow
          }

          $geoMap = @{
              "US"="244"; "GB"="242"; "CA"="39"; "AU"="12"; "DE"="94";
              "FR"="84"; "BR"="32"; "MX"="166"; "ES"="217"; "VN"="251";
              "CH"="223"; "ID"="111"; "IT"="118"; "NL"="176"; "PL"="191";
              "AR"="11"; "CL"="46"; "CO"="51"; "IN"="113"; "JP"="122";
              "KR"="134"; "CN"="45"; "TW"="237"; "RU"="203"; "TR"="235";
              "SA"="205"; "AE"="224"; "ZA"="209"; "NG"="178"; "KE"="129";
              "PH"="185"; "TH"="227"; "MY"="167"; "SG"="215"; "HK"="104";
              "PT"="193"; "RO"="200"; "HU"="109"; "CZ"="75"; "SK"="214";
              "UA"="241"; "GR"="98"; "SE"="221"; "NO"="177"; "DK"="61";
              "FI"="77"; "BE"="21"; "AT"="14"; "NZ"="183"; "IE"="110";
          }
          $geoId = $geoMap[$country]
          if ($geoId) {
              try {
                  Set-WinHomeLocation -GeoId ([int]$geoId) -ErrorAction Stop
                  Write-Host "[Locale] Home location (GeoID) set to: $country ($geoId)" -ForegroundColor Green
              } catch {
                  Write-Host "[Locale] WARNING: Set-WinHomeLocation failed: $_" -ForegroundColor Yellow
              }
          } else {
              Write-Host "[Locale] No GeoID mapping found for '$country' — skipping home location." -ForegroundColor DarkGray
          }

          try {
              $langList = New-WinUserLanguageList $locale -ErrorAction Stop
              if ($kb -and $kb -ne "") {
                  $langList[0].InputMethodTips.Clear()
                  $langList[0].InputMethodTips.Add($kb)
              }
              Set-WinUserLanguageList $langList -Force -ErrorAction Stop
              Write-Host "[Locale] User language list set: $locale | Keyboard: $kb" -ForegroundColor Green
          } catch {
              Write-Host "[Locale] WARNING: Set-WinUserLanguageList failed: $_" -ForegroundColor Yellow
          }

          try {
              w32tm /resync /force 2>&1 | Out-Null
              Write-Host "[Locale] System clock synced via w32tm." -ForegroundColor Green
          } catch {
              Write-Host "[Locale] w32tm sync failed (non-critical)." -ForegroundColor DarkGray
          }

          Write-Host "[Locale] All locale adjustments applied for OS." -ForegroundColor Green

      - name: Install and Start Getscreen.me (Windows)
        shell: pwsh
        run: |
          Write-Host "========== REMOTE ACCESS AGENT ==========" -ForegroundColor Cyan
          Write-Host "[Getscreen] Starting MSI download from getscreen.me..."
          $MaxRetries = 3
          $RetryCount = 0
          $Success = $false
          while (-not $Success -and $RetryCount -lt $MaxRetries) {
              try {
                  Invoke-WebRequest -Uri "https://getscreen.me/download/getscreen.msi" -OutFile "getscreen.msi" -ErrorAction Stop
                  if ((Get-Item "getscreen.msi").length -gt 1MB) {
                      $Success = $true
                      Write-Host "[Getscreen] Download successful." -ForegroundColor Green
                  } else {
                      Write-Host "[Getscreen] Downloaded file too small. Retrying ($RetryCount/$MaxRetries)..." -ForegroundColor Yellow
                      Start-Sleep -Seconds 5; $RetryCount++
                  }
              } catch {
                  Write-Host "[Getscreen] Connection error. Retrying ($RetryCount/$MaxRetries)..." -ForegroundColor Red
                  Start-Sleep -Seconds 5; $RetryCount++
              }
          }
          if (-not $Success) { Write-Host "[Getscreen] Failed to download agent. Exiting."; exit 1 }

          Write-Host "[Getscreen] Executing silent install for account: ${{ matrix.email }}"
          $InstallArgs = "/i getscreen.msi /qn REGISTER=`"${{ matrix.email }}`" CONFIG=`"name='$env:DEVICE_NAME' autostart=true nonadmin=true control=true disable_confirmation=true`""
          Start-Process msiexec.exe -Wait -ArgumentList $InstallArgs
          Write-Host "[Getscreen] Agent configured and running in background." -ForegroundColor Green

      - name: Setup Auto-Downloader, Surfer & Software Installation
        shell: pwsh
        env:
          TARGET_URL: ${{ matrix.target_url }}
          SOFTWARE_TYPE: ${{ matrix.software_type }}
          EXE_FILTER: ${{ matrix.exe_filter }}
          ACTION_MODE: ${{ matrix.action_mode }}
          PROFILE_TAG: ${{ matrix.profile_tag }}
          APPLY_MASKING: ${{ inputs.apply_masking }}
        run: |
          $edgePolicy = "HKLM:\SOFTWARE\Policies\Microsoft\Edge"
          if (-not (Test-Path $edgePolicy)) { New-Item -Path $edgePolicy -Force | Out-Null }
          if ($env:ACTION_MODE -in @("click", "surf")) {
              Write-Host "============================================================" -ForegroundColor Red
              Write-Host " [SAFETY] $($env:ACTION_MODE.ToUpper()) Path Detected: Enforcing strict Anti-Download Policy" -ForegroundColor Red
              Write-Host "============================================================" -ForegroundColor Red
              Set-ItemProperty -Path $edgePolicy -Name "DownloadRestrictions" -Value 3
          } else {
              Set-ItemProperty -Path $edgePolicy -Name "DownloadRestrictions" -Value 0
          }

          $useProxy    = $env:USE_PROXY -eq "true"
          $proxyType   = $env:PROXY_TYPE
          $proxyUser   = $env:PROXY_USER
          $proxyPass   = $env:PROXY_PASS
          $proxyServer = $env:PROXY_SERVER

          Write-Host "============================================================" -ForegroundColor Cyan
          Write-Host " Autonomous Web Operations Agent Active" -ForegroundColor Cyan
          Write-Host " Target URL: $env:TARGET_URL" -ForegroundColor Gray
          Write-Host " Category  : $env:SOFTWARE_TYPE" -ForegroundColor Cyan
          Write-Host " Action    : $($env:ACTION_MODE.ToUpper()) PATHWAY ASSIGNED" -ForegroundColor Magenta
          if ($env:PROFILE_TAG) {
              Write-Host " Profile   : $($env:PROFILE_TAG.ToUpper()) VISITOR SIMULATION" -ForegroundColor Yellow
          }
          Write-Host " Masking   : $($env:APPLY_MASKING) | Locale: $env:WINDOWS_LOCALE | Country: $env:PROXY_COUNTRY_CODE" -ForegroundColor DarkCyan

          if ($useProxy) {
              Write-Host " Mode      : Proxy ($proxyType -> $proxyServer)" -ForegroundColor Cyan
              if ($proxyUser) {
                  Write-Host " Auth User : $($proxyUser.Substring(0, [Math]::Min(20, $proxyUser.Length)))..." -ForegroundColor DarkCyan
              } else {
                  Write-Host " Auth User : None (IP Authentication)" -ForegroundColor DarkCyan
              }
          } else {
              Write-Host " Mode      : Direct (Proxy Completely Bypassed)" -ForegroundColor Yellow
          }
          Write-Host "============================================================" -ForegroundColor Cyan

          $edgeExe = "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe"
          if (-Not (Test-Path $edgeExe)) {
              $edgeExe = "C:\Program Files\Microsoft\Edge\Application\msedge.exe"
          }

          $localeTag = $env:WINDOWS_LOCALE
          if (-not $localeTag) { $localeTag = "en-US" }
          $langCode = $localeTag.ToLower()
          $langPrimary = $langCode.Split("-")[0]
          $acceptLang = "$langCode,$langPrimary;q=0.9,en;q=0.8"

          Write-Host "[Dependencies] Installing python UIA modules (pywinauto, pyautogui, etc)..." -ForegroundColor DarkGray
          python -m pip install pywinauto pyautogui pygetwindow keyboard --quiet

          $credFile = "$env:TEMP\proxy_creds.json"
          $credObj  = @{
              proxy_user    = $proxyUser
              proxy_pass    = $proxyPass
              proxy_server  = $proxyServer
              proxy_type    = $proxyType
              use_proxy     = $useProxy
              target_url    = $env:TARGET_URL
              software_type = $env:SOFTWARE_TYPE
              edge_exe      = $edgeExe
              lang_code     = $langCode
              accept_lang   = $acceptLang
              apply_masking = ($env:APPLY_MASKING -eq 'true')
              tz_iana       = $env:TIMEZONE_IANA
              profile_tag   = $env:PROFILE_TAG
          }
          $credJson = $credObj | ConvertTo-Json -Depth 2
          [System.IO.File]::WriteAllText($credFile, $credJson, [System.Text.UTF8Encoding]::new($false))
          Write-Host "[Proxy] Settings written to secure temp file: $credFile" -ForegroundColor DarkGray

          $handlerPy = @'
          import time, sys, subprocess, random, os, tempfile, ctypes, json, math
          from pywinauto import Desktop
          import pyautogui
