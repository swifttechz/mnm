          def get_visitor_profile(profile_tag):
              try:
                  p_id = int(re.sub(r"[^\d]", "", profile_tag))
              except Exception:
                  p_id = random.randint(1, 100)
              p_id = max(1, min(100, p_id))

              arch = ARCHETYPES[(p_id - 1) * len(ARCHETYPES) // 100]
              rng = random.Random(p_id * 7919 + 13)   # deterministic "person" per profile id

              def u(key):
                  lo, hi = arch[key]
                  return rng.uniform(lo, hi)

              dur_low = min(u("dur_low"), SURF_HARD_CAP_SEC - 25)
              dur_high = min(max(u("dur_high"), dur_low + 15), SURF_HARD_CAP_SEC)
              weights = {k: rng.uniform(lo, hi) for k, (lo, hi) in arch["weights"].items()}
              links_lo, links_hi = arch["links"]
              base_links = rng.randint(links_lo, links_hi)

              # Per-session mood: genuinely random each run, so the same profile never behaves identically twice
              mood = random.uniform(0.85, 1.15)
              energy = random.uniform(0.90, 1.12)
              link_target = max(0, min(6, base_links + random.choice([-1, 0, 0, 1])))

              pause_min = u("pause_min") * mood
              pause_max = pause_min + u("pause_span") * mood
              speed = u("speed") * energy

              return {
                  "profile_id": f"P{p_id}",
                  "archetype": arch["name"],
                  "dur_low": dur_low,
                  "dur_high": dur_high,
                  "dur_mode_pos": u("mode_pos"),
                  "duration_min": int(dur_low),
                  "duration_max": int(dur_high),
                  "scroll_speed": "fast" if speed > 1.15 else ("slow" if speed < 0.9 else "medium"),
                  "speed": speed,
                  "pause_min": pause_min,
                  "pause_max": pause_max,
                  "down_scroll_prob": u("down"),
                  "link_click_target": link_target,
                  "subpage_stay": u("stay") * mood,
                  "text_select_prob": u("select"),
                  "idle_prob": u("idle"),
                  "idle_len": arch["idle_len"],
                  "key_scroll_prob": u("key"),
                  "bounce_prob": u("bounce"),
                  "sticky_prob": u("sticky"),
                  "footer_prob": u("footer"),
                  "glance": u("glance"),
                  "overshoot_prob": u("overshoot"),
                  "max_depth": 2,
                  "weights": weights,
                  "mood": mood,
              }


          def sample_session_duration(profile):
              """Randomised total runtime (page load included). Never above SURF_HARD_CAP_SEC."""
              lo, hi = profile["dur_low"], profile["dur_high"]
              mode = lo + (hi - lo) * profile["dur_mode_pos"]
              kind = "normal"
              d = random.triangular(lo, hi, mode)
              roll = random.random()
              if roll < profile["bounce_prob"]:
                  kind = "early-bounce"
                  d = random.uniform(SURF_MIN_SEC, max(SURF_MIN_SEC + 8, lo * 0.65))
              elif roll > 1.0 - profile["sticky_prob"]:
                  kind = "highly-engaged"
                  d = random.uniform(hi * 0.90, hi)
              d *= random.uniform(0.95, 1.05)
              d = int(max(SURF_MIN_SEC, min(d, SURF_HARD_CAP_SEC - 5)))
              return d, kind


          # ---------------------------------------------------------------------------
          # Page load verifier (deadline aware)
          # ---------------------------------------------------------------------------
          def wait_for_page_to_fully_load(edge_window, timeout=35):
              timeout = max(2, min(timeout, surf_remaining() - 1))
              log_msg("PageVerifier", f"Verifying webpage load and DOM stabilization (max {timeout:.0f}s)...")
              start_check = time.time()
              last_descendant_count = -1
              stable_ticks = 0

              while (time.time() - start_check) < timeout:
                  try:
                      wt = (edge_window.window_text() or "").strip()
                      wt_lower = wt.lower()
                      if wt_lower in ["microsoft edge", "edge", "new tab", "about:blank", ""]:
                          time.sleep(1)
                          continue

                      count = 0
                      for doc in edge_window.descendants(control_type="Document"):
                          count += len(doc.children())

                      if count > 0:
                          if count == last_descendant_count:
                              stable_ticks += 1
                              if stable_ticks >= 3:
                                  log_msg("PageVerifier", f"Page verified as fully loaded and stable. Title: '{wt[:50]}' (Elements: {count})")
                                  return True
                          else:
                              stable_ticks = 0
                              last_descendant_count = count
                      else:
                          desc_cnt = len(edge_window.descendants())
                          if desc_cnt > 15:
                              log_msg("PageVerifier", f"DOM elements active ({desc_cnt} nodes). Page ready.")
                              return True
                  except Exception:
                      pass
                  time.sleep(1)

              log_msg("PageVerifier", "Timeout reached waiting for page load. Proceeding with best-effort state.")
              return True


          # ---------------------------------------------------------------------------
          # Mouse: curved (bezier) paths, variable speed, occasional overshoot+correct
          # ---------------------------------------------------------------------------
          def _clamp_screen(x, y):
              try:
                  sw, sh = pyautogui.size()
              except Exception:
                  sw, sh = 1920, 1080
              return int(max(3, min(sw - 4, x))), int(max(3, min(sh - 4, y)))


          def _bezier_path(x1, y1, x2, y2, steps):
              dist = math.hypot(x2 - x1, y2 - y1) or 1.0
              nx, ny = -(y2 - y1) / dist, (x2 - x1) / dist
              bend1 = random.uniform(-0.22, 0.22) * dist
              bend2 = random.uniform(-0.22, 0.22) * dist
              c1 = (x1 + (x2 - x1) * 0.30 + nx * bend1, y1 + (y2 - y1) * 0.30 + ny * bend1)
              c2 = (x1 + (x2 - x1) * 0.70 + nx * bend2, y1 + (y2 - y1) * 0.70 + ny * bend2)
              pts = []
              for i in range(1, steps + 1):
                  t = i / steps
                  t = t * t * (3 - 2 * t)  # smoothstep easing: slow start/end, fast middle
                  a = (1 - t) ** 3
                  b = 3 * (1 - t) ** 2 * t
                  c = 3 * (1 - t) * t ** 2
                  d = t ** 3
                  pts.append((a * x1 + b * c1[0] + c * c2[0] + d * x2, a * y1 + b * c1[1] + c * c2[1] + d * y2))
              return pts


          def human_smooth_move(x, y, duration=None, speed=1.0, overshoot_prob=0.0):
              try:
                  x, y = _clamp_screen(x, y)
                  cx, cy = pyautogui.position()
                  dist = math.hypot(x - cx, y - cy)
                  if dist < 4:
                      return
                  if duration is None:
                      duration = max(0.18, min(1.4, dist / (950.0 * max(0.4, speed)) + random.uniform(0.08, 0.28)))
                  duration = min(duration, max(0.1, surf_remaining() - 0.5))

                  targets = [(x, y)]
                  if overshoot_prob and dist > 220 and random.random() < overshoot_prob:
                      ox, oy = _clamp_screen(x + random.randint(-28, 28), y + random.randint(-22, 22))
                      targets = [(ox, oy), (x, y)]

                  for idx, (tx, ty) in enumerate(targets):
                      seg_dur = duration if idx == 0 else random.uniform(0.12, 0.28)
                      sx, sy = pyautogui.position()
                      steps = int(max(8, min(55, math.hypot(tx - sx, ty - sy) / 14)))
                      for (px, py) in _bezier_path(sx, sy, tx, ty, steps):
                          px, py = _clamp_screen(px, py)
                          pyautogui.moveTo(px, py, duration=0, _pause=False)
                          time.sleep(seg_dur / steps)
                  if random.random() < 0.40:
                      jx, jy = random.randint(-4, 4), random.randint(-4, 4)
                      pyautogui.moveRel(jx, jy, duration=random.uniform(0.05, 0.15), _pause=False)
              except Exception:
                  pass


          def ensure_pointer_on_content(speed=1.0):
              """Mouse-wheel only scrolls the page when the pointer is over it."""
              try:
                  sw, sh = pyautogui.size()
                  x, y = pyautogui.position()
                  if y < sh * 0.22 or y > sh * 0.94 or x < sw * 0.05 or x > sw * 0.95:
                      human_smooth_move(random.randint(int(sw * 0.25), int(sw * 0.75)),
                                        random.randint(int(sh * 0.35), int(sh * 0.75)), speed=speed)
              except Exception:
                  pass


          # ---------------------------------------------------------------------------
          # Scrolling: eased wheel scroll, momentary hesitation, overshoot correction,
          # plus keyboard paging (PageDown / arrows) as an alternative style
          # ---------------------------------------------------------------------------
          def human_natural_scroll(direction="down", intensity="medium", overshoot_prob=0.10, speed=1.0):
              try:
                  ensure_pointer_on_content(speed)
                  cfg = {"short": (2, 4, 70, 120), "medium": (3, 7, 90, 160), "long": (6, 12, 120, 220)}[intensity]
                  ticks_count = random.randint(cfg[0], cfg[1])
                  step_size = random.randint(cfg[2], cfg[3])
                  sign = -1 if direction == "down" else 1

                  for i in range(ticks_count):
                      if surf_remaining() <= 1:
                          return
                      pos = (i + 0.5) / ticks_count
                      ease = 0.55 + 0.9 * math.sin(math.pi * pos)   # gentle start, quick middle, gentle stop
                      pyautogui.scroll(int(sign * step_size * ease * random.uniform(0.9, 1.1)), _pause=False)
                      time.sleep(random.uniform(0.04, 0.16) / max(0.6, speed))
                      if random.random() < 0.06:
                          surf_sleep(random.uniform(0.25, 0.7))      # momentary hesitation

                  if random.random() < overshoot_prob:
                      surf_sleep(random.uniform(0.2, 0.5))
                      pyautogui.scroll(int(-sign * random.randint(40, 110)), _pause=False)  # scrolled too far, nudge back
                  surf_sleep(random.uniform(0.3, 0.8))
              except Exception:
                  pass


          def human_key_scroll(direction="down"):
              try:
                  ensure_pointer_on_content()
                  if random.random() < 0.5:
                      key = "pagedown" if direction == "down" else "pageup"
                      pyautogui.press(key, presses=random.randint(1, 2), interval=random.uniform(0.35, 0.8), _pause=False)
                  else:
                      key = "down" if direction == "down" else "up"
                      pyautogui.press(key, presses=random.randint(3, 8), interval=random.uniform(0.05, 0.12), _pause=False)
                  surf_sleep(random.uniform(0.3, 0.9))
              except Exception:
                  pass


          # ---------------------------------------------------------------------------
          # Reading / idle / selection behaviours (all deadline aware)
          # ---------------------------------------------------------------------------
          def human_reading_pause(min_s=2.5, max_s=6.5, parked_prob=0.15):
              pause_time = random.uniform(min_s, max_s)
              pause_time = min(pause_time, max(0.0, surf_remaining() - 1.0))
              if pause_time < 0.3:
                  return
              parked = random.random() < parked_prob   # eyes on page, hand off the mouse
              log_msg("Reader", f"Reading pause ({pause_time:.1f}s){' - mouse parked' if parked else ''}...")
              start_p = time.time()
              while time.time() - start_p < pause_time:
                  if not parked and random.random() < 0.35:
                      dx, dy = random.randint(-20, 20), random.randint(-12, 12)
                      pyautogui.moveRel(dx, dy, duration=random.uniform(0.2, 0.45), _pause=False)
                  time.sleep(min(random.uniform(0.4, 0.9), max(0.05, pause_time - (time.time() - start_p))))


          def human_idle_away(profile):
              lo, hi = profile["idle_len"]
              d = min(random.uniform(lo, hi), max(0.0, surf_remaining() - 8.0))
              if d < 1.5:
                  return False
              log_msg("HumanSurf", f"Attention drift: looking away from screen for {d:.1f}s (no input)...")
              surf_sleep(d)
              return True


          def human_text_selection_simulation():
              try:
                  sw, sh = pyautogui.size()
                  sx = random.randint(int(sw * 0.25), int(sw * 0.65))
                  sy = random.randint(int(sh * 0.35), int(sh * 0.75))
                  human_smooth_move(sx, sy)
                  pyautogui.mouseDown()
                  drag_len = random.randint(60, 240)
                  pyautogui.moveRel(drag_len, random.randint(-6, 6), duration=random.uniform(0.3, 0.7))
                  pyautogui.mouseUp()
                  log_msg("Reader", f"Simulated text highlighting ({drag_len}px).")
                  surf_sleep(random.uniform(0.8, 1.8))
              except Exception:
                  try:
                      pyautogui.mouseUp()
                  except Exception:
                      pass


          # ---------------------------------------------------------------------------
          # Link finder: middle / lower part of the page only, safe-keyword preference,
          # never the same label twice, hover dwell before clicking
          # ---------------------------------------------------------------------------
          def find_and_interact_middle_or_downside(edge_window, speed=1.0, overshoot_prob=0.1):
              sw, sh = pyautogui.size()
              candidate_links = []
              scan_t0 = time.time()
              log_msg("LinkFinder", "Searching for interactive elements strictly in MIDDLE or DOWNSIDE...")

              try:
                  for el in edge_window.descendants():
                      try:
                          ctrl_type = el.element_info.control_type
                          if ctrl_type not in ["Hyperlink", "Button", "MenuItem", "TabItem", "Text", "Custom"]:
                              continue
                          txt = (el.window_text() or "").strip()
                          nm = (el.element_info.name or "").strip()
                          combined = f"{txt} {nm}".lower().strip()
                          if not combined or len(combined) > 70:
                              continue
                          if combined in _CLICKED_LABELS:
                              continue

                          rect = el.rectangle()
                          cx = rect.mid_point().x
                          cy = rect.mid_point().y
                          if cy < (sh * 0.25):
                              continue
                          if any(bad in combined for bad in DANGEROUS_CLICK_KEYWORDS):
                              continue
                          if (sw * 0.08) < cx < (sw * 0.92) and (sh * 0.28) < cy < (sh * 0.90):
                              is_safe_kw = any(good in combined for good in SAFE_SURF_KEYWORDS)
                              candidate_links.append((is_safe_kw, el, cx, cy, combined))
                      except Exception:
                          continue

                  log_msg("LinkFinder", f"Scan finished in {time.time() - scan_t0:.1f}s: {len(candidate_links)} candidate(s).")
                  if surf_remaining() < 12:
                      log_msg("LinkFinder", "Not enough session time left to follow a link. Skipping.")
                      return False

                  if candidate_links:
                      safe_first = [c for c in candidate_links if c[0]]
                      pool = safe_first if (safe_first and random.random() < 0.75) else candidate_links
                      pool.sort(key=lambda x: x[3], reverse=True)
                      chosen = random.choice(pool[:min(10, len(pool))])
                      _, target_el, cx, cy, label = chosen
                      _CLICKED_LABELS.add(label)
                      log_msg("LinkFinder", f"Chosen link: '{label[:40]}' at ({cx}, {cy}). Moving mouse...")

                      human_smooth_move(cx, cy, speed=speed, overshoot_prob=overshoot_prob)
                      surf_sleep(random.uniform(0.25, 0.9))     # hover dwell before committing

                      clicked = False
                      if random.random() < 0.85:
                          try:
                              target_el.click_input()
                              clicked = True
                              log_msg("LinkFinder", "Clicked target link successfully.")
                          except Exception:
                              pass
                      if not clicked:
                          pyautogui.click(cx, cy)
                          log_msg("LinkFinder", "Clicked target link via PyAutoGUI coordinates.")
                      return True
              except Exception as e:
                  log_msg("LinkFinder", f"Middle/downside search failed: {e}")
              return False


          # ---------------------------------------------------------------------------
          # Action picker: weighted by persona, shaped by session phase, anti-repetition
          # ---------------------------------------------------------------------------
          def pick_action(profile, phase, history, clicks_executed, depth, remaining):
              w = dict(profile["weights"])
              w["idle"] = w.get("idle", 0.0) + profile["idle_prob"] * 0.5
              w["select"] = w.get("select", 0.0) * (0.5 + profile["text_select_prob"])
              if phase == "early":
                  w["read"] *= 1.3
                  w["link"] *= 0.5
              elif phase == "late":
                  w["link"] *= 0.5
                  w["scroll"] *= 1.15
              if clicks_executed >= profile["link_click_target"] or remaining <= 40 or depth >= profile["max_depth"]:
                  w["link"] = 0.0
              if remaining < 14:
                  w["idle"] = 0.0
                  w["select"] = 0.0
              if len(history) >= 2 and history[-1] == history[-2]:
                  w[history[-1]] = w.get(history[-1], 0.0) * 0.15
              keys = [k for k in w if w[k] > 0]
              if not keys:
                  return "scroll"
              return random.choices(keys, weights=[w[k] for k in keys])[0]


          def write_surf_flag(name, text):
              try:
                  with open(os.path.join(tempfile.gettempdir(), name), "w") as f:
                      f.write(text)
              except Exception:
                  pass


          def run_human_surfing_simulation(desktop, edge_window, profile_tag="P1"):
              global _SURF_CLOCK
              profile = get_visitor_profile(profile_tag)
              session_duration, duration_kind = sample_session_duration(profile)
              _SURF_CLOCK = SurfClock(session_duration)
              clock = _SURF_CLOCK

              # Tell the PowerShell watcher immediately (its budget starts from this moment)
              write_surf_flag("surf_duration.txt", str(clock.total))
              write_surf_flag("surf_start.txt", str(int(time.time())))

              log_msg("HumanSurf", "============================================================")
              log_msg("HumanSurf", f" VISITOR PROFILE LOADED: [{profile['profile_id']}] {profile['archetype'].upper()}")
              log_msg("HumanSurf", "============================================================")
              log_msg("HumanSurf", f"Persona traits : speed={profile['speed']:.2f} ({profile['scroll_speed']}) | pause={profile['pause_min']:.1f}-{profile['pause_max']:.1f}s | down-scroll={profile['down_scroll_prob']:.0%} | mood={profile['mood']:.2f}")
              log_msg("HumanSurf", f"Behaviour      : link target={profile['link_click_target']} | subpage stay~{profile['subpage_stay']:.0f}s | select={profile['text_select_prob']:.0%} | idle={profile['idle_prob']:.0%} | keyboard-scroll={profile['key_scroll_prob']:.0%} | footer-dive={profile['footer_prob']:.0%}")
              log_msg("HumanSurf", f"Runtime window : {profile['duration_min']}-{profile['duration_max']}s (hard cap {SURF_HARD_CAP_SEC}s)")
              log_msg("HumanSurf", f"SESSION RUNTIME ASSIGNED: {clock.total}s [{duration_kind}] (includes page load)")

              wait_for_page_to_fully_load(edge_window, timeout=25)

              sw, sh = pyautogui.size()
              speed = profile["speed"]
              ovs = profile["overshoot_prob"]

              # Landing glance
              log_msg("HumanSurf", "Initial landing glance. User observing top content...")
              human_reading_pause(min_s=profile["glance"] * 0.8, max_s=profile["glance"] * 1.4, parked_prob=0.3)

              # First deliberate scroll
              if surf_remaining() > 5:
                  log_msg("HumanSurf", "Beginning first natural scroll down into middle content...")
                  human_natural_scroll("down", random.choice(["short", "medium"]), ovs, speed)
                  SURF_STATS["scroll"] += 1
                  human_reading_pause(profile["pause_min"], profile["pause_max"])

              clicks_executed = 0
              subpage_depth = 0
              subpage_entered_time = 0.0
              current_stay = profile["subpage_stay"]
              footer_done = False
              history = []

              while surf_remaining() > 1.0:
                  remaining = surf_remaining()
                  frac = clock.elapsed() / clock.total
                  phase = "early" if frac < 0.25 else ("late" if frac > 0.75 else "mid")

                  try:
                      edge_window.set_focus()
                  except Exception:
                      pass

                  # One-off footer dive for "researcher" personas in the second half
                  if (not footer_done and frac > 0.45 and remaining > 20 and random.random() < profile["footer_prob"] * 0.25):
                      footer_done = True
                      SURF_STATS["footer_dive"] += 1
                      log_msg("HumanSurf", f"[t={clock.elapsed():.0f}/{clock.total}s] Heading to the footer area (long scroll down)...")
                      for _ in range(random.randint(2, 3)):
                          human_natural_scroll("down", "long", ovs, speed)
                      human_reading_pause(profile["pause_min"], profile["pause_max"])
                      history.append("scroll")
                      continue

                  action = pick_action(profile, phase, history, clicks_executed, subpage_depth, remaining)
                  history.append(action)
                  tag = f"[t={clock.elapsed():.0f}/{clock.total}s|{phase}]"

                  if action == "scroll":
                      direction = "down" if random.random() < profile["down_scroll_prob"] else "up"
                      if profile["scroll_speed"] == "fast":
                          intensity = random.choice(["medium", "long", "long"])
                      elif profile["scroll_speed"] == "slow":
                          intensity = random.choice(["short", "short", "medium"])
                      else:
                          intensity = random.choice(["short", "medium", "medium", "long"])
                      if random.random() < profile["key_scroll_prob"]:
                          log_msg("HumanSurf", f"{tag} Keyboard scroll {direction.upper()}...")
                          human_key_scroll(direction)
                          SURF_STATS["keyscroll"] += 1
                      else:
                          log_msg("HumanSurf", f"{tag} Scrolling {direction.upper()} ({intensity})...")
                          human_natural_scroll(direction, intensity, ovs, speed)
                          SURF_STATS["scroll"] += 1

                  elif action == "scroll_back":
                      log_msg("HumanSurf", f"{tag} Scrolling back UP to re-read something...")
                      human_natural_scroll("up", random.choice(["short", "medium"]), ovs, speed)
                      human_reading_pause(profile["pause_min"], profile["pause_max"])
                      SURF_STATS["scroll_back"] += 1

                  elif action == "read":
                      human_reading_pause(profile["pause_min"], profile["pause_max"])
                      SURF_STATS["read"] += 1

                  elif action == "keyscroll":
                      direction = "down" if random.random() < profile["down_scroll_prob"] else "up"
                      log_msg("HumanSurf", f"{tag} Keyboard scroll {direction.upper()}...")
                      human_key_scroll(direction)
                      SURF_STATS["keyscroll"] += 1

                  elif action == "select":
                      human_text_selection_simulation()
                      SURF_STATS["select"] += 1

                  elif action == "idle":
                      if human_idle_away(profile):
                          SURF_STATS["idle"] += 1

                  elif action == "link":
                      log_msg("HumanSurf", f"{tag} Link interaction ({clicks_executed + 1}/{profile['link_click_target']})...")
                      if find_and_interact_middle_or_downside(edge_window, speed, ovs):
                          clicks_executed += 1
                          subpage_depth += 1
                          subpage_entered_time = time.time()
                          current_stay = profile["subpage_stay"] * random.uniform(0.8, 1.25)
                          SURF_STATS["link"] += 1
                          log_msg("HumanSurf", "Waiting for subpage to load...")
                          surf_sleep(random.uniform(2.0, 3.5))
                          wait_for_page_to_fully_load(edge_window, timeout=15)
                          human_natural_scroll("down", "short", ovs, speed)
                          human_reading_pause(max(2.5, profile["pause_min"]), max(5.0, profile["pause_max"]))

                  else:  # rove
                      rx = random.randint(int(sw * 0.15), int(sw * 0.85))
                      ry = random.randint(int(sh * 0.30), int(sh * 0.80))
                      log_msg("HumanSurf", f"{tag} Eye-tracking mouse move to ({rx}, {ry})...")
                      human_smooth_move(rx, ry, speed=speed, overshoot_prob=ovs)
                      surf_sleep(random.uniform(0.5, 1.4))
                      SURF_STATS["rove"] += 1

                  # Back navigation once the subpage has been inspected long enough
                  if subpage_depth > 0 and (time.time() - subpage_entered_time) > current_stay and surf_remaining() > 10:
                      if random.random() < 0.75:
                          log_msg("HumanSurf", f"[t={clock.elapsed():.0f}/{clock.total}s] Subpage inspected. Navigating Back (Alt + Left Arrow)...")
                          try:
                              edge_window.set_focus()
                              send_keys('%{LEFT}')
                              surf_sleep(random.uniform(2.0, 3.2))
                              wait_for_page_to_fully_load(edge_window, timeout=12)
                              subpage_depth = max(0, subpage_depth - 1)
                              SURF_STATS["back_nav"] += 1
                          except Exception:
                              pass

                  surf_sleep(random.uniform(0.5, 1.4))

              actual = clock.elapsed()
              write_surf_flag("surf_stats.json", json.dumps({
                  "profile": profile["profile_id"], "archetype": profile["archetype"],
                  "assigned_sec": clock.total, "actual_sec": round(actual, 1), "kind": duration_kind,
                  "links_followed": clicks_executed, "actions": SURF_STATS,
              }))
              write_surf_flag("surf_done.flag", "done")

              log_msg("HumanSurf", "============================================================")
              log_msg("HumanSurf", f" SURF SESSION COMPLETE [{profile['profile_id']}] {profile['archetype']}")
              log_msg("HumanSurf", f" Runtime  : {actual:.1f}s of {clock.total}s assigned (hard cap {SURF_HARD_CAP_SEC}s)")
              log_msg("HumanSurf", f" Links    : {clicks_executed} followed (target {profile['link_click_target']}) | Back-navs: {SURF_STATS['back_nav']}")
              log_msg("HumanSurf", f" Actions  : {SURF_STATS}")
              log_msg("HumanSurf", "============================================================")

          def handle_automation(software_type, action_mode, profile_tag="P1", timeout=450):
              desktop = Desktop(backend="uia")
              start_time = time.time()
              proxy_auth_time = start_time

              log_msg("UI-Engine", f"Started. Action: {action_mode.upper()} | Type: {software_type} | Profile: {profile_tag}")
              log_msg("UI-Engine", f"Target URL: {TARGET_URL}")

              if not TARGET_URL or TARGET_URL.strip() == "":
                  log_msg("UI-Engine", "FATAL: TARGET_URL is empty. Exiting.")
                  sys.exit(1)

              log_msg("UI-Engine", "Booting Edge via verified launcher...")
              if not verify_edge_launch(TARGET_URL, EDGE_EXE, PROXY_SERVER, USE_PROXY, LANG_CODE, ACCEPT_LANG, APPLY_MASKING, TZ_IANA):
                  log_msg("UI-Engine", "FATAL: Could not verify Edge launch. Exiting.")
                  sys.exit(1)

              download_clicked = False
              download_started = False
              last_dl_click_time = time.time()
              keep_mouse_sequence_done = False
              keep_mouse_step = 0
              keep_mouse_last_try = 0
              download_click_attempts = 0
              MAX_DOWNLOAD_CLICK_ATTEMPTS = 3
              last_download_reattempt_time = 0

              smart_link_interstitial_done = False
              smart_link_interstitial_time = 0

              sentinel_path = os.path.join(tempfile.gettempdir(), "download_done.flag")
              installer_executed_sentinel = os.path.join(tempfile.gettempdir(), "installer_executed.flag")
              download_windows_closed = False

              actual_software = software_type
              sentinel_read_done = False

              last_interference_sweep = 0
              INTERFERENCE_SWEEP_INTERVAL = 2

              last_auth_inject_time = 0
              AUTH_INJECT_COOLDOWN = 8

              surf_simulation_executed = False

              while time.time() - start_time < timeout:
                  try:
                      desktop = Desktop(backend="uia")
                      edge_window = None
                      opera_window = None
                      avg_window = None

                      for window in desktop.windows(visible_only=True):
                          wt = window.window_text()
                          if not wt: continue
                          if "Microsoft Edge" in wt or "sudetyj" in wt or "Chrome Web Store" in wt or "Edge" in wt:
                              edge_window = window
                          if "Opera" in wt or "Speed Dial" in wt or "Start Page" in wt or "Welcome" in wt:
                              if "Microsoft Edge" not in wt and "Edge" not in wt and "Chrome Web Store" not in wt:
                                  opera_window = window
                          if "AVG" in wt:
                              avg_window = window

                      if action_mode == "install" and download_clicked and not download_started:
                          if time.time() - last_dl_click_time > 120:
                              log_msg("Timeout", "120 seconds since download click with no download. Aborting.")
                              with open(os.path.join(tempfile.gettempdir(), "abort_install.flag"), "w") as f:
                                  f.write("abort")
                              sys.exit(0)

                      if edge_window and action_mode == 'install':
                          wt_check = (edge_window.window_text() or "").strip()
                          elapsed_total = time.time() - start_time
                          if elapsed_total > 20 and wt_check.lower() in ["microsoft edge", "edge", "new tab", ""]:
                              log_msg("EdgeURLGuard", f"Edge has blank title '{wt_check}' after {elapsed_total:.0f}s. Relaunching...")
                              verify_edge_launch(TARGET_URL, EDGE_EXE, PROXY_SERVER, USE_PROXY, LANG_CODE, ACCEPT_LANG, APPLY_MASKING, TZ_IANA)
                              proxy_auth_time = time.time()
                              continue

                      if edge_window and action_mode == 'install':
                          if detect_edge_error(edge_window):
                              log_msg("EdgeError", "FATAL: Proxy/Connection error detected! Relaunching Edge...")
                              verify_edge_launch(TARGET_URL, EDGE_EXE, PROXY_SERVER, USE_PROXY, LANG_CODE, ACCEPT_LANG, APPLY_MASKING, TZ_IANA)
                              start_time = time.time()
                              proxy_auth_time = time.time()
                              last_auth_inject_time = 0
                              download_clicked = False
                              download_started = False
                              download_click_attempts = 0
                              keep_mouse_sequence_done = False
                              download_windows_closed = False
                              time.sleep(2)
                              continue

                      now = time.time()
                      if now - last_interference_sweep >= INTERFERENCE_SWEEP_INTERVAL:
                          dismiss_interference_windows(desktop, software_type, label="continuous")
                          last_interference_sweep = now

                      if USE_PROXY and (now - last_auth_inject_time > AUTH_INJECT_COOLDOWN):
                          auth_injected_this_tick = False
                          try:
                              for auth_window in desktop.windows(visible_only=True):
                                  awt = auth_window.window_text() or ""
                                  if "Microsoft Edge" in awt and awt != "Microsoft Edge": continue
                                  if _is_target_software_window(awt, software_type): continue
                                  if _is_proxy_auth_dialog(awt):
                                      last_auth_inject_time = now
                                      log_msg("ProxyAuth", f"[TopLevel] Auth dialog: '{awt}' — injecting...")
                                      injected = inject_proxy_auth(auth_window, label=f"toplevel-{awt[:30]}")
                                      if injected:
                                          proxy_auth_time = time.time()
                                          auth_injected_this_tick = True
                                          break
                          except Exception: pass

                          if not auth_injected_this_tick and edge_window:
                              try:
                                  for child in edge_window.children():
                                      cwt = child.window_text() or ""
                                      if _is_proxy_auth_dialog(cwt):
                                          last_auth_inject_time = now
                                          log_msg("ProxyAuth", f"[EdgeChild] Embedded auth dialog: '{cwt}'")
                                          injected = inject_proxy_auth(child, label=f"edge-child-{cwt[:20]}")
                                          if injected:
                                              proxy_auth_time = time.time()
                                              auth_injected_this_tick = True
                                              break
                              except Exception: pass

                      if not download_windows_closed and os.path.exists(sentinel_path):
                          log_msg("Sentinel", "Download flag detected. Initiating Edge cleanup sequence...")
                          for attempt in range(1, 8):
                              still_open = close_download_windows(desktop, attempt_label=f"#{attempt}")
                              time.sleep(2)
                              if not still_open:
                                  break
                          download_windows_closed = True
                          download_started = True
                          edge_window = None

                      if edge_window:
                          try:
                              for btn in edge_window.descendants(control_type="Button"):
                                  try: btn_txt = (btn.window_text() or "").strip()
                                  except Exception: btn_txt = ""
                                  if btn_txt and _matches_any(btn_txt, COOKIE_CONSENT_KEYWORDS):
                                      try:
                                          log_msg("Cookies", f"Found consent button: '{btn_txt}'. Clicking...")
                                          btn.click_input()
                                          time.sleep(1)
                                          break
                                      except Exception: pass
                          except Exception: pass

                      if edge_window and software_type == "opera_smart_link":
                          elapsed = time.time() - proxy_auth_time
                          if not smart_link_interstitial_done and elapsed > 40:
                              try:
                                  log_msg("SmartLink", f"{elapsed:.1f}s elapsed. Executing TAB + ENTER interstitial bypass...")
                                  edge_window.set_focus(); time.sleep(0.5)
                                  send_keys('{TAB}'); time.sleep(1)
                                  send_keys('{ENTER}')
                              except Exception as e:
                                  log_msg("SmartLink", f"Bypass failed: {e}")
                              smart_link_interstitial_done = True
                              smart_link_interstitial_time = time.time()
                              proxy_auth_time = time.time()

                      # =======================================================
                      # SURF PATHWAY HANDLING
                      # =======================================================
                      if action_mode == "surf":
                          if software_type == "opera_smart_link" and not smart_link_interstitial_done:
                              time.sleep(1)
                              continue

                          elapsed_surf = time.time() - proxy_auth_time
                          if not surf_simulation_executed and elapsed_surf > 6 and edge_window:
                              surf_simulation_executed = True
                              run_human_surfing_simulation(desktop, edge_window, profile_tag=profile_tag)
                              log_msg("UI-Engine", "Surf pathway complete. Terminating python loop cleanly.")
                              sys.exit(0)

                          time.sleep(1)
                          continue

                      # =======================================================
                      # CLICK-ONLY PATHWAY HANDLING
                      # =======================================================
                      if action_mode == "click":
                          if software_type == "opera_smart_link":
                              if not smart_link_interstitial_done:
                                  time.sleep(1)
                                  continue
                              elif time.time() - smart_link_interstitial_time < 15:
                                  time.sleep(1)
                                  continue
                          time.sleep(1)
                          continue

                      # =======================================================
                      # INSTALL PATHWAY HANDLING
                      # =======================================================
                      can_click_download = True
                      if software_type == "opera_smart_link":
                          if not smart_link_interstitial_done or (time.time() - smart_link_interstitial_time < 15):
                              can_click_download = False

                      if (edge_window and action_mode == "install" and can_click_download
                              and software_type in ["opera_gx", "opera_one", "ad_mvn",
                                                    "dynamic_opera", "opera_smart_link", "avg"]):
                          elapsed = time.time() - proxy_auth_time

                          if not download_clicked and elapsed > 30:
                              log_msg("DL-Engine", f"{elapsed:.1f}s elapsed. PRIMARY: Initiating download button detection...")
                              try: edge_window.set_focus()
                              except Exception: pass

                              robust_click_download_button(edge_window, software_type)

                              download_clicked = True
                              download_click_attempts = 1
                              last_dl_click_time = time.time()
                              last_download_reattempt_time = time.time()

                      if download_clicked and not keep_mouse_sequence_done and edge_window:
                          elapsed_since_dl = now - last_dl_click_time
                          if elapsed_since_dl >= 5 and keep_mouse_step < 4:
                              if (now - keep_mouse_last_try) >= 5:
                                  keep_mouse_step += 1
                                  try: edge_window.set_focus()
                                  except Exception: pass
                                  time.sleep(0.5)
                                  send_keys('^j')
                                  time.sleep(1.5)

                                  clicked_keep = False
                                  try:
                                      for btn in edge_window.descendants(control_type="Button"):
                                          txt = (btn.window_text() or "").lower()
                                          nm = (btn.element_info.name or "").lower()
                                          combined = f"{txt} {nm}"
                                          if any(kw in combined for kw in KEEP_KW):
                                              if click_element_robust(btn, "KeepMouse"):
                                                  clicked_keep = True
                                                  break
                                  except Exception: pass

                                  if clicked_keep:
                                      keep_mouse_sequence_done = True
                                      download_started = True
                                  else:
                                      keep_mouse_last_try = time.time()

                          if keep_mouse_step >= 4 and not keep_mouse_sequence_done:
                              keep_mouse_sequence_done = True

                  except Exception:
                      pass
                  time.sleep(1)

          if __name__ == "__main__":
              software_choice_raw = sys.argv[1] if len(sys.argv) > 1 else "01. Opera OfferGate - Ahmad"
              software_type = sys.argv[2] if len(sys.argv) > 2 else "opera_one"
              action_mode   = sys.argv[3] if len(sys.argv) > 3 else "install"
              profile_tag   = sys.argv[4] if len(sys.argv) > 4 else "P1"
              handle_automation(software_type, action_mode, profile_tag=profile_tag)
          '@

          $handlerPyBytes = [System.Text.UTF8Encoding]::new($false).GetBytes($handlerPy)
          [System.IO.File]::WriteAllBytes("$env:TEMP\auto_handler.py", $handlerPyBytes)

          Write-Host "[UI-Engine] Spinning up background Python process..." -ForegroundColor DarkGray
          Start-Process -FilePath "python" `
              -ArgumentList "-u `"$env:TEMP\auto_handler.py`" `"$env:SOFTWARE_CHOICE`" `"$env:SOFTWARE_TYPE`" `"$env:ACTION_MODE`" `"$env:PROFILE_TAG`"" `
              -WindowStyle Hidden

          $dlFolder    = "$env:USERPROFILE\Downloads"
          $timeoutSecs = 450
          $softwareType = $env:SOFTWARE_TYPE
          $exeFilter   = $env:EXE_FILTER
          $sentinelPath = "$env:TEMP\download_done.flag"
          $installerExecutedSentinel = "$env:TEMP\installer_executed.flag"

          if ($env:ACTION_MODE -eq "install") {
              Write-Host "[Watcher] Action mode is INSTALL. Initializing download directory monitor..." -ForegroundColor Cyan
              $installJob = Start-Job -ScriptBlock {
                  param($dlFolder, $timeoutSecs, $softwareType, $exeFilter, $sentinelPath, $installerExecutedSentinel)
                  $deadline  = (Get-Date).AddSeconds($timeoutSecs)
                  $installed = $false

                  Write-Output "[$($softwareType.ToUpper())-WATCHER] Tracking directory: $dlFolder"
                  Write-Output "[$($softwareType.ToUpper())-WATCHER] Awaiting file matching: $exeFilter"

                  while (-not $installed -and (Get-Date) -lt $deadline) {
                      if (Test-Path "$env:TEMP\abort_install.flag") {
                          Write-Output "[$($softwareType.ToUpper())-WATCHER] Abort flag detected. Ending watcher."
                          break
                      }

                      $candidates = Get-ChildItem -Path $dlFolder -Filter $exeFilter -ErrorAction SilentlyContinue |
                          Where-Object { $_.Name -notmatch '\.(crdownload|part|tmp)$' } |
                          Sort-Object LastWriteTime -Descending

                      if ($candidates.Count -gt 0) {
                          $file = $candidates[0]
                          Write-Output "[$($softwareType.ToUpper())-WATCHER] SUCCESS: Payload binary found -> $($file.Name)"

                          try { Set-Content -Path $sentinelPath -Value "done" -ErrorAction SilentlyContinue } catch {}

                          Write-Output "[$($softwareType.ToUpper())-WATCHER] Aggressively closing Edge download tabs..."
                          for ($closeAttempt = 1; $closeAttempt -le 4; $closeAttempt++) {
                              try {
                                  $wsh = New-Object -ComObject WScript.Shell
                                  $edgeProcs = Get-Process -Name "msedge" -ErrorAction SilentlyContinue |
                                      Where-Object { $_.MainWindowHandle -ne 0 } |
                                      Sort-Object StartTime -Descending

                                  if ($edgeProcs) {
                                      foreach ($edgeProc in $edgeProcs) {
                                          $wsh.AppActivate($edgeProc.Id)
                                          Start-Sleep -Milliseconds 600
                                          $wsh.SendKeys("^w")
                                          Start-Sleep -Milliseconds 400
                                          $wsh.SendKeys("^w")
                                          Start-Sleep -Milliseconds 400
                                      }
                                  } else {
                                      $wsh.SendKeys("^w")
                                      Start-Sleep -Milliseconds 500
                                      $wsh.SendKeys("^w")
                                  }

                                  Start-Sleep -Milliseconds 800
                                  $remaining = Get-Process -Name "msedge" -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 }
                                  if (-not $remaining) {
                                      break
                                  }
                              } catch {}
                              Start-Sleep -Milliseconds 500
                          }

                          $remainingAfter = Get-Process -Name "msedge" -ErrorAction SilentlyContinue
                          if ($remainingAfter) {
                              Stop-Process -Name "msedge" -Force -ErrorAction SilentlyContinue
                          }

                          $actualSoftware = $softwareType
                          if ($softwareType -in @("ad_mvn", "dynamic_opera", "opera_smart_link")) {
                              if ($file.Name -match "OperaGX") { $actualSoftware = "opera_gx" }
                              elseif ($file.Name -match "Opera.*Setup|Opera") { $actualSoftware = "opera_one" }
                              elseif ($file.Name -match "avg") { $actualSoftware = "avg" }
                              else { $actualSoftware = "opera_one" }
                          }

                          Write-Output "[$($actualSoftware.ToUpper())-INSTALL] Fingerprinted as: $actualSoftware"
                          $locked = $true
                          while ($locked) {
                              Start-Sleep -Seconds 2
                              try {
                                  $s = [System.IO.File]::Open($file.FullName, 'Open', 'Read', 'None')
                                  $s.Close(); $locked = $false
                              } catch { }
                          }

                          try { Set-Content -Path $installerExecutedSentinel -Value $actualSoftware -ErrorAction SilentlyContinue } catch {}
                          try {
                              Start-Process -FilePath $file.FullName -ArgumentList "/silent" -Wait
                              Set-Content -Path "$env:TEMP\software_downloaded_success.flag" -Value "true" -ErrorAction SilentlyContinue
                          } catch {}

                          $installed = $true
                      } else {
                          Start-Sleep -Seconds 5
                      }
                  }
              } -ArgumentList $dlFolder, $timeoutSecs, $softwareType, $exeFilter, $sentinelPath, $installerExecutedSentinel
          }

          Write-Host "[System] Closing any lingering Edge processes..." -ForegroundColor DarkGray
          Stop-Process -Name "msedge" -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          Write-Host "[System] UI-Engine (Python) will autonomously manage Edge..." -ForegroundColor Cyan
          Write-Host "========== RUNTIME EXECUTION ==========" -ForegroundColor Cyan

          if ($env:ACTION_MODE -eq "install") {
              Write-Host "[Runtime] Operating in INSTALL pathway. Monitoring watcher job..." -ForegroundColor Cyan
              $deadline = (Get-Date).AddSeconds($timeoutSecs)
              while ($true) {
                  $output = Receive-Job -Job $installJob -ErrorAction SilentlyContinue
                  if ($output) { foreach ($line in $output) { Write-Host $line } }
                  if ($installJob.State -eq 'Completed' -or $installJob.State -eq 'Failed' -or (Get-Date) -gt $deadline) { break }
                  Start-Sleep -Seconds 5
              }
              Write-Host "[Runtime] Install job concluded. Task complete." -ForegroundColor Green

              if (Test-Path "$env:TEMP\software_downloaded_success.flag") {
                  Write-Host "[Runtime] Software downloaded and installed successfully." -ForegroundColor Green
                  "SOFTWARE_DOWNLOADED=true" | Out-File -FilePath $env:GITHUB_ENV -Append
              } else {
                  Write-Host "[Runtime] Software NOT downloaded. Skipping Keep-Alive." -ForegroundColor Yellow
              }

          } elseif ($env:ACTION_MODE -eq "surf") {
              Write-Host "============================================================" -ForegroundColor Cyan
              Write-Host " Operating in SURF pathway. Visitor Simulation Engine v2 Active." -ForegroundColor Cyan
              Write-Host " Visitor Profile: $env:PROFILE_TAG" -ForegroundColor Yellow
              Write-Host " Surf runtime  : randomised per session, HARD CAP 180s" -ForegroundColor Yellow
              Write-Host "============================================================" -ForegroundColor Cyan

              $surfDurationFile = "$env:TEMP\surf_duration.txt"
              $surfDoneFlag     = "$env:TEMP\surf_done.flag"
              $surfStatsFile    = "$env:TEMP\surf_stats.json"
              $surfHardCap      = 180   # max seconds of surfing (engine clock, starts when surfing begins)
              $startupCeiling   = 240   # max seconds to wait for the engine to begin (Edge launch, proxy auth, interstitial)
              $graceAfter       = 20    # slack after the assigned runtime before the watcher forces the end
              $step             = 5
              $elapsed          = 0
              $surfBeganAt      = -1
              $resolvedDuration = $surfHardCap

              while ($true) {
                  if (Test-Path $surfDoneFlag) {
                      $ranFor = if ($surfBeganAt -ge 0) { $elapsed - $surfBeganAt } else { $elapsed }
                      Write-Host "[SURF-RUNTIME] Profile $env:PROFILE_TAG reported completion after ${ranFor}s of surfing." -ForegroundColor Green
                      break
                  }

                  if ($surfBeganAt -lt 0 -and (Test-Path $surfDurationFile)) {
                      try {
                          $val = [int](Get-Content -Path $surfDurationFile -Raw).Trim()
                          if ($val -ge 10 -and $val -le $surfHardCap) { $resolvedDuration = $val }
                      } catch {}
                      $surfBeganAt = $elapsed
                      Write-Host "[SURF-RUNTIME] Surf engine started at ${elapsed}s (startup took ${elapsed}s). Assigned runtime: ${resolvedDuration}s (cap ${surfHardCap}s)." -ForegroundColor Green
                  }

                  if ($surfBeganAt -ge 0) {
                      $surfElapsed = $elapsed - $surfBeganAt
                      if ($surfElapsed -ge ($resolvedDuration + $graceAfter)) {
                          Write-Host "[SURF-RUNTIME] Runtime budget exceeded (${surfElapsed}s of ${resolvedDuration}s + ${graceAfter}s grace). Concluding session." -ForegroundColor Yellow
                          break
                      }
                      $pct = [math]::Min(100, [int](100 * $surfElapsed / [math]::Max(1, $resolvedDuration)))
                      Write-Host "[SURF-RUNTIME] Browsing active [$env:PROFILE_TAG]: $surfElapsed / $resolvedDuration s ($pct%)" -ForegroundColor Cyan
                  } else {
                      if ($elapsed -ge $startupCeiling) {
                          Write-Host "[SURF-RUNTIME] Surf engine never started within ${startupCeiling}s. Concluding session." -ForegroundColor Red
                          break
                      }
                      Write-Host "[SURF-RUNTIME] Waiting for surf engine to start (Edge launch / proxy auth / page load): $elapsed / $startupCeiling s" -ForegroundColor DarkGray
                  }

                  $unexpectedDownloads = Get-ChildItem -Path $dlFolder -File -ErrorAction SilentlyContinue
                  if ($unexpectedDownloads.Count -gt 0) {
                      Write-Host "[Safety-Purge] Purging download leak in surf mode! ($($unexpectedDownloads.Count) files)..." -ForegroundColor Red
                      Remove-Item -Path "$dlFolder\*" -Force -Recurse -ErrorAction SilentlyContinue
                  }

                  Start-Sleep -Seconds $step
                  $elapsed += $step
              }

              if (Test-Path $surfStatsFile) {
                  Write-Host "[SURF-RUNTIME] Session report: $(Get-Content -Path $surfStatsFile -Raw)" -ForegroundColor Magenta
              }
              Write-Host "[Runtime] Surf tracking complete ($elapsed s total incl. startup). All actions finished." -ForegroundColor Green
              Write-Host "[Runtime] Surf pathway exiting cleanly." -ForegroundColor Magenta
              exit 0

          } else {
              Write-Host "[Runtime] Operating in CLICK-ONLY pathway. Installations bypassed." -ForegroundColor Magenta

              if ($env:SOFTWARE_TYPE -eq "opera_smart_link") {
                  Write-Host "[Runtime] Allowing 75 seconds for TAB/ENTER interstitial routing..." -ForegroundColor Yellow
              } else {
                  Write-Host "[Runtime] Allowing 75 seconds for webpage to fully load..." -ForegroundColor Yellow
              }

              $clickStart      = Get-Date
              $clickTotal      = 75
              $step            = 15
              $reloadFired     = $false
              $reloadThreshold = Get-Random -Minimum 20 -Maximum 61

              Write-Host "[$env:SOFTWARE_TYPE] Click session started. Reload threshold: ${reloadThreshold}s" -ForegroundColor DarkGray

              for ($w = 0; $w -lt $clickTotal; $w += $step) {
                  Write-Host "[$env:SOFTWARE_TYPE] Click tracker: $w / $clickTotal seconds elapsed..." -ForegroundColor Yellow

                  $unexpectedDownloads = Get-ChildItem -Path $dlFolder -File -ErrorAction SilentlyContinue
                  if ($unexpectedDownloads.Count -gt 0) {
                      Write-Host "[Safety-Purge] Blocking auto-download leak! Purging $($unexpectedDownloads.Count) file(s)..." -ForegroundColor Red
                      Remove-Item -Path "$dlFolder\*" -Force -Recurse -ErrorAction SilentlyContinue
                  }

                  if (-not $reloadFired) {
                      $elapsed = [int]((Get-Date) - $clickStart).TotalSeconds
                      if ($elapsed -ge $reloadThreshold) {
                          Write-Host "[$env:SOFTWARE_TYPE] Reload threshold at ${elapsed}s. Executing F5 reload..." -ForegroundColor Cyan
                          try {
                              $wsh = New-Object -ComObject WScript.Shell
                              $wsh.SendKeys('{F5}')
                              Write-Host "[$env:SOFTWARE_TYPE] F5 sent successfully." -ForegroundColor Green
                          } catch {
                              Write-Host "[$env:SOFTWARE_TYPE] F5 reload failed: $_" -ForegroundColor Red
                          }
                          $reloadFired = $true
                      }
                  }

                  Start-Sleep -Seconds $step
              }

              Write-Host "[Runtime] Click tracking complete (75s). All click-path tasks finished." -ForegroundColor Green
              Write-Host "[Runtime] Click pathway exiting cleanly." -ForegroundColor Magenta
              exit 0
          }

      - name: Keep Runner Alive
        if: always() && matrix.action_mode == 'install' && env.SOFTWARE_DOWNLOADED == 'true'
        shell: pwsh
        env:
          KEEP_ALIVE_INPUT: ${{ inputs.keep_alive_duration }}
        run: |
          Write-Host "Session lifecycle fully executed." -ForegroundColor Green

          $durationMins = [int]($env:KEEP_ALIVE_INPUT -replace '[^\d]', '')
          $durationSecs = $durationMins * 60

          Write-Host "Leaving runner online for $durationMins minutes ($durationSecs seconds)..." -ForegroundColor Cyan
          Start-Sleep -Seconds $durationSecs
