          def _page_control_keys(container, control_type):
              keys = set()
              try:
                  docs = container.descendants(control_type="Document")
              except Exception:
                  return keys, False
              for doc in docs:
                  try:
                      for c in doc.descendants(control_type=control_type):
                          try: keys.add(tuple(c.element_info.runtime_id))
                          except Exception: pass
                  except Exception:
                      return keys, False
              return keys, True

          def _outside_page(container, control_type):
              try:
                  all_c = container.descendants(control_type=control_type)
              except Exception:
                  return []
              keys, ok = _page_control_keys(container, control_type)
              if not ok: return []
              if not keys: return list(all_c)
              out = []
              for c in all_c:
                  try: rid = tuple(c.element_info.runtime_id)
                  except Exception: rid = None
                  if rid is not None and rid in keys: continue
                  out.append(c)
              return out

          def _is_address_bar_control(ctrl):
