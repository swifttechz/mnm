                      time.sleep(0.2)
                      send_keys('{ENTER}')
                      log("ProxyAuth", f"[{label}] Keyboard-only auth submitted.")
                      return True

              except Exception as e:
                  log("ProxyAuth", f"[{label}] inject_proxy_auth exception: {e}")
                  return False

          # ---------------------------------------------------------------
          # Proxy auth polling
          # ---------------------------------------------------------------
          AUTH_SCAN_INTERVAL = 2
          LATE_VALVE_INTERVAL = 6
          _AUTH_CTX = {"last_scan": 0.0, "last_late": 0.0}

          def _find_edge_window(desktop):
              edge_window = None
              try:
                  for window in desktop.windows(visible_only=True):
                      wt = window.window_text()
                      if not wt: continue
                      if "Microsoft Edge" in wt or "Chrome Web Store" in wt or "Edge" in wt:
                          edge_window = window
              except Exception: pass
              return edge_window

          def proxy_auth_step():
              if not USE_PROXY: return
              now = time.time()
              try: desktop = Desktop(backend="uia")
              except Exception: return
              edge_window = _find_edge_window(desktop)

              if not PROXY_AUTH_STATE["done"]:
                  if now - _AUTH_CTX["last_scan"] < AUTH_SCAN_INTERVAL: return
                  _AUTH_CTX["last_scan"] = now
                  auth_injected_this_tick = False
                  seen_prompt = False
                  try:
                      for auth_window in desktop.windows(visible_only=True):
                          awt = auth_window.window_text() or ""
                          # v3.7 fix: DO inspect windows titled exactly "Microsoft Edge"
                          # (the auth dialog may live inside such a top-level window)
                          if "Microsoft Edge" in awt and awt != "Microsoft Edge":
                              continue
                          if _window_looks_like_auth_dialog(auth_window):
                              seen_prompt = True
                              log("ProxyAuth", f"[TopLevel] Auth dialog: '{awt}' - injecting...")
                              if inject_proxy_auth(auth_window, label=f"toplevel-{awt[:30]}"):
                                  auth_injected_this_tick = True; break
                  except Exception: pass

                  if not auth_injected_this_tick and edge_window:
                      try:
                          if _edge_has_proxy_prompt(edge_window):
                              seen_prompt = True
                              log("ProxyAuth", "[Edge-UI] Browser-UI credential prompt detected - injecting...")
                              if inject_proxy_auth(edge_window, label="edge-ui"):
                                  auth_injected_this_tick = True
                      except Exception: pass

                  if auth_injected_this_tick:
                      _mark_proxy_auth_done("credentials submitted")
                  elif seen_prompt:
                      PROXY_AUTH_STATE["page_ok_ticks"] = 0
                      PROXY_AUTH_STATE["last_prompt_seen"] = now
                  elif (edge_window and (now - PROXY_AUTH_STATE["started"]) > 10
                        and (now - PROXY_AUTH_STATE["last_prompt_seen"]) > 5):
                      if _page_loaded_without_prompt(edge_window):
                          PROXY_AUTH_STATE["page_ok_ticks"] += 1
                          if PROXY_AUTH_STATE["page_ok_ticks"] >= 3:
                              _mark_proxy_auth_done("page loaded with no proxy prompt - proxy already authenticated")
                      else:
                          PROXY_AUTH_STATE["page_ok_ticks"] = 0
              else:
                  age = now - PROXY_AUTH_STATE["done_time"]
                  if age <= LATE_PROMPT_WINDOW_SEC and PROXY_AUTH_STATE["late_reinjects"] < LATE_REINJECT_MAX:
                      if now - _AUTH_CTX["last_late"] >= LATE_VALVE_INTERVAL:
                          _AUTH_CTX["last_late"] = now
                          try: late_target = _find_genuine_proxy_prompt(desktop, edge_window)
                          except Exception: late_target = None
                          if late_target is not None:
                              PROXY_AUTH_STATE["late_reinjects"] += 1
                              log("ProxyAuth", f"[LatePrompt] genuine proxy prompt showing again - re-submitting "
                                               f"({PROXY_AUTH_STATE['late_reinjects']}/{LATE_REINJECT_MAX}).")
                              inject_proxy_auth(late_target, label="late-prompt", allow_late=True)
                  elif not PROXY_AUTH_STATE["valve_logged"]:
                      PROXY_AUTH_STATE["valve_logged"] = True
                      log("ProxyAuth", "Late-prompt window closed: proxy credential injection fully disabled.")

          def await_proxy_auth(target_url, timeout=120, max_relaunches=3):
              if not USE_PROXY: return True
              _reset_proxy_auth_state()
              t0 = time.time()
              relaunches = 0
              log("ProxyAuth", f"Waiting up to {timeout}s for the proxy dialog to be answered...")
              while time.time() - t0 < timeout:
                  proxy_auth_step()
                  if PROXY_AUTH_STATE["done"]: return True
                  try: edge_window = _find_edge_window(Desktop(backend="uia"))
                  except Exception: edge_window = None
                  if edge_window is not None and relaunches < max_relaunches:
                      title = (edge_window.window_text() or "").strip().lower()
                      elapsed = time.time() - t0
                      reason = None
                      if elapsed > 20 and title in ("microsoft edge", "edge", "new tab", "") \
                              and (time.time() - PROXY_AUTH_STATE["last_prompt_seen"]) > 5:
                          reason = f"blank title '{title}' after {elapsed:.0f}s"
                      elif detect_edge_error(edge_window):
                          reason = "proxy/connection error page"
                      if reason:
                          relaunches += 1
                          log("EdgeGuard", f"{reason} - relaunching Edge ({relaunches}/{max_relaunches})...")
                          verify_edge_launch(target_url)
                          _reset_proxy_auth_state()
                          t0 = time.time()
                  time.sleep(1)
              log("ProxyAuth", f"WARNING: proxy auth not confirmed within {timeout}s - attaching anyway.")
              return False

          def run_proxy_auth_loop(stop_event):
              log("ProxyAuthLoop", "Background proxy-auth thread started.")
              while not stop_event.is_set():
                  try: proxy_auth_step()
                  except Exception as ex: log("ProxyAuthLoop", f"scan error: {ex}")
                  time.sleep(1.5)
              log("ProxyAuthLoop", "Background proxy-auth thread stopped.")

          # ---------------------------------------------------------------
          # GoLogin token page flow
          # ---------------------------------------------------------------
          def token_via_settings(pg):
              pg.goto("https://app.gologin.com/#/personalArea/TokenApi",
                      wait_until="domcontentloaded", timeout=30000)
              time.sleep(3)
              dismiss_overlays(pg, 3)
              new_btn = find_visible(pg, [
                  pg.get_by_role("button", name=re.compile(r"new token", re.I)),
                  pg.get_by_role("button", name=re.compile(r"(create|generate).{0,12}token", re.I)),
              ], 8000)
              if not new_btn:
                  click_first(pg, [
                      pg.get_by_text(re.compile(r"API\s*(&|and)\s*MCP", re.I)),
                      pg.get_by_role("link", name=re.compile(r"^api", re.I)),
                  ], 4000)
                  time.sleep(2.5)
                  dismiss_overlays(pg, 2)
                  new_btn = find_visible(pg, [pg.get_by_role("button", name=re.compile(r"new token", re.I))], 8000)
              scan_page(pg, "settings-existing")
              shot(pg, "api-page")
              if not new_btn:
                  log("Token", "no 'New token' button found on the API page")
                  return
              new_btn.click()
              time.sleep(1.5)
              try:
                  name_input = pg.locator(
                      '[role="dialog"] input[type="text"], [class*="modal" i] input[type="text"]').first
                  if name_input.is_visible():
                      name_input.fill(f"actions-{IDX}")
              except Exception: pass
              click_first(pg, [pg.get_by_role(
                  "button", name=re.compile(r"^(create|generate|save|confirm|ok|done|continue)\b", re.I))], 3000)
              time.sleep(2.5)
              scan_page(pg, "settings-new")
              click_first(pg, [
                  pg.get_by_role("button", name=re.compile(r"copy", re.I)),
                  pg.get_by_text(re.compile(r"^copy( token)?$", re.I)),
              ], 2000)
              read_clipboard(pg)
              shot(pg, "settings-after-new-token")

          # ---------------------------------------------------------------
          # Main browser automation flow
          # ---------------------------------------------------------------
          def run_flow(pw, result, page_ref):
              try:
                  browser = connect_cdp(pw)
                  context = browser.contexts[0] if browser.contexts else browser.new_context()
                  try:
                      context.grant_permissions(["clipboard-read", "clipboard-write"])
                  except Exception as e:
                      log("Main", f"clipboard permission grant skipped: {e}")

                  def on_response(r):
                      try:
                          if "gologin.com" not in r.url or "token" not in r.url.lower(): return
                          ct = r.headers.get("content-type", "")
                          if "json" not in ct and "text" not in ct: return
                          for m in JWT.findall(r.text()):
                              add_candidate(m, "network:" + r.url.split("?")[0][-40:])
                      except Exception: pass

                  context.on("response", on_response)
                  context.add_init_script(INIT_JS)

                  page = None
                  for p in context.pages:
                      if "gologin" in (p.url or "").lower():
                          page = p; break
                  if page is None:
                      page = context.pages[0] if context.pages else context.new_page()
                  page_ref[0] = page
                  page.set_default_timeout(25000)
                  try: page.evaluate(INIT_JS)
                  except Exception: pass

                  banner("Phase 2 - Fill the sign-up form")
                  log("Main", f"Edge is already on: {page.url}")
                  if "sign_up" not in (page.url or ""):
                      log("Main", "Not on the sign-up page yet - navigating...")
                      page.goto(SIGNUP_URL, wait_until="domcontentloaded", timeout=60000)

                  email_field = find_visible(page, [
                      page.get_by_placeholder(re.compile(r"your email", re.I)),
                      page.locator('input[type="email"]'),
                      page.locator('input[name="email"]'),
                      page.locator('input[placeholder*="email" i]'),
                  ], 30000)
                  if not email_field:
                      shot(page, "no-email-field")
                      raise RuntimeError("Sign-up email field not found. Check the screenshot.")
                  time.sleep(random.uniform(1.5, 2.5))
                  shot(page, "signup-page")

                  log("Main", f"Entering email: {EMAIL}")
                  type_human(email_field, EMAIL)
                  time.sleep(random.uniform(2, 4))
                  shot(page, "email-entered")

                  tick_tos(page)
                  time.sleep(random.uniform(1.2, 2.0))
                  shot(page, "tos-ticked")

                  click_first(page, [
                      page.get_by_role("button", name=re.compile(r"try 7 days for free", re.I)),
                      page.get_by_role("button", name=re.compile(r"try.*free", re.I)),
                      page.get_by_role("button", name=re.compile(r"continue", re.I)),
                  ], 10000)
                  time.sleep(random.uniform(2, 3.5))

                  banner("Phase 3 - Password + Turnstile (v4 GUI) + Create account")

                  def password_visible():
                      return (page.locator('input[type="password"]').first.is_visible()
                              or page.get_by_placeholder(re.compile(r"your password", re.I)).first.is_visible())

                  stage1 = wait_any([
                      ["password", password_visible],
                      ["error", lambda: page.get_by_text(re.compile(
                          r"already (registered|exists|in use|taken)|invalid email|too many|something went wrong", re.I)
                      ).first.is_visible()],
                  ], 45000)
                  shot(page, "after-email-submit")
                  if stage1 != "password":
                      raise RuntimeError(f"Password step not reached (stage={stage1}). Check the screenshot.")

                  pass_field = page.get_by_placeholder(re.compile(r"your password", re.I)).first
                  confirm_field = page.get_by_placeholder(re.compile(r"confirm password", re.I)).first
                  try:
                      if not (pass_field.is_visible() and confirm_field.is_visible()):
                          raise ValueError("placeholders not found")
                  except Exception:
                      pw_inputs = page.locator('input[type="password"]')
                      pass_field = pw_inputs.nth(0)
                      confirm_field = pw_inputs.nth(1) if pw_inputs.count() > 1 else None

                  type_human(pass_field, PASSWORD)
                  time.sleep(random.uniform(0.6, 1.0))
                  if confirm_field is not None:
                      type_human(confirm_field, PASSWORD)
                  time.sleep(random.uniform(0.8, 1.5))
                  tick_tos(page)
                  time.sleep(random.uniform(0.8, 1.4))
                  shot(page, "password-filled")

                  def left_password_step():
                      try:
                          if not page.locator('input[type="password"]').first.is_visible():
                              return True
                      except Exception:
                          return True
                      return False

                  # v4: up to 4 Create account attempts, Turnstile FIRST each time
                  created = False
                  for attempt in range(1, 5):
                      log("Main", f"=== Create account attempt {attempt}/4 ===")

                      # 1) Solve Turnstile FIRST (GUI automation as strategy 0)
                      ts_ok = solve_turnstile(page, f"a{attempt}", min_wait=10)
                      log("Main", f"Turnstile solve result (attempt {attempt}): {ts_ok}")

                      # 2) Extra wait after Turnstile to let token settle
                      time.sleep(random.uniform(2.0, 3.5))
                      shot(page, f"before-create-account-{attempt}")

                      # 3) Click "Create an account" ONLY after Turnstile confirmed
                      log("Main", f"Clicking 'Create an account' (attempt {attempt})")
                      clicked = click_first(page, [
                          page.get_by_role("button", name=CREATE_RE),
                          page.locator('button:has-text("Create")'),
                          page.locator('button[type="submit"]'),
                      ], 8000)
                      log("Main", f"Create click result: {clicked}")
                      time.sleep(random.uniform(2.0, 3.0))
                      shot(page, f"after-create-click-{attempt}")

                      # 4) Did we move past the password step?
                      moved = wait_any([
                          ["left", left_password_step],
                          ["survey", lambda: page.get_by_text(re.compile(r"have you ever used antidetect", re.I)).first.is_visible()],
                          ["allset", lambda: page.get_by_text(re.compile(r"all set", re.I)).first.is_visible()],
                          ["dashboard", lambda: is_dashboard(page)],
                          ["installer", lambda: "download-installer" in page.url],
                      ], 25000)
                      log("Main", f"After create click: moved={moved}")
                      if moved:
                          created = True; break
                      log("Main", f"Still on password step — re-solving Turnstile (attempt {attempt+1})")
                      time.sleep(random.uniform(2.0, 3.5))

                  if not created:
                      shot(page, "create-never-advanced")
                      raise RuntimeError("Create account did not advance after 4 attempts (Turnstile/Create failed)")

                  stage2 = wait_any([
                      ["survey",   lambda: page.get_by_text(re.compile(r"have you ever used antidetect", re.I)).first.is_visible()],
                      ["allset",   lambda: page.get_by_text(re.compile(r"all set", re.I)).first.is_visible()],
                      ["dashboard",lambda: is_dashboard(page)],
                      ["installer",lambda: "download-installer" in page.url],
                      ["error",    lambda: page.get_by_text(re.compile(
                          r"already (registered|exists|in use|taken)|password is too|something went wrong", re.I)
                      ).first.is_visible()],
                  ], 90000)
                  shot(page, "after-create-account")

                  if stage2 in ("error", None):
                      raise RuntimeError(f"Account creation failed (stage={stage2}). Check the screenshot.")
                  result["signup"] = True
                  log("Main", f"ACCOUNT CREATED: {EMAIL} (stage={stage2})")

                  banner("Phase 4 - Onboarding")
                  for _ in range(5):
                      close_btn = find_visible(page, [
                          page.locator('[aria-label="Close" i]'),
                          page.locator('button.close, button[class*="close" i]'),
                          page.get_by_role("button", name=re.compile(r"^\u00d7$|^close$", re.I)),
                      ], 3000)
                      if close_btn:
                          try: close_btn.click(); log("Main", "closed onboarding modal")
                          except Exception: pass
                          time.sleep(1.2); break
                      if "download-installer" in page.url:
                          page.goto("https://app.gologin.com/profileList",
                                    wait_until="domcontentloaded", timeout=30000)
                          time.sleep(2); break
                      time.sleep(0.8)
                  for _ in range(4):
                      skip = find_visible(page, [
                          page.get_by_text(re.compile(r"skip recommended setup", re.I)),
                          page.get_by_role("link", name=re.compile(r"skip", re.I)),
                          page.get_by_role("button", name=re.compile(r"skip", re.I)),
                      ], 3000)
                      if skip:
                          try: skip.click(); log("Main", "clicked Skip")
                          except Exception: pass
                          time.sleep(1.5); break
                      time.sleep(0.6)
                  dismiss_overlays(page, 8)
                  shot(page, "after-onboarding")
                  if not is_dashboard(page):
                      page.goto("https://app.gologin.com/profileList",
                                wait_until="domcontentloaded", timeout=30000)
                      time.sleep(3)
                      dismiss_overlays(page, 5)
                  shot(page, "dashboard")
                  log("Main", "Reached GoLogin dashboard.")

                  banner("Phase 5 - Run -> API control -> Copy token")
                  run_btn = find_visible(page, [page.get_by_role("button", name="Run", exact=True)], 20000)

                  if not run_btn:
                      log("Main", "No Run button - going to Settings API page")
                      token_via_settings(page)
                  else:
                      run_btn.click()
                      log("Main", "clicked Run")
                      time.sleep(random.uniform(1, 1.8))
                      shot(page, "run-menu")
                      api_clicked = click_first(page, [
                          page.get_by_text(re.compile(r"api control", re.I)),
                          page.get_by_role("menuitem", name=re.compile(r"api control", re.I)),
                      ], 10000)
                      if not api_clicked:
                          log("Main", '"API control" not found - going to Settings')
                          token_via_settings(page)
                      else:
                          log("Main", 'clicked "API control"')
                          time.sleep(random.uniform(2, 3.5))
                          shot(page, "api-control-page")
                          scan_page(page, "cloud-api-control")
                          copy_el = find_visible(page, [
                              page.get_by_text(re.compile(r"copy token", re.I)),
                              page.get_by_role("button", name=re.compile(r"copy token", re.I)),
                          ], 20000)
                          if copy_el:
                              copy_el.click()
                              log("Main", "clicked Copy token")
                              time.sleep(random.uniform(1, 1.5))
                              read_clipboard(page)
                              shot(page, "after-copy-token")
                          else:
                              log("Main", '"Copy token" not found - scanning page source')
                              scan_page(page, "cloud-api-control-scan")

                  if not [c for c in candidates if rank_of(c["source"]) <= 2]:
                      log("Main", "No trusted token yet - trying the Settings API page")
                      token_via_settings(page)

                  if not candidates:
                      shot(page, "no-token")
                      raise RuntimeError("Signup succeeded but no API token extracted.")

                  ordered = sorted(candidates, key=lambda c: rank_of(c["source"]))
                  pick = None
                  for c in ordered[:5]:
                      st = rest_status(c["token"])
                      log("Main", f"REST /user check for {c['source']}: {st}")
                      if st == 200:
                          pick = c
                          result["restStatus"] = st; break
                      if result["restStatus"] is None:
                          result["restStatus"] = st
                  if pick is None:
                      pick = ordered[0]
                      log("Main", "WARNING: no candidate passed the REST check - keeping the best-ranked one")

                  result["token"] = pick["token"]
                  result["tokenSource"] = pick["source"]
                  (OUT / "token.txt").write_text(pick["token"] + "\n", encoding="utf-8")

                  try: browser.close()
                  except Exception: pass

              except Exception:
                  if page_ref[0] is not None:
                      shot(page_ref[0], "error")
                  raise

          def main():
              proxy_display = (f"{PROXY_LABEL}:{PROXY_SERVER} user={PROXY_USER[:6]}***"
                               if USE_PROXY else "none")
              result = {
                  "index": int(IDX), "email": EMAIL, "password": PASSWORD,
                  "signup": False, "token": None, "tokenSource": None,
                  "restStatus": None, "error": None, "finishedAt": None,
                  "proxy": proxy_display,
              }

              stop_event = threading.Event()
              auth_thread = None
              page_ref = [None]

              try:
                  if not EMAIL or not PASSWORD:
                      raise RuntimeError("ACC_EMAIL / ACC_PASSWORD are empty.")

                  banner("Phase 0 - Launch Edge with proxy injected, straight onto GoLogin page")
                  log("Main", f"Proxy: {proxy_display}")
                  if not verify_edge_launch(SIGNUP_URL):
                      raise RuntimeError("Could not verify Edge launch after 5 attempts.")

                  banner("Phase 0b - Proxy popup automation (main109FA logic)")
                  if USE_PROXY:
                      await_proxy_auth(SIGNUP_URL)
                      auth_thread = threading.Thread(target=run_proxy_auth_loop,
                                                     args=(stop_event,), daemon=True)
                      auth_thread.start()
                  else:
                      log("Main", "No proxy - nothing to authenticate.")

                  banner("Phase 1 - Playwright attaches to Edge via CDP")
                  with sync_playwright() as pw:
                      run_flow(pw, result, page_ref)

              except Exception as e:
                  result["error"] = str(e)
                  print(f"::error::Device {IDX} ({EMAIL}): {e}", flush=True)
                  traceback.print_exc()
                  sys.exit(1)

              finally:
                  stop_event.set()
                  if auth_thread and auth_thread.is_alive():
                      auth_thread.join(timeout=5)
                  try:
                      if EDGE_PROC and EDGE_PROC.poll() is None:
                          EDGE_PROC.terminate()
                  except Exception: pass
                  kill_edge()
                  result["finishedAt"] = datetime.datetime.now(datetime.timezone.utc).isoformat()
                  (OUT / "result.json").write_text(json.dumps(result, indent=2), encoding="utf-8")

                  print("\n" + "="*60)
                  print("GOLOGIN SIGNUP RESULT")
                  print("="*60)
                  print(f"device    : {IDX}")
                  print(f"email     : {EMAIL}")
                  print(f"signup    : {'OK' if result['signup'] else 'FAILED'}")
                  print(f"proxy     : {result['proxy']}")
                  print(f"source    : {result.get('tokenSource') or '-'}")
                  print(f"REST /user: {result.get('restStatus') or '-'}")
                  print("\nAPI KEY (copy the line below):")
                  print(result.get("token") or "(not captured)")
                  print("="*60 + "\n")

                  if result.get("token"):
                      print(f"::notice title=GoLogin API key (device {IDX} - {EMAIL})::{result['token']}", flush=True)

                  summ = os.environ.get("GITHUB_STEP_SUMMARY")
                  if summ:
                      md = "\n".join([
                          f"### Device {IDX}: {EMAIL}",
                          f"- Signup: **{'OK' if result['signup'] else 'FAILED'}**",
                          f"- Proxy: {result['proxy']}",
                          f"- API key: `{result.get('token') or 'not captured'}`",
                          f"- Source: {result.get('tokenSource') or '-'}  |  REST: {result.get('restStatus') or '-'}",
                          (f"- Error: {result['error']}" if result.get("error") else ""),
                          "",
                      ])
                      with open(summ, "a", encoding="utf-8") as fh:
                          fh.write(md + "\n")

          if __name__ == "__main__":
              main()
          PYEOF

      # ================================================================
      # STEP 8 — Verify Edge is available
      # ================================================================
      - name: "[8/11] Confirm Microsoft Edge is available"
        shell: pwsh
        run: |
          $edge = @(
            "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe",
            "C:\Program Files\Microsoft\Edge\Application\msedge.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($edge) {
            Write-Host "[Edge] Found: $edge"
            $v = (Get-Item $edge).VersionInfo.ProductVersion
            Write-Host "[Edge] Version: $v"
          } else {
            Write-Host "::error::Microsoft Edge not found in the standard install paths."
            exit 1
          }

      # ================================================================
      # STEP 9 — Run automation
      # ================================================================
      - name: "[9/11] Run GoLogin signup automation"
        id: automation
        working-directory: automation
        timeout-minutes: 25
        env:
          OUT_DIR:       out
          CDP_PORT:      ${{ env.CDP_PORT }}
          PROXY_REAL_IP: ${{ env.PROXY_REAL_IP }}
          USE_PROXY:     ${{ env.USE_PROXY }}
          PROXY_SERVER:  ${{ env.PROXY_SERVER }}
          PROXY_HOST:    ${{ env.PROXY_HOST }}
          PROXY_PORT:    ${{ env.PROXY_PORT }}
          PROXY_USER:    ${{ env.PROXY_USER }}
          PROXY_PASS:    ${{ env.PROXY_PASS }}
          PROXY_SCHEME:  ${{ env.PROXY_SCHEME }}
          PROXY_LABEL:   ${{ env.PROXY_LABEL }}
          PROXY_TYPE:    ${{ env.PROXY_TYPE }}
        run: python signup.py

      # ================================================================
      # STEP 10 — Upload screenshots + result
      # ================================================================
      - name: "[10/11] Upload screenshots and result"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.index }}
          path: automation/out
          if-no-files-found: warn
          retention-days: 7

      # ================================================================
      # STEP 11 — Keep device alive
      # ================================================================
      - name: "[11/11] Keep device alive for inspection"
        if: ${{ always() && env.KEEP_MIN != '0' }}
        run: |
          total=$KEEP_MIN
          echo "Keeping device alive for ${total}min (outcome: ${{ steps.automation.outcome }})."
          [[ -n "$GS_EMAIL" ]] && echo "Connect via Getscreen: device gh-${GITHUB_RUN_ID}-dev${ACC_INDEX}-win"
          for ((m=total; m>0; m--)); do echo "  ...${m}min left"; sleep 60; done

      # ================================================================
      # CLEANUP
      # ================================================================
      - name: "Cleanup - close Edge, disconnect WARP"
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "Closing Edge..."
          & taskkill /F /IM msedge.exe /T 2>&1 | Out-Null

          if ($env:WARP_ON -eq "true") {
            $cli = "C:\Program Files\Cloudflare\Cloudflare WARP\warp-cli.exe"
            if (Test-Path $cli) { & $cli '--accept-tos' 'disconnect' 2>&1 | Out-Null }
          }
          Write-Host "Device $($env:ACC_INDEX) ($($env:ACC_EMAIL)) done."
          # Reset $LASTEXITCODE so the step doesn't report failed due to taskkill exit codes
          $global:LASTEXITCODE = 0
          exit 0

# =============================================================================
# JOB 4 — REPORT: combined summary of all accounts + API keys
# =============================================================================
  report:
    name: "Combined API key report"
    needs: [prepare, signup]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: all
        continue-on-error: true

      - name: Print and summarise all accounts
        run: |
          shopt -s nullglob
          files=(all/*/result.json)
          if (( ${#files[@]} == 0 )); then echo "::warning::No result files produced"; exit 0; fi

          jq -s 'sort_by(.index)' "${files[@]}" > all-results.json
          total=$(jq 'length' all-results.json)
          ok=$(jq '[.[] | select(.token != null)] | length' all-results.json)

          echo "========= ALL GOLOGIN ACCOUNTS ($ok/$total with API key) ========="
          jq -r '.[] | "#\(.index)  \(.email)\n  signup : \(.signup)\n  proxy  : \(.proxy // "n/a")\n  API KEY: \(.token // "NOT CAPTURED")\n  error  : \(.error // "-")\n"' all-results.json
          echo "=================================================================="
          echo "--- API keys only (email  token) ---"
          jq -r '.[] | select(.token != null) | "\(.email)  \(.token)"' all-results.json

          {
            echo "## GoLogin accounts — combined ($ok of $total with API key)"
            echo "| # | Email | Proxy | Signup | API key |"
            echo "|---|-------|-------|--------|---------|"
            jq -r '.[] | "| \(.index) | \(.email) | \(.proxy // "none") | \(if .signup then "OK ✓" else "FAILED ✗" end) | `\(.token // "not captured")` |"' all-results.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined results
        uses: actions/upload-artifact@v4
        with:
          name: gologin-all-results
          path: all-results.json
          if-no-files-found: ignore
          retention-days: 7
