                  aid = ""
                  cls = ""
                  try: aid = (ctrl.element_info.automation_id or "").lower()
                  except Exception: pass
                  try: cls = (ctrl.element_info.class_name or "").lower()
                  except Exception: pass
                  for name in ADDRESS_BAR_NAMES:
                      if name in wt or name in aid: return True
                  for aid_kw in ADDRESS_BAR_AUTOMATION_IDS:
                      if aid_kw.lower() in aid: return True
                  if "omnibox" in cls or "addressbar" in cls: return True
              except Exception: pass
              return False

          def _edge_has_proxy_prompt(edge_window):
              try:
                  edits = [c for c in _outside_page(edge_window, "Edit") if not _is_address_bar_control(c)]
              except Exception:
                  return False
              if not edits: return False
              if len(edits) == 2: return True
              try:
                  for t in edge_window.descendants(control_type="Text")[:300]:
                      tt = t.window_text() or ""
                      if tt and _window_mentions_proxy_host(tt): return True
              except Exception: pass
              return False

          def _find_genuine_proxy_prompt(desktop, edge_window):
              try:
                  for w in desktop.windows(visible_only=True):
                      try: awt = w.window_text() or ""
                      except Exception: continue
                      if "Microsoft Edge" in awt: continue
                      if _window_mentions_proxy_host(awt): return w
                      try:
                          for t in w.descendants(control_type="Text")[:60]:
                              if _window_mentions_proxy_host(t.window_text() or ""): return w
                      except Exception: pass
              except Exception: pass
              if edge_window is not None and _edge_has_proxy_prompt(edge_window):
                  try:
                      for t in edge_window.descendants(control_type="Text")[:300]:
                          if _window_mentions_proxy_host(t.window_text() or ""): return edge_window
                  except Exception: pass
              return None

          def _page_loaded_without_prompt(edge_window):
