          def find_edge():
              for p in EDGE_EXE_CANDIDATES:
                  if os.path.exists(p): return p
              return shutil.which("msedge")

          def kill_edge():
              os.system("taskkill /F /IM msedge.exe >nul 2>&1")

          def cdp_ready(timeout=30):
              end = time.time() + timeout
              while time.time() < end:
                  try:
                      with urllib.request.urlopen(f"http://127.0.0.1:{CDP_PORT}/json/version", timeout=2) as r:
                          if r.status == 200: return True
                  except Exception: pass
                  time.sleep(0.5)
              return False

          def launch_edge_guaranteed(target_url, attempt_num=1):
              global EDGE_PROC
              exe = find_edge()
              if not exe:
                  log("EdgeLaunch", "CRITICAL: Microsoft Edge executable not found!")
                  return False
              try:
                  kill_edge()
                  time.sleep(2)
              except Exception: pass

              user_dir = os.path.join(tempfile.gettempdir(), f"EdgeProfile_{random.randint(100000, 999999)}")
              cmd_parts = [
                  f'"{exe}"',
                  f'--user-data-dir="{user_dir}"',
                  f'--remote-debugging-port={CDP_PORT}',
                  '--remote-debugging-address=127.0.0.1',
                  '--no-first-run',
                  '--no-default-browser-check',
                  '--disable-sync',
                  '--disable-features=msSmartScreenProtection,SmartScreenPuaEnabled,CalculateNativeWinOcclusion',
                  '--restore-last-session=false',
                  '--hide-crash-restore-window',
                  '--disable-blink-features=AutomationControlled',
                  '--force-webrtc-ip-handling-policy=disable_non_proxied_udp',
              ]
              if USE_PROXY and PROXY_SERVER.strip():
                  srv = PROXY_SERVER.strip()
                  if "://" not in srv: srv = "http://" + srv
                  cmd_parts.append(f'--proxy-server="{srv}"')
                  log("EdgeLaunch", f"Attempt {attempt_num}: Proxy injected -> {srv}")
              else:
                  log("EdgeLaunch", f"Attempt {attempt_num}: Direct mode (no proxy)")
              cmd_parts.append(f'"{target_url.strip()}"')
              cmd = " ".join(cmd_parts)
              log("EdgeLaunch", f"Attempt {attempt_num} CMD: {cmd[:260]}")
              try:
                  EDGE_PROC = subprocess.Popen(cmd, shell=True)
                  log("EdgeLaunch", f"Attempt {attempt_num}: Edge process spawned.")
                  return True
              except Exception as e:
                  log("EdgeLaunch", f"Attempt {attempt_num}: Popen failed: {e}")
                  return False

          def verify_edge_launch(target_url, max_attempts=5):
              for attempt in range(1, max_attempts + 1):
                  if not launch_edge_guaranteed(target_url, attempt_num=attempt):
                      time.sleep(2)
                      continue
                  start_wait = time.time()
                  last = attempt == max_attempts

                  if USE_PROXY and PROXY_USER and PROXY_PASS:
                      log("EdgeLaunch", "Authenticated proxy. Waiting up to 10s for the proxy auth dialog...")
                      auth_found = False
                      while time.time() - start_wait < 10:
                          try:
                              for w in Desktop(backend="uia").windows(visible_only=True):
                                  wt = w.window_text() or ""
                                  if _is_proxy_auth_dialog(wt):
                                      auth_found = True; break
                                  if "Microsoft Edge" in wt or "Edge" in wt:
                                      u, p = _is_auth_dialog_by_structure(w)
                                      if u and p:
                                          auth_found = True; break
                          except Exception: pass
                          if auth_found: break
                          time.sleep(1)
                      if auth_found:
                          log("EdgeLaunch", "Proxy auth dialog detected. Edge launched correctly.")
                          return True
                      if last:
                          log("EdgeLaunch", "WARNING: no auth dialog seen on the last attempt - continuing anyway.")
                          return True
                      log("EdgeLaunch", "No proxy auth dialog within 10s. Relaunching...")
                      kill_edge()
                      time.sleep(2)
                  else:
                      log("EdgeLaunch", "Direct / unauthenticated mode. Waiting up to 12s for the page title...")
                      url_loaded = False
                      while time.time() - start_wait < 12:
                          try:
                              for w in Desktop(backend="uia").windows(visible_only=True):
                                  wtl = (w.window_text() or "").lower()
                                  if ("microsoft edge" in wtl or "msedge" in wtl) and wtl not in ("microsoft edge", "edge", "new tab", ""):
                                      url_loaded = True; break
                          except Exception: pass
                          if url_loaded: break
                          time.sleep(1)
                      if url_loaded:
                          log("EdgeLaunch", "URL loaded. Edge launched correctly.")
                          return True
                      if last:
                          log("EdgeLaunch", "WARNING: page title never appeared - continuing anyway.")
                          return True
                      log("EdgeLaunch", "URL did not load within 12s. Relaunching...")
                      kill_edge()
                      time.sleep(2)
              return False

          def detect_edge_error(edge_window):
              try:
                  error_kw = [
                      "can't reach this page", "err_connection_closed",
                      "err_proxy_connection_failed", "err_connection_reset",
                      "err_connection_timed_out", "site can't be reached",
                      "checking the proxy and the firewall", "err_empty_response",
                      "err_network_changed",
                  ]
                  title = (edge_window.window_text() or "").lower()
                  if any(kw in title for kw in error_kw): return True
                  try:
                      for doc in edge_window.descendants(control_type="Document"):
                          name = (doc.element_info.name or "").lower()
                          if any(kw in name for kw in error_kw): return True
                  except Exception: pass
                  try:
                      for text_el in edge_window.descendants(control_type="Text"):
                          txt = (text_el.window_text() or "").lower()
                          if any(kw in txt for kw in error_kw): return True
                  except Exception: pass
              except Exception: pass
              return False

          def connect_cdp(pw, attempts=4):
              if not cdp_ready(30):
                  raise RuntimeError(f"Edge CDP endpoint 127.0.0.1:{CDP_PORT} is not answering.")
              last = None
              for n in range(1, attempts + 1):
                  try:
                      return pw.chromium.connect_over_cdp(f"http://127.0.0.1:{CDP_PORT}", timeout=30000)
                  except Exception as e:
                      last = e
                      log("CDP", f"connect attempt {n}/{attempts} failed: {e}")
                      time.sleep(2)
              raise RuntimeError(f"Playwright could not attach to Edge over CDP: {last}")

