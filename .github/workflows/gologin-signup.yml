            # ================================================================
      # STEP 6 — Install Python dependencies (pywinauto + Playwright)
      # Proxy injection uses subprocess --proxy-server + pywinauto
      # (identical approach to main10FA which works reliably in prod).
      # Playwright is used for GoLogin form automation only.
      # ================================================================
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: "[6/11] Install Python deps + Playwright"
        run: |
          set -euo pipefail
          echo "[Deps] Installing pywinauto, keyboard, requests..."
          python -m pip install pywinauto keyboard requests urllib3 --quiet
          echo "[Deps] Installing Playwright + msedge..."
          mkdir -p automation/out
          cd automation
          cat > package.json <<'PKG'
          {"name":"gologin-signup-automation","version":"1.0.0","private":true}
          PKG
          npm install --no-audit --no-fund "playwright@${PLAYWRIGHT_VERSION}"
          node -e "const {chromium}=require('playwright'); chromium.launch({channel:'msedge',headless:true}).then(b=>{console.log('Edge ok',b.version());return b.close()}).catch(async()=>{const {execSync}=require('child_process');execSync('npx playwright install msedge',{stdio:'inherit'})})"
          echo "[Deps] All installed."

      # ================================================================
      # STEP 7 — Write signup automation script (Python, main10FA style)
      #
      # Architecture (matches main10FA exactly):
      #   1. Edge launched via subprocess.Popen with --proxy-server flag
      #   2. pywinauto polling loop watches for native OS proxy auth dialog
      #      and auto-fills credentials (one-shot, web-page-safe)
      #   3. Once proxy is authenticated (page loads OR auth submitted),
      #      Playwright attaches to the running Edge via CDP and drives
      #      the GoLogin signup form
      #   4. Token extraction via DOM scan + network intercept
      # ================================================================
      - name: "[7/11] Write signup automation script"
        run: |
          mkdir -p automation/out
          cat > automation/signup.py << 'PYEOF'
          import os, sys, time, subprocess, tempfile, random, string, json, re
          import datetime, unicodedata, threading, pathlib

          # ---------------------------------------------------------------
          # Dependencies check
          # ---------------------------------------------------------------
          try:
              from pywinauto import Desktop
              from pywinauto.keyboard import send_keys
          except ImportError:
              subprocess.check_call([sys.executable, "-m", "pip", "install",
                                     "pywinauto", "keyboard", "--quiet"])
              from pywinauto import Desktop
              from pywinauto.keyboard import send_keys

          try:
              from playwright.sync_api import sync_playwright
          except ImportError:
              subprocess.check_call([sys.executable, "-m", "pip", "install",
                                     "playwright", "--quiet"])
              from playwright.sync_api import sync_playwright

          # ---------------------------------------------------------------
          # Config from environment
          # ---------------------------------------------------------------
          EMAIL        = os.environ.get("ACC_EMAIL", "")
          PASSWORD     = os.environ.get("ACC_PASSWORD", "")
          IDX          = os.environ.get("ACC_INDEX", "1")
          OUT          = pathlib.Path(os.environ.get("OUT_DIR", "out")).resolve()
          OUT.mkdir(parents=True, exist_ok=True)

          USE_PROXY    = os.environ.get("USE_PROXY",    "false").lower() == "true"
          PROXY_SERVER = os.environ.get("PROXY_SERVER", "")  # e.g. http://host:port
          PROXY_USER   = os.environ.get("PROXY_USER",   "")
          PROXY_PASS   = os.environ.get("PROXY_PASS",   "")
          PROXY_LABEL  = os.environ.get("PROXY_LABEL",  "none")

          EDGE_EXE_CANDIDATES = [
              r"C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe",
              r"C:\Program Files\Microsoft\Edge\Application\msedge.exe",
          ]

          # ---------------------------------------------------------------
          # Logging
          # ---------------------------------------------------------------
          def log(tag, msg):
              print(f"[{time.strftime('%H:%M:%S')}][dev{IDX}][{tag}] {msg}", flush=True)

          def banner(title):
              print(f"\n{'='*60}\n[dev{IDX}] {title}\n{'='*60}", flush=True)

          shot_n = [0]
          def shot(page, label):
              try:
                  shot_n[0] += 1
                  page.screenshot(path=str(OUT / f"{shot_n[0]:02d}-{label}.png"))
              except Exception: pass

          # ---------------------------------------------------------------
          # Proxy auth keywords (ported verbatim from main10FA)
          # ---------------------------------------------------------------
          PROXY_AUTH_TITLE_KEYWORDS = [
              "sign in", "authentication required", "proxy authentication",
              "connect to", "enter credentials", "network authentication",
              "proxy auth", "enter network credentials", "authentication",
              "proxy", "credential",
              "connexion", "authentification",
              "entrar", "autenticacao", "conectar",
              "anmelden", "authentifizierung",
              "iniciar sesion", "autenticacion",
              "accedi", "autenticazione",
              "aanmelden", "authenticatie",
              "zaloguj", "uwierzytelnianie",
              "dang nhap", "xac thuc",
              "masuk", "autentikasi",
          ]
          USERNAME_FIELD_KEYWORDS = [
              "username", "user name", "user", "login", "account", "email",
              "nom d'utilisateur", "utilisateur", "identifiant",
              "nome de usuario", "usuario", "utilizador",
              "benutzername", "benutzer", "nombre de usuario",
              "nome utente", "utente", "gebruikersnaam",
              "nazwa uzytkownika", "uzytkownik",
          ]
          PASSWORD_FIELD_KEYWORDS = [
              "password", "pass", "passwd", "secret", "pin",
              "mot de passe", "senha", "palavra-passe",
              "passwort", "kennwort", "contrasena", "clave",
              "parola d'ordine", "wachtwoord", "haslo",
          ]
          SUBMIT_BUTTON_KEYWORDS = [
              "sign in", "ok", "connect", "login", "submit", "authenticate",
          ]
          ADDRESS_BAR_NAMES = [
              "address and search bar", "address bar", "search bar",
              "omnibox", "location bar", "url bar", "address",
          ]
          ADDRESS_BAR_AUTOMATION_IDS = [
              "addressEditBox", "addressField", "locationBar", "view_1", "omnibox",
          ]

          _FOLD_SPECIAL_MAP = str.maketrans({
              'ł':'l','Ł':'L','đ':'d','Đ':'D','ø':'o','Ø':'O',
              'ß':'ss','æ':'ae','Æ':'AE','œ':'oe','Œ':'OE','ı':'i',
          })
          def fold(text):
              if not text: return ""
              pre = text.translate(_FOLD_SPECIAL_MAP)
              nfkd = unicodedata.normalize('NFKD', pre)
              return ''.join(ch for ch in nfkd if not unicodedata.combining(ch)).lower().strip()

          def matches_any(text, kws):
              if not text: return False
              tl = fold(text)
              return any(fold(k) in tl for k in kws)

          def proxy_host_hint():
              srv = PROXY_SERVER.replace("http://","").replace("https://","")
              host = srv.split("@")[-1].split(":")[0].strip()
              return host if len(host) >= 4 else ""

          PROXY_HOST_HINT = proxy_host_hint()

          def is_proxy_auth_dialog(wt):
              if not wt: return False
              return (matches_any(wt, PROXY_AUTH_TITLE_KEYWORDS) or
                      (bool(PROXY_HOST_HINT) and PROXY_HOST_HINT.lower() in wt.lower()))

          def is_address_bar(ctrl):
              try:
                  wt  = (ctrl.window_text() or "").lower().strip()
                  aid = ""
                  try: aid = (ctrl.element_info.automation_id or "").lower()
                  except: pass
                  for n in ADDRESS_BAR_NAMES:
                      if n in wt or n in aid: return True
                  for a in ADDRESS_BAR_AUTOMATION_IDS:
                      if a.lower() in aid: return True
              except: pass
              return False

          def page_ctrl_keys(container, ctype):
              keys = set()
              try:
                  for doc in container.descendants(control_type="Document"):
                      try:
                          for c in doc.descendants(control_type=ctype):
                              try: keys.add(tuple(c.element_info.runtime_id))
                              except: pass
                      except: return keys, False
              except: return keys, False
              return keys, True

          def outside_page(container, ctype):
              try: all_c = container.descendants(control_type=ctype)
              except: return []
              keys, ok = page_ctrl_keys(container, ctype)
              if not ok: return []
              if not keys: return list(all_c)
              out = []
              for c in all_c:
                  try: rid = tuple(c.element_info.runtime_id)
                  except: rid = None
                  if rid is not None and rid in keys: continue
                  out.append(c)
              return out

          def find_username_fields(container):
              results = []
              try:
                  for ctrl in outside_page(container, "Edit"):
                      if is_address_bar(ctrl): continue
                      try: wt = ctrl.window_text() or ""
                      except: wt = ""
                      try: name = ctrl.element_info.name or ""
                      except: name = ""
                      if matches_any(wt + " " + name, USERNAME_FIELD_KEYWORDS):
                          results.append(ctrl)
              except: pass
              return results

          def find_password_fields(container):
              results = []
              try:
                  for ctrl in outside_page(container, "Edit"):
                      if is_address_bar(ctrl): continue
                      try: wt = ctrl.window_text() or ""
                      except: wt = ""
                      try: name = ctrl.element_info.name or ""
                      except: name = ""
                      if matches_any(wt + " " + name, PASSWORD_FIELD_KEYWORDS):
                          results.append(ctrl); continue
                      try:
                          state = int((ctrl.legacy_properties().get("State", 0) or 0))
                          if state & 0x20000000: results.append(ctrl); continue
                      except: pass
              except: pass
              return results

          def find_submit_button(container):
              try:
                  for btn in outside_page(container, "Button"):
                      try: wt = btn.window_text() or ""
                      except: wt = ""
                      try: name = btn.element_info.name or ""
                      except: name = ""
                      if matches_any(wt + " " + name, SUBMIT_BUTTON_KEYWORDS):
                          return btn
              except: pass
              return None

          def auth_dialog_by_structure(window):
              try:
                  edits = [c for c in outside_page(window, "Edit") if not is_address_bar(c)]
                  if len(edits) == 2: return edits[0], edits[1]
              except: pass
              return None, None

          def edge_has_proxy_prompt(w):
              try:
                  edits = [c for c in outside_page(w, "Edit") if not is_address_bar(c)]
                  if len(edits) == 2: return True
                  for t in w.descendants(control_type="Text")[:300]:
                      tt = t.window_text() or ""
                      if tt and PROXY_HOST_HINT and PROXY_HOST_HINT.lower() in tt.lower():
                          return True
              except: pass
              return False

          def page_loaded_without_prompt(edge_window):
              try:
                  wt = (edge_window.window_text() or "").strip().lower()
                  base = re.sub(r"\s*[-\u2013\u2014]\s*[^-\u2013\u2014]*microsoft\W*edge\s*$", "", wt).strip()
                  if base in ("", "microsoft edge", "edge", "new tab", "about:blank"):
                      return False
                  if edge_has_proxy_prompt(edge_window): return False
                  count = 0
                  for doc in edge_window.descendants(control_type="Document"):
                      count += len(doc.children())
                  return count >= 3
              except: return False

          # ---------------------------------------------------------------
          # Proxy auth state (one-shot, web-page-safe — identical to main10FA)
          # ---------------------------------------------------------------
          PROXY_AUTH_STATE = {
              "done": False, "reason": "", "done_time": 0.0,
              "late_reinjects": 0, "page_ok_ticks": 0,
              "last_prompt_seen": 0.0, "started": 0.0, "valve_logged": False,
          }
          LATE_PROMPT_WINDOW_SEC = 90
          LATE_REINJECT_MAX      = 2

          def reset_proxy_auth_state():
              PROXY_AUTH_STATE.update({
                  "done": False, "reason": "", "done_time": 0.0,
                  "late_reinjects": 0, "page_ok_ticks": 0,
                  "last_prompt_seen": 0.0, "started": time.time(), "valve_logged": False,
              })

          def mark_proxy_auth_done(reason):
              if PROXY_AUTH_STATE["done"]: return
              PROXY_AUTH_STATE["done"]      = True
              PROXY_AUTH_STATE["reason"]    = reason
              PROXY_AUTH_STATE["done_time"] = time.time()
              log("ProxyAuth", "="*50)
              log("ProxyAuth", f"PROXY AUTH DONE ({reason}).")
              log("ProxyAuth", "Credentials will NOT be typed again into any text box.")
              log("ProxyAuth", "="*50)

          def inject_proxy_auth(window, label="", allow_late=False):
              if not USE_PROXY or not PROXY_USER or not PROXY_PASS: return False
              if PROXY_AUTH_STATE["done"] and not allow_late:            return False
              try:
                  user_fields = find_username_fields(window)
                  pass_fields = find_password_fields(window)
                  if (user_fields and not pass_fields) or (pass_fields and not user_fields):
                      try:
                          edits = [c for c in outside_page(window, "Edit") if not is_address_bar(c)]
                      except: edits = []
                      if len(edits) == 2:
                          known = (user_fields or pass_fields)[0]
                          other = [c for c in edits if c != known]
                          if other:
                              if user_fields and not pass_fields:
                                  pass_fields = [other[0]]
                              else:
                                  user_fields = [other[0]]
                  if not user_fields or not pass_fields:
                      u_s, p_s = auth_dialog_by_structure(window)
                      if u_s and p_s:
                          user_fields = [u_s]; pass_fields = [p_s]
                  if user_fields and pass_fields:
                      if is_address_bar(user_fields[0]) or is_address_bar(pass_fields[0]):
                          log("ProxyAuth", f"[{label}] BLOCKED — address bar. Skipping.")
                          return False
                      log("ProxyAuth", f"[{label}] Injecting {PROXY_LABEL} creds. User={PROXY_USER[:20]}...")
                      window.set_focus(); time.sleep(0.5)
                      try:
                          user_fields[0].click_input(); time.sleep(0.2)
                          send_keys('^a'); time.sleep(0.1); send_keys('{DELETE}'); time.sleep(0.1)
                          user_fields[0].type_keys(PROXY_USER, with_spaces=True, pause=0.02)
                          time.sleep(0.3)
                      except Exception as eu: log("ProxyAuth", f"username type failed: {eu}")
                      try:
                          pass_fields[0].click_input(); time.sleep(0.2)
                          send_keys('^a'); time.sleep(0.1); send_keys('{DELETE}'); time.sleep(0.1)
                          pass_fields[0].type_keys(PROXY_PASS, with_spaces=True, pause=0.02)
                          time.sleep(0.3)
                      except Exception as ep: log("ProxyAuth", f"password type failed: {ep}")
                      submit = find_submit_button(window)
                      if submit:
                          try:
                              submit.click_input()
                              log("ProxyAuth", f"[{label}] Submit clicked.")
                              return True
                          except Exception as eb: log("ProxyAuth", f"submit click failed: {eb}")
                      try:
                          pass_fields[0].click_input(); time.sleep(0.2)
                          send_keys('{ENTER}')
                          log("ProxyAuth", f"[{label}] ENTER fallback."); return True
                      except Exception as ek: log("ProxyAuth", f"ENTER fallback failed: {ek}")
                  else:
                      wt = ""
                      try: wt = window.window_text() or ""
                      except: pass
                      if not is_proxy_auth_dialog(wt): return False
                      try: has_doc = len(window.descendants(control_type="Document")) > 0
                      except: has_doc = True
                      if has_doc:
                          log("ProxyAuth", f"[{label}] Refusing blind typing: window has web content.")
                          return False
                      log("ProxyAuth", f"[{label}] No Edit fields — keyboard Tab injection.")
                      window.set_focus(); time.sleep(0.5)
                      send_keys('^a{DELETE}'); time.sleep(0.1)
                      for ch in PROXY_USER:
                          send_keys(ch if ch.isalnum() or ch in '.-_=@' else '{%s}' % ch)
                          time.sleep(0.01)
                      send_keys('{TAB}'); time.sleep(0.3)
                      send_keys('^a{DELETE}'); time.sleep(0.1)
                      for ch in PROXY_PASS:
                          send_keys(ch if ch.isalnum() or ch in '.-_=@' else '{%s}' % ch)
                          time.sleep(0.01)
                      send_keys('{ENTER}')
                      log("ProxyAuth", f"[{label}] Keyboard-only auth submitted."); return True
              except Exception as e:
                  log("ProxyAuth", f"[{label}] exception: {e}"); return False

          def find_genuine_proxy_prompt(desktop, edge_window):
              try:
                  for w in desktop.windows(visible_only=True):
                      try: awt = w.window_text() or ""
                      except: continue
                      if "Microsoft Edge" in awt: continue
                      if PROXY_HOST_HINT and PROXY_HOST_HINT.lower() in awt.lower(): return w
                      try:
                          for t in w.descendants(control_type="Text")[:60]:
                              if PROXY_HOST_HINT and PROXY_HOST_HINT.lower() in (t.window_text() or "").lower():
                                  return w
                      except: pass
              except: pass
              if edge_window is not None and edge_has_proxy_prompt(edge_window):
                  try:
                      for t in edge_window.descendants(control_type="Text")[:300]:
                          if PROXY_HOST_HINT and PROXY_HOST_HINT.lower() in (t.window_text() or "").lower():
                              return edge_window
                  except: pass
              return None

          # ---------------------------------------------------------------
          # Edge launcher — subprocess + --proxy-server (main10FA pattern)
          # ---------------------------------------------------------------
          def find_edge_exe():
              for c in EDGE_EXE_CANDIDATES:
                  if os.path.exists(c): return c
              return None

          CDP_PORT = 9222

          def launch_edge_with_proxy(target_url, attempt_num=1):
              resolved_exe = find_edge_exe()
              if not resolved_exe:
                  log("EdgeLaunch", "CRITICAL: Edge exe not found!")
                  return False
              try: os.system("taskkill /F /IM msedge.exe >nul 2>&1")
              except: pass
              time.sleep(2)
              user_dir = os.path.join(tempfile.gettempdir(), f"EdgeGLSignup_{random.randint(100000,999999)}")
              cmd_parts = [
                  f'"{resolved_exe}"',
                  f'--user-data-dir="{user_dir}"',
                  f'--remote-debugging-port={CDP_PORT}',
                  '--no-first-run',
                  '--no-default-browser-check',
                  '--disable-sync',
                  '--disable-blink-features=AutomationControlled',
                  '--force-webrtc-ip-handling-policy=disable_non_proxied_udp',
                  '--safebrowsing-disable-download-protection',
                  '--disable-features=msSmartScreenProtection,SmartScreenPuaEnabled,CalculateNativeWinOcclusion',
                  '--restore-last-session=false',
                  '--start-maximized',
                  '--password-store=basic',
                  '--use-mock-keychain',
                  '--lang=en-US',
                  '--accept-lang="en-US,en;q=0.9"',
              ]
              if USE_PROXY and PROXY_SERVER and PROXY_SERVER.strip():
                  proxy_arg = PROXY_SERVER if "://" in PROXY_SERVER else f"http://{PROXY_SERVER}"
                  cmd_parts.append(f'--proxy-server="{proxy_arg}"')
                  log("EdgeLaunch", f"Attempt {attempt_num}: Proxy injected -> {proxy_arg}")
              else:
                  log("EdgeLaunch", f"Attempt {attempt_num}: Direct mode (no proxy).")
              cmd_parts.append(f'"{target_url}"')
              cmd = ' '.join(cmd_parts)
              log("EdgeLaunch", f"CMD (truncated): {cmd[:220]}...")
              try:
                  subprocess.Popen(cmd, shell=True)
                  log("EdgeLaunch", f"Attempt {attempt_num}: Edge spawned.")
                  return True
              except Exception as e:
                  log("EdgeLaunch", f"Popen failed: {e}")
                  try:
                      os.system(f'start "" {cmd}')
                      log("EdgeLaunch", f"os.system fallback executed."); return True
                  except Exception as e2:
                      log("EdgeLaunch", f"os.system also failed: {e2}"); return False

          def verify_edge_launch_with_proxy_auth(target_url):
              """
              Launch Edge + --proxy-server, then wait for and handle the native
              proxy auth dialog exactly as main10FA does. Returns True once Edge
              is confirmed running and proxy is authenticated (or no auth needed).
              """
              reset_proxy_auth_state()
              for attempt in range(1, 6):
                  launch_edge_with_proxy(target_url, attempt_num=attempt)
                  start_wait = time.time()
                  if USE_PROXY and PROXY_USER and PROXY_PASS:
                      log("EdgeLaunch", "Authenticated proxy. Waiting up to 15s for native auth dialog...")
                      auth_found = False
                      while time.time() - start_wait < 15:
                          desktop_chk = Desktop(backend="uia")
                          try:
                              for w in desktop_chk.windows(visible_only=True):
                                  wt = w.window_text() or ""
                                  if is_proxy_auth_dialog(wt):
                                      auth_found = True; break
                                  if "Microsoft Edge" in wt or "Edge" in wt:
                                      u, p = auth_dialog_by_structure(w)
                                      if u and p: auth_found = True; break
                          except: pass
                          if auth_found: break
                          time.sleep(1)
                      if auth_found:
                          log("EdgeLaunch", "Proxy auth dialog detected — Edge launched correctly.")
                          return True
                      else:
                          log("EdgeLaunch", f"No auth dialog in 15s (attempt {attempt}). Relaunching...")
                          os.system("taskkill /F /IM msedge.exe >nul 2>&1"); time.sleep(2)
                  else:
                      log("EdgeLaunch", "No auth needed. Waiting up to 15s for Edge URL to load...")
                      url_loaded = False
                      while time.time() - start_wait < 15:
                          desktop_chk = Desktop(backend="uia")
                          try:
                              for w in desktop_chk.windows(visible_only=True):
                                  wt = (w.window_text() or "").lower()
                                  if ("microsoft edge" in wt or "msedge" in wt) and wt not in ["microsoft edge","edge","new tab",""]:
                                      url_loaded = True; break
                          except: pass
                          if url_loaded: break
                          time.sleep(1)
                      if url_loaded:
                          log("EdgeLaunch", "URL loaded — Edge launched correctly."); return True
                      else:
                          log("EdgeLaunch", f"URL not loaded in 15s (attempt {attempt}). Relaunching...")
                          os.system("taskkill /F /IM msedge.exe >nul 2>&1"); time.sleep(2)
              log("EdgeLaunch", "FATAL: Could not verify Edge launch after 5 attempts.")
              return False

          def run_proxy_auth_loop(desktop_ref, edge_win_ref, stop_event):
              """
              Background thread: continuously scans for the native proxy auth dialog
              and injects credentials. Mirrors main10FA's main polling loop auth block.
              Stops once proxy is marked done OR stop_event is set.
              """
              AUTH_SCAN_INTERVAL  = 2.0
              LATE_VALVE_INTERVAL = 6.0
              last_auth_scan = 0.0
              last_late_check = 0.0
              log("ProxyAuthLoop", "Background proxy-auth thread started.")
              while not stop_event.is_set():
                  now = time.time()
                  if not PROXY_AUTH_STATE["done"]:
                      if now - last_auth_scan >= AUTH_SCAN_INTERVAL:
                          last_auth_scan = now
                          try:
                              desktop = Desktop(backend="uia")
                              auth_injected = False
                              seen_prompt = False
                              edge_w = None
                              for w in desktop.windows(visible_only=True):
                                  wt = w.window_text() or ""
                                  if "Microsoft Edge" in wt: edge_w = w
                                  if "Microsoft Edge" in wt and wt != "Microsoft Edge": continue
                                  if is_proxy_auth_dialog(wt):
                                      seen_prompt = True
                                      log("ProxyAuthLoop", f"[TopLevel] Dialog: '{wt}' — injecting...")
                                      if inject_proxy_auth(w, label=f"toplevel-{wt[:30]}"):
                                          auth_injected = True; break
                              if not auth_injected and edge_w:
                                  if edge_has_proxy_prompt(edge_w):
                                      seen_prompt = True
                                      log("ProxyAuthLoop", "[Edge-UI] Inline proxy prompt detected — injecting...")
                                      if inject_proxy_auth(edge_w, label="edge-ui"):
                                          auth_injected = True
                              if auth_injected:
                                  mark_proxy_auth_done("credentials submitted")
                              elif seen_prompt:
                                  PROXY_AUTH_STATE["page_ok_ticks"] = 0
                                  PROXY_AUTH_STATE["last_prompt_seen"] = now
                              elif (edge_w and (now - PROXY_AUTH_STATE["started"]) > 10
                                    and (now - PROXY_AUTH_STATE["last_prompt_seen"]) > 5):
                                  if page_loaded_without_prompt(edge_w):
                                      PROXY_AUTH_STATE["page_ok_ticks"] += 1
                                      if PROXY_AUTH_STATE["page_ok_ticks"] >= 3:
                                          mark_proxy_auth_done("page loaded with no proxy prompt — proxy already authenticated")
                                  else:
                                      PROXY_AUTH_STATE["page_ok_ticks"] = 0
                          except Exception as ex:
                              log("ProxyAuthLoop", f"scan error: {ex}")
                  else:
                      # Late-prompt valve (identical to main10FA)
                      age = now - PROXY_AUTH_STATE["done_time"]
                      if age <= LATE_PROMPT_WINDOW_SEC and PROXY_AUTH_STATE["late_reinjects"] < LATE_REINJECT_MAX:
                          if now - last_late_check >= LATE_VALVE_INTERVAL:
                              last_late_check = now
                              try:
                                  desktop = Desktop(backend="uia")
                                  edge_w = None
                                  for w in desktop.windows(visible_only=True):
                                      if "Microsoft Edge" in (w.window_text() or ""):
                                          edge_w = w; break
                                  late_target = find_genuine_proxy_prompt(desktop, edge_w)
                                  if late_target is not None:
                                      PROXY_AUTH_STATE["late_reinjects"] += 1
                                      log("ProxyAuthLoop", f"[LatePrompt] Genuine proxy prompt still showing — re-injecting ({PROXY_AUTH_STATE['late_reinjects']}/{LATE_REINJECT_MAX}).")
                                      inject_proxy_auth(late_target, label="late-prompt", allow_late=True)
                              except: pass
                      elif not PROXY_AUTH_STATE["valve_logged"]:
                          PROXY_AUTH_STATE["valve_logged"] = True
                          log("ProxyAuthLoop", "Late-prompt window closed: proxy auth injection fully disabled.")
                  time.sleep(1.5)
              log("ProxyAuthLoop", "Background proxy-auth thread stopped.")

          # ---------------------------------------------------------------
          # Playwright signup helpers (form automation — unchanged from v2)
          # ---------------------------------------------------------------
          def wait_any(checks, timeout_ms):
              end = time.time() + timeout_ms/1000
              while time.time() < end:
                  for name, fn in checks:
                      try:
                          if fn(): return name
                      except: pass
                  time.sleep(0.4)
              return None

          def find_visible(page, locs, timeout_ms=6000):
              end = time.time() + timeout_ms/1000
              while time.time() < end:
                  for l in locs:
                      try:
                          if l.first.is_visible(): return l.first
                      except: pass
                  time.sleep(0.3)
              return None

          def click_first(page, locs, timeout_ms=4000):
              el = find_visible(page, locs, timeout_ms)
              if not el: return False
              try: el.click(timeout=5000)
              except: el.click(force=True, timeout=3000)
              return True

          def type_human(loc, text):
              loc.click()
              loc.fill("")
              loc.press_sequentially(text, delay=random.randint(30,70))

          def tick_tos(page):
              cb = page.locator('input[type="checkbox"]').first
              if cb.count() > 0:
                  if cb.is_checked(): return True
                  page.get_by_text(re.compile(r'I agree to the', re.I)).first.click(
                      position={"x":-20,"y":8}, force=True)
                  time.sleep(0.4)
                  if cb.is_checked(): return True
                  cb.check(force=True); time.sleep(0.3)
              return True

          def solve_turnstile(page, caller_label=""):
              lbl = f"[{caller_label}] " if caller_label else ""
              log("Turnstile", f"{lbl}checking for Cloudflare Turnstile...")
              iframe_visible = False
              for _ in range(24):
                  try:
                      if page.locator('iframe[src*="challenges.cloudflare.com"], iframe[src*="turnstile"]').count() > 0:
                          iframe_visible = True; break
                  except: pass
                  time.sleep(0.5)
              if not iframe_visible: log("Turnstile", f"{lbl}no iframe — skipping"); return False
              log("Turnstile", f"{lbl}iframe detected...")
              cf = page.frame_locator('iframe[src*="challenges.cloudflare.com"], iframe[src*="turnstile"]').first
              cb = cf.locator('input[type="checkbox"]')
              appeared = False
              for _ in range(30):
                  try:
                      if cb.is_visible(): appeared = True; break
                  except: pass
                  time.sleep(0.5)
              if not appeared:
                  shot(page, f"cf-no-checkbox-{caller_label}"); return False
              shot(page, f"cf-before-{caller_label}")
              for attempt in range(1,6):
                  try: cb.click(timeout=5000); break
                  except: time.sleep(1)
              solved = False
              for _ in range(60):
                  try:
                      te = page.locator('[name="cf-turnstile-response"]')
                      if te.count() > 0 and len(te.input_value()) > 10: solved = True; break
                      if page.locator('iframe[src*="challenges.cloudflare.com"], iframe[src*="turnstile"]').count() == 0:
                          solved = True; break
                  except: pass
                  time.sleep(0.5)
              shot(page, f"cf-{'solved' if solved else 'timeout'}-{caller_label}")
              log("Turnstile", f"{lbl}{'SOLVED ✓' if solved else 'TIMED OUT'}")
              if solved: time.sleep(random.randint(1200,2000)/1000)
              return solved

          def dismiss_overlays(page, rounds=10):
              for _ in range(rounds):
                  acted = click_first(page, [
                      page.get_by_role("button", name=re.compile(r"got it", re.I)),
                      page.get_by_text(re.compile(r"skip recommended setup", re.I)),
                      page.get_by_role("button", name=re.compile(r"^not now$", re.I)),
                      page.get_by_role("button", name=re.compile(r"^(close|skip|maybe later|no thanks)$", re.I)),
                      page.locator('[aria-label="Close" i], [aria-label="close" i]'),
                  ], 800)
                  if not acted: break
                  time.sleep(0.9)

          def is_dashboard(page):
              return (page.get_by_role("button", name=re.compile(r"add profile", re.I)).first.is_visible() or
                      page.get_by_text(re.compile(r"^all profiles$", re.I)).first.is_visible())

          JWT = re.compile(r'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}')
          candidates = []
          RANK = ['copy-token-click','clipboard','network','settings-new','settings-existing']
          def rank_of(s):
              i = next((i for i,r in enumerate(RANK) if s.startswith(r)), 99); return i

          def add_candidate(token, source):
              if not token or any(c["token"] == token for c in candidates): return
              candidates.append({"token": token, "source": source})
              log("Token", f"candidate [{source}] ({len(token)} chars)")

          def read_clipboard(page):
              try:
                  for m in JWT.findall(page.evaluate("() => navigator.clipboard.readText()") or ""):
                      add_candidate(m, "clipboard")
              except: pass

          def scan_page(page, source):
              texts = page.evaluate("""() => {
                  const out = [document.body?.innerText || ''];
                  document.querySelectorAll('input,textarea').forEach(e => out.push(e.value||''));
                  document.querySelectorAll('[data-token],[title],[data-clipboard-text]').forEach(e => {
                      out.push(e.getAttribute('data-token')||'',e.getAttribute('title')||'',e.getAttribute('data-clipboard-text')||'');
                  });
                  return out;
              }""")
              for t in texts:
                  for m in JWT.findall(t): add_candidate(m, source)

          # ---------------------------------------------------------------
          # MAIN
          # ---------------------------------------------------------------
          def main():
              proxy_display = (f"{PROXY_LABEL}:{PROXY_SERVER} user={PROXY_USER[:6]}***"
                               if USE_PROXY else "none")
              result = {
                  "index": int(IDX), "email": EMAIL, "password": PASSWORD,
                  "signup": False, "token": None, "tokenSource": None,
                  "restStatus": None, "error": None, "finishedAt": None,
                  "proxy": proxy_display,
              }

              stop_event = threading.Event()
              auth_thread = None

              try:
                  banner("Phase 0 — Launch Edge + inject proxy (main10FA pattern)")
                  log("Main", f"Proxy: {proxy_display}")
                  log("Main", f"Edge will be launched with --proxy-server (subprocess), not Playwright proxy object")

                  # --- Launch Edge with --proxy-server exactly as main10FA does ---
                  if not verify_edge_launch_with_proxy_auth("https://app.gologin.com/sign_up"):
                      raise RuntimeError("Could not verify Edge launch after 5 attempts.")

                  # --- Start background proxy-auth polling thread ---
                  auth_thread = threading.Thread(
                      target=run_proxy_auth_loop,
                      args=(None, None, stop_event),
                      daemon=True,
                  )
                  auth_thread.start()

                  # Wait for proxy auth to complete before Playwright attaches
                  if USE_PROXY and PROXY_USER:
                      log("Main", "Waiting up to 30s for proxy auth to complete before Playwright attaches...")
                      for _ in range(30):
                          if PROXY_AUTH_STATE["done"]: break
                          time.sleep(1)
                      if PROXY_AUTH_STATE["done"]:
                          log("Main", f"Proxy auth done ({PROXY_AUTH_STATE['reason']}). Attaching Playwright via CDP.")
                      else:
                          log("Main", "WARNING: Proxy auth not marked done in 30s — attaching anyway.")
                  else:
                      log("Main", "No proxy auth needed. Attaching Playwright via CDP immediately.")
                      time.sleep(3)

                  # --- Playwright attaches to the already-running Edge via CDP ---
                  banner("Phase 1 — Playwright attaches to Edge via CDP")
                  with sync_playwright() as pw:
                      browser = pw.chromium.connect_over_cdp(f"http://localhost:{CDP_PORT}")
                      context = browser.contexts[0]
                      context.grant_permissions(["clipboard-read", "clipboard-write"])

                      # Intercept network responses for token scanning
                      def on_response(r):
                          try:
                              if "gologin.com" not in r.url: return
                              if "token" not in r.url.lower(): return
                              ct = r.headers.get("content-type","")
                              if "json" not in ct and "text" not in ct: return
                              for m in JWT.findall(r.text()):
                                  add_candidate(m, "network:"+r.url.split("?")[0][-40:])
                          except: pass

                      context.on("response", on_response)

                      # Clipboard intercept init script
                      context.add_init_script("""
                          const rec = t => {
                              try { window.__gl_copy?.(String(t)); } catch {}
                              (window.__copied = window.__copied||[]).push(String(t));
                          };
                          try {
                              const orig = navigator.clipboard.writeText.bind(navigator.clipboard);
                              navigator.clipboard.writeText = t => { rec(t); return orig(t).catch(()=>Promise.resolve()); };
                          } catch {}
                          document.addEventListener('copy', ()=>{ try { rec(String(window.getSelection())); } catch {} }, true);
                      """)

                      pages = context.pages
                      page = pages[0] if pages else context.new_page()
                      page.set_default_timeout(25000)

                      # Navigate to sign_up if not already there
                      if "sign_up" not in page.url:
                          log("Main", "Navigating to sign_up page...")
                          page.goto("https://app.gologin.com/sign_up",
                                    wait_until="domcontentloaded", timeout=60000)

                      email_field = page.get_by_placeholder(re.compile(r"your email", re.I)).first
                      email_field.wait_for(state="visible", timeout=30000)
                      time.sleep(random.uniform(1.5, 2.5))
                      shot(page, "01-signup-page")

                      banner("Phase 2 — Fill signup form")
                      log("Main", f"Entering email: {EMAIL}")
                      type_human(email_field, EMAIL)
                      time.sleep(random.uniform(5, 8))
                      shot(page, "02-email-entered")

                      tick_tos(page)
                      time.sleep(random.uniform(1.2, 2.0))
                      shot(page, "03-tos-ticked")

                      click_first(page, [
                          page.get_by_role("button", name=re.compile(r"try 7 days for free", re.I)),
                          page.get_by_role("button", name=re.compile(r"try.*free", re.I)),
                          page.get_by_role("button", name=re.compile(r"continue", re.I)),
                      ], 10000)
                      time.sleep(random.uniform(2, 3.5))

                      banner("Phase 3 — Password page")
                      pass_field = page.get_by_placeholder(re.compile(r"your password", re.I)).first
                      stage1 = wait_any([
                          ["password", lambda: pass_field.is_visible()],
                          ["error",    lambda: page.get_by_text(re.compile(r"already (registered|exists|in use|taken)|invalid email|too many|something went wrong", re.I)).first.is_visible()],
                      ], 45000)
                      shot(page, "04-after-email-submit")
                      if stage1 != "password":
                          raise RuntimeError(f"Password step not reached (stage={stage1}). Check screenshot 04.")

                      type_human(pass_field, PASSWORD)
                      time.sleep(random.uniform(0.6, 1.0))
                      confirm_field = page.get_by_placeholder(re.compile(r"confirm password", re.I)).first
                      type_human(confirm_field, PASSWORD)
                      time.sleep(random.uniform(0.8, 1.5))
                      shot(page, "05-password-filled")

                      solve_turnstile(page, "before-create")
                      shot(page, "06-before-create-account")

                      click_first(page, [page.get_by_role("button", name=re.compile(r"create an account", re.I))], 10000)
                      time.sleep(random.uniform(1.5, 2.5))
                      solve_turnstile(page, "after-create")

                      create_btn = page.get_by_role("button", name=re.compile(r"create an account", re.I)).first
                      if create_btn.is_visible() and create_btn.is_enabled():
                          create_btn.click(timeout=5000)
                          time.sleep(random.uniform(1.5, 2.5))

                      stage2 = wait_any([
                          ["survey",    lambda: page.get_by_text(re.compile(r"have you ever used antidetect", re.I)).first.is_visible()],
                          ["allset",    lambda: page.get_by_text(re.compile(r"all set", re.I)).first.is_visible()],
                          ["dashboard", lambda: is_dashboard(page)],
                          ["installer", lambda: "download-installer" in page.url],
                          ["error",     lambda: page.get_by_text(re.compile(r"already (registered|exists|in use|taken)|password is too|something went wrong", re.I)).first.is_visible()],
                      ], 90000)
                      shot(page, "07-after-create-account")

                      if stage2 in ("error", None):
                          raise RuntimeError(f"Account creation failed (stage={stage2}). Check screenshot 07.")
                      result["signup"] = True
                      log("Main", f"ACCOUNT CREATED: {EMAIL} (stage={stage2})")

                      banner("Phase 4 — Onboarding")
                      for _ in range(5):
                          close_btn = find_visible(page, [
                              page.locator('[aria-label="Close" i], [aria-label="close" i]').first,
                              page.locator('button.close, button[class*="close" i]').first,
                              page.get_by_role("button", name=re.compile(r"^×$|^close$", re.I)).first,
                              page.locator('a[href*="profileList"], a[href*="dashboard"]').first,
                          ], 3000)
                          if close_btn:
                              close_btn.click(); log("Main", "closed onboarding modal"); time.sleep(1.2); break
                          if "download-installer" in page.url:
                              page.goto("https://app.gologin.com/profileList",
                                        wait_until="domcontentloaded", timeout=30000)
                              time.sleep(2); break
                          time.sleep(0.8)
                      for _ in range(4):
                          skip = find_visible(page, [
                              page.get_by_text(re.compile(r"skip recommended setup", re.I)),
                              page.get_by_role("link",   name=re.compile(r"skip", re.I)),
                              page.get_by_role("button", name=re.compile(r"skip", re.I)),
                          ], 3000)
                          if skip: skip.click(); log("Main","clicked Skip"); time.sleep(1.5); break
                          time.sleep(0.6)
                      dismiss_overlays(page, 8)
                      shot(page, "08-after-onboarding")
                      if not is_dashboard(page):
                          page.goto("https://app.gologin.com/profileList",
                                    wait_until="domcontentloaded", timeout=30000)
                          time.sleep(3); dismiss_overlays(page, 5)
                      shot(page, "09-dashboard")
                      log("Main", "Reached GoLogin dashboard.")

                      banner("Phase 5 — Run → API control → Copy token")
                      run_btn = find_visible(page, [page.get_by_role("button", name="Run", exact=True)], 20000)

                      async def token_via_settings(pg):
                          pg.goto("https://app.gologin.com/#/personalArea/TokenApi",
                                  wait_until="domcontentloaded", timeout=30000)
                          time.sleep(3); dismiss_overlays(pg, 3)
                          new_btn = find_visible(pg, [
                              pg.get_by_role("button", name=re.compile(r"new token", re.I)),
                              pg.get_by_role("button", name=re.compile(r"(create|generate).{0,12}token", re.I)),
                          ], 8000)
                          if not new_btn:
                              click_first(pg, [pg.get_by_text(re.compile(r"API\s*&\s*MCP", re.I)),
                                               pg.get_by_role("link", name=re.compile(r"^api", re.I))], 4000)
                              time.sleep(2.5); dismiss_overlays(pg, 2)
                              new_btn = find_visible(pg, [pg.get_by_role("button", name=re.compile(r"new token", re.I))], 8000)
                          scan_page(pg, "settings-existing")
                          shot(pg, "13-api-page")
                          if not new_btn: return
                          new_btn.click(); time.sleep(1.5)
                          name_input = pg.locator('[role="dialog"] input[type="text"], [class*="modal" i] input[type="text"]').first
                          if name_input.is_visible(): name_input.fill(f"actions-{IDX}")
                          click_first(pg, [pg.get_by_role("button", name=re.compile(r"^(create|generate|save|confirm|ok|done|continue)\b", re.I))], 3000)
                          time.sleep(2.5); scan_page(pg, "settings-new")
                          click_first(pg, [pg.get_by_role("button", name=re.compile(r"copy", re.I)),
                                           pg.get_by_text(re.compile(r"^copy( token)?$", re.I))], 2000)
                          read_clipboard(pg); shot(pg, "14-settings-after-new-token")

                      def token_via_settings_sync(pg):
                          pg.goto("https://app.gologin.com/#/personalArea/TokenApi",
                                  wait_until="domcontentloaded", timeout=30000)
                          time.sleep(3); dismiss_overlays(pg, 3)
                          new_btn = find_visible(pg, [
                              pg.get_by_role("button", name=re.compile(r"new token", re.I)),
                              pg.get_by_role("button", name=re.compile(r"(create|generate).{0,12}token", re.I)),
                          ], 8000)
                          if not new_btn:
                              click_first(pg, [pg.get_by_text(re.compile(r"API\s*&\s*MCP", re.I)),
                                               pg.get_by_role("link", name=re.compile(r"^api", re.I))], 4000)
                              time.sleep(2.5); dismiss_overlays(pg, 2)
                              new_btn = find_visible(pg, [pg.get_by_role("button", name=re.compile(r"new token", re.I))], 8000)
                          scan_page(pg, "settings-existing")
                          shot(pg, "13-api-page")
                          if not new_btn: return
                          new_btn.click(); time.sleep(1.5)
                          name_input = pg.locator('[role="dialog"] input[type="text"], [class*="modal" i] input[type="text"]').first
                          if name_input.is_visible(): name_input.fill(f"actions-{IDX}")
                          click_first(pg, [pg.get_by_role("button", name=re.compile(r"^(create|generate|save|confirm|ok|done|continue)\b", re.I))], 3000)
                          time.sleep(2.5); scan_page(pg, "settings-new")
                          click_first(pg, [pg.get_by_role("button", name=re.compile(r"copy", re.I)),
                                           pg.get_by_text(re.compile(r"^copy( token)?$", re.I))], 2000)
                          read_clipboard(pg); shot(pg, "14-settings-after-new-token")

                      if not run_btn:
                          log("Main", "No Run button — going to Settings API page")
                          token_via_settings_sync(page)
                      else:
                          run_btn.click(); log("Main", "clicked Run"); time.sleep(random.uniform(1,1.8))
                          shot(page, "10-run-menu")
                          api_clicked = click_first(page, [
                              page.get_by_text(re.compile(r"api control", re.I)),
                              page.get_by_role("menuitem", name=re.compile(r"api control", re.I)),
                          ], 10000)
                          if not api_clicked:
                              log("Main", '"API control" not found — going to Settings')
                              token_via_settings_sync(page)
                          else:
                              log("Main", 'clicked "API control"')
                              time.sleep(random.uniform(2, 3.5)); shot(page, "11-api-control-page")
                              scan_page(page, "cloud-api-control")
                              copy_el = find_visible(page, [
                                  page.get_by_text(re.compile(r"copy token", re.I)),
                                  page.get_by_role("button", name=re.compile(r"copy token", re.I)),
                              ], 20000)
                              if copy_el:
                                  copy_el.click(); log("Main","clicked Copy token"); time.sleep(random.uniform(1,1.5))
                                  read_clipboard(page); shot(page, "12-after-copy-token")
                              else:
                                  log("Main", '"Copy token" not found — scanning page source')
                                  scan_page(page, "cloud-api-control-scan")

                      primary = [c for c in candidates if rank_of(c["source"]) <= 2]
                      if not primary: token_via_settings_sync(page)

                      pick = sorted(candidates, key=lambda c: rank_of(c["source"]))[0] if candidates else None
                      if not pick:
                          raise RuntimeError("Signup succeeded but no API token extracted.")

                      result["token"]       = pick["token"]
                      result["tokenSource"] = pick["source"]

                      try:
                          import urllib.request
                          req = urllib.request.Request(
                              "https://api.gologin.com/user",
                              headers={"Authorization": f"Bearer {pick['token']}", "Accept": "application/json"},
                          )
                          with urllib.request.urlopen(req, timeout=20) as resp:
                              result["restStatus"] = resp.status
                          log("Main", f"REST /user validation: HTTP {result['restStatus']}")
                      except Exception as e: result["restStatus"] = f"error: {e}"

                      (OUT / "token.txt").write_text(pick["token"] + "\n")

                  browser.close()

              except Exception as e:
                  result["error"] = str(e)
                  print(f"::error::Device {IDX} ({EMAIL}): {e}", flush=True)
                  import traceback; traceback.print_exc()
                  sys.exit(1)

              finally:
                  stop_event.set()
                  if auth_thread and auth_thread.is_alive():
                      auth_thread.join(timeout=5)
                  result["finishedAt"] = datetime.datetime.utcnow().isoformat() + "Z"
                  (OUT / "result.json").write_text(json.dumps(result, indent=2))

                  print("\n" + "="*60)
                  print("GOLOGIN SIGNUP RESULT")
                  print("="*60)
                  print(f"device  : {IDX}")
                  print(f"email   : {EMAIL}")
                  print(f"signup  : {'OK ✓' if result['signup'] else 'FAILED ✗'}")
                  print(f"proxy   : {result['proxy']}")
                  print(f"source  : {result.get('tokenSource') or '-'}")
                  print(f"REST /user: {result.get('restStatus') or '-'}")
                  print(f"\nAPI KEY (copy the line below):")
                  print(result.get("token") or "(not captured)")
                  print("="*60 + "\n")

                  if result.get("token"):
                      print(f"::notice title=GoLogin API key (device {IDX} · {EMAIL})::{result['token']}", flush=True)

                  summ = os.environ.get("GITHUB_STEP_SUMMARY")
                  if summ:
                      md = "\n".join([
                          f"### Device {IDX}: {EMAIL}",
                          f"- Signup: **{'OK ✓' if result['signup'] else 'FAILED ✗'}**",
                          f"- Proxy: {result['proxy']}",
                          f"- API key: `{result.get('token') or 'not captured'}`",
                          f"- Source: {result.get('tokenSource') or '-'}  |  REST: {result.get('restStatus') or '-'}",
                          (f"- Error: {result['error']}" if result.get("error") else ""),
                          "",
                      ])
                      open(summ, "a").write(md + "\n")

          main()
          PYEOF

      # ================================================================
      # STEP 8 — Verify Edge is available
      # ================================================================
      - name: "[8/11] Confirm Microsoft Edge is available"
        shell: pwsh
        run: |
          $edge = @(
            "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe",
            "C:\Program Files\Microsoft\Edge\Application\msedge.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($edge) {
            Write-Host "[Edge] Found: $edge"
            $v = (Get-Item $edge).VersionInfo.ProductVersion
            Write-Host "[Edge] Version: $v"
          } else {
            Write-Host "[Edge] Not found in standard paths — installing via Playwright..."
            cd automation
            npx playwright install msedge
          }

      # ================================================================
      # STEP 9 — Run automation
      # ================================================================
      - name: "[9/11] Run GoLogin signup automation"
        id: automation
        working-directory: automation
        timeout-minutes: 20
        env:
          OUT_DIR:       out
          USE_PROXY:     ${{ env.USE_PROXY }}
          PROXY_SERVER:  ${{ env.PROXY_SERVER }}
          PROXY_HOST:    ${{ env.PROXY_HOST }}
          PROXY_PORT:    ${{ env.PROXY_PORT }}
          PROXY_USER:    ${{ env.PROXY_USER }}
          PROXY_PASS:    ${{ env.PROXY_PASS }}
          PROXY_SCHEME:  ${{ env.PROXY_SCHEME }}
          PROXY_LABEL:   ${{ env.PROXY_LABEL }}
          PROXY_TYPE:    ${{ env.PROXY_TYPE }}
        run: python signup.py


            # ================================================================
      # STEP 10 — Upload screenshots + result
      # ================================================================
      - name: "[10/11] Upload screenshots and result"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.index }}
          path: automation/out
          if-no-files-found: warn
          retention-days: 7

      # ================================================================
      # STEP 11 — Keep device alive
      # ================================================================
      - name: "[11/11] Keep device alive for inspection"
        if: ${{ always() && env.KEEP_MIN != '0' }}
        run: |
          total=$KEEP_MIN
          echo "Keeping device alive for ${total}min (outcome: ${{ steps.automation.outcome }})."
          [[ -n "$GS_EMAIL" ]] && echo "Connect via Getscreen: device gh-${GITHUB_RUN_ID}-dev${ACC_INDEX}-win"
          for ((m=total; m>0; m--)); do echo "  ...${m}min left"; sleep 60; done

      # ================================================================
      # CLEANUP
      # ================================================================
      - name: "Cleanup — close Edge, kill monitor, disconnect WARP"
        if: always()
        shell: pwsh
        run: |
          Write-Host "Closing Edge..."
          taskkill /F /IM msedge.exe /T 2>$null; $true

          # Kill proxy-auth monitor if running
          $pidFile = Join-Path $env:TEMP "proxy_auth_monitor.pid"
          if (Test-Path $pidFile) {
            $monPid = (Get-Content $pidFile -ErrorAction SilentlyContinue).Trim()
            if ($monPid -match '^\d+$') {
              try { Stop-Process -Id ([int]$monPid) -Force -ErrorAction Stop; Write-Host "Monitor PID $monPid stopped." }
              catch { Write-Host "Monitor PID $monPid already gone." }
            }
            Remove-Item $pidFile -Force -ErrorAction SilentlyContinue
          }
          # Also print monitor log for debugging
          $logFile = Join-Path $env:TEMP "proxy_auth_monitor.log"
          if (Test-Path $logFile) {
            Write-Host "--- proxy_auth_monitor.log ---"
            Get-Content $logFile -ErrorAction SilentlyContinue | Select-Object -Last 40 | ForEach-Object { Write-Host $_ }
          }

          if ($env:WARP_ON -eq "true") {
            $cli = "C:\Program Files\Cloudflare\Cloudflare WARP\warp-cli.exe"
            if (Test-Path $cli) { & $cli '--accept-tos' 'disconnect' 2>$null; $true }
          }
          Write-Host "Device $($env:ACC_INDEX) ($($env:ACC_EMAIL)) done."

# =============================================================================
# JOB 4 — REPORT: combined summary of all accounts + API keys
# =============================================================================
  report:
    name: "Combined API key report"
    needs: [prepare, signup]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: all
        continue-on-error: true

      - name: Print and summarise all accounts
        run: |
          shopt -s nullglob
          files=(all/*/result.json)
          if (( ${#files[@]} == 0 )); then echo "::warning::No result files produced"; exit 0; fi

          jq -s 'sort_by(.index)' "${files[@]}" > all-results.json
          total=$(jq 'length' all-results.json)
          ok=$(jq '[.[] | select(.token != null)] | length' all-results.json)

          echo "========= ALL GOLOGIN ACCOUNTS ($ok/$total with API key) ========="
          jq -r '.[] | "#\(.index)  \(.email)\n  signup : \(.signup)\n  proxy  : \(.proxy // "n/a")\n  API KEY: \(.token // "NOT CAPTURED")\n  error  : \(.error // "-")\n"' all-results.json
          echo "=================================================================="
          echo "--- API keys only (email  token) ---"
          jq -r '.[] | select(.token != null) | "\(.email)  \(.token)"' all-results.json

          {
            echo "## GoLogin accounts — combined ($ok of $total with API key)"
            echo "| # | Email | Proxy | Signup | API key |"
            echo "|---|-------|-------|--------|---------|"
            jq -r '.[] | "| \(.index) | \(.email) | \(.proxy // "none") | \(if .signup then "OK ✓" else "FAILED ✗" end) | `\(.token // "not captured")` |"' all-results.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined results
        uses: actions/upload-artifact@v4
        with:
          name: gologin-all-results
          path: all-results.json
          if-no-files-found: ignore
          retention-days: 7

# =============================================================================
# NOTES — Proxy Injection Design (v3)
# =============================================================================
#
# WHY THE OLD page.on('dialog') APPROACH FAILED:
#   Edge's HTTP proxy authentication popup is a NATIVE BROWSER dialog,
#   not a JavaScript dialog. page.on('dialog') only catches:
#     - window.alert()
#     - window.confirm()
#     - window.prompt()
#     - beforeunload dialogs
#   The native proxy credential dialog is rendered by the browser chrome (OS),
#   completely outside of any JavaScript context, so Playwright's dialog
#   event never fires for it. This is why the previous fix didn't work.
#
# THE NEW 4-LAYER APPROACH:
#
#   Layer 1 — Playwright proxy object (launchPersistentContext.proxy):
#     server   = "http://host:port"   (bare URL — NEVER include credentials here)
#     username = "user"               (separate field)
#     password = "pass"               (separate field)
#     Playwright converts these to the correct --proxy-server and
#     --proxy-auth Chromium flags internally. This alone handles most
#     proxy providers and prevents any popup from appearing.
#     Chromium silently ignores http://user:pass@host:port in the URL.
#
#   Layer 2 — context.route() Proxy-Authorization header injection:
#     Every outgoing HTTP/HTTPS request gets "Proxy-Authorization: Basic <b64>"
#     injected by Playwright's routing layer. The proxy receives the credential
#     on the first request and never needs to issue a 407 challenge.
#     This operates at the Playwright level and applies to all pages.
#
#   Layer 3 — CDP Network.setExtraHTTPHeaders per page:
#     Opens a CDP (Chrome DevTools Protocol) session per page and sets
#     Proxy-Authorization as an extra header at the network layer.
#     This covers requests that bypass Playwright's routing (service workers,
#     pre-navigation favicon requests, etc.). Applied before every navigation.
#
#   Layer 4 — page.authenticate() on every page:
#     Playwright's built-in mechanism for handling 407 challenges.
#     Pre-supplies credentials so the browser auto-responds to any residual
#     407 without showing the user a popup.
#
#   Step 5b — Windows Credential Manager pre-population:
#     Runs BEFORE Edge launches. Uses cmdkey.exe to store the proxy
#     credentials in the Windows Credential Manager and also sets the
#     system-wide WinINet/WinHTTP proxy. Edge's underlying network stack
#     reads from Credential Manager automatically for proxy auth.
#     This covers any auth path that bypasses all Playwright mechanisms.
#
# WHAT ABOUT --proxy-server IN LAUNCH ARGS?
#   DO NOT pass --proxy-server when also using Playwright's proxy option.
#   Playwright adds --proxy-server internally when proxy is set.
#   Passing it twice causes a conflict and can break authentication.
#
# =============================================================================
