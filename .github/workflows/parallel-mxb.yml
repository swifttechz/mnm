          Write-Host "ACTION_MODE=$env:ACTION_MODE | SOFTWARE_TYPE=$env:SOFTWARE_TYPE | POST_BEHAVIOR=$env:POST_BEHAVIOR"
          # NOTE: Replace this placeholder with the full Python handler code from the
