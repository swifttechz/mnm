          - '06. OperaGX - Admax-Techx'
          - '01. Ad-MVN - F.Ahmadx'
          - '02. Ad-MVN - WillDougly'
          - '03. Ad-MVN - YTX'
          - '04. Ad-MVN - F.Mazari'
          - '01. Mob Opera - Techx'
          - '01. AVG - Techx'
          - '01. Opera - Harrari'
          - '02. Opera - AD'
          - '03. Opera - Mahal'
          - '04 Opera - Oliver'
          - '05. Opera - Mobeen'
          - '06. Opera - Fahmad'
          - '07. Opera - Peggy'
          - '08. Opera - Tufayl'
        default: '04 Opera - Oliver'
      manual_software_url:
        description: 'Manual URL'
        required: false
        type: string
        default: ''
      run_manual_link:
        description: 'Run Manual Link'
        required: true
        type: boolean
        default: false
      apply_masking:
        description: 'Apply Fingerprint Masking'
        required: true
        type: boolean
        default: true
      scrapeops_api_key:
        description: 'ScrapeOps / Floppy / BytesFlow / Redscrape / GoLogin / Manual'
        required: false
        type: string
        default: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqd3RpZCI6IjZhZmFhMWVjNzBhNTc4MDliYWUxNGUzYyIsInR5cGUiOiJ1c2VyIiwic3ViIjoiNmFmYWExZWM3MGE1NzgwOWJhZTE0ZTMzIn0.hSpG7avrsP1-dGP_Etcnc1iuxvJzDEZAC77oh8jw7V8'
      use_without_proxy:
        description: 'Use Without Proxy'
        required: true
